îmet","b":[{"k":"ar","a":"مَا شَرَعَهُ اللَّهُ مِنَ الْأَحْكَامِ تَخْفِيفًا عَلَى الْمُكَلَّفِ فِي حَالَاتٍ خَاصَّةٍ تَقْتَضِي هَذَا التَّخْفِيفَ","x":"Ruhsat"},{"k":"ar","a":"مَا شَرَعَهُ اللَّهُ أَصَالَةً مِنَ الْأَحْكَامِ الْعَامَّةِ الَّتِي لَا تَخْتَصُّ بِحَالٍ دُونَ حَالٍ وَلَا بِمُكَلَّفٍ دُونَ مُكَلَّفٍ","x":"Azîmet"},{"k":"d","t":"Ruhsat","x":"Allah'ın, bu hafifletmeyi gerektiren özel durumlarda mükellefe kolaylık olsun diye meşru kıldığı hükümlerdir."},{"k":"d","t":"Azîmet","x":"Allah'ın asıl olarak meşru kıldığı, bir duruma ya da bir mükellefe özgü olmayan genel hükümlerdir."},{"k":"h","x":"Ruhsatın çeşitleri"},{"k":"n","n":1,"x":"Zaruret veya ihtiyaç anında haramların mübah olması: ölmeyecek kadar içki içmek gibi."},{"k":"n","n":2,"x":"Mazeret olduğunda vâcibin terkinin mübah olması: seferde oruç tutulmaması gibi."},{"k":"n","n":3,"x":"İstisnaî bazı akidlerin sahih olması: selem gibi."},{"k":"n","n":4,"x":"Bizden önceki ümmetlerin meşakkat barındıran hükümlerinin neshi: necaset bulaşan elbisenin o bölgesinin kesilmesi gibi."},{"k":"h","x":"Hanefîlere göre ruhsat"},{"k":"tbl","r":[["Kısım","Tanımı","Örnek"],["**1. Terfih ruhsatı**","Azîmetin hükmü ve delili kalmakla beraber mükellefe rahatlık, hafiflik olsun diye terkine ruhsat verilen","İkrah altında küfür kelimesi söylemek. Burada azîmeti seçip şehid de olabilirsin."],["**2. Iskat ruhsatı**","Azîmetin hükmü kalmayıp ruhsatla amel etmenin vâcib olduğu kısım","Ölmemek için domuz eti yemek. Bu hâlde yemeyip ölürsek günahkâr oluruz."]]}]},{"h":"5. Sıhhat ve butlan","b":[{"k":"h","x":"A. Cumhura göre"},{"k":"tbl","r":[["","Tanım 1","Tanım 2"],["**Sıhhat**","«تَرَتُّبُ آثَارِهِ الشَّرْعِيَّةِ عَلَيْهِ»","«مُوَافَقَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ»"],["**Butlan**","«عَدَمُ تَرَتُّبِ آثَارِهِ الشَّرْعِيَّةِ عَلَيْهِ»","«مُخَالَفَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ»"]]},{"k":"h","x":"B. Hanefîlere göre"},{"k":"li","x":"**Sahih:** «مُوَافَقَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ» (cumhurla aynı)"},{"k":"li","x":"**Gayr-ı sahih:** «مُخَالَفَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ»"},{"k":"li","x":"İbadet konularında cumhurla aynıdır. Muamelat konularında ise gayr-ı sahih ikiye ayrılır:"},{"k":"tbl","r":[["Kısım","Tanımı"],["**1. Fâsid**","Sıhhat şartlarında eksiklik olan"],["**2. Bâtıl**","Rükünlerinde eksiklik olan"]]},{"k":"ornek","x":"Et bozulmuşsa bâtıl; kokuşmuşsa (ama yenilebiliyorsa) fâsid denir."}]},{"h":"Mahkûm fîh","b":[{"k":"ar","a":"فِعْلُ الْمُكَلَّفِ الَّذِي تَعَلَّقَ بِهِ حُكْمُ الشَّارِعِ","x":""},{"k":"d","t":"Mahkûm fîh","x":"Mükellefin, şâriin hükmünün taalluk ettiği fiilidir."},{"k":"ar","a":"يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ","x":"Örnek. Hâkim: Allah · Hüküm: vücub · Mahkûm fîh: sözleşmeleri yerine getirme."},{"k":"ar","a":"لَا تَكْلِيفَ إِلَّا بِفِعْلٍ","x":"Ancak bir fiille teklif olur."},{"k":"li","x":"Emir, nedb ve ibaha birer fiildir. Tahrîm ve kerahet ise nefsi alıkoymak bakımından birer fiil sayılır. (Yani normalde bir şeyi yapmamak fiil sayılmaz; ancak bu bakımdan fiil sayılır.)"}]},{"h":"Bir fiilin şer'an yükümlü kılınabilmesinin şartları","b":[{"k":"h","x":"1. Fiil, mükellef tarafından tam olarak bilinmeli"},{"k":"li","x":"Kur'an'da «أَقِيمُوا الصَّلَاةَ» deniyor, fakat nasıl kılınacağı bildirilmiyor; bunu Hz. Peygamber'in göstermesiyle tam olarak malum oluyor. Dolayısıyla teklif olması sahih oluyor."},{"k":"li","x":"Bu, mücmel ayetler için geçerlidir. Açık olanlarda zaten bir problem yoktur."},{"k":"h","x":"2. Teklifin, teklif yetkisi bulunandan geldiğinin bilinmesi"},{"k":"li","x":"Buradaki bilmeden maksat, bilme imkânının olmasıdır."},{"k":"li","x":"Dolayısıyla kişinin bilmesi dârülislâmda yaşaması ile sabit olur. Çünkü dârülislâmda yaşayıp da bilmemek gibi bir mazeret olamaz; ama dârülharpte olabilir."},{"k":"h","x":"3. Fiilin yapılması mümkün veya mükellefin kudreti dahilinde olmalı"},{"k":"tbl","r":[["Kısım","","Tanımı","Örnek"],["**A. Müstahil**","AA. Li-zâtihî","Aklen ve âdeten imkânsız","İki zıddın cem'i"],["","AB. Li-gayrihî","Aklen mümkün, âdeten imkânsız","İnsanın bir vasıta olmadan uçması"],["**B. Başkasının fiili**","","Kimse başkasının yapıp yapmadığı fiillerden sorumlu tutulmaz","—"]]},{"k":"li","x":"Aynı şekilde insanın fıtratında olan şeyler de emredilemez. Hz. Peygamber'in «لَا تَغْضَبْ» hadisindeki \"öfkelenme\"den maksat \"öfkene hâkim ol\"dur."},{"k":"h","x":"İslam'da meşakkat"},{"k":"tbl","r":[["Kısım","Örnek","Hükmü"],["**1. Meşakkate rağmen insanların yapabildiği**","Rızık için çalışmak","İslam insanları bu tür meşakkatlerle sorumlu tutmuştur"],["**2. Yapmaya çalışıldığında büyük eziyet ve zarara uğratan**","Savm-ı visal","İslam insanları bu tür meşakkatlerle sorumlu tutmamıştır"]]}]},{"h":"Mahkûm aleyh","b":[{"k":"ar","a":"الْمُكَلَّفُ الَّذِي تَعَلَّقَ حُكْمُ الشَّارِعِ بِفِعْلِهِ","x":""},{"k":"d","t":"Mahkûm aleyh","x":"Şâriin hükmünün fiiline taalluk ettiği mükelleftir."},{"k":"h","x":"Mükellefin yükümlü olabilmesinin şartları"},{"k":"n","n":1,"x":"**Teklifin delillerini anlamaya muktedir olmalı (akıl, bulûğ).** Yani ne ile mükellef olduğunu bilmeli ve anlamalı. Bu ancak akılla olur; dolayısıyla mecnun mükellef olmaz. Akıl gizli bir şey olduğu için bir kimsenin akıllı olup olmadığını dışarıdan anlayamayız; bunun için bir alamet gerekir. Bu alamet de bulûğdur."},{"k":"n","n":2,"x":"**Mükellef olduğu şeye ehil olmalı.**"}]},{"h":"Ehliyet","b":[{"k":"d","t":"Ehliyet","x":"Sözlükte salahiyettir. Istılahta iki kısma ayrılır: vücûb ehliyeti ve edâ ehliyeti."},{"k":"h","x":"A. Vücûb ehliyeti"},{"k":"d","t":"Vücûb ehliyeti","x":"Bir insanın hakları elde etmeye ve sorumlulukları üstlenmeye elverişli olmasıdır. Bu hassaya zimmet denir."},{"k":"li","x":"Vücûb ehliyeti mutlak insan olmakla (kadın, erkek, çocuk, cenin, deli, bâliğ, akıllı) ilişkilidir."},{"k":"tbl","r":[["Kısım","Tanımı","Örnek"],["**1. Nâkıs**","Hakları elde etmeye elverişli, sorumlulukları üstlenmeye elverişsiz; ya da tam tersi","Anne karnındaki cenin; (tersi) borçlu meyyit"],["**2. Tam**","Her ikisine de elverişli","Sağ olarak doğumla başlar"]]},{"k":"h","x":"B. Edâ ehliyeti"},{"k":"d","t":"Edâ ehliyeti","x":"Mükellefin söz ve fiillerinin şer'an muteber sayılmasına elverişli olmasıdır."},{"k":"li","x":"Edâ ehliyeti akıl ile ilişkilidir. Üçe ayrılır:"},{"k":"tbl","r":[["Kısım","Kimde"],["**1. Edâ ehliyetinin olmaması**","Gayr-ı mümeyyiz çocuk (7 yaş altı) ve deli"],["**2. Nâkıs edâ ehliyeti**","Mümeyyiz (7 yaş) ve ma'tûh"],["**3. Tam edâ ehliyeti**","Bulûğa ermekle olur (akıllı olmak şartıyla)"]]},{"k":"h","x":"Nâkıs edâ ehliyetinde tasarruflar"},{"k":"tbl","r":[["Tasarruf","Hükmü","Örnek"],["**A. Mahza yarar sağlayan**","Geçerli","Hibe ve sadaka almak"],["**B. Mahza zarar veren**","Geçersiz","Teberruât ve ıskatat"],["**C. İki ihtimalli olan**","Velinin iznine bağlı","—"]]},{"k":"h","x":"Rüşd, sefeh, ateh"},{"k":"d","t":"Rüşd","x":"Malını korumak için gerekli tedbirleri alma ve saçıp savurmaktan sakınma vasfıdır. Bu vasfa sahip olana reşîd denir."},{"k":"li","x":"**Hanefîlere göre:** Üst sınırı dedelik yaşı denilen 25 yaştır. Bu yaşa geldiğinde rüşde ulaşmasa da malı teslim edilir."},{"k":"li","x":"**Cumhura göre:** Yaşa bakılmaz, rüşde bakılır."},{"k":"d","t":"Sefeh","x":"Bâliğ ve mümeyyiz bir kimsenin malını ölçüsüz harcama vasfıdır. Bu vasfa sahip olana sefîh denir; hacredilir."},{"k":"d","t":"Ateh","x":"Bunamadır. Sahibine ma'tûh denir; hacredilir."}]},{"h":"Ehliyet arızaları","b":[{"k":"not","x":"Ehliyet arızaları edâ ehliyeti ile ilgilidir."},{"k":"tbl","r":[["Arıza","Örnek"],["**1. Ehliyeti izale eden**","Delilik, uyku, baygınlık"],["**2. Ehliyeti azaltan (نَقْص)**","Ateh. Çünkü atehte nâkıs edâ ehliyeti vardır."],["**3. Ehliyeti etkilemeyen, fakat bazı hükümler doğuran**","Sefeh → hacr"]]}]}],"ht":[{"s":0,"x":"Hâkim: hükmün kaynağı (Allah) · Hüküm: Allah'ın mükelleflerin fiillerine taalluk eden hitabı · Mahkûm fîh: mükellefin fiili · Mahkûm aleyh: mükellef."},{"s":0,"x":"Hüsün-kubuh: Mâtürîdî ve Mu'tezileye göre akılla bilinir; Eş'arîye göre bilinmez, şer'îdir."},{"s":1,"x":"Teklifî hüküm: talebî (talebü'l-fiil, talebü't-terk) ve tahyîrî. Vaz'î hüküm: sebep, şart, mâni."},{"s":1,"x":"Fark: teklifîde talep var ve hep kudret dahilinde; vaz'îde talep yok ve bazen kudret dışında (akrabalık mirasa sebep)."},{"s":2,"x":"Vâcib: kesin talep. Zaman: mutlak (keffaret) / muvakkat: muvassa' (öğle), mudayyak (Ramazan), zü'ş-şebeheyn."},{"s":2,"x":"Vâcib: kifâî (cenaze namazı) / aynî (5 vakit) · muhadded (zekât) / gayr-ı muhadded (infak) · muayyen (kurban) / muhayyer (yemin keffareti)."},{"s":3,"x":"Mendub: kesin olmayan talep. Müekkede/hüdâ (terki itab: cemaatle namaz) · gayr-ı müekkede/zâide/nâfile (Perşembe orucu) · zâid (Peygamber'e uyma niyetiyle yeme-içme)."},{"s":4,"x":"Muharram: kesin nehiy. Li-zâtihî (zina) / li-gayrihî (gasp elbiseyle namaz: haram ama ibadet makbul, akid sahih)."},{"s":5,"x":"Mekruh: kesin olmayan nehiy; «كره» sîgası, kerahet bildiren nehiy, karineli ictinab emri."},{"s":6,"x":"Cumhur 5 kısım (vâcib, mendub, muharram, mekruh, mübah); Hanefîler 7 kısım (farz, vâcib, haram, mendub, tenzîhen mekruh, tahrîmen mekruh, mübah)."},{"s":6,"x":"Farz: sübut ve delalet kat'î, inkârı küfür. Vâcib: biri kat'î biri zannî, inkârı bid'at ve sapıklık."},{"s":7,"x":"Sebep: teklifî hükme (vakit-namaz) veya mülkiyet/helalliğe (bey', nikâh, talak) sebep; her biri mükellefin gücü dahilinde olan (zekât, katl) ve olmayan (vakit, miras)."},{"s":7,"x":"Şart: şer'î / ca'lî; şartın varlığı meşrutu gerektirmez (abdest-namaz). Mâni: hükme (hayız) / sebebe (borç-nisab)."},{"s":8,"x":"Ruhsat: zarurette haramın mübah olması · mazerette vâcibin terki · istisnaî akidler (selem) · önceki ümmetlerin ağır hükümlerinin neshi."},{"s":8,"x":"Hanefîlere göre: terfih ruhsatı (azîmet de seçilebilir: ikrahta küfür) / ıskat ruhsatı (ruhsat vâcib: zarurette domuz eti)."},{"s":9,"x":"Sıhhat: fiilin şâriin emrine uyması / şer'î sonuçlarını doğurması. Hanefîler muamelatta gayr-ı sahihi ikiye ayırır: fâsid (şartta eksiklik), bâtıl (rükünde eksiklik)."},{"s":10,"x":"Mahkûm fîh: hükmün taalluk ettiği mükellef fiili. \"Lâ teklîfe illâ bi-fi'l\": haram ve mekruhta nefsi alıkoymak fiil sayılır."},{"s":11,"x":"Fiilin şartları: tam bilinmesi (mücmel sünnetle açıklanır) · yetkiliden geldiğinin bilinmesi (bilme imkânı; dârülislâmda bilmemek mazeret değil) · kudret dahilinde olması (müstahil li-zâtihî/li-gayrihî; başkasının fiili; fıtrat: \"lâ tağdab\")."},{"s":11,"x":"Meşakkat: katlanılabilen (rızık için çalışmak) teklife engel değil; büyük eziyet veren (savm-ı visal) ile sorumlu tutulmaz."},{"s":12,"x":"Mükellefin şartları: anlamaya muktedir olmak (akıl; alameti bulûğ) ve ehil olmak."},{"s":13,"x":"Vücûb ehliyeti (zimmet): insan olmakla; nâkıs (cenin) / tam (doğumla). Edâ ehliyeti: akılla; yok (7 yaş altı, deli), nâkıs (mümeyyiz, ma'tûh), tam (bulûğ)."},{"s":13,"x":"Nâkıs edâ ehliyetinde: mahza yarar geçerli (hibe almak), mahza zarar geçersiz (teberru), iki ihtimalli veli iznine bağlı."},{"s":13,"x":"Rüşd: Hanefîlere göre üst sınır 25 yaş; cumhura göre yaşa değil rüşde bakılır. Sefîh ve ma'tûh hacredilir."},{"s":14,"x":"Ehliyet arızaları (edâ ehliyetiyle ilgili): izale eden (delilik, uyku, baygınlık), azaltan (ateh), etkilemeyip hüküm doğuran (sefeh → hacr)."}]},{"t":"Lafızlar ve Delalet","intro":"Hanefîlere göre nassın delalet yolları ve cumhura göre mantûk–mefhûm; manaya delaleti açık ve kapalı lafızlar; müşterek, âmm, hâss, mutlak–mukayyed; emir ve nehiy.","s":[{"h":"Nassın delalet yolları (Hanefîlere göre)","b":[{"k":"not","x":"Bu taksim Hanefiye göredir."},{"k":"h","x":"1. İbâretü'n-nass"},{"k":"d","t":"İbâretü'n-nass","x":"Sîganın akla ilk gelen manaya ve sevkedilme amacına delalet etmesidir. Bu sevkedilme amacı aslî de olabilir, tebeî de."},{"k":"ar","a":"وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا","x":"Örnek"},{"k":"li","x":"Bu nassın sîgası, sevkedilme amacı olan iki manaya delalet eder: 1) Alışverişin faiz gibi olmadığı. 2) Alışverişin hükmünün helal, faizin hükmünün de haram oluşu."},{"k":"li","x":"1. mana **asaleten**dir. Çünkü bu ayet «إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَا» diyenlere reddiye için sevkedilmiş, aralarındaki benzerlik nefyedilmiştir. 2. mana ise **tebean**dır."},{"k":"h","x":"2. İşâretü'n-nass"},{"k":"d","t":"İşâretü'n-nass","x":"Akla ilk gelmeyen ve sevkedilme amacı olmayan, fakat gereklilik yoluyla çıkarılan manadır. Bu gereklilik bazen zâhir, bazen de hafî olur."},{"k":"ar","a":"وَشَاوِرْهُمْ فِي الْأَمْرِ","x":"Örnek"},{"k":"li","x":"İbâretü'n-nass istişarenin gerekliliğidir. İşâretü'n-nass ise kendisiyle istişare edilecek bir topluluk oluşturma gerekliliğidir. Çünkü istişare bu topluluk olmadan yapılamaz."},{"k":"h","x":"3. Delâletü'n-nass"},{"k":"d","t":"Delâletü'n-nass","x":"Nassta belirtilen duruma ait hükmün, kıyas ve içtihada ihtiyaç duyulmaksızın sadece dili bilmekle anlaşılabilen illetteki müştereklik sebebiyle nassta belirtilmeyen durum hakkında da sabit olmasıdır."},{"k":"ar","a":"فَلَا تَقُلْ لَهُمَا أُفٍّ","x":"Örnek"},{"k":"li","x":"İbâretü'n-nass, evladın anne-babaya \"öf\" dememesidir. Buradaki illet eziyet vermedir. Delâletü'n-nass ise sövme ve dövme gibi eziyet veren diğer fiillerin de nehyedilmesidir."},{"k":"dikkat","x":"Kıyas ile farkı: Delâletü'n-nassta sadece dili bilmek yeterlidir; kıyasta bu yeterli değildir."},{"k":"h","x":"4. İktizâü'n-nass"},{"k":"d","t":"İktizâü'n-nass","x":"Nassın sahih bir şekilde anlaşılması için takdir edilmesi gereken manadır."},{"k":"ar","a":"حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ","x":"Örnek. Takdiri: «نِكَاحُهَا». Yani nikâhlanmak haram kılındı."}]},{"h":"Delaletlerin gücü ve tearuzu","b":[{"k":"dikkat","x":"Delaletler içerisinde en güçlüsü **ibare**dir. Sonra sırasıyla **işaret, delalet ve iktiza** gelir. Bundan dolayı nasslar arasında bir tearuz meydana geldiğinde ibare işarete tercih edilir."},{"k":"steps","x":["İbâretü'n-nass","İşâretü'n-nass","Delâletü'n-nass","İktizâü'n-nass"]},{"k":"h","x":"İbare ile işaretin tearuzuna örnek"},{"k":"ar","a":"كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى","x":"1. ayet: İbaresi katile kısas uygulanmasının vücubuna delalet eder."},{"k":"ar","a":"وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ","x":"2. ayet: İşareti, kasden adam öldürene kısas uygulanmayacağına delalet eder."},{"k":"li","x":"Söz konusu tearuzda ibare işarete tercih edilir ve katile kısas uygulanır."},{"k":"h","x":"İşaret ile delaletin tearuzuna örnek"},{"k":"ar","a":"وَمَنْ قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ","x":"Bu ayetin ibaresi, hataen bir mümini öldürenin cezasının mümin bir köleyi azat etme keffareti olduğuna delalet eder."},{"k":"li","x":"Delaleti ise şudur: Hataen öldürene bu gerekiyorsa, aralarındaki illet («قَتْل») birliği sebebiyle bilerek öldürene haydi haydi gerekir."},{"k":"li","x":"Bu delalet, yukarıdaki «وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا» ayetinin işaretiyle tearuz eder ve **işaret tercih edilir**. Devamında işaret de ibare ile tearuz eder ve **ibare tercih edilir**."}]},{"h":"Cumhura göre delaletin nevileri","b":[{"k":"tbl","r":[["Nevi","Tanımı","Hanefîlerdeki karşılığı"],["**1. Delâletü'l-mantûk**","Lafzın, nassta zikri geçen bir şeyin hükmüne delaleti","İbare, işaret ve iktiza"],["**2. Delâletü'l-mefhûm**","Lafzın, nassta zikri geçmeyen bir şeyin hükmüne delaleti; ikiye ayrılır","—"],["**2A. Mefhûmu'l-muvâfaka**","—","Delâletü'n-nass"],["**2B. Mefhûmu'l-muhâlefe**","5 çeşittir","—"]]},{"k":"h","x":"Mefhûm-ı muhâlefetin çeşitleri"},{"k":"tbl","r":[["Çeşit","Tanımı","Örnek","Mefhûm-ı muhâlefesi"],["**2B1. Mefhûmu's-sıfat**","Hükmü bir vasıfla kayıtlanmış nassın, bu vasfı taşımayan durumlarda o hükmün geçerli olmadığına delalet etmesi","«وَحَلَائِلُ أَبْنَائِكُمُ الَّذِينَ مِنْ أَصْلَابِكُمْ»","Öz olmayan çocuklar (süt çocuğu gibi)"],["**2B2. Mefhûmu'l-gâye**","Hükmü belirli bir sınırla kayıtlanmış nassın, bu sınırdan sonra o hükmün geçerli olmadığına delalet etmesi","«فَإِنْ طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ»","Boşanılan kadın, kendisini boşayan erkeğin dışında başka bir erkekle evlenirse helal olur"],["**2B3. Mefhûmu'ş-şart**","Hükmü şart edatlarından biriyle belirli bir şarta bağlanmış nassın, bu şartın bulunmadığı durumlarda o hükmün geçerli olmadığına delalet etmesi","«وَإِنْ كُنَّ أُولَاتِ حَمْلٍ فَأَنْفِقُوا عَلَيْهِنَّ حَتَّى يَضَعْنَ حَمْلَهُنَّ»","Hamile değillerse nafaka mükellefiyeti yoktur"],["**2B4. Mefhûmu'l-aded**","Hükmü belirli bir sayıyla kayıtlanmış nassın, bu sayının dışında o hükmün yerine gelmeyeceğine delalet etmesi","«الزَّانِيَةُ وَالزَّانِي فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ»","100'den az veya fazlası olmaz"],["**2B5. Mefhûmu'l-lakab**","Özel isim, cins ve nevi gibilerine bağlanan hükmün bunların dışındakiler için geçerli olmaması","«مُحَمَّدٌ رَسُولُ اللَّهِ»","Muhammed dışındakiler resul değildir"]]}]},{"h":"Mefhûm-ı muhâlefetin hücciyeti","b":[{"k":"h","x":"Tetimme"},{"k":"n","n":1,"x":"Mefhûmu'l-lakab ittifakla hüccet değildir."},{"k":"n","n":2,"x":"Mefhûmu'l-muhâlefe (lakap hariç bütün çeşitleriyle) ittifakla şer'î nassların dışında hüccettir."},{"k":"n","n":3,"x":"Mefhûmu'l-muhâlefe (lakap hariç bütün çeşitleriyle) cumhura göre nasslarda da hüccettir; Hanefîlere göre değildir."},{"k":"h","x":"Cumhurun delilleri"},{"k":"n","n":1,"x":"Arapların ibare kullanma üslubundan akla ilk gelen şudur: Vasıf, şart, gaye ve aded ile hükmü kayıtlamak, bu kayıtlar olmadığında o hükmün nefyine delalet eder."},{"k":"ornek","x":"\"Çocuğun başarılı olursa ona bir hediye al.\" Yani başarılı olmazsa alma."},{"k":"n","n":2,"x":"Nasslardaki kayıtlar bir hikmet içindir; boşu boşuna değildir."},{"k":"h","x":"Hanefîlerin delilleri"},{"k":"n","n":1,"x":"Cumhurun söylediği 1. delil her zaman geçerli olmayabilir."},{"k":"ornek","x":"\"Biri senden sabah bir şey isterse ihtiyacını gider.\" Bundan \"Akşam isterse giderme\" anlamı çıkarılmaz."},{"k":"n","n":2,"x":"Cumhurun söylediği 2. delil de (nasslarla ilgili) her zaman geçerli değildir."},{"k":"ar","a":"إِنْ خِفْتُمْ أَنْ يَفْتِنَكُمُ الَّذِينَ كَفَرُوا","x":"Namazın seferde kısaltılmasıyla ilgili ayetteki kayıt. Bundan \"Korku yoksa kısaltmayın, tam kılın\" anlamı çıkarılmaz."},{"k":"h","x":"Mefhûm-ı muhâlifle amel şartları"},{"k":"li","x":"Bunu kabul edenlere göre birçok şartı vardır; fakat hepsi bir noktada toplanabilir: Mantûkun hükmüne konulan kaydın, kayıt kalktığında hükmün de sona ereceğini göstermek dışında bir fayda ve gayesi olmamalıdır. Aksi hâlde mefhûm-ı muhâlif dikkate alınmaz."},{"k":"ar","a":"وَهُوَ الَّذِي سَخَّرَ الْبَحْرَ لِتَأْكُلُوا مِنْهُ لَحْمًا طَرِيًّا","x":"Örnek. Buradaki maksat nimetleri hatırlatmaktır; \"Taze olmayanı yemeyin\" demek değildir."}]},{"h":"Hanefîlere göre manaya delaleti açık lafızlar (el-Vâdıhu'd-delâle)","b":[{"k":"tbl","r":[["Lafız","Tanımı","Tevil ihtimali","Teşrî döneminde nesih"],["**1. Zâhir**","Harici bir şeye ihtiyaç duymaksızın bizzat sîgasıyla murad edilen manaya delalet eden, nassın aslen sevk amacı olmayan","Var","Açık"],["**2. Nass**","Aynı şekilde delalet eden, nassın asıl sevk amacı olan","Var","Açık"],["**3. Müfesser**","Murad edilen manaya açık bir şekilde delalet eden","Yok","Açık"],["**4. Muhkem**","Murad edilen manaya açık bir şekilde delalet eden","Yok","Kapalı"]]},{"k":"h","x":"1. Zâhir"},{"k":"d","t":"Zâhir","x":"Harici bir şeye ihtiyaç duymaksızın bizzat sîgası ile murad edilen manaya delalet eden, nassın aslen sevk amacı olmayan ve tevil (tahsis, takyid, mecaz) ihtimali olan lafızdır."},{"k":"ar","a":"وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا","x":"Örnek. Tebean alışverişin helal, faizin haram olduğuna delalet eder (çünkü aslen alışverişin faiz gibi olmadığına delalet eder). Bu manaya harici bir şeye ihtiyaç duymadan delalet eder."},{"k":"li","x":"**Hükmü:** Aksine bir delil olmadığı sürece zâhirle amel etmek vâcibtir. Teşrî döneminde neshe açıktır."},{"k":"h","x":"2. Nass"},{"k":"d","t":"Nass","x":"Harici bir şeye ihtiyaç duymaksızın bizzat sîgası ile murad edilen manaya delalet eden, nassın asıl sevk amacı olan ve tevil ihtimali olan lafızdır."},{"k":"li","x":"Örneği aynı ayettir (alışverişin faiz gibi olmadığı manası). Hükmü zâhirin hükmü gibidir."},{"k":"h","x":"Tevil"},{"k":"d","t":"Tevil","x":"Sözlükte döndürmektir. Istılahta lafzı bir delille zâhirinden çevirmektir."},{"k":"ar","a":"صَرْفُ اللَّفْظِ عَنْ ظَاهِرِهِ بِدَلِيلٍ","x":""},{"k":"h","x":"3. Müfesser"},{"k":"d","t":"Müfesser","x":"Murad edilen manaya açık bir şekilde delalet eden ve tevil (tahsis, takyid, mecaz) ihtimali olmayan lafızdır."},{"k":"ar","a":"فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً","x":"Örnek. Fazlası veya eksiği olmaz."},{"k":"li","x":"**Hükmü:** Zâhir ve nass gibi; teşrî döneminde neshe açıktır."},{"k":"not","x":"Tefsir şâri tarafından, tevil şârih tarafından yapılır. Tefsir kat'îdir, tevil ise zannîdir."},{"k":"h","x":"4. Muhkem"},{"k":"d","t":"Muhkem","x":"Murad edilen manaya açık bir şekilde delalet eden, tevil ihtimali olmayan ve teşrî döneminde de neshe kapalı olan lafızdır."},{"k":"ar","a":"وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا","x":"Örnek"},{"k":"li","x":"**Hükmü:** Teşrî döneminde de neshe kapalıdır. Dolayısıyla müfesser, Hz. Peygamber'in vefatından sonra muhkeme döner."},{"k":"dikkat","x":"Kuvvet sıralaması tersten gider: muhkem > müfesser > nass > zâhir. Tearuz durumunda bu sıralama takip edilir."}]},{"h":"Hanefîlere göre manaya delaleti kapalı lafızlar (Gayru'l-vâdıhi'd-delâle)","b":[{"k":"tbl","r":[["Lafız","Kapalılığın yeri","Nasıl giderilir"],["**1. Hafî**","Lafzın manası açık; şâmil olduğu fertlere delaleti kapalı","İnceleme ve içtihadla"],["**2. Müşkil**","Bizzat sîgada","Harici bir şeyle; içtihadla"],["**3. Mücmel**","Bizzat sîgada","Ancak şâriin beyanıyla"],["**4. Müteşâbih**","Kimsenin ya da yalnız ilimde râsih olanların bilebileceği derecede","(İhtilaflı)"]]},{"k":"h","x":"1. Hafî"},{"k":"d","t":"Hafî","x":"Manaya delaleti açık olup şâmil olduğu fertlere delaleti kapalı olan lafızdır."},{"k":"ar","a":"وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا","x":"Örnek. «سَارِق» kelimesinin manası açıktır; fakat hangi fertleri kapsadığı konusunda kapalılık vardır."},{"k":"tbl","r":[["Kişi","Durumu","Hükmü"],["**Tarrâr «طَرَّار»** (yankesici)","Yankesici açıktan alır, hırsız gizliden","Ulemânın içtihadıyla ittifaken eli kesilir"],["**Nebbâş «نَبَّاش»**","Ölünün kefenini veya elbisesini çalan. Hırsızdan farkı, mergûb olmayan bir malı çalmasıdır","İmam Şâfiî ve Ebû Yûsuf'a göre hırsız sayılır; diğer Hanefî ulemâsına göre hırsız sayılmaz, ta'zir cezası verilir"]]},{"k":"li","x":"**Hükmü:** İnceleme ve içtihad yoluyla kapalılığı giderilir. İnceleme ve içtihadla bir neticeye varıldıktan sonra kendisiyle amel edilebilir."},{"k":"h","x":"2. Müşkil"},{"k":"d","t":"Müşkil","x":"Bizzat kendi sîgasıyla murad edilen manaya delaleti kapalı olup bu kapalılığın ancak harici bir şeyle giderildiği lafızlardır."},{"k":"dikkat","x":"Hafî ile farkı: Kapalılık hafîde bizzat sîgada değil, fertleri kapsamasındadır. Müşkilde ise bizzat sîgadadır."},{"k":"li","x":"Müşterek lafızlarda bulunur."},{"k":"li","x":"**Hükmü:** Muhtemel manalarından biri içtihad ile belirlendikten sonra amel edilebilir."},{"k":"ar","a":"وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ","x":"Örnek. «قُرُوء» hayız mı, temizlik mi?"},{"k":"tbl","r":[["Mezhep","Görüşü","Delilleri"],["**Şâfiîler**","Temizlik","«ثَلَاثَة» adedinin müzekker gelmesi, ma'dûdun müzekker yani temizlik («طُهْر») olduğuna delalet eder."],["**Hanefîler**","Hayız","1) İddet beklemenin hikmeti hamile olup olmadığının belli olmasıdır; bu da temizlikten değil hayızdan anlaşılır. 2) «وَاللَّائِي يَئِسْنَ مِنَ الْمَحِيضِ مِنْ نِسَائِكُمْ إِنِ ارْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَاثَةُ أَشْهُرٍ وَاللَّائِي لَمْ يَحِضْنَ» ayetinden iddetin hayızla alakalı olduğu anlaşılır. 3) «طَلَاقُ الْأَمَةِ ثِنْتَانِ وَعِدَّتُهَا حَيْضَتَانِ» hadisi."]]},{"k":"h","x":"3. Mücmel"},{"k":"d","t":"Mücmel","x":"Murad edilen manaya delaleti kapalı olup ancak şâriin beyanıyla açık olan lafızlardır."},{"k":"tbl","r":[["Çeşidi","Örnek"],["**1. Müştereklik**","«مَوْلًى»"],["**2. Sözlük manasından şâriin kastettiği özel bir manaya nakledilmesi**","«صَلَاة»"],["**3. Lafzın garabeti**","«هَلُوعًا»"]]},{"k":"li","x":"**Hükmü:** Şâriin beyanı olmadan kendisiyle amel edilmesi caiz değildir. Bu beyan iki şekilde olabilir:"},{"k":"n","n":1,"x":"**Kat'î ve vâfi (tam) beyan:** Bu durumda mücmel müfessere döner. Şâriin salâtı beyanı gibi."},{"k":"n","n":2,"x":"**Vâfi olmayan beyan:** Bu durumda mücmel müşkile döner ve şâriin beyanına ihtiyaç duymaksızın müçtehidin içtihadıyla bu kapalılık giderilebilir."},{"k":"ornek","x":"«وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا» ayetindeki «رِبَا» sözlük anlamıyla değil, şâriin kastettiği özel bir manada kullanılmıştır. Hz. Peygamber bunu «الذَّهَبُ بِالذَّهَبِ…» hadisiyle beyan etmiştir. Fakat bu beyan vâfi değildir. Bu yüzden «رِبَا» müşkile döner ve müçtehid onun neliği konusunda içtihad edebilir."},{"k":"h","x":"4. Müteşâbih"},{"k":"d","t":"Müteşâbih","x":"Kendisiyle kastedilen mananın dünyada hiç kimsenin bilemeyeceği veya sadece ilimde râsih olanların bilebileceği derecede kapalı olan lafızlardır."},{"k":"dikkat","x":"Bu anlamıyla müteşâbih, teşrî-amelî hükümleri içeren nasslarda (ayet ve hadislerde) bulunmaz. Ancak bunların dışındakilerde bulunur:"},{"k":"li","x":"**Hurûf-ı mukattaa**"},{"k":"li","x":"**Zâhiri, Allah'ın yarattıklarına benzediğini vehmettiren nasslar** («يَد، وَجْه»)"},{"k":"li","x":"**Hükmü:** Manasına vâkıf olunup olunamayacağı konusu ihtilaflıdır («إِلَّا اللَّهُ» üzerinde durulup durulmayacağı / «وَالرَّاسِخُونَ فِي الْعِلْمِ»)."}]},{"h":"Hanefîlerin dışındakilere göre açık ve kapalı lafızlar","b":[{"k":"h","x":"El-Vâdıhu'd-delâle"},{"k":"d","t":"Zâhir (Hanefî dışı)","x":"Manasına zannî (açık) olarak delalet eden, başka bir ihtimale açık olan lafızdır."},{"k":"d","t":"Nass (Hanefî dışı)","x":"Manasına kat'î (açık) olarak delalet eden, başka bir ihtimale kapalı olan lafızdır. Hanefîlerdeki müfesserle aynıdır."},{"k":"li","x":"**Muhkem** ise (Hanefîlerin dışındakilere göre) ister zannî ister kat'î, manasına açık bir şekilde delalet edendir. Yani hem zâhiri hem nassı kapsar."},{"k":"not","x":"Bu ihtilaf ciddi bir fikir ayrılığı olmayıp sırf terim ayrılığından ibarettir. Pratik açıdan herhangi bir sonucu yoktur."},{"k":"h","x":"Gayru'l-vâdıhi'd-delâle"},{"k":"n","n":1,"x":"**Mücmel:** Manasına delaleti kapalı olan lafız."},{"k":"n","n":2,"x":"**Müteşâbih:** İster kendi sîgasındaki bir sebeple, ister başka bir sebeple manaya delaleti kapalı olan lafız."},{"k":"li","x":"Bu ikisi Hanefîlerdeki dört neviyi de kapsar."},{"k":"tbl","r":[["","Hanefîler","Hanefî dışındakiler"],["**Açık**","Zâhir, nass, müfesser, muhkem","Zâhir, nass (= Hanefî müfesseri); muhkem ikisini kapsar"],["**Kapalı**","Hafî, müşkil, mücmel, müteşâbih","Mücmel, müteşâbih"]]}]},{"h":"Müşterek","b":[{"k":"d","t":"Müşterek","x":"Her biri ayrı bir vaz' ile olmak üzere birden fazla manaya sahip olan lafızlardır. «عَيْن» ve «قُرْء» lafızları gibi."},{"k":"h","x":"Müştereğin ortaya çıkış sebepleri"},{"k":"tbl","r":[["Sebep","Örnek"],["**1. Arap kabileleri arasındaki farklılıklar**","«ذِرَاع»: Bazı kabilelerde omuza kadar, bazılarında dirseğe kadar, bazılarında ise bileğe kadardır."],["**2. Hakiki manadan mecaza geçip yaygınlaşması**","«سَيَّارَة» ve «دَرَّاجَة»: Önce hakiki bir mana için konmuş, sonra bir alakadan dolayı mecazen farklı bir manada kullanılmış ve öylesine yaygınlaşmış ki artık hakiki manası unutulmuştur."],["**3. Sözlük manasından şer'î/ıstılahî manaya geçiş**","«صَلَاة» ve «زَكَاة»"]]},{"k":"h","x":"Nassta gelen müşterek lafız"},{"k":"li","x":"Şer'î bir nassta gelen lafız, **sözlük ve şer'î/ıstılahî anlamlar** bakımından müşterekse şer'î/ıstılahî manasının kastedilmesi vâcibtir."},{"k":"ornek","x":"«وَأَقِيمُوا الصَّلَاةَ»: namaz kastedilir, dua değil."},{"k":"li","x":"Şer'î bir nassta gelen lafız **birkaç sözlük anlamı** bakımından müşterekse, birinin tayini için içtihad edilmesi gerekir."},{"k":"ornek","x":"«قُرُوء»: Hanefîlere göre hayız, Şâfiîlere göre temizlik."},{"k":"h","x":"Hükmü"},{"k":"li","x":"Lafızda aslolan müşterek olmamasıdır. Lafzın hem müşterek olma hem de olmama ihtimali varsa olmama ihtimali tercih edilir. Bu müttefekun aleyhtir."},{"k":"li","x":"Böyle bir ihtimal olmayıp müştereklik kesinleşince, içtihadla biri tercih edildikten sonra amel edilir."}]},{"h":"Umûmu'l-müşterek meselesi","b":[{"k":"li","x":"Yani müşterek lafzın manalarının her birine aynı anda delalet edip edemeyeceği meselesi."},{"k":"tbl","r":[["Görüş","Hükmü","Gerekçe"],["**Hanefîler**","İster olumlu ister olumsuz olsun caiz değildir","Müştereğin tanımından anlaşılacağı üzere her mana için ayrı bir vaz' gerekir; tek bir vaz' ile delalet etmesi müştereklik tanımına aykırıdır."],["**Şâfiîler**","İster olumlu ister olumsuz olsun caizdir","Hac Suresi 18. ayet: secde insanlar hakkında alnı yere koymak, diğer varlıklar hakkında boyun eğmek ve itaattir; tek bir vaz' ile ikisine delalet eder."],["**Bazı Hanefîler**","Olumsuz cümlede caizdir, olumlu cümlede değildir","Olumsuzdan sonra gelen nekranın umum ifade etmesi gibi olur."]]},{"k":"ar","a":"أَلَمْ تَرَ أَنَّ اللَّهَ يَسْجُدُ لَهُ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ وَالشَّمْسُ وَالْقَمَرُ وَالنُّجُومُ وَالْجِبَالُ وَالشَّجَرُ وَالدَّوَابُّ وَكَثِيرٌ مِنَ النَّاسِ","x":"Şâfiîlerin delili"},{"k":"dikkat","x":"Hanefîlerin cevabı: Buradaki iki secde de boyun eğme ve itaattir; ayrı anlamlarda değildir. Dolayısıyla bir müştereklik söz konusu değildir."},{"k":"ornek","x":"Yeminler bahsinde: «أَقْسَمَ أَوْ حَلَفَ لَا يُكَلِّمُ مَوَالِيَ فُلَانٍ». \"Falancanın mevlâlarıyla konuşmayacağım\" diye yemin eden kimsenin bu yemini hem a'lâyı (azat edeni) hem esfeli (azat edileni) kapsar; çünkü olumsuz bir cümledir."}]},{"h":"Âmm","b":[{"k":"d","t":"Âmm","x":"Tek bir vaz' ile tek bir manaya delalet eden ve bütün fertleri sınır olmaksızın kapsayan lafızdır."},{"k":"li","x":"Şer'î bir nassta âmm lafız gelirse ve tahsisine ilişkin bir delil yoksa kesinlikle umumu üzere hamledilir. Delil varsa zannî olarak tahsise hamledilir."},{"k":"li","x":"Âmm, ancak kendi seviyesindeki bir delil ile tahsis edilebilir."},{"k":"h","x":"Âmm lafızları"},{"k":"li","x":"«كُلّ» ve «جَمِيع» lafızları; cins lâm-ı tarifli isim cins; lâm-ı tarifli çoğul; ism-i mevsuller; şart isimleri; nefiyden sonra gelen nekre (ve istifham isimleri)."},{"k":"h","x":"Âmm ile mutlakın farkı"},{"k":"ar","a":"عُمُومُ الْعَامِّ شُمُولِيٌّ وَعُمُومُ الْمُطْلَقِ بَدَلِيٌّ","x":"Âmmın umumu kapsayıcı, mutlakın umumu bedelîdir."},{"k":"tbl","r":[["","Ne ifade eder","Örnek"],["**Mutlak**","Delalet ettiği fertlerden herhangi birini","«تَحْرِيرُ رَقَبَةٍ»: bütün köleleri değil, herhangi bir köleyi azat etmek"],["**Âmm**","Delalet ettiği bütün fertleri","«وَالسَّارِقُ وَالسَّارِقَةُ»: bütün hırsızlar"]]}]},{"h":"Âmmın delaleti","b":[{"k":"li","x":"Tahsisten **sonra** âmmın delaletinin zannî olduğu konusunda cumhur ile Hanefîler arasında ihtilaf yoktur."},{"k":"tbl","r":[["","Tahsisten önce âmmın delaleti","Zorunlu neticesi","Delili"],["**Cumhur**","Zannîdir","Zannî bir delille tahsis edilebilir","İstikra: Nasslarda vârid olan âmm lafızların hepsi tahsis edilmiştir; tahsis edilmeyip umumu üzere kalanlar gerçekten nadirdir."],["**Hanefîler**","Kat'îdir","Ancak kat'î bir delille tahsis edilebilir","Genel kural: Aksine bir delil olmadıkça âmm lafız, bütün fertlerini kapsamak üzere vaz' edilmiştir. Bu kat'îdir."]]}]},{"h":"Âmmın tahsisi","b":[{"k":"d","t":"Tahsis","x":"Âmmın bazı fertlerine hasredilmesidir."},{"k":"h","x":"Cumhura göre"},{"k":"li","x":"Mutlak olarak (ister müstakil ister gayr-ı müstakil, ister mukârin ister gayr-ı mukârin) âmmın bazı fertlerine hasredilmesidir."},{"k":"tbl","r":[["Muhassıs","Çeşit","Örnek"],["**a. Müstakil** (âmmın bulunduğu nassta geçmeyen, ayrı olan)","a1. Akıl","«فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ»: akıl, çocuk ve delinin kastedilmediğini bilir."],["","a2. Örf ve âdet","Bir kimse hayvanlarla ilgili bir vasiyette bulunsa ve o bölgede \"hayvan\" kelimesi sadece at anlamına geliyorsa vasiyetin kapsamına sadece atlar girer."],["","a3. Mutlak nass (mukârin ve gayr-ı mukârin)","Mukârin: «وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا». Gayr-ı mukârin: «حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ» ayetinin umumunu «هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ» hadisi tahsis etmiştir."],["**b. Gayr-ı müstakil / muttasıl** (âmmın bulunduğu nassta geçen, ayrı olmayan)","b1. İstisna","«إِلَّا أَنْ تَكُونَ تِجَارَةً حَاضِرَةً…»"],["","b2. Şart","«…إِنْ خِفْتُمْ أَنْ يَفْتِنَكُمُ الَّذِينَ كَفَرُوا»"],["","b3. Sıfat / vasf","«…مِنْ نِسَائِكُمُ اللَّاتِي دَخَلْتُمْ بِهِنَّ»"],["","b4. Gaye","«…وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ»"],["**c. Mukârin**","Âmm ile aynı vakitte meşru kılınan","«وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا»"],["**d. Gayr-ı mukârin**","Âmm ile aynı vakitte meşru kılınmayan, sonradan meşru kılınan","«حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ» → «هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ»"]]},{"k":"h","x":"Hanefîlere göre"},{"k":"li","x":"Tahsis, **müstakil ve mukârin** bir muhassıs ile âmm lafzın bazı fertlerine hasredilmesidir."},{"k":"tbl","r":[["Muhassıs","Hanefîlere göre adı"],["Gayr-ı müstakil","Tahsis değil, **kasr**"],["Müstakil ama gayr-ı mukârin","**Nesh**"],["Müstakil ve mukârin","**Tahsis**"]]},{"k":"dikkat","x":"Dolayısıyla Hanefîlere göre müstakil muhassısın çeşitlerinden olan \"nass\" sadece mukârin olur, gayr-ı mukârin olmaz."},{"k":"h","x":"Genel kural"},{"k":"ar","a":"الْعِبْرَةُ بِعُمُومِ اللَّفْظِ لَا بِخُصُوصِ السَّبَبِ","x":"Hüküm, sebebin özel olmasına değil lafzın genel olmasına göredir."},{"k":"ornek","x":"«أَنَتَوَضَّأُ بِمَاءِ الْبَحْرِ؟» sorusuna «هُوَ الطَّهُورُ مَاؤُهُ…» cevabı. Burada \"Soru sadece abdestle ilgiliydi\" veya \"Sadece zaruret hâlinde geçerli\" gibi şeylere itibar edilmez."}]},{"h":"Hâss","b":[{"k":"d","t":"Hâss","x":"Tek bir vaz' ile tek bir manaya delalet eden lafızdır."},{"k":"li","x":"Hâss lafız bazen **mutlak**, bazen **mukayyed**, bazen **emir**, bazen de **nehiy** olarak dört şekilde gelebilir."},{"k":"h","x":"Hâssın delaleti"},{"k":"li","x":"Hâss, ittifakla vaz' olunduğu manaya kat'î bir şekilde delalet eder ve aksine bir delil bulunmadıkça başka bir manaya hamledilemez."},{"k":"ar","a":"فَكَفَّارَتُهُ إِطْعَامُ عَشَرَةِ مَسَاكِينَ","x":"Örnek. 10'dan ne eksik ne de fazla."},{"k":"li","x":"Aksine bir delil bulunursa başka bir manaya hamledilir."},{"k":"ar","a":"فِي كُلِّ أَرْبَعِينَ شَاةً شَاةٌ","x":"Örnek. Hanefîler buradaki hâss olan «شَاة» kelimesini başka bir mana olan «قِيمَتُهَا» (değeri) şeklinde yorumlamıştır."}]},{"h":"Mutlak ve mukayyed","b":[{"k":"d","t":"Mutlak","x":"Gayr-ı muayyen bir ferde veya fertlere delalet eden ve herhangi bir sıfatla kayıtlandığına dair bir delil bulunmayan lafızdır."},{"k":"d","t":"Mukayyed","x":"Gayr-ı muayyen bir ferde veya fertlere delalet etmekle birlikte bir sıfatla veya kayıtla kayıtlandığına dair bir delil bulunan lafızdır."},{"k":"ornek","x":"Mutlak: \"öğrenci\" veya \"öğrenciler\". Mukayyed: \"çalışkan öğrenci\" veya \"çalışkan öğrenciler\"."},{"k":"h","x":"Mutlakın hükmü"},{"k":"li","x":"Bir nassta mutlak olarak gelen bir lafız, başka bir nassta mukayyed olarak gelmemişse mutlak hâline göre amel edilir."},{"k":"ar","a":"وَمَنْ كَانَ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ","x":"Örnek. «أَيَّام» lafzı mutlaktır; çünkü burada veya başka bir nassta herhangi bir kayıtla (mesela \"peş peşe\") kayıtlanmamıştır."},{"k":"h","x":"Mukayyedin hükmü"},{"k":"li","x":"Bir nassta mukayyed olarak gelen bir lafız, başka bir nassta mutlak olarak gelmemişse mukayyed hâline göre amel edilir."},{"k":"ar","a":"فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِنْ قَبْلِ أَنْ يَتَمَاسَّا","x":"Örnek. Mutlak bir lafız olan «شَهْرَيْن», «مُتَتَابِعَيْن» kaydıyla kayıtlanmış ve bu manada ilgili başka hiçbir nassta mutlak olarak zikredilmemiştir."}]},{"h":"Mutlakın mukayyede hamli","b":[{"k":"li","x":"Bir lafzın bir nassta mutlak, diğerinde mukayyed olarak gelmesi iki şekilde olur: Itlak ve takyid ya hükmün **sebebindedir** (hüküm aynı) ya da hükmün **kendisindedir**."},{"k":"h","x":"1. Sebepte ıtlak ve takyid"},{"k":"li","x":"Bu durumda **Hanefîlere göre** mutlak mukayyede hamledilmez; **cumhura göre** hamledilir."},{"k":"ar","a":"أَدُّوا صَاعًا مِنْ بُرٍّ أَوْ قَمْحٍ بَيْنَ اثْنَيْنِ أَوْ صَاعًا مِنْ تَمْرٍ أَوْ شَعِيرٍ عَنْ كُلِّ حُرٍّ وَعَبْدٍ صَغِيرٍ أَوْ كَبِيرٍ","x":"Mutlak"},{"k":"ar","a":"أَدُّوا عَنْ كُلِّ حُرٍّ وَعَبْدٍ مِنَ الْمُسْلِمِينَ","x":"Mukayyed"},{"k":"li","x":"Her iki nasstaki hüküm aynıdır: «أَدُّوا», yani sadaka-i fıtrın vâcib olması. Sebep ise nafaka ile yükümlülüktür. 1. nassta bu sebep «حُرّ» ve «عَبْد» diye mutlak olarak zikredilmişken 2. nassta «مِنَ الْمُسْلِمِينَ» kaydıyla zikredilmiştir."},{"k":"li","x":"**Hanefîlere göre** burada mutlak mukayyede hamledilmediğinden her iki nassla da ayrı ayrı amel edilir: Müslüman olsun olmasın, nafakası üstlenilen herkes adına fitre vermek vâcibtir."},{"k":"li","x":"**Cumhura göre** hamledildiğinden mukayyed nassla amel edilir: Sadece Müslüman olan adına vermek vâcibtir."},{"k":"h","x":"2. Hükümde ıtlak ve takyid"},{"k":"tbl","r":[["Durum","Hamli","Mutlak","Mukayyed","Açıklama"],["**1. Hüküm ve sebep aynı**","İttifakla hamledilir","«حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنْزِيرِ»","«أَوْ دَمًا مَسْفُوحًا»","Hüküm haramlık, sebep zarardır."],["**2. Hüküm ve sebep farklı**","İttifakla hamledilmez","«وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا»","«فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ»","Mutlakın hükmü el kesmek, sebebi hırsızlık; mukayyedin hükmü yıkamak, sebebi namaz."],["**3. Sebep aynı, hüküm farklı**","İttifakla hamledilmez","«فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ مِنْهُ» (teyemmüm)","«فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ»","Sebep ikisinde de namaz; hüküm 1.'de mesh, 2.'de yıkama."],["**4. Hüküm aynı, sebep farklı**","Hanefîlere göre hamledilmez; cumhura göre hamledilir","Zıhar ayetinde «فَتَحْرِيرُ رَقَبَةٍ»","Hataen bir mümini öldürme ayetinde «فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ»","Hüküm aynı (köle azat etmek); sebepler farklı: 1.'de zıhar, 2.'de katl."]]}]},{"h":"Emir ve nehiy: çeşitleri ve delaleti","b":[{"k":"tbl","r":[["","Çeşitleri"],["**Emir**","1. Emir sîgası (emr-i hâzır ve emr-i gâib) · 2. Emir anlamındaki haberî cümle"],["**Nehiy**","1. Nehiy sîgası (nehy-i hâzır ve nehy-i gâib) · 2. Nehiy anlamındaki haberî cümle"]]},{"k":"h","x":"Emrin delaleti"},{"k":"li","x":"Nassta vârid olan emrin neye delalet ettiği konusunda bir karine varsa ona delalet eder; bunda ihtilaf yoktur. Ama karinesiz vârid olursa neye delalet ettiği hususunda ihtilaf vardır:"},{"k":"n","n":1,"x":"Bir görüşe göre böyle bir emir nedb ve irşada delalet eder."},{"k":"n","n":2,"x":"Diğer bir görüşe göre ibahaya delalet eder."},{"k":"n","n":3,"x":"Bir başka görüşe göre vücub, nedb (irşad) ve ibahaya delaleti eşittir; özel bir karine olmadıkça hiçbirine delaleti belirgin hâle gelmez."},{"k":"n","n":4,"x":"**Çoğunluğa göre** böyle bir emir **vücuba** delalet eder ve özel bir karine olmadıkça başka bir manaya delalet etmez. Buna göre:"},{"k":"tbl","r":[["Karine neye delalet ediyorsa","Örnek"],["**a. İbaha**","«وَكُلُوا وَاشْرَبُوا»"],["**b. Nedb**","Kölelerle mükâtebe ayeti: «فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًا»"],["**c. İrşad**","Deyn (borç) ayeti"],["**d. Te'dib**","«سَمِّ اللَّهَ وَكُلْ بِيَمِينِكَ وَكُلْ مِمَّا يَلِيكَ»"]]},{"k":"h","x":"Nehyin delaleti"},{"k":"li","x":"Aynen emir gibi karine varsa karinenin gösterdiği şeye ihtilafsız delalet eder. Karine yoksa ihtilaflıdır:"},{"k":"n","n":1,"x":"Böyle bir nehiy kerahete delalet eder."},{"k":"n","n":2,"x":"Tahrîm ve kerahet arasında müşterektir; karine olmadıkça bunlardan hiçbirine delalet etmez."},{"k":"n","n":3,"x":"**Çoğunluğa göre** böyle bir nehiy **tahrîme** delalet eder ve özel bir karine olmadıkça başka bir manaya delalet etmez. Buna göre:"},{"k":"tbl","r":[["Karine neye delalet ediyorsa","Örnek"],["**a. Kerahet**","«وَذَرُوا الْبَيْعَ…»"],["**b. İrşad**","«لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ»"],["**c. Dua**","«رَبَّنَا لَا تُزِغْ قُلُوبَنَا…»"]]}]},{"h":"Emrin tekrara, fevre ve terâhîye delaleti","b":[{"k":"h","x":"Emrin tekrara delaleti"},{"k":"li","x":"Bu konuda tercih edilen görüş: Emir, kendi sîgasıyla tekrara delalet etmez; ancak karine varsa delalet eder. Emrin, şâriin me'mûrun bih için illet veya sebep kıldığı bir şarta bağlanmış veya bir vasıfla kayıtlanmış olması gibi."},{"k":"ar","a":"يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا…","x":"Örnek. Buradaki \"yıkayın\" emrinin illeti veya sebebi namazdır. Bir şeyin illeti ve sebebi tekrarlandıkça o şey de tekrarlanır."},{"k":"h","x":"Emrin fevr ve terâhîye delaleti"},{"k":"li","x":"Bu konuda ihtilaf olmakla birlikte en isabetli görüş şudur: Emir, kendi sîgasıyla fevre veya terâhîye delalet etmez. Ancak karine bulunursa fevre veya terâhîye delalet edebilir."},{"k":"tbl","r":[["Örnek","Delaleti"],["\"Bana su ver!\"","Fevr"],["\"Bir hafta sonra şöyle yap!\"","Terâhî"],["Beş vakit namaz gibi muvassa' vâcibler","Terâhî"],["Ramazan orucu gibi mudayyak vâcibler","Fevr"]]},{"k":"h","x":"Nehiy"},{"k":"dikkat","x":"Nehiy ise ihtilafsız **fevr ve tekrara** delalet eder. Şâri bir şeyi nehyetmişse mükellefin onu derhâl terk etmesi ve hayatı boyunca hiçbir zaman yapmaması gerekir."}]}],"ht":[{"s":0,"x":"Hanefî delalet yolları: ibare (asıl sevk amacı: \"ehalle'llâhu'l-bey'\"), işaret (gereklilik: \"ve şâvirhum\" → istişare topluluğu), delalet (dil bilgisiyle illet: \"öf\" → dövme), iktiza (takdir: \"hurrimet ümmehâtüküm\" → nikâhları)."},{"s":1,"x":"Güç sırası: ibare > işaret > delalet > iktiza. Kısas ayeti (ibare) ile \"müteammiden öldüren cehennemdir\" ayeti (işaret) çatışınca ibare tercih edilir: katile kısas."},{"s":1,"x":"Hata ile öldürmede keffaret ayetinin delaleti ile kasıt ayetinin işareti çatışınca işaret tercih edilir."},{"s":2,"x":"Cumhur: mantûk (Hanefîlerin ibare, işaret, iktizası) ve mefhûm. Mefhûm-ı muvâfaka = Hanefîlerin delâletü'n-nassı."},{"s":2,"x":"Mefhûm-ı muhâlefe 5 çeşit: sıfat, gâye, şart, aded, lakab."},{"s":3,"x":"Mefhûmu'l-lakab ittifakla hüccet değil. Diğer mefhûm-ı muhâlefeler nass dışında ittifakla hüccet; nasslarda cumhura göre hüccet, Hanefîlere göre değil."},{"s":3,"x":"Mefhûm-ı muhâlifle amel şartı: kaydın, hükmün sona ereceğini göstermekten başka bir faydası olmamalı (\"taze et\" kaydı nimeti hatırlatır)."},{"s":4,"x":"Açık lafızlar (Hanefî): zâhir (asıl sevk değil, tevil var), nass (asıl sevk, tevil var), müfesser (tevil yok, nesih var: \"80 değnek\"), muhkem (tevil de nesih de yok: \"ebeden şahitliklerini kabul etmeyin\")."},{"s":4,"x":"Kuvvet: muhkem > müfesser > nass > zâhir. Tefsir şâriden ve kat'î; tevil şârihten ve zannî. Müfesser vefattan sonra muhkeme döner."},{"s":5,"x":"Kapalı lafızlar (Hanefî): hafî (fertlerde kapalı: tarrâr, nebbâş), müşkil (sîgada kapalı; müşterekte: kurû'), mücmel (yalnız şâriin beyanı: mevlâ, salât, helû'), müteşâbih (hurûf-ı mukattaa, yed, vech)."},{"s":5,"x":"Kurû': Şâfiîlere göre temizlik (müzekker sayı), Hanefîlere göre hayız (iddetin hikmeti, âyise ayeti, cariye hadisi)."},{"s":5,"x":"Mücmelin beyanı kat'î ve tamsa müfessere (salât), tam değilse müşkile (ribâ) döner."},{"s":6,"x":"Hanefî dışı: açık lafızlar zâhir (zannî) ve nass (kat'î = Hanefî müfesseri); muhkem ikisini kapsar. Kapalı: mücmel ve müteşâbih. Fark yalnız terimdedir."},{"s":7,"x":"Müşterek: birden fazla manaya ayrı vaz'larla konmuş lafız (ayn, kur'). Sebepleri: kabile farkı (zirâ'), mecazın yaygınlaşması (seyyâre), şer'î manaya nakil (salât)."},{"s":7,"x":"Nassta: sözlük/şer'î müştereklikte şer'î mana; birkaç sözlük manasında içtihad. Asıl olan müşterek olmamaktır."},{"s":8,"x":"Umûmu'l-müşterek: Hanefîlere göre hiç caiz değil; Şâfiîlere göre caiz (secde ayeti); bazı Hanefîlere göre yalnız olumsuz cümlede (mevlâ yemini)."},{"s":9,"x":"Âmm: tek vaz', bütün fertler, sınırsız. Lafızları: küll, cemî', lâm-ı tarifli cins ve çoğul, mevsul, şart isimleri, nefiyden sonra nekre."},{"s":9,"x":"Âmmın umumu şümûlî (bütün hırsızlar), mutlakın umumu bedelî (herhangi bir köle)."},{"s":10,"x":"Tahsisten sonra âmm herkese göre zannî. Tahsisten önce cumhura göre zannî (zannî delille tahsis edilir), Hanefîlere göre kat'î (ancak kat'î delille)."},{"s":11,"x":"Cumhur: müstakil (akıl, örf, nass), gayr-ı müstakil (istisna, şart, sıfat, gaye), mukârin ve gayr-ı mukârin hepsi tahsistir."},{"s":11,"x":"Hanefî: yalnız müstakil ve mukârin muhassıs tahsistir; gayr-ı müstakil kasr, gayr-ı mukârin nesihtir."},{"s":11,"x":"\"el-İbretu bi-umûmi'l-lafz lâ bi-husûsi's-sebeb\" (deniz suyu hadisi)."},{"s":12,"x":"Hâss: tek vaz', tek mana; mutlak, mukayyed, emir veya nehiy olarak gelir. Delaleti kat'î (\"on fakir\"); delil varsa başka manaya hamledilir (Hanefîler: koyun → değeri)."},{"s":13,"x":"Mutlak, kayıtlayan nass yoksa mutlak hâliyle amel edilir (kaza oruçları \"eyyâm\"). Mukayyed, mutlak bir nass yoksa mukayyed hâliyle amel edilir (keffarette peş peşe iki ay)."},{"s":14,"x":"Sebepte ıtlak-takyid (fitre: \"Müslümanlardan\" kaydı): Hanefîlere göre hamledilmez (gayrimüslim için de verilir), cumhura göre hamledilir."},{"s":14,"x":"Hükümde: hüküm ve sebep aynı → ittifakla haml (kan → akıtılmış kan); ikisi farklı → haml yok (hırsızlık-abdest); sebep aynı hüküm farklı → haml yok (teyemmüm-abdest); hüküm aynı sebep farklı → Hanefî hayır, cumhur evet (zıhar-katl keffareti)."},{"s":15,"x":"Emir ve nehiy: sîga veya o anlamda haberî cümle. Karinesiz emir çoğunluğa göre vücub; karineyle ibaha, nedb, irşad, te'dib."},{"s":15,"x":"Karinesiz nehiy çoğunluğa göre tahrîm; karineyle kerahet, irşad, dua."},{"s":16,"x":"Emir kendi sîgasıyla tekrara delalet etmez; illet/sebep olan şarta bağlıysa tekrarlanır (abdest-namaz). Fevr ve terâhîye de sîgasıyla delalet etmez; karine belirler (muvassa' terâhî, mudayyak fevr)."},{"s":16,"x":"Nehiy ihtilafsız fevr ve tekrar ifade eder."}]},{"t":"Teşriî Usûlî Kaideler","intro":"Teşriin genel gayeleri (zarûriyyât, hâciyyât, tahsîniyyât) ve ilgili kaideler; Allah hakları ve kul hakları; içtihadın caiz olduğu alanlar; hükmün neshi.","s":[{"h":"Teşriin genel gayesi ve makâsıdın nevileri","b":[{"k":"li","x":"Teşriin genel gayesi, insanlar için fayda sağlamak ve onlardan zararı savmaktır."},{"k":"tbl","r":[["Nevi","Tanımı"],["**1. Zarûriyyât**","Toplumun varlığını koruyabilmesi için kaçınılmaz olan değerlerdir. Bunlar yitirildiğinde hayat düzeni bozulur, insanlar arasında kaos ve başıboşluk yayılır."],["**2. Hâciyyât**","Hayatı kolaylaştırıcı, yokluğu insanlara zorluk ve sıkıntı verebilen, ancak hayat düzenini bozmayan düzenlemelerdir."],["**3. Tahsîniyyât**","Kâmil insan, üstün ahlak ve güzel davranış niteliklerinin gerektirdiği durumlardır. Yokluğu hayat düzenini bozmaz veya insanları zorluğa ve sıkıntıya sokmaz; ancak selim akıl sahiplerinin nazarında bu özelliklerden mahrum olan kimse nahoş ve çirkin görünür."]]},{"k":"dikkat","x":"Bu değerlerin tertibi: **Zarûriyyât > Hâciyyât > Tahsîniyyât**."},{"k":"not","x":"Bu taksimin bu üç kısımda hasredilmesinin delili his ve müşahededir."}]},{"h":"Zarûriyyât: Zarûrât-ı hamse","b":[{"k":"tbl","r":[["Zaruri değer","Korunması için konan hükümler"],["**1. Din**","Dinin korunması için cihad farz kılınmıştır."],["**2. Nefis (can)**","Canın korunması için zaruri miktarda yemek-içmek, kısas, diyet gibi hükümler farz kılınmıştır."],["**3. Akıl**","Aklın korunması için içki gibi sarhoş edici şeyler yasaklanmıştır."],["**4. Irz (nesil)**","Neslin korunması için zina ve zina iftirası yasaklanmıştır."],["**5. Mal**","Malın korunması için hırsızlık, faiz, aldatma gibi fiiller yasaklanmıştır."]]}]},{"h":"Hâciyyât ve tahsîniyyât","b":[{"k":"tbl","r":[["Alan","Hâciyyât","Tahsîniyyât"],["**İbadat**","Su bulamayan için teyemmümün meşru kılınması","Beden ve elbise temizliği, setr-i avret gibi hükümler"],["**Muamelat**","Selem akdinin cevazı","Telakki'l-celeb, neceş gibi fiillerin haram kılınması"],["**Ukubat**","Hataen adam öldürenin diyetini âkilenin ödemesi","Savaş âdâbı (kadın ve çocukların öldürülmemesi)"]]}]},{"h":"Mükemmilât","b":[{"k":"d","t":"Mükemmilât","x":"Bu üç değeri tamamlayıcı hükümlerdir."},{"k":"tbl","r":[["Değer","Örnek"],["**Zarûriyyâta**","Dinin korunması için namaz farz kılındığı gibi ezan ve cemaatle namaz da meşru kılınmıştır."],["**Hâciyyâta**","Yolculukta kasr-ı salâta cevaz verildiği gibi cem'e de cevaz verilmiştir."],["**Tahsîniyyâta**","Sadaka vererek sevap kazanmak meşru olduğu gibi, verirken iyisinden vermek tavsiye edilmiştir."]]}]},{"h":"Zarûriyyâtla ilgili kaideler (def'-i zarar)","b":[{"k":"ar","a":"الضَّرَرُ يُزَالُ شَرْعًا","x":"1. Zarar şer'an giderilir: şuf'a gibi."},{"k":"ar","a":"الضَّرَرُ لَا يُزَالُ بِالضَّرَرِ","x":"2. Zarar zararla giderilmez: kişi kendi malını korumak için başkasının malına zarar veremez."},{"k":"ar","a":"يُتَحَمَّلُ الضَّرَرُ الْخَاصُّ لِدَفْعِ الضَّرَرِ الْعَامِّ","x":"3. Genel zararı defetmek için özel zarara katlanılır: toplumun can güvenliği için katile kısas uygulamak gibi."},{"k":"ar","a":"يُرْتَكَبُ أَخَفُّ الضَّرَرَيْنِ لِاتِّقَاءِ أَشَدِّهِمَا","x":"4. Ağır zarardan korunmak için hafif olanı irtikâp edilir: avret yerini örtecek elbise bulamayanın, namazı terk etmek yerine öyle kılması gibi."},{"k":"ar","a":"دَفْعُ الْمَضَارِّ مُقَدَّمٌ عَلَى جَلْبِ الْمَنَافِعِ","x":"5. Zararları defetmek, menfaat celbinden önce gelir: oruçlunun mazmaza ve istinşakta mübalağa yapmasının mekruh olması gibi."},{"k":"ar","a":"الضَّرُورَاتُ تُبِيحُ الْمَحْظُورَاتِ","x":"6. Zaruretler yasakları mübah kılar: ızdırar hâlinde domuz eti yemek gibi."},{"k":"ar","a":"الضَّرُورَاتُ تُقَدَّرُ بِقَدَرِهَا","x":"7. Zaruretler kendi miktarlarınca takdir olunur: domuz etini ölmeyecek kadar yemek gibi."}]},{"h":"Hâciyyâtla ilgili kaideler (def'-i haraç)","b":[{"k":"ar","a":"الْمَشَقَّةُ تَجْلِبُ التَّيْسِيرَ","x":"1. Meşakkat kolaylık getirir. Sebepleri 7'dir: sefer, hastalık, ikrah, unutmak, cehalet, umûm-i belvâ ve nâkıs olmak."},{"k":"ar","a":"الْحَرَجُ شَرْعًا مَرْفُوعٌ","x":"2. Haraç (darlık) şer'an kaldırılmıştır: istikbâl-i kıble konusunda zann-ı gâlip ile hareket edilebilmesi gibi."},{"k":"ar","a":"الْحَاجَاتُ تُنَزَّلُ مَنْزِلَةَ الضَّرُورَاتِ فِي إِبَاحَةِ الْمَحْظُورَاتِ","x":"3. İhtiyaçlar yasakları mübah kılmada zaruretler yerine konur: selem akdine cevaz verilmesi gibi."}]},{"h":"Allah hakları ve kul hakları","b":[{"k":"tbl","r":[["Mahkûm fîhten maksat","Kimin hakkı","Tenfizinde hıyar"],["Toplumun maslahatı","Sadece Allah hakkı","Yoktur"],["Sadece mükellefin maslahatı","Sadece mükellefin (kulun) hakkı","Vardır"],["Her ikisinin maslahatı","Hangisi baskınsa ona göre 1. ya da 2. gruba girer","—"]]},{"k":"h","x":"Sadece Allah hakları"},{"k":"n","n":1,"x":"Mahza ibadet (namaz gibi)."},{"k":"n","n":2,"x":"Malî yükümlülük barındıran ibadet (fitre gibi)."},{"k":"n","n":3,"x":"Ziraî arazi hakkında farz kılınan vergiler (öşür)."},{"k":"n","n":4,"x":"Ganimetler ve yer altında bulunan hazine ve madenler hakkında farz kılınan vergi (ganimetten 1/5)."},{"k":"n","n":5,"x":"Kâmil (tam) ceza çeşitleri (hadler gibi)."},{"k":"n","n":6,"x":"Kâsır (eksik) ceza çeşitleri (katilin mirastan mahrum bırakılması gibi)."},{"k":"n","n":7,"x":"İbadet anlamındaki keffaretler (yemin keffareti gibi)."},{"k":"h","x":"Sadece kul hakkı"},{"k":"ornek","x":"Borçlunun borcunu ödemesi."},{"k":"h","x":"Müşterek haklar"},{"k":"tbl","r":[["Kısım","Örnek"],["**1. Allah hakkının baskın olduğu**","Kazf haddi"],["**2. Kul hakkının baskın olduğu**","Kısas haddi"]]},{"k":"not","x":"Zekât Hanefîlere göre mahza ibadettir (1. kısımdan); cumhura göre 2. kısımdandır (malî yükümlülük barındıran ibadet)."}]},{"h":"İçtihadın caiz olduğu alanlar","b":[{"k":"dikkat","x":"Hakkında sarih ve kat'î nass bulunan bir konuda içtihad yapılamaz. İçtihad, hakkında nass olmayan veya kat'î olmayan nass bulunan konularda yapılabilir."},{"k":"d","t":"İçtihad","x":"Şer'î amelî hükümleri tafsîlî delillerinden çıkarabilmek için bütün çabayı sarf etmektir."},{"k":"h","x":"İçtihad yapabilmenin başlıca şartları"},{"k":"n","n":1,"x":"Arap diline vâkıf olmak."},{"k":"n","n":2,"x":"Kur'an ilimlerine vâkıf olmak."},{"k":"n","n":3,"x":"Hadis ilimlerine vâkıf olmak."},{"k":"n","n":4,"x":"Kıyasın vecihlerini bilmek (illet, hikmet, illetin şartları vb.)."},{"k":"h","x":"İçtihadla ilgili dikkat çekilmesi gereken 3 husus"},{"k":"n","n":1,"x":"**İçtihad bölünmeyi kabul etmez.** Yani bir müçtehidin talakla ilgili hükümleri bilip bey' ile ilgili hükümleri bilmemesi düşünülemez. Her konuda bilgi sahibi olmalıdır."},{"k":"n","n":2,"x":"**Müçtehid ecir kazanır.** İsabet ederse 2, etmezse 1 sevap alır."},{"k":"n","n":3,"x":"**İçtihad misliyle nakzedilmez.** Yani bir müçtehid bir mesele hakkında bir içtihad eder, daha sonra aynı meseleyle ilgili farklı bir içtihad ederse ne kendisi ne de bir başkası 1. içtihadı bozamaz. Çünkü bu anarşi, istikrarsızlık ve güvensizliğe yol açar."},{"k":"not","x":"Bu konuda tafsilat vardır."}]},{"h":"Hükmün neshi","b":[{"k":"dikkat","x":"Resulullah'ın vefatından sonra nesih yoktur."},{"k":"ar","a":"رَفْعُ الْحُكْمِ الشَّرْعِيِّ بِدَلِيلٍ شَرْعِيٍّ","x":""},{"k":"d","t":"Nesh","x":"Şer'î bir hükmün şer'î bir delille kaldırılmasıdır."},{"k":"h","x":"Hikmeti"},{"k":"n","n":1,"x":"Maslahatların değişiklik göstermesi."},{"k":"n","n":2,"x":"Tedricilik."},{"k":"n","n":3,"x":"İmtihan."},{"k":"not","x":"Kitapta iki hikmet sayılır: ilk ikisi."},{"k":"h","x":"Çeşitleri"},{"k":"tbl","r":[["Çeşit","Tanımı","Örnek"],["**1. Sarih nesih**","Şâriin önceki hükmü ilga ettiğini açıkça ifade etmesidir","Hz. Peygamber'in önce kabir ziyaretini yasaklayıp sonra izin vermesi"],["**2. Zımnî nesih**","Şâriin açıkça nesihten bahsetmeyip önceki hükme, aralarını bulamayacak şekilde muarız bir hüküm koymasıdır","Vasiyet ayetini Hz. Peygamber'in «لَا وَصِيَّةَ لِوَارِثٍ» hadisi neshetmiştir"]]},{"k":"not","x":"Zımnî nesihteki \"aralarını bulamayacak şekilde\" kaydı cumhura göredir; Hanefîlere göre bu kayıt yoktur."},{"k":"h","x":"Küllî ve cüz'î nesih"},{"k":"tbl","r":[["Çeşit","Tanımı","Örnek"],["**1. Küllî**","Önceki hükmü herkes için tamamen ilga etmek","Vefat edenin karısının iddetinin önce 1 yıl, sonra 4 ay 10 gün olması"],["**2. Cüz'î**","Önceki hükmü bazı hâllerde ve bazı kimseler hakkında ilga etmek","Kazifte bulunup 4 şahit getiremeyene 80 sopa vurulur; ama bu kişi kocaysa 80 sopa değil, liân yapılır"]]}]},{"h":"Nesih kabul etmeyen nasslar ve nesih aracı","b":[{"k":"h","x":"Nesih kabul etmeyen nasslar"},{"k":"n","n":1,"x":"Hiçbir durumda değişmeyen temel hükümler: iman esasları gibi."},{"k":"n","n":2,"x":"Sîgası te'bid ifade eden hükümler: kazifler hakkındaki «وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا» ayeti gibi."},{"k":"n","n":3,"x":"Gerçekleşmiş olaylar hakkındaki nasslar. Çünkü böyle bir durumda nesih şâriin yalanlanmasına götürür ki bu muhaldir."},{"k":"h","x":"Ne ile nesih gerçekleşir?"},{"k":"ar","a":"مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُنْسِهَا نَأْتِ بِخَيْرٍ مِنْهَا أَوْ مِثْلِهَا","x":"Genel kural: Bu ayette de belirtildiği gibi bir nassı ancak onun seviyesinde veya ondan daha üstün, kuvvetli bir nass neshedebilir."},{"k":"tbl","r":[["Neshedebilir mi?","Cevap","Gerekçe"],["**İcmâ nassı**","Hayır","Nass kat'î ise icmâ söz konusu olamaz. Zannî ise başka bir kat'î nassa dayanıp icmâ yapılır; bu durumda nâsih icmâ değil, dayandığı kat'î nass olur."],["**İcmâ icmâyı**","Hayır","—"],["**Kıyas Kitap, Sünnet ve icmâyı**","Hayır","Kıyasın Kitap, Sünnet ve icmâya aykırı olmaması şartı vardır."],["**Kıyas kıyası**","Hayır","—"]]}]}],"ht":[{"s":0,"x":"Teşriin gayesi: fayda sağlamak, zarar savmak. Makâsıd: zarûriyyât > hâciyyât > tahsîniyyât (delili his ve müşahede)."},{"s":1,"x":"Zarûrât-ı hamse: din (cihad), can (yeme-içme, kısas, diyet), akıl (içki yasağı), nesil (zina ve kazf yasağı), mal (hırsızlık, faiz, aldatma yasağı)."},{"s":2,"x":"Hâciyyât: teyemmüm, selem, âkilenin diyeti. Tahsîniyyât: temizlik ve setr-i avret, telakki'l-celeb ve neceş yasağı, savaş âdâbı."},{"s":3,"x":"Mükemmilât: namaza ezan ve cemaat; kasra cem'; sadakada iyisini vermek."},{"s":4,"x":"Def'-i zarar kaideleri: zarar giderilir (şuf'a) · zararla giderilmez · genel zarar için özel zarara katlanılır (kısas) · ehven-i şerreyn (örtüsüz namaz) · def'-i mefsedet celb-i menfaatten önce (oruçluya mübalağa mekruh) · zaruretler yasakları mübah kılar · zaruret kendi miktarınca."},{"s":5,"x":"Def'-i haraç kaideleri: meşakkat kolaylık getirir (7 sebep: sefer, hastalık, ikrah, unutma, cehalet, umûm-i belvâ, nâkıslık) · haraç kaldırılmıştır (kıblede zann-ı gâlip) · ihtiyaç zaruret yerine geçer (selem)."},{"s":6,"x":"Toplum maslahatı → Allah hakkı (hıyar yok); mükellef maslahatı → kul hakkı (hıyar var). Müşterek: Allah hakkı baskın (kazf), kul hakkı baskın (kısas)."},{"s":6,"x":"Sadece Allah hakları 7: mahza ibadet, malî ibadet (fitre), öşür, humus, kâmil ceza (had), kâsır ceza (mirastan mahrumiyet), ibadet anlamında keffaret."},{"s":7,"x":"Kat'î ve sarih nass olan yerde içtihad yok. Şartlar: Arapça, Kur'an ilimleri, hadis ilimleri, kıyas vecihleri."},{"s":7,"x":"İçtihad bölünmez · müçtehid isabette 2, hatada 1 ecir alır · içtihad misliyle nakzedilmez."},{"s":8,"x":"Nesih: şer'î hükmün şer'î delille kaldırılması; vefattan sonra yok. Hikmeti: maslahatın değişmesi, tedric, imtihan."},{"s":8,"x":"Sarih (kabir ziyareti) / zımnî (vasiyet ayeti – \"lâ vasiyyete li-vâris\"). Küllî (iddet 1 yıl → 4 ay 10 gün) / cüz'î (kazifte koca için liân)."},{"s":9,"x":"Neshi kabul etmeyenler: iman esasları, te'bidli hükümler (\"ebeden\"), gerçekleşmiş olaylar."},{"s":9,"x":"Nassı ancak dengi veya üstü nesheder. İcmâ nassı ve icmâyı, kıyas Kitap, Sünnet, icmâ ve kıyası neshedemez."}]},{"t":"Tearuz ve Tercih","intro":"Delillerin tearuzu; Hanefîlere, cumhura ve muhaddislere göre tercih metodu; cem ve telif örneği.","s":[{"h":"Delillerin tearuzu","b":[{"k":"d","t":"Tearuz","x":"Aynı meselede iki delilden birinin, diğerinin gerektirdiğiyle çelişen bir hükmü gerektirmesidir."},{"k":"ar","a":"إِنَّمَا الرِّبَا فِي النَّسِيئَةِ","x":"1. hadis: Ribâ sadece vadededir, fazlalıkta değildir."},{"k":"ar","a":"لَا تَبِيعُوا الْبُرَّ بِالْبُرِّ إِلَّا سَوَاءً بِسَوَاءٍ","x":"2. hadis: Fazlalık da ribâdır."},{"k":"li","x":"Bu iki hadis ribe'l-fazl konusunda tearuz etmiştir."},{"k":"dikkat","x":"İki ayet arasında, iki sahih hadis arasında veya ayet ile sahih hadis arasında hakiki tearuz yoktur."}]},{"h":"Tercih metodu","b":[{"k":"tbl","r":[["Görüş","Sırasıyla"],["**Hanefîlere göre**","1. Nesh · 2. Tercih · 3. Cem ve telif / tevfik · 4. Terk"],["**Cumhura göre**","1. Cem ve telif / tevfik · 2. Tercih · 3. Nesh · 4. Tevakkuf"],["**Muhaddislere göre**","1. Cem ve telif / tevfik · 2. Nesh · 3. Tercih · 4. Tevakkuf"]]},{"k":"not","x":"Bu derste cumhurun sıralaması esas alınır."},{"k":"h","x":"Hanefîler"},{"k":"steps","x":["Nesh","Tercih","Cem ve telif / tevfik","Terk"]},{"k":"h","x":"Cumhur"},{"k":"steps","x":["Cem ve telif / tevfik","Tercih","Nesh","Tevakkuf"]},{"k":"h","x":"Muhaddisler"},{"k":"steps","x":["Cem ve telif / tevfik","Nesh","Tercih","Tevakkuf"]}]},{"h":"Cem ve telif örneği: Hamile kadının iddeti","b":[{"k":"ar","a":"وَالَّذِينَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُونَ أَزْوَاجًا يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا","x":"1. ayet: Kocası vefat eden kadının iddeti 4 ay 10 gündür."},{"k":"ar","a":"وَأُولَاتُ الْأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ","x":"2. ayet: Hamile kadınların iddeti doğum yapmalarıyla biter."},{"k":"tbl","r":[["Görüş","Yol","Sonuç"],["**Hanefîler**","Nesh: 2. ayet 1. ayeti neshetmiştir.","Hamile kadının iddeti her hâlükârda doğumdur."],["**Cumhur**","Nesih değil, cem ve telif yoluna gidilir.","Hamile kadın 4 ay 10 günden önce doğurursa bu süreyi tamamlar; sonra doğurursa zaten süreyi tamamlamış olur. Yani hamile kadının iddeti her hâlükârda 4 ay 10 gündür."]]}]}],"ht":[{"s":0,"x":"Tearuz: aynı meselede iki delilin çelişen hüküm gerektirmesi (ribe'l-fazl hadisleri). İki ayet, iki sahih hadis ya da ayet ile sahih hadis arasında hakiki tearuz yoktur."},{"s":1,"x":"Hanefî: nesh → tercih → cem ve telif → terk. Cumhur: cem ve telif → tercih → nesh → tevakkuf. Muhaddisler: cem ve telif → nesh → tercih → tevakkuf."},{"s":2,"x":"Hamile dulun iddeti: Hanefîlere göre 2. ayet 1.'yi nesheder → iddet doğumla biter. Cumhura göre cem ve telif → doğum 4 ay 10 günden önceyse süre tamamlanır."}]}];
const SORULAR = [{"u":0,"q":"Fıkıh tarifindeki «الشرعية» kaydı hangi hükümleri dışarıda bırakır?","a":["Aklî ve hissî hükümleri","İtikadi ve ahlaki hükümleri","Vaz'î hükümleri","Tafsîlî delillerden çıkmayan hükümleri"],"x":"\"Şer'î\" kaydıyla aklî (bir, ikinin yarısıdır) ve hissî (ateş yakıcıdır) hükümler; \"amelî\" kaydıyla itikadi ve ahlaki hükümler dışarıda kalır."},{"u":0,"q":"Fıkıh tarifindeki «العملية» kaydı hangi hükümleri dışarıda bırakır?","a":["İtikadi ve ahlaki hükümleri","Aklî ve hissî hükümleri","İbadetle ilgili hükümleri","Muamelatla ilgili hükümleri"],"x":"\"Amelî\" kaydı itikadi ve ahlaki hükümleri; \"şer'î\" kaydı ise aklî ve hissî hükümleri dışarıda bırakır."},{"u":0,"q":"\"Kişinin lehine ve aleyhine olanı bilmesi\" şeklindeki fıkıh tanımı kime aittir?","a":["İmam Ebû Hanîfe","İmam Şâfiî","Gazzâlî","Serahsî"],"x":"Ebû Hanîfe'ye göre fıkıh «مَعْرِفَةُ النَّفْسِ مَا لَهَا وَمَا عَلَيْهَا»dır."},{"u":0,"q":"Usûl-i fıkhın konusu nedir?","a":["Küllî şer'î delil; kendisiyle sabit olan küllî hükümler bakımından","Mükellefin fiili; kendisi için sabit olan şer'î hükümler bakımından","Şer'î hükümleri insanların fiil ve sözlerine uygulamak","Cüz'î delillerden hüküm çıkarmak"],"x":"Fıkhın konusu mükellefin fiili, usûl-i fıkhın konusu ise küllî şer'î delildir."},{"u":0,"q":"Aşağıdakilerden hangisi küllî bir hükümdür?","a":["İcab","Emir","Kıyas","Âmm"],"x":"Küllî hüküm, içinde çeşitli cüz'î hükümlerin toplandığı nevidir: icab, tahrîm, sıhhat, butlan. Emir, âmm, kıyas ise küllî delildir."},{"u":0,"q":"Hangisi fukahâ metodunun özelliklerinden biri değildir?","a":["Kıyas (tümdengelim) yöntemini kullanır","Hanefî mezhebine sıkı biçimde bağlıdır","Akla önem vermez, nakle dayanır","Misalleri boldur"],"x":"Fukahâ metodu istikrâ (tümevarım) yöntemini kullanır. Kıyas (tümdengelim) mütekellimîn metodunun özelliğidir."},{"u":0,"q":"Hangisi mütekellimîn metodunun özelliğidir?","a":["Herhangi bir mezhebe bağlı değildir ve akla önem verir","Hanefî mezhebine sıkı biçimde bağlıdır","Kelâmî konulara az yer verir","Misalleri boldur"],"x":"Mütekellimîn metodu mezhepten bağımsızdır, akla önem verir, kıyas (tümdengelim) yöntemini kullanır, kelâmî konuları işler ve misalleri azdır."},{"u":0,"q":"el-Mustasfâ hangi usûl telif yolunun eseridir?","a":["Mütekellimîn metodu","Fukahâ metodu","Memzuc metot","Hiçbiri; fıkıh eseridir"],"x":"Mütekellimîn metodunun eserleri: el-Umed, el-Mu'temed, el-Burhân ve Gazzâlî'nin el-Mustasfâ'sı."},{"u":0,"q":"Hangisi memzuc (iki metodu birleştiren) eserlerden biridir?","a":["et-Tahrîr","Takvîmü'l-edille","el-Burhân","el-Fusûl fi'l-usûl"],"x":"Memzuc eserler: Bedîu'n-nizâm, et-Tavzîh, Cem'u'l-cevâmi' ve İbnü'l-Hümâm'ın et-Tahrîr'i."},{"u":0,"q":"Hangisi fukahâ metoduyla yazılmış bir eserdir?","a":["Takvîmü'l-edille","el-Mu'temed","Cem'u'l-cevâmi'","el-Umed"],"x":"Fukahâ metodu eserleri: el-Fusûl (Cessâs), Takvîmü'l-edille (Debûsî), Kenzü'l-vüsûl (Pezdevî), el-Usûl (Serahsî)."},{"u":1,"q":"Hangisi muhtelefun fîh (üzerinde ihtilaf edilen) delillerden biri değildir?","a":["Kıyas","İstihsan","Sahâbe kavli","İstishab"],"x":"Kıyas, Kitap, Sünnet ve icmâ ile birlikte müttefekun aleyh dört delilden biridir."},{"u":1,"q":"Kur'an hükümlerinin delaleti ne zaman kat'î olur?","a":["Lafız birden fazla manaya ihtimalli değilse","Ayet Medine'de inmişse","Hüküm itikadi bir konudaysa","Ayet tevatürle nakledilmişse"],"x":"Kur'an'ın sübûtu kat'îdir. Delaleti ise lafız tek manaya ihtimalliyse kat'î (\"yüz değnek\"), birden fazla manaya ihtimalliyse zannîdir (\"kurû'\")."},{"u":1,"q":"«وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ» ayeti hangisine örnektir?","a":["Delaleti zannî olan Kur'an hükmüne","Delaleti kat'î olan Kur'an hükmüne","Sübûtu zannî olan bir nassa","Muhkem bir lafza"],"x":"«قُرُوء» kelimesi birden fazla manaya (hayız, temizlik) ihtimalli olduğu için ayetin delaleti zannîdir."},{"u":1,"q":"Hz. Peygamber'in bazı sahabelerin söz ve fiillerini susarak veya överek onaylamasına ne denir?","a":["Takrirî sünnet","Fiilî sünnet","Kavlî sünnet","Sünnet-i zâide"],"x":"Takrirî sünnet, sahabelerden meydana gelen söz ve fiillerin susarak, gülerek, överek veya dua ederek onaylanmasıdır."},{"u":1,"q":"Sünnetin, Kur'an'da bulunmayan bir hükmü isbat etmesine örnek hangisidir?","a":["(Erkeklere) altın ve gümüşün haram oluşu","Namazın nasıl kılınacağı","\"Namaz kılın\" emrinin sünnette de geçmesi","Vasiyet ayetinin neshi"],"x":"Namazın nasıl kılınacağı tebyine, \"namaz kılın\" te'kide örnektir. Altın ve gümüşün haram oluşu Kur'an'da bulunmayan bir hükmün isbatıdır."},{"u":1,"q":"Hanefîlere göre ilk tabakada tevatür sayısına ulaşmamış, fakat 2. ve 3. tabakada ulaşmış rivayete ne denir?","a":["Meşhur","Mütevâtir","Âhâd","Garîb"],"x":"Hanefîlere göre sünnet senedine göre mütevâtir, meşhur ve âhâd olmak üzere üçe ayrılır. Tarif edilen meşhurdur."},{"u":1,"q":"Cumhura göre âhâd haberin kısımlarında \"garîb\" hadisin herhangi bir tabakadaki ravi sayısı kaçtır?","a":["1","2","3","4"],"x":"Cumhura göre âhâd: meşhur/müstefîz (3), azîz (2), garîb (1)."},{"u":1,"q":"Hangisi teşrî özelliği olmayan sünnetlere örnektir?","a":["Hurma aşılama meselesi","Beş vakit namazın edası","Cemaatle namaz","Fitrenin verilmesi"],"x":"Dünya işlerinde ustalık ve tecrübeye dayanan fiiller (hurma aşılama) teşrî özelliği taşımaz. Diğerleri: insan tabiatı gereği yapılanlar ve Peygambere özel olanlar."},{"u":1,"q":"Âhâd haberi kabulde raviye yemin ettiren sahâbî kimdir?","a":["Hz. Ali","Hz. Ebû Bekir","Hz. Ömer","Hz. Osman"],"x":"Hz. Ebû Bekir ve Hz. Ömer iki kişi işittiğini söylediğinde kabul eder, Hz. Ali raviye yemin ettirirdi."},{"u":1,"q":"Âhâd haberin \"umûm-i belvâdan olmaması\" şartını hangi mezhep koşar?","a":["Hanefîler","Mâlikîler","Şâfiîler","Hanbelîler"],"x":"Hanefîlerin ek şartları: ravinin rivayetine aykırı amel etmemesi, hadisin umûm-i belvâdan olmaması, ravi müçtehid değilse kıyasa aykırı olmaması."},{"u":1,"q":"Âhâd haberin Medine ehlinin ameline aykırı olmamasını şart koşan mezhep hangisidir?","a":["Mâlikîler","Hanefîler","Şâfiîler","Hanbelîler"],"x":"Mâlikîler hadisin Medine ameline aykırı olmamasını, Şâfiîler senedin sahih ve muttasıl olmasını şart koşar; Hanbelîler ek şart koşmaz."},{"u":1,"q":"İcmâın hücciyetine delil getirilen ayetteki «أُولِي الْأَمْرِ» İbn Abbas gibi müfessirlere göre kimdir?","a":["Ulemâ","Ümerâ (devlet başkanları)","Sahâbe","Kumandanlar"],"x":"İcmâın delili «وَأُولِي الْأَمْرِ مِنْكُمْ» ayeti ve \"Ümmetim hata üzerinde birleşmez\" hadisidir; İbn Abbas gibi müfessirlere göre ulu'l-emr ulemâdır."},{"u":1,"q":"İcmâın mümkün olmadığını savunanlar kimlerdir?","a":["Nazzâm ve bazı Şiîler","Cumhur","Hanefîler","Mâlikîler"],"x":"Nazzâm ve bazı Şiîler icmâın mümkün olmadığını savunur. Cumhura göre mümkündür ve bilfiil vuku bulmuştur."},{"u":1,"q":"Hangisi bilfiil vuku bulmuş icmâya örnek gösterilmez?","a":["Yağmurda namazların cem'i","Hz. Ebû Bekir'in hilafeti","Domuz iç yağının haram oluşu","Ninenin altıda bire varis olması"],"x":"Yağmurda cem', münâsib-i mülâim konusunda kıyas örneğidir. Diğer üçü icmâ örneğidir."},{"u":1,"q":"Hallâf'a göre icmâ nasıl mümkün olabilir?","a":["Ancak devlet eliyle","Ancak sahâbe döneminde","Ancak Medine ehliyle","Hiçbir şekilde"],"x":"Hallâf'a göre icmâ ancak devlet eliyle mümkün olabilir."},{"u":1,"q":"Sükûtî icmâ ile ilgili hangisi doğrudur?","a":["Delaleti zannîdir; Şâfiîler ve Mâlikîler kabul etmez","Delaleti kat'îdir; uymak vâcib, uymamak haramdır","Hakiki icmâ olarak da adlandırılır","Bütün müçtehidlerin görüşünü açıkça belirtmesidir"],"x":"Sükûtî (itibarî) icmâda bazı müçtehidler susar; delaleti zannîdir. Sarih (hakiki) icmâ ise kat'îdir."},{"u":1,"q":"\"Kıyas müsbit değil, muzhirdir\" sözü ne anlatır?","a":["Kıyas hükmü ortaya koymaz, var olan hükmü ortaya çıkarır","Kıyasla sabit olan hüküm kesindir","Kıyas yalnızca ibadetlerde geçerlidir","Kıyas nassı nesheder"],"x":"Kıyas yeni bir hüküm koymaz; nassta var olan hükmü illet birliğiyle fer'de ortaya çıkarır."},{"u":1,"q":"Kıyasın hücciyetine sahâbe fiillerinden delil olarak ne gösterilir?","a":["Hz. Ebû Bekir'in hilafetinin namaz imamlığına kıyas edilmesi","Muâz b. Cebel hadisi","«فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ» ayeti","Kur'an'ın cem'i"],"x":"Sahâbe \"Resulullah onu dinimiz için uygun gördü, dünyamız için uygun görmeyelim mi?\" diyerek hilafeti imamlığa kıyas etmiştir."},{"u":1,"q":"Kıyasın rükünlerinden \"fer'\" nedir?","a":["Hükmü hakkında nass bulunmayan","Hükmü hakkında nass bulunan","Asla ait hükmün konulmasına sebep olan nitelik","Asla sabit olan ve fer'e uygulanmak istenen hüküm"],"x":"Fer'e «الْمَقِيس، الْمَحْمُول، الْمُشَبَّه» da denir; hükmü hakkında nass bulunmayandır."},{"u":1,"q":"Hz. Peygamber'in dörtten fazla evliliğine kıyas yapılamaması hangi şarta örnektir?","a":["Aslın hükmü asla has olmamalı","Aslın hükmü nassla sabit olmalı","Aslın hükmü taabbüdî olmamalı","İllet müteaddî olmalı"],"x":"Aslın hükmünün şartları: nassla sabit olmak, aklen idrak edilebilir illeti olmak ve asla has olmamak."},{"u":1,"q":"Seferde kasr-ı salâtta \"meşakkatin def'i\" nedir?","a":["Hikmet","İllet","Sebep","Mâni"],"x":"Hikmet hükmün konuluş amacıdır (meşakkatin def'i); illet ise hükmün bağlandığı niteliktir (sefer)."},{"u":1,"q":"Güneşin batması akşam namazının farziyeti için nedir?","a":["Sebeptir, illet değildir","Hem illet hem sebeptir","İllettir, sebep değildir","Hikmettir"],"x":"Akılla idrak edilemeyen şeye sadece sebep denir. Sefer ise kasr için hem illet hem sebeptir."},{"u":1,"q":"İlletin \"müteaddî\" olması ne demektir?","a":["Kişiye özel (kâsır) olmayıp başka yerlere geçebilmesi","Açık olması","Şahıstan şahısa değişmemesi","Hükme uygun olması"],"x":"İlletin şartları: zâhir (açık), munzabıt (standart, şahıstan şahısa değişmeyen), münâsib (uygun), müteaddî (kâsır olmayan)."},{"u":1,"q":"Nass veya icmâ ile bizzat hükme illet olduğu sabit olan vasfa ne denir?","a":["el-Münâsibü'l-müessir","el-Münâsibü'l-mülâim","el-Münâsibü'l-mürsel","el-Münâsibü'l-mülgâ"],"x":"Örneği hayız ayetidir: hüküm «اعْتِزَال», illet «أَذًى»."},{"u":1,"q":"Şâriin itibar veya ilga ettiğine dair bir delil bulunmayan vasfa ne denir?","a":["el-Münâsibü'l-mürsel","el-Münâsibü'l-mülgâ","el-Münâsibü'l-müessir","el-Münâsibü'l-mülâim"],"x":"el-Münâsibü'l-mürsele maslahat-ı mürsele de denilebilir. İlga edildiğine dair delil varsa mülgâ olur."},{"u":1,"q":"Erkek ve kızın karabette eşit, mirasta farklı olması hangi münasebete örnektir?","a":["el-Münâsibü'l-mülgâ","el-Münâsibü'l-mürsel","el-Münâsibü'l-mülâim","el-Münâsibü'l-müessir"],"x":"Şâri mirasta eşitlik vasfını ilga etmiştir; bu vasıf mülgâdır."},{"u":1,"q":"«لَا يَرِثُ الْقَاتِلُ» hadisinde illet hangi yolla bulunur?","a":["Îmâ ve işaret","Kat'î sarih nass","Zannî sarih nass","Sebr ve taksim"],"x":"Talil edatı yoktur; hükmün türemiş kelimeye («الْقَاتِل») bağlanması, kökünün («الْقَتْل») illet olduğunu hissettirir."},{"u":1,"q":"Hangisi yalnızca talil manasında gelen (kat'î) edatlardandır?","a":["«لِأَجْلِ»","«لِ»","«بِ»","«إِنَّ»"],"x":"Kat'î edatlar: «مِنْ أَجْلِ، لِأَجْلِ، لِأَنَّ، كَيْ…». «لِ، بِ، فَ، إِنَّ» başka manalara da gelebildiği için zannîdir."},{"u":1,"q":"Muhtemel seçenekleri belirleyip (hasr) birer birer eleyerek (hazf) tek seçeneği bırakmaya ne denir?","a":["Sebr ve taksim","Tahkîku'l-menât","Tahrîcü'l-menât","Kıyas maa'l-fârık"],"x":"Sebr deneme-sınama, taksim ayırma-bölmedir."},{"u":1,"q":"Tenkîhu'l-menâtı sebr ve taksimden ayıran özellik nedir?","a":["Vasıfların nassta geçmesi","İlletin fer'de bulunduğundan emin olunması","İcmâya dayanması","Talil edatı bulunması"],"x":"Tenkîhu'l-menât, nassta geçen vasıflardan illet olmaya elverişli olanı tespit etmektir."},{"u":1,"q":"Asılda geçen illetin fer'de bulunduğundan emin olmaya ne denir?","a":["Tahkîku'l-menât","Tenkîhu'l-menât","Tahrîcü'l-menât","Sebr ve taksim"],"x":"Tahrîc illeti bulmak, tenkîh nasstaki vasıflardan ayıklamak, tahkîk illetin fer'de olduğunu doğrulamaktır."},{"u":1,"q":"Fer' hakkında nass varken kıyas yapmaya ne denir?","a":["Kıyas fâsidü'l-i'tibâr","Kıyas maa'l-fârık","Kıyas-ı hafî","Kıyas-ı celî"],"x":"Kıyas maa'l-fârık ise illet birliğinin sağlanamadığı kıyastır."},{"u":1,"q":"Hanefîlere göre yırtıcı kuşların artıklarının temiz sayılması hangi delille açıklanır?","a":["İstihsan (kıyas-ı hafînin kıyas-ı celîye tercihi)","Maslahat-ı mürsele","Sedd-i zerâi","İstishab"],"x":"Vech-i istihsan: Yırtıcı kuşlar temiz bir kemik olan gagalarıyla içer, tükürükleri artığa karışmaz."},{"u":1,"q":"Selem akdinin istihsanen caiz olması istihsanın hangi çeşidine örnektir?","a":["Küllî hükmün bırakılıp istisnaî hükmün tercihi","Kıyas-ı hafînin kıyas-ı celîye tercihi","Örfe dayalı istihsan","Sedd-i zerâi"],"x":"Küllî hüküm ma'dûmun satışının yasak olmasıdır; selem ihtiyaçtan dolayı istisnaî olarak caizdir."},{"u":1,"q":"Hangisi maslahat-ı mürselenin şartlarından biri değildir?","a":["Bir nassla açıkça itibar edilmiş olması","Hakiki olup vehmî olmaması","Umumi olup şahsi olmaması","Nass veya icmâ ile sabit bir hükme muarız olmaması"],"x":"Maslahat-ı mürsele, itibar veya ilgasına dair bir delil bulunmayan maslahattır."},{"u":1,"q":"Sedd-i zerâide \"çoğu zaman mefsedete götüren mübah\" vasıtalar hangi mezheplere göre yasaklanır?","a":["Mâlikî ve Hanbelîlere göre","Şâfiî ve Hanefîlere göre","Bütün mezheplere göre","Zâhirîlere göre"],"x":"Son iki kısım Mâlikî ve Hanbelîlere göre yasaklanır; Şâfiî, Hanefî ve Zâhirîlere göre yasaklanmaz."},{"u":1,"q":"Üzüm üretiminin yasaklanmaması sedd-i zerâide hangi kısma örnektir?","a":["Nadiren mefsedete götüren mübah vasıta","Çoğu zaman mefsedete götüren mübah vasıta","Haram vasıta","Amacı dışında kullanılan meşru fiil"],"x":"Nadiren de olsa içki üretimine vesile olabilir; bu kısım ittifakla yasaklanmaz."},{"u":1,"q":"Örf ile icmâ arasındaki fark nedir?","a":["Örf halkın, icmâ müçtehidlerin ittifakıdır","Örf kat'î, icmâ zannîdir","Örf yazılı, icmâ sözlüdür","İkisi aynı şeydir"],"x":"Halkın ittifakı örf, müçtehidlerin ittifakı icmâdır."},{"u":1,"q":"\"Veled\" lafzının sadece erkek çocuk için kullanılması hangi örfe örnektir?","a":["Kavlî örf","Amelî örf","Bâtıl örf","Şer'î örf"],"x":"Teâtî satışı amelî örfe, \"veled\" lafzının kullanımı kavlî örfe örnektir."},{"u":1,"q":"Müçtehidin başvurduğu son delil hangisidir?","a":["İstishab","Örf","İstihsan","Sahâbe kavli"],"x":"İstishab, değiştiğine dair delil bulunmadıkça mevcut hâlin devamına hükmetmektir."},{"u":1,"q":"Kur'an'da mutlak olarak zikredilen önceki şeriat hükmü (şer'u men kablenâ) kimlere göre bizim için de şeriattır?","a":["Hanefî, Mâlikî ve Şâfiîlere göre","Yalnızca Hanefîlere göre","Hiçbir mezhebe göre","Yalnızca Zâhirîlere göre"],"x":"Kur'an'da geçmeyen ve neshedilenler şeriat değildir; emredilenler şeriattır; mutlak zikredilenler Hanefî, Mâlikî ve Şâfiîlere göre şeriattır."},{"u":1,"q":"Sahâbenin kendi rey ve içtihadıyla söyleyip ittifak edilmeyen görüşleri için hangisi doğrudur?","a":["Hanefîlere göre hüccettir, Şâfiîlere göre değildir","Şâfiîlere göre hüccettir, Hanefîlere göre değildir","İttifakla hüccettir","İttifakla hüccet değildir"],"x":"Sahâbenin ittifak ettiği ve içtihada kapalı konulardaki sözleri ihtilafsız hüccettir."},{"u":2,"q":"Hüsün ve kubhun akılla bilinemeyip şer'î olduğunu söyleyen kimdir?","a":["Eş'arîler","Mâtürîdîler","Mu'tezile","Hanefîler"],"x":"Mâtürîdî ve Mu'tezileye göre hüsün-kubuh akılla bilinebilir; Eş'arîye göre bilinemez, şer'îdir."},{"u":2,"q":"«وَإِذَا حَلَلْتُمْ فَاصْطَادُوا» ayeti hangi teklifî hükme örnektir?","a":["Tahyîrî hüküm","Talebü'l-fiil","Talebü't-terk","Vaz'î hüküm"],"x":"Bu emir karineyle ibahaya delalet eder; tahyîr ibaha ifade eder."},{"u":2,"q":"«لَا نِكَاحَ إِلَّا بِشَاهِدَيْنِ» hadisi hangi vaz'î hükme örnektir?","a":["Şart","Sebep","Mâni","Ruhsat"],"x":"Vaz'î hüküm örnekleri: sebep (hırsızlıkta el kesme), şart (nikâhta iki şahit), mâni (katilin mirasçı olamaması)."},{"u":2,"q":"Teklifî ile vaz'î hüküm arasındaki farklardan biri hangisidir?","a":["Teklifîde talep vardır, vaz'îde yoktur","Vaz'î hüküm her zaman mükellefin kudreti dahilindedir","Teklifî hüküm bazen kudret dışındadır","Vaz'î hükümde tahyîr vardır"],"x":"Teklifî hüküm hep mükellefin kudreti dahilindedir; vaz'î hüküm bazen dahilinde, bazen değildir (akrabalığın mirasa sebep olması)."},{"u":2,"q":"Vakit içinde kendi cinsinden başka bir ibadetin yapılabildiği vâcibe ne denir?","a":["Muvassa'","Mudayyak","Mutlak","Muhayyer"],"x":"Öğle namazı muvassa', Ramazan orucu mudayyak vâcibe örnektir."},{"u":2,"q":"Yemin keffareti vâcibin hangi kısmına örnektir?","a":["Muhayyer","Muayyen","Muhadded","Kifâî"],"x":"Muhayyer vâcib, şâriin belirli şeylerden birini istediği vâcibtir. Kurban ise muayyendir."},{"u":2,"q":"Cenaze namazı vâcibin hangi kısmına örnektir?","a":["Kifâî","Aynî","Muayyen","Mudayyak"],"x":"Yapılması istenmesi bakımından vâcib kifâî (topluca: cenaze namazı) ve aynî (herkes: beş vakit) olarak ikiye ayrılır."},{"u":2,"q":"Terki ikab değil itab gerektiren mendub hangisidir?","a":["Sünnet-i müekkede (hüdâ)","Sünnet-i zâide","Nâfile","Zâid"],"x":"Cemaatle namaz gibi sünnet-i müekkedenin terki itab gerektirir; gayr-ı müekkedenin terki ikab ve itab gerektirmez."},{"u":2,"q":"Gasbedilmiş elbiseyle kılınan namaz hangi kısma örnektir?","a":["Li-gayrihî muharram","Li-zâtihî muharram","Mekruh","Bâtıl ibadet"],"x":"Li-gayrihî haramlar sonradan meydana gelen bir sebepten dolayı haramdır; işlenmesi haram olsa da ibadet makbul, akid sahihtir."},{"u":2,"q":"Hanefîlere göre teklifî hükümler kaç kısımdır?","a":["7","5","4","6"],"x":"Farz, vâcib, haram, mendub, tenzîhen mekruh, tahrîmen mekruh, mübah. Cumhura göre 5 kısımdır."},{"u":2,"q":"Farz ile vâcib arasındaki farka göre vâcibi inkâr etmenin hükmü nedir?","a":["Bid'at ve sapıklıktır","Küfürdür","Mekruhtur","Hiçbir sonucu yoktur"],"x":"Farzın sübut ve delaleti kat'îdir, inkârı küfürdür. Vâcibin biri kat'î biri zannîdir, inkârı bid'at ve sapıklıktır."},{"u":2,"q":"\"Kişi nisab miktarı mala sahip ama borcu var\" örneği neye örnektir?","a":["Sebebi geçersiz kılan mâniye","Hükme mâniye","Ca'lî şarta","Iskat ruhsatına"],"x":"Borç,
