geldiğinde rüşde ulaşmasa da malı teslim edilir."},{"k":"li","x":"**Cumhura göre:** Yaşa bakılmaz, rüşde bakılır."},{"k":"d","t":"Sefeh","x":"Bâliğ ve mümeyyiz bir kimsenin malını ölçüsüz harcama vasfı. Bu vasfa sahip olana sefîh denir. Hacredilir."},{"k":"d","t":"Ateh","x":"Bunama → Ma'tûh → Hacredilir."}]},{"h":"Ehliyet arızaları","b":[{"k":"not","x":"Edâ ehliyeti ile ilgilidir."},{"k":"n","n":1,"x":"**Ehliyeti izale eden:** Delilik, uyku ve baygınlık gibi."},{"k":"n","n":2,"x":"**Ehliyeti azaltan («نَقْص»):** Ateh gibi. Çünkü atehte nâkıs edâ ehliyeti vardır."},{"k":"n","n":3,"x":"**Ehliyete etki etmeyen.** Fakat bazı hükümler doğuran. Sefeh gibi → Hacr."}]}],"ht":[{"s":0,"x":"Hâkim «من صدر عنه الحكم» · Hüküm «خطاب الله المتعلق بأفعال المكلفين» · Mahkûm fîh «فعل المكلف» · Mahkûm aleyh «المكلف»."},{"s":0,"x":"Hüsün-kubuh: Mâtürîdî ve Mu'tezileye göre akılla bilinebilir; Eş'arîye göre bilinemez, şer'îdir."},{"s":1,"x":"Teklifî: talebî (talebü'l-fiil, talebü't-terk) ve tahyîr. Vaz'î: sebep, şart, mâni. Teklifîde talep var ve hep kudret dahilinde; vaz'îde talep yok, bazen kudret dışında (akrabalık mirasa sebep)."},{"s":2,"x":"Vâcib: kesin talep. Zaman: mutlak (keffaret), muvakkat → muvassa' (öğle), mudayyak (Ramazan), zü'ş-şebeheyn."},{"s":2,"x":"Kifâî (cenaze namazı) / aynî (5 vakit) · muhadded (zekât) / gayr-ı muhadded (infak) · muayyen (kurban) / muhayyer (yemin keffareti)."},{"s":3,"x":"Mendub: kesin olmayan talep. Müekkede/hüdâ (terki itab: cemaatle namaz) · gayr-ı müekkede/zâide/nâfile (Perşembe orucu) · zâid (uyma niyetiyle yeme-içme)."},{"s":4,"x":"Muharram: kesin nehiy. Li-zâtihî (zina) / li-gayrihî (mağsup elbiseyle namaz: haram ama ibadet makbul, akid sahih)."},{"s":5,"x":"Mekruh: kesin olmayan nehiy; «كره» sîgası, kerahet bildiren nehiy, karineli ictinab emri («وذروا البيع»)."},{"s":6,"x":"Cumhura göre 5 kısım; Hanefiye göre 7 kısım (farz, vâcib, haram, mendub, tenzîhen mekruh, tahrîmen mekruh, mübah). Farzın inkârı küfür, vâcibin inkârı bid'at ve sapıklık."},{"s":7,"x":"Sebep: teklifî hükme (vakit-namaz) veya mülkiyet/helalliğe (bey', nikâh, talak); gücü dahilinde olan (zekât, katl) ve olmayan (vakit, miras)."},{"s":7,"x":"Şart: şer'î / ca'lî; şartın varlığı meşrutu gerektirmez (abdest-namaz). Mâni: hükme (hayız) / sebebe (borç-nisab)."},{"s":8,"x":"Ruhsat çeşitleri: zarurette haramın mübah olması · mazerette vâcibin terki · istisnaî akid (selem) · önceki ümmetlerin ağır hükümlerinin neshi. Hanefîler: terfih (ikrahta küfür) / ıskat (domuz eti)."},{"s":9,"x":"Sıhhat-butlan: cumhura göre şer'î sonuç doğurup doğurmama / emre uyup uymama. Hanefîler muamelatta gayr-ı sahihi ikiye ayırır: fâsid (şartta eksik), bâtıl (rükünde eksik)."},{"s":10,"x":"Mahkûm fîh: hükmün taalluk ettiği mükellef fiili («أوفوا بالعقود»). «لا تكليف إلا بالفعل»: tahrîm ve kerahette nefsi alıkoymak fiil sayılır."},{"s":11,"x":"Fiilin şartları: tam bilinmesi (mücmeli sünnet açıklar) · yetkiliden geldiğinin bilinmesi (bilme imkânı; dârülislâmda bilmemek mazeret değil) · kudret dahilinde olması (müstahil li-zâtihî / li-gayrihî; başkasının fiili; fıtrat: «لا تغضب»)."},{"s":11,"x":"Meşakkat: katlanılabilen (rızık için çalışmak) ile sorumlu tutulur; büyük eziyet veren (savm-ı visal) ile tutulmaz."},{"s":12,"x":"Mükellefin şartları: teklifin delillerini anlamaya muktedir olmak (akıl; alameti bulûğ) ve mükellef olduğu şeye ehil olmak."},{"s":13,"x":"Vücûb ehliyeti (zimmet): nâkıs (cenin; borçlu meyyit) / tam (sağ doğumla). Edâ ehliyeti (akılla): yok (7 yaş altı, deli), nâkıs (mümeyyiz, ma'tûh), tam (bulûğ + akıl)."},{"s":13,"x":"Rüşd: Hanefîlere göre üst sınır 25 yaş; cumhura göre yaşa değil rüşde bakılır. Sefîh ve ma'tûh hacredilir."},{"s":14,"x":"Ehliyet arızaları (edâ ehliyetiyle ilgili): izale eden (delilik, uyku, baygınlık), azaltan (ateh), etkilemeyip hüküm doğuran (sefeh → hacr)."}]},{"t":"Lafızlar ve Delalet","intro":"Hanefîlere göre nassın delalet yolları ve cumhura göre delaletin nevileri; manaya delaleti açık ve kapalı lafızlar; müşterek, âmm, hâss, mutlak–mukayyed; emir ve nehiy.","s":[{"h":"Nassın delalet yolları","b":[{"k":"not","x":"Bu taksim Hanefiye göredir."},{"k":"h","x":"1. İbâretü'n-nass"},{"k":"d","t":"İbâretü'n-nass","x":"Sîganın akla ilk gelen manaya ve sevkedilme amacına delalet etmesi. Bu sevkedilme amacı aslî de olabilir, tebeî de."},{"k":"ar","a":"وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا","x":"Örnek"},{"k":"li","x":"Bu nassın sîgası, sevkedilme amacı olan iki manaya delalet eder: 1) Alışverişin faiz gibi olmadığı. 2) Alışverişin hükmünün helal, faizin hükmünün de haram oluşu."},{"k":"li","x":"Lakin 1. mana asaletendir. Çünkü bu ayet «إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَا» diyenlere reddiye için sevkedilip aralarındaki benzerlik nefyedilmiştir."},{"k":"li","x":"2. mana ise tebeandır."},{"k":"h","x":"2. İşâretü'n-nass"},{"k":"d","t":"İşâretü'n-nass","x":"Akla ilk gelmeyen ve sevkedilme amacı olmayan, fakat gereklilik yoluyla çıkarılan manadır. Bu gereklilik bazen zâhir, bazen de hafî olur."},{"k":"ar","a":"وَشَاوِرْهُمْ فِي الْأَمْرِ","x":"Örnek"},{"k":"li","x":"İbâretü'n-nass, istişarenin gerekliliğidir."},{"k":"li","x":"İşâretü'n-nass ise kendisiyle istişare edilecek bir topluluk oluşturma gerekliliğidir. Çünkü istişare, bu topluluk olmadan yapılamaz."},{"k":"h","x":"3. Delâletü'n-nass"},{"k":"d","t":"Delâletü'n-nass","x":"Nassta belirtilen duruma ait hükmün, kıyas ve içtihada ihtiyaç duyulmaksızın sadece dili bilmekle anlaşılabilen illetteki müştereklik sebebiyle nassta belirtilmeyen durum hakkında da sabit olmasıdır."},{"k":"ar","a":"فَلَا تَقُلْ لَهُمَا أُفٍّ","x":"Örnek"},{"k":"li","x":"İbâretü'n-nass, evladın anne-babaya öf dememesi. Buradaki illet eziyet vermedir."},{"k":"li","x":"Delâletü'n-nass ise sövme ve dövme gibi eziyet veren diğer fiillerin de nehyedilmesi."},{"k":"dikkat","x":"Kıyas ile arasındaki fark: Yukarıdaki tarifinden de anlaşılacağı üzere burada sadece dil bilmek yeterliyken kıyasta bu yeterli değil."},{"k":"h","x":"4. İktizâü'n-nass"},{"k":"d","t":"İktizâü'n-nass","x":"Nassın sahih bir şekilde anlaşılması için takdir edilmesi gereken manadır."},{"k":"ar","a":"حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ","x":"Örnek → «نِكَاحُهَا». Yani nikâhlanmak haram kılındı."},{"k":"tbl","r":[["Delalet","Ne anlaşılır","Örnek"],["**İbare**","Akla ilk gelen ve sevk amacı olan mana","«وَأَحَلَّ اللَّهُ الْبَيْعَ…»"],["**İşaret**","Sevk amacı olmayan, gereklilikle çıkan mana","«وَشَاوِرْهُمْ…» → istişare topluluğu"],["**Delalet**","Dil bilgisiyle anlaşılan ortak illetle nassta geçmeyen hüküm","«أُفٍّ» → sövme, dövme"],["**İktiza**","Doğru anlamak için takdir edilmesi gereken mana","«أُمَّهَاتُكُمْ» → nikâhları"]]}]},{"h":"Delaletlerin gücü ve tearuzu","b":[{"k":"dikkat","x":"Delaletler içerisinde en güçlüsü ibaredir. Sonra sırasıyla işaret, delalet ve iktiza gelir. Bundan dolayı nasslar arasında bir tearuz meydana geldiğinde ibare, işarete tercih edilir."},{"k":"steps","x":["İbare","İşaret","Delalet","İktiza"]},{"k":"h","x":"Örnek: İbare ile işaretin tearuzu"},{"k":"ar","a":"كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى","x":"1. ayet"},{"k":"ar","a":"وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ","x":"2. ayet"},{"k":"li","x":"1. ayette ibare, katile kısas uygulanmasının vücubuna delalet eder."},{"k":"li","x":"2. ayette işaret, kasden adam öldürene kısas uygulanmayacağına delalet eder."},{"k":"li","x":"Söz konusu tearuzda ibare, işarete tercih edilir ve katile kısas uygulanır."},{"k":"h","x":"İşaret ve delaletin tearuzuna örnek"},{"k":"ar","a":"وَمَنْ قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ","x":""},{"k":"li","x":"Bu ayette ibare, hataen bir mümini öldürenin cezasının mümin bir köleyi azad etme keffareti olduğuna delalet eder."},{"k":"li","x":"Delalet ise; hataen öldürene bu gerekiyorsa aralarındaki illet («قَتْل») birliği sebebiyle bilerek öldürene haydi haydi evla gerekmesidir."},{"k":"li","x":"Bu şekilde yukarıdaki «وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا» ayetinin işaretiyle tearuz eder ve işaret tercih edilir."},{"k":"li","x":"Devamında işaret de ibareyle tearuz eder ve ibare tercih edilir."}]},{"h":"Cumhura göre delaletin nevileri","b":[{"k":"h","x":"1. Delâletü'l-mantûk"},{"k":"d","t":"Delâletü'l-mantûk","x":"Lafzın, nassta zikri geçen bir şeyin hükmüne delaleti."},{"k":"li","x":"Bu, Hanefîlerdeki ibare, işaret ve iktizadır."},{"k":"h","x":"2. Delâletü'l-mefhûm"},{"k":"d","t":"Delâletü'l-mefhûm","x":"Lafzın, nassta zikri geçmeyen bir şeyin hükmüne delaleti."},{"k":"li","x":"Bu da iki kısma ayrılır:"},{"k":"li","x":"**2A. Mefhûmu'l-muvâfaka:** Bu, Hanefîlerdeki delâletü'n-nasstır."},{"k":"li","x":"**2B. Mefhûmu'l-muhâlefe:** Bu da 5 çeşittir."},{"k":"tbl","r":[["Cumhur","Hanefîler"],["Delâletü'l-mantûk","İbare, işaret, iktiza"],["Mefhûmu'l-muvâfaka","Delâletü'n-nass"],["Mefhûmu'l-muhâlefe","(Hanefîlere göre nasslarda hüccet değil)"]]}]},{"h":"Mefhûmu'l-muhâlefenin çeşitleri","b":[{"k":"h","x":"2B1. Mefhûmu's-sıfat"},{"k":"d","t":"Mefhûmu's-sıfat","x":"Hükmü bir vasıf ile kayıtlanmış nassın, bu vasfı taşımayan durumlar hakkında o hükmün geçerli olmadığına delalet etmesidir."},{"k":"ar","a":"وَحَلَائِلُ أَبْنَائِكُمُ الَّذِينَ مِنْ أَصْلَابِكُمْ","x":"Örnek. Bunun mefhûm-ı muhâlefesi: Öz olmayan çocuklardır. (Süt çocuğu gibi.)"},{"k":"h","x":"2B2. Mefhûmu'l-gâye"},{"k":"d","t":"Mefhûmu'l-gâye","x":"Hükmü belirli bir sınır ile kayıtlanmış nassın, bu sınırdan sonra o hükmün geçerli olmadığına delalet etmesidir."},{"k":"ar","a":"فَإِنْ طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ","x":"Örnek. Bunun mefhûm-ı muhâlefesi: Boşanılan kadın, kendisini boşayan erkeğin dışında başka bir erkekle evlenirse helal olur."},{"k":"h","x":"2B3. Mefhûmu'ş-şart"},{"k":"d","t":"Mefhûmu'ş-şart","x":"Hükmü şart edatlarından biriyle belirli bir şarta bağlanmış nassın, bu şartın bulunmadığı durumlarda o hükmün geçerli olmadığına delalet etmesidir."},{"k":"ar","a":"وَإِنْ كُنَّ أُولَاتِ حَمْلٍ فَأَنْفِقُوا عَلَيْهِنَّ حَتَّى يَضَعْنَ حَمْلَهُنَّ","x":"Örnek. Bunun mefhûm-ı muhâlefesi: Eğer hamile değillerse nafaka mükellefiyeti yoktur."},{"k":"h","x":"2B4. Mefhûmu'l-aded"},{"k":"d","t":"Mefhûmu'l-aded","x":"Hükmü belirli bir sayı ile kayıtlanmış nassın, bu sayının dışında o hükmün yerine gelmeyeceğine delalet etmesidir."},{"k":"ar","a":"الزَّانِيَةُ وَالزَّانِي فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ","x":"Örnek. Bunun mefhûm-ı muhâlefesi: 100'den az veya fazlası olmaz."},{"k":"h","x":"2B5. Mefhûmu'l-lakab"},{"k":"d","t":"Mefhûmu'l-lakab","x":"Özel isim, cins ve nevi gibilerine bağlanan hükmün bunun dışındakiler için geçerli olmaması."},{"k":"ar","a":"مُحَمَّدٌ رَسُولُ اللَّهِ","x":"Örnek. Bunun mefhûm-ı muhâlefesi: Muhammed dışındakiler resul değildir."},{"k":"tbl","r":[["Çeşit","Kayıt","Mefhûm-ı muhâlefesi"],["**Sıfat**","«مِنْ أَصْلَابِكُمْ»","Öz olmayan (süt) çocuklar"],["**Gâye**","«حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ»","Başka biriyle evlenirse helal"],["**Şart**","«وَإِنْ كُنَّ أُولَاتِ حَمْلٍ»","Hamile değilse nafaka yok"],["**Aded**","«مِائَةَ جَلْدَةٍ»","100'den az veya fazla olmaz"],["**Lakab**","«مُحَمَّدٌ»","Diğerleri resul değil"]]}]},{"h":"Tetimme","b":[{"k":"n","n":1,"x":"Mefhûmu'l-lakab, ittifakla hüccet değildir."},{"k":"n","n":2,"x":"Mefhûmu'l-muhâlefe (lakap hariç bütün çeşitleriyle) ittifakla şer'î nassların dışında hüccettir."},{"k":"n","n":3,"x":"Mefhûmu'l-muhâlefe (lakap hariç bütün çeşitleriyle) cumhura göre nasslarda da hüccettir; Hanefîlere göre değildir."},{"k":"h","x":"Cumhurun delilleri"},{"k":"n","n":1,"x":"Arapların ibareleri kullanma üslubundan akla ilk gelen; vasıf, şart, gaye ve aded ile hükmü kayıtlamak, bu kayıtlar olmadığında o hükmün nefyine delalet eder."},{"k":"ornek","x":"Çocuğun başarılı olursa ona bir hediye al. Yani başarılı olmazsa alma."},{"k":"n","n":2,"x":"Nasslardaki kayıtlar bir hikmet içindir. Boşu boşuna değildir."},{"k":"h","x":"Hanefîlerin delilleri"},{"k":"n","n":1,"x":"Cumhurun söylediği 1. delil her zaman geçerli olmayabilir."},{"k":"ornek","x":"\"Biri senden sabah bir şey isterse ihtiyacını gider.\" Bundan şu çıkarılmaz: \"Akşam isterse giderme.\""},{"k":"n","n":2,"x":"Cumhurun söylediği 2. delil de (nasslarla ilgili) her zaman geçerli değil."},{"k":"ar","a":"إِنْ خِفْتُمْ أَنْ يَفْتِنَكُمُ الَّذِينَ كَفَرُوا","x":"Örnek: Namazın seferde kısaltılması ile ilgili ayetteki kayıt. Bundan \"Korku yoksa kısaltmayın, tam kılın.\" çıkarılmaz."},{"k":"h","x":"Mefhûm-ı muhâlifle amel şartları"},{"k":"li","x":"Bunu kabul edenlere göre birçok şartı vardır. Fakat hepsi bir noktada toplanabilir: Mantûkun hükmüne konulan kaydın, kayıt kalktığında hükmün de sona ereceğini göstermek dışında bir fayda ve gayesi olmamalıdır. Aksi hâlde mefhûm-ı muhâlif dikkate alınmaz."},{"k":"ar","a":"وَهُوَ الَّذِي سَخَّرَ الْبَحْرَ لِتَأْكُلُوا مِنْهُ لَحْمًا طَرِيًّا","x":"Örnek. Burada maksat nimetleri hatırlatmaktır. Yoksa taze olmayanı yemeyin değil."}]},{"h":"El-Vâdıhu'd-delâle: Manaya delaleti açık (Hanefîlere göre)","b":[{"k":"h","x":"1. Zâhir"},{"k":"d","t":"Zâhir","x":"Harici bir şeye ihtiyaç duymaksızın bizzat sîgası ile murad edilen manaya delalet eden, nassın aslen sevk amacı olmayan ve tevil (tahsis, takyid, mecaz) ihtimali olandır."},{"k":"ar","a":"وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا","x":"Örnek"},{"k":"li","x":"Tebean alışverişin helal, faizin haram olduğuna delalet eder (Çünkü aslen alışverişin faiz gibi olmadığına delalet eder). Ve bu manaya harici bir şeye ihtiyaç duymadan delalet eder."},{"k":"li","x":"**Hükmü:** Aksine bir delil olmadığı sürece zâhirle amel etmek vâcibtir. Teşrî döneminde neshe açıktır."},{"k":"h","x":"2. Nass"},{"k":"d","t":"Nass (Hanefîlere göre)","x":"Harici bir şeye ihtiyaç duymaksızın bizzat sîgası ile murad edilen manaya delalet eden, nassın asıl sevk amacı olan ve tevil ihtimali olandır."},{"k":"ar","a":"وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا","x":"Örnek"},{"k":"li","x":"**Hükmü:** Zâhirin hükmü gibi."},{"k":"h","x":"Tevil"},{"k":"li","x":"Sözlükte: Döndürmek."},{"k":"ar","a":"صَرْفُ اللَّفْظِ عَنْ ظَاهِرِهِ بِدَلِيلٍ","x":"Istılahta. Türkçesi: Lafzı bir delille zâhirinden çevirmek."},{"k":"h","x":"3. Müfesser"},{"k":"d","t":"Müfesser","x":"Murad edilen manaya açık bir şekilde delalet eden ve tevil (tahsis, takyid, mecaz) ihtimali olmayandır."},{"k":"ar","a":"فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً","x":"Örnek. Fazlası veya eksiği olmaz."},{"k":"li","x":"**Hükmü:** Zâhirin hükmü gibi (teşrî döneminde neshe açık)."},{"k":"not","x":"Tefsir, şâri tarafından; tevil, şârih tarafından yapılır. Tefsir kat'îdir, tevil ise zannîdir."},{"k":"h","x":"4. Muhkem"},{"k":"d","t":"Muhkem","x":"Murad edilen manaya açık bir şekilde delalet eden ve tevil (tahsis, takyid, mecaz) ihtimali olmayandır; teşrî döneminde de neshe kapalıdır."},{"k":"ar","a":"وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا","x":"Örnek"},{"k":"li","x":"**Hükmü:** Zâhirin hükmü gibi; teşrî döneminde de neshe kapalı. Dolayısıyla müfesser, Hz. Peygamber'in vefatından sonra muhkeme döner."},{"k":"dikkat","x":"Kuvvet sıralaması terstendir. Tearuz durumunda bu sıralama takip edilir."},{"k":"tbl","r":[["Lafız","Asıl sevk amacı","Tevil ihtimali","Teşrî döneminde nesih"],["**Zâhir**","Değil","Var","Açık"],["**Nass**","Evet","Var","Açık"],["**Müfesser**","—","Yok","Açık"],["**Muhkem**","—","Yok","Kapalı"]]}]},{"h":"Gayru'l-vâdıhi'd-delâle: Manaya delaleti kapalı (Hanefîlere göre)","b":[{"k":"h","x":"1. Hafî"},{"k":"d","t":"Hafî","x":"Manaya delaleti açık olup şâmil olduğu fertlere delaleti kapalı olandır."},{"k":"ar","a":"وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا","x":"Örnek"},{"k":"li","x":"«سَارِق» kelimesinin manası açıktır. Fakat hangi fertleri kapsadığı konusunda kapalılık vardır."},{"k":"li","x":"Örneğin «طَرَّار»: Yankesici. Yankesici açıktan alır, hırsız gizliden. Ulemânın içtihadıyla ittifaken bunun eli kesilir."},{"k":"li","x":"Veya «نَبَّاش»: Ölünün kefen veya elbisesini çalan. Hırsızdan farkı: Mergûb olmayan bir malı çalmasıdır. İ. Şâfiî ve Ebû Yûsuf'a göre hırsız sayılır. Diğer Hanefî ulemâsına göre ise hırsız sayılmaz, ta'zir cezası verilir."},{"k":"li","x":"**Hükmü:** İnceleme ve içtihad yoluyla kapalılığı giderilir. İnceleme ve içtihad ile bir neticeye varıldıktan sonra kendisiyle amel edilebilir."},{"k":"h","x":"2. Müşkil"},{"k":"d","t":"Müşkil","x":"Bizzat kendi sîgasıyla murad edilen manaya delaleti kapalı olup bu kapalılığın ancak harici bir şeyle giderildiği lafızlardır."},{"k":"dikkat","x":"Hafî ile arasındaki fark: Kapalılık hafîde bizzat sîgada değil, fertleri kapsamasındadır. Müşkilde ise bizzat sîgadadır."},{"k":"li","x":"Müşterek lafızlarda bulunur."},{"k":"li","x":"**Hükmü:** Muhtemel manalarından biri içtihad ile belirlendikten sonra amel edilebilir."},{"k":"ar","a":"وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ","x":"Örnek. Hayız mı, temizlik mi?"},{"k":"li","x":"**Şâfiîlere göre: Temizlik.** Delilleri: «ثَلَاثَة» adedinin müzekker olarak gelmesi, ma'dûdun müzekker yani temizlik olduğuna delalet eder."},{"k":"li","x":"**Hanefîlere göre: Hayızdır.** Delilleri:"},{"k":"n","n":1,"x":"İddet beklemenin hikmeti hamile olup olmadığının belli olmasıdır. Bu da temizlikten değil hayızdan anlaşılır."},{"k":"n","n":2,"x":"«وَاللَّائِي يَئِسْنَ مِنَ الْمَحِيضِ مِنْ نِسَائِكُمْ إِنِ ارْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَاثَةُ أَشْهُرٍ وَاللَّائِي لَمْ يَحِضْنَ» Bu ayetten iddetin hayızla alakalı olduğu anlaşılıyor."},{"k":"n","n":3,"x":"«طَلَاقُ الْأَمَةِ ثِنْتَانِ وَعِدَّتُهَا حَيْضَتَانِ» hadisi."},{"k":"h","x":"3. Mücmel"},{"k":"d","t":"Mücmel","x":"Murad edilen manaya delaleti kapalı olup ancak şâriin beyanıyla açık olan lafızlardır."},{"k":"li","x":"**Çeşitleri:**"},{"k":"n","n":1,"x":"Müştereklik. «مَوْلًى» gibi."},{"k":"n","n":2,"x":"Sözlük manasından şâriin kastettiği özel bir manaya nakledilmesi. «صَلَاة» gibi."},{"k":"n","n":3,"x":"Lafzın garabeti. «هَلُوعًا» gibi."},{"k":"li","x":"**Hükmü:** Şâriin beyanı olmadan kendisiyle amel edilmesi caiz değildir. Bu beyan iki şekilde olabilir:"},{"k":"n","n":1,"x":"**Kat'î ve vâfi (tam):** Bu durumda mücmel müfessere döner. Şâriin «صَلَاة»yı beyanı gibi."},{"k":"n","n":2,"x":"**Vâfi olmayan:** Bu durumda mücmel müşkile döner ve şâriin beyanına ihtiyaç duymaksızın müçtehidin içtihadıyla bu kapalılık giderilebilir."},{"k":"ornek","x":"«وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا» Buradaki «رِبَا» sözlük anlamıyla değil de şâriin kastettiği özel bir manada kullanılmıştır ve bunu Hz. Peygamber şu hadisiyle beyan etmiştir: «الذَّهَبُ بِالذَّهَبِ…» Fakat bu beyan vâfi değildir. Ve «رِبَا» müşkile döner; müçtehid «رِبَا»nın neliği konusunda içtihad edebilir."},{"k":"h","x":"4. Müteşâbih"},{"k":"d","t":"Müteşâbih","x":"Kendisiyle kastedilen mananın dünyada hiç kimsenin bilemeyeceği veya sadece ilimde râsih olanların bilebileceği derecede kapalı olan lafızlardır."},{"k":"li","x":"Bu anlamıyla müteşâbih, teşrî-amelî hükümleri içeren nasslarda (ayet ve hadislerde) bulunmaz. Ancak bunun dışındakilerde bulunur:"},{"k":"li","x":"Hurûf-ı mukattaa."},{"k":"li","x":"Zâhiri, Allah'ın yarattıklarına benzediğini vehmettiren nasslar. («يَد، وَجْه»)"},{"k":"li","x":"**Hükmü:** Manasına vâkıf olunup olunamayacağı konusu ihtilaflı. («إِلَّا اللَّهُ – وَالرَّاسِخُونَ فِي الْعِلْمِ»)"},{"k":"tbl","r":[["Lafız","Kapalılık nerede","Nasıl açılır","Örnek"],["**Hafî**","Fertleri kapsamada","İnceleme ve içtihad","Tarrâr, nebbâş"],["**Müşkil**","Bizzat sîgada","İçtihad","«قُرُوء»"],["**Mücmel**","Bizzat sîgada","Ancak şâriin beyanı","«صَلَاة»، «رِبَا»"],["**Müteşâbih**","Kimse ya da yalnız râsihler bilir","İhtilaflı","Hurûf-ı mukattaa, «يَد»"]]}]},{"h":"Hanefîlerin dışındakilere göre açık ve kapalı lafızlar","b":[{"k":"h","x":"El-Vâdıhu'd-delâle"},{"k":"d","t":"Zâhir (Hanefî dışı)","x":"Manasına zannî (açık) olarak delalet eden, başka bir ihtimale açık olan lafızdır."},{"k":"d","t":"Nass (Hanefî dışı)","x":"Manasına kat'î (açık) olarak delalet eden, başka bir ihtimale kapalı olan lafızdır. Hanefîlerdeki müfesserle aynıdır."},{"k":"li","x":"Muhkem ise (Hanefîlerin dışındakilere göre) ister zannî ister kat'î, manasına açık bir şekilde delalet edendir. Yani hem zâhiri hem nassı kapsar."},{"k":"not","x":"Bu ihtilaf ciddi bir fikir ayrılığı olmayıp sırf terim ayrılığından ibarettir. Pratik açıdan herhangi bir sonucu yoktur."},{"k":"h","x":"Gayru'l-vâdıhi'd-delâle"},{"k":"n","n":1,"x":"**Mücmel:** Manası, delaleti kapalı olan lafız."},{"k":"n","n":2,"x":"**Müteşâbih:** İster kendi sîgasındaki bir sebeple, ister başka bir sebeple manaya delaleti kapalı olan lafız."},{"k":"li","x":"Bu ikisi Hanefîlerdeki 4 neviyi de kapsar."},{"k":"tbl","r":[["","Hanefîler","Hanefîlerin dışındakiler"],["**Açık**","Zâhir, nass, müfesser, muhkem","Zâhir, nass (= müfesser); muhkem ikisini kapsar"],["**Kapalı**","Hafî, müşkil, mücmel, müteşâbih","Mücmel, müteşâbih"]]}]},{"h":"Müşterek","b":[{"k":"d","t":"Müşterek","x":"Her biri ayrı bir vaz' ile olmak üzere birden fazla manaya sahip olan lafızlardır. «عَيْن» ve «قُرْء» lafızları gibi."},{"k":"h","x":"Müştereğin ortaya çıkış sebepleri"},{"k":"n","n":1,"x":"**Arap kabileleri arasındaki farklılıklar.**"},{"k":"ornek","x":"«ذِرَاع»: Bazı kabilelerde omuza kadar, bazı kabilelerde dirseğe kadar, bazı kabilelerde ise bileğe kadardır."},{"k":"n","n":2,"x":"**Bir lafız, önce hakiki bir mana için konmuş, sonra aynı lafız bir alakadan dolayı mecazen farklı bir manada kullanılmış ve bu öylesine yaygınlaşmış ki artık hakiki manası unutulmuş.**"},{"k":"ornek","x":"«سَيَّارَة» ve «دَرَّاجَة» gibi (lugatta, dilde)."},{"k":"n","n":3,"x":"**Bir lafız, önce bir mana için konmuş, sonra da şer'î/ıstılahî bir mana için konmuş.**"},{"k":"ornek","x":"«صَلَاة» ve «زَكَاة»."},{"k":"h","x":"Nassta gelen müşterek lafız"},{"k":"li","x":"Şer'î bir nassta gelen bir lafız sözlük ve şer'î/ıstılahî anlamlar bakımından müşterekse şer'î/ıstılahî manasının kastedilmesi vâcibtir."},{"k":"ornek","x":"«وَأَقِيمُوا الصَّلَاةَ»: Namaz, dua değil."},{"k":"li","x":"Şer'î bir nassta gelen bir lafız birkaç sözlük anlamı bakımından müşterekse bu durumda birinin tayini için içtihad edilmesi gerekir."},{"k":"ornek","x":"«قُرُوء». Hanefî… Şâfiî…"},{"k":"h","x":"Hükmü"},{"k":"li","x":"Lafızda aslolan müşterek olmamasıdır. Şayet lafzın hem müşterek olma hem de olmama ihtimali varsa olmama ihtimali tercih edilir. Bu müttefekun aleyhtir."},{"k":"li","x":"Böyle bir ihtimal olmayıp müştereklği kesinleştikten sonra içtihadla biri tercih edildikten sonra amel edilir."}]},{"h":"Umûmu'l-müşterek meselesi","b":[{"k":"li","x":"Yani müşterek lafzın manalarının her birine aynı anda delalet edip edemeyeceği meselesi."},{"k":"h","x":"Hanefîlere göre"},{"k":"li","x":"Bu, ister olumlu ister olumsuz olsun caiz değildir. Çünkü müştereğin tanımından da anlaşılacağı üzere her biri için ayrı bir vaz' gerekir. Tek bir vaz' ile delalet etmesi müşterekliğine aykırıdır."},{"k":"h","x":"Şâfiîlere göre"},{"k":"li","x":"Bu, ister olumlu ister olumsuz olsun caizdir. Delilleri şu ayettir:"},{"k":"ar","a":"أَلَمْ تَرَ أَنَّ اللَّهَ يَسْجُدُ لَهُ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ وَالشَّمْسُ وَالْقَمَرُ وَالنُّجُومُ وَالْجِبَالُ وَالشَّجَرُ وَالدَّوَابُّ وَكَثِيرٌ مِنَ النَّاسِ","x":""},{"k":"li","x":"Buradaki sücud insanlar hakkında alnın yere konması, diğer varlıklar hakkında ise boyun eğme, itaat demektir. Dolayısıyla tek bir vaz' ile bu ikisine delalet eder."},{"k":"dikkat","x":"Hanefîlerin buna cevabı: Buradaki iki secde de boyun eğme ve itaattir. Ayrı anlamlarda değildir. Dolayısıyla bir müştereklik söz konusu değildir."},{"k":"h","x":"Bazı Hanefîlere göre"},{"k":"li","x":"Bu, eğer olumsuz oluşa caiz olur, olumlu oluşa olmaz. Bu, olumsuzdan sonra gelen nekranın umum ifade etmesi gibi olur."},{"k":"ornek","x":"Yeminler bahsinde geçen: «أَقْسَمَ أَوْ حَلَفَ لَا يُكَلِّمُ مَوَالِيَ فُلَانٍ…» \"Falancanın mevlâlarıyla konuşmayacağım\" diye yemin eden kimsenin bu yemini hem a'lâyı hem esfeli kapsar. Çünkü bu olumsuz bir cümledir."},{"k":"tbl","r":[["Görüş","Umûmu'l-müşterek"],["**Hanefîler**","Olumlu da olumsuz da caiz değil"],["**Şâfiîler**","Olumlu da olumsuz da caiz"],["**Bazı Hanefîler**","Yalnızca olumsuzda caiz"]]}]},{"h":"Âmm","b":[{"k":"d","t":"Âmm","x":"Tek bir vaz' ile tek bir manaya delalet eden ve bütün fertleri sınır olmaksızın kapsayan lafız."},{"k":"li","x":"Şer'î bir nassta âmm lafız gelirse ve tahsisine ilişkin bir delil de yoksa kesinlikle umumu üzere hamledilir. Delil varsa zannî olarak tahsise hamledilir."},{"k":"li","x":"Âmm, ancak kendi seviyesindeki bir delil ile tahsis edilebilir."},{"k":"h","x":"Âmm lafızları"},{"k":"li","x":"«كُلّ» ve «جَمِيع» lafızları, cins lâm-ı tarifli isim cins, isim tarifli çoğul, ism-i mevsuller, şart isimleri, nefiyden sonra gelen nekre (ve istifham isimleri)."},{"k":"h","x":"Âmm ile mutlakın farkı"},{"k":"ar","a":"عُمُومُ الْعَامِّ شُمُولِيٌّ وَعُمُومُ الْمُطْلَقِ بَدَلِيٌّ","x":""},{"k":"li","x":"Mutlak, delalet ettiği fertlerden herhangi birini ifade eder. Mesela «تَحْرِيرُ رَقَبَةٍ»: Bütün köleleri değil, herhangi bir köleyi azad etmek."},{"k":"li","x":"Âmm ise delalet ettiği bütün fertleri ifade eder. Mesela «وَالسَّارِقُ وَالسَّارِقَةُ»: Bütün hırsızlar."}]},{"h":"Âmmın delaleti","b":[{"k":"li","x":"Tahsisten sonra delaletinin zannî olduğuna dair cumhur ve Hanefîler arasında ihtilaf yoktur."},{"k":"h","x":"Cumhura göre"},{"k":"li","x":"Tahsisten önce de delaleti yine zannîdir."},{"k":"li","x":"Bu görüşün zorunlu neticesi: Âmmın delaleti zannî olduğuna göre zannî bir delille tahsis edilebilir."},{"k":"li","x":"Delilleri ise: İstikra sonucu nasslarda vârid olan bütün âmm lafızlar tahsis edilmiş; tahsis edilmeyip umumu üzere kalanlar da gerçekten nadirdir."},{"k":"h","x":"Hanefîlere göre"},{"k":"li","x":"Tahsisten önce âmmın delaleti kat'îdir."},{"k":"li","x":"Bu görüşün zorunlu neticesi: Âmmın delaleti kat'î olduğuna göre ancak kat'î bir delille tahsis edilebilir."},{"k":"li","x":"Delilleri ise: Genel kural: Aksine bir delil olmadıkça hakikaten âmm lafız, bütün fertlerini kapsamak üzere vaz' edilmiştir. Bu kat'îdir."},{"k":"tbl","r":[["","Tahsisten önce","Tahsis edilebileceği delil"],["**Cumhur**","Zannî","Zannî delil"],["**Hanefîler**","Kat'î","Ancak kat'î delil"]]}]},{"h":"Âmmın tahsisi","b":[{"k":"li","x":"**Genel tanım:** Âmmın bazı fertlerine hasredilmesi."},{"k":"h","x":"Cumhura göre"},{"k":"li","x":"Mutlak olarak (ister müstakil, ister gayr-ı müstakil, ister mukârin, ister gayr-ı mukârin) âmmın bazı fertlerine hasredilmesi."},{"k":"li","x":"**a. Müstakil:** Âmmın bulunduğu nassta geçmeyen, ayrı olan. Bu da 3 çeşittir:"},{"k":"li","x":"a1. **Akıl.** Örnek: «فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ» Akıl; çocuk ve delinin olmadığını bilir."},{"k":"li","x":"a2. **Örf ve âdet.** Örnek: Bir kimse hayvanlarla ilgili bir vasiyette bulunsa ve o bölgede hayvan kelimesi sadece at anlamına geliyorsa bu vasiyet kapsamına sadece atlar girer."},{"k":"li","x":"a3. **Mutlak nass (yani mukârin ve gayr-ı mukârin).** Örnek: Mukârin → «وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا». Gayr-ı mukârin → «حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ» ayetindeki umumu «هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ» hadisi tahsis etmiştir."},{"k":"li","x":"**b. Gayr-ı müstakil / muttasıl:** Âmmın bulunduğu nassta geçen, ayrı olmayan. Bu da 4 çeşittir:"},{"k":"li","x":"b1. **İstisna.** Örnek: «…إِلَّا أَنْ تَكُونَ تِجَارَةً حَاضِرَةً»"},{"k":"li","x":"b2. **Şart.** Örnek: «…إِنْ خِفْتُمْ أَنْ يَفْتِنَكُمُ الَّذِينَ كَفَرُوا»"},{"k":"li","x":"b3. **Sıfat / vasf.** Örnek: «…مِنْ نِسَائِكُمُ اللَّاتِي دَخَلْتُمْ بِهِنَّ»"},{"k":"li","x":"b4. **Gaye.** Örnek: «…وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ»"},{"k":"li","x":"**c. Mukârin:** Âmm ile aynı vakitte meşru kılınan. «وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا»"},{"k":"li","x":"**d. Gayr-ı mukârin:** Âmm ile aynı vakitte meşru kılınmayan, sonradan meşru kılınan. «حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ» → «هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ»"},{"k":"h","x":"Hanefîlere göre"},{"k":"li","x":"Müstakil ve mukârin bir muhassıs ile âmm lafzın bazı fertlerine hasredilmesi."},{"k":"li","x":"Eğer muhassıs gayr-ı müstakil ise bu tahsis değil **kasr** olur."},{"k":"li","x":"Eğer müstakil ama gayr-ı mukârin ise bu **nesh** olur."},{"k":"li","x":"Dolayısıyla Hanefîlere göre müstakillin çeşitlerinden olan \"nass\", sadece mukârin olur, gayr-ı mukârin olmaz."},{"k":"tbl","r":[["Muhassıs","Cumhura göre","Hanefîlere göre"],["**Müstakil + mukârin**","Tahsis","Tahsis"],["**Müstakil + gayr-ı mukârin**","Tahsis","Nesh"],["**Gayr-ı müstakil**","Tahsis","Kasr"]]},{"k":"h","x":"Genel kural"},{"k":"ar","a":"الْعِبْرَةُ بِعُمُومِ اللَّفْظِ لَا بِخُصُوصِ السَّبَبِ","x":""},{"k":"ornek","x":"«…أَنَتَوَضَّأُ بِمَاءِ الْبَحْرِ؟ هُوَ الطَّهُورُ مَاؤُهُ…» Burada \"Soru sadece abdestle ilgiliydi veya sadece zaruret hâlinde geçerli\" gibi şeylere itibar edilmez."}]},{"h":"Hâss","b":[{"k":"d","t":"Hâss","x":"Tek bir vaz' ile tek bir manaya delalet eden lafız."},{"k":"li","x":"Hâss lafız; bazen mutlak, bazen mukayyed, bazen emir ve bazen de nehiy olarak 4 şekilde gelebilir."},{"k":"h","x":"Hâssın delaleti"},{"k":"li","x":"Hâss, ittifakla vaz' olunduğu manaya kat'î bir şekilde delalet eder ve aksine bir delil bulunmadıkça başka bir manaya hamledilemez."},{"k":"ar","a":"فَكَفَّارَتُهُ إِطْعَامُ عَشَرَةِ مَسَاكِينَ","x":"Örnek. 10'dan ne eksik ne de fazla."},{"k":"li","x":"Aksine bir delil bulunursa başka bir manaya hamledilir."},{"k":"ar","a":"فِي كُلِّ أَرْبَعِينَ شَاةً شَاةٌ","x":"Örnek. Hanefîler, buradaki hâss olan «شَاة» kelimesini, başka bir mana olan «قِيمَتُهَا» şeklinde yorumlamıştır."}]},{"h":"Mutlak ve mukayyed","b":[{"k":"d","t":"Mutlak","x":"Gayr-ı muayyen bir ferde veya fertlere delalet eden ve herhangi bir sıfatla kayıtlandığına dair bir delil bulunmayan lafız."},{"k":"ornek","x":"Öğrenci veya öğrenciler."},{"k":"d","t":"Mukayyed","x":"Gayr-ı muayyen bir ferde veya fertlere delalet etmekle birlikte bir sıfatla/kayıtla kayıtlandığına dair bir delil bulunan lafız."},{"k":"ornek","x":"Çalışkan öğrenci veya öğrenciler."},{"k":"h","x":"Mutlakın hükmü"},{"k":"li","x":"Bir nassta mutlak olarak gelen bir lafız, başka bir nassta mukayyed olarak gelmemişse mutlak hâline göre amel edilir."},{"k":"ar","a":"وَمَنْ كَانَ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ","x":"Örnek. Buradaki «أَيَّام» lafzı mutlaktır. Çünkü burada veya başka bir nassta herhangi bir kayıtla (mesela peş peşe) kayıtlanmamıştır."},{"k":"h","x":"Mukayyedin hükmü"},{"k":"li","x":"Bir nassta mukayyed olarak gelen bir lafız, başka bir nassta mutlak olarak gelmemişse mukayyed hâline göre amel edilir."},{"k":"ar","a":"فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِنْ قَبْلِ أَنْ يَتَمَاسَّا","x":"Örnek. Buradaki mutlak bir lafız olan «شَهْرَيْن» lafzı, «مُتَتَابِعَيْن» kaydıyla kayıtlanmış ve bu manada ilgili başka hiçbir nassta mutlak olarak zikredilmemiştir."}]},{"h":"Mutlakın mukayyede hamli","b":[{"k":"li","x":"Bir lafzın, bir nassta mutlak, diğerinde mukayyed olarak gelmesi iki şekilde olur: Itlak ve takyid ya hükmün sebebindedir (hüküm aynı) ya da hükmün kendisindedir."},{"k":"h","x":"1. Sebepte ıtlak ve takyid"},{"k":"li","x":"Bu durumda Hanefîlere göre mutlak mukayyede hamledilmez. Cumhura göre hamledilir."},{"k":"ar","a":"أَدُّوا صَاعًا مِنْ بُرٍّ أَوْ قَمْحٍ بَيْنَ اثْنَيْنِ أَوْ صَاعًا مِنْ تَمْرٍ أَوْ شَعِيرٍ عَنْ كُلِّ حُرٍّ وَعَبْدٍ صَغِيرٍ أَوْ كَبِيرٍ","x":"Mutlak"},{"k":"ar","a":"أَدُّوا عَنْ كُلِّ حُرٍّ وَعَبْدٍ مِنَ الْمُسْلِمِينَ","x":"Mukayyed"},{"k":"li","x":"Burada her iki nasstaki hüküm aynıdır; o da «أَدُّوا», yani sadaka-i fıtrın vâcib olmasıdır."},{"k":"li","x":"Sebep ise nafaka ile yükümlülüktür. 1. nassta bu sebep «حُرّ» ve «عَبْد» diye mutlak olarak zikredilmişken 2. nassta «مِنَ الْمُسْلِمِينَ» kaydıyla zikredilmiştir."},{"k":"li","x":"Hanefîlere göre burada mutlak mukayyede hamledilmediğinden her iki nassla da ayrı ayrı amel edilir ve Müslüman olsun veya olmasın onun adına fitre sadakası verilmesi vâcibtir."},{"k":"li","x":"Cumhura göre ise hamledilebildiğinden mukayyed olan nassla amel edilir ve sadece Müslüman olan adına verilmesi vâcibtir."},{"k":"h","x":"2. Hükümde ıtlak ve takyid"},{"k":"li","x":"Bu durumda 4 şekil söz konusudur:"},{"k":"n","n":1,"x":"**Hüküm ve sebep aynı olur.** Bu durumda mutlak mukayyede ittifakla hamledilir."},{"k":"li","x":"Örnek: Mutlak: «حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنْزِيرِ». Mukayyed: «أَوْ دَمًا مَسْفُوحًا». Buradaki hüküm haramlık, sebep ise zarardır."},{"k":"n","n":2,"x":"**Hüküm ve sebep farklı olur.** Bu durumda ittifakla hamledilmez."},{"k":"li","x":"Örnek: Mutlak: «وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا». Mukayyed: «فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ». Burada mutlakın hükmü el kesmek, sebebi ise hırsızlıktır. Mukayyedin hükmü yıkamak, sebebi ise namazdır."},{"k":"n","n":3,"x":"**Sebep aynı, hüküm farklı olur.** Bu durumda da ittifakla hamledilmez."},{"k":"li","x":"Örnek: Mutlak: «فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ مِنْهُ» (teyemmüm). Mukayyed: «فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ». Burada her ikisinde de sebep aynıdır, yani namazdır. Hüküm farklıdır: 1.'de mesh, 2.'de yıkamadır."},{"k":"n","n":4,"x":"**Hüküm aynı, sebep farklı olur.** Bu durumda Hanefîlere göre hamledilmez, cumhura göre hamledilir."},{"k":"li","x":"Örnek: Mutlak: Zıhar ayetindeki «فَتَحْرِيرُ رَقَبَةٍ». Mukayyed: Hataen bir mümini öldürme ayetindeki «فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ». Burada hüküm aynı, yani köle azad etmek. Sebepler farklı: 1.'de zıhar, 2.'de katl."},{"k":"tbl","r":[["Durum","Hamledilir mi?","Örnek"],["**Sebepte ıtlak-takyid**","Hanefî: hayır · Cumhur: evet","Fitre («مِنَ الْمُسْلِمِينَ»)"],["**Hüküm ve sebep aynı**","İttifakla evet","Kan → akıtılmış kan"],["**Hüküm ve sebep farklı**","İttifakla hayır","El kesme – abdest"],["**Sebep aynı, hüküm farklı**","İttifakla hayır","Teyemmüm – abdest"],["**Hüküm aynı, sebep farklı**","Hanefî: hayır · Cumhur: evet","Zıhar – katl keffareti"]]}]},{"h":"Emir ve nehiy","b":[{"k":"h","x":"Emrin çeşitleri"},{"k":"n","n":1,"x":"Emir sîgası (emr-i hâzır ve emr-i gâib)."},{"k":"n","n":2,"x":"Emir anlamındaki haberî cümle."},{"k":"h","x":"Nehyin çeşitleri"},{"k":"n","n":1,"x":"Nehiy sîgası (nehy-i hâzır ve nehy-i gâib)."},{"k":"n","n":2,"x":"Nehiy anlamındaki haberî cümle."},{"k":"h","x":"Emrin delaleti"},{"k":"li","x":"Nassta vârid olan emrin neye delalet ettiği konusunda bir karine varsa ona delalet eder. Bunda ihtilaf yoktur. Ama karinesiz vârid olursa neye delalet ettiği hususunda ihtilaf vardır:"},{"k":"n","n":1,"x":"Bir görüşe göre böyle bir emir, nedb ve irşada delalet eder."},{"k":"n","n":2,"x":"Diğer bir görüşe göre böyle bir emir, ibahaya delalet eder."},{"k":"n","n":3,"x":"Bir başka görüşe göre böyle bir emrin vücub, nedb (irşad) ve ibahaya delaleti eşittir. Özel bir karine olmadıkça hiçbirine delaleti belirgin hâle gelmez."},{"k":"n","n":4,"x":"Çoğunluğa göre ise böyle bir emir vücuba delalet eder ve özel bir karine olmadıkça başka bir manaya delalet etmez. Buna göre:"},{"k":"li","x":"a. Şayet karine ibahaya delalet ediyorsa ibaha. Örnek: «وَكُلُوا وَاشْرَبُوا»"},{"k":"li","x":"b. Nedbe delalet ediyorsa nedb. Örnek: Kölelerle mükâtebe ayeti: «فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًا»"},{"k":"li","x":"c. İrşada delalet ediyorsa irşad. Örnek: Deyn ayeti."},{"k":"li","x":"d. Te'dibe delalet ediyorsa te'dib. Örnek: «سَمِّ اللَّهَ وَكُلْ بِيَمِينِكَ وَكُلْ مِمَّا يَلِيكَ»"},{"k":"h","x":"Nehyin delaleti"},{"k":"li","x":"Aynen emir gibi karine varsa karinenin gösterdiği şeye ihtilafsız delalet eder. Karine yoksa ihtilaflı:"},{"k":"n","n":1,"x":"Böyle bir nehiy kerahete delalet eder."},{"k":"n","n":2,"x":"Tahrîm ve kerahet arasında müşterektir ve karine olmadıkça bunlardan hiçbirine delalet etmez."},{"k":"n","n":3,"x":"Çoğunluğa göre ise böyle bir nehiy tahrîme delalet eder ve özel bir karine olmadıkça başka bir manaya delalet etmez. Buna göre:"},{"k":"li","x":"a. Şayet karine kerahete delalet ediyorsa kerahet. Örnek: «وَذَرُوا الْبَيْعَ…»"},{"k":"li","x":"b. İrşada delalet ediyorsa irşad. Örnek: «لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ»"},{"k":"li","x":"c. Duaya delalet ediyorsa dua. Örnek: «رَبَّنَا لَا تُزِغْ قُلُوبَنَا…»"},{"k":"tbl","r":[["","Karinesiz (çoğunluğa göre)","Karineyle"],["**Emir**","Vücub","İbaha, nedb, irşad, te'dib"],["**Nehiy**","Tahrîm","Kerahet, irşad, dua"]]}]},{"h":"Emrin tekrara, fevr ve terâhîye delaleti","b":[{"k":"h","x":"Emrin tekrara delaleti"},{"k":"li","x":"Bu konuda tercih edilen görüş; emir, kendi sîgasıyla tekrara delalet etmez. Ancak karine varsa delalet eder. Emrin, şâriin me'mûrun bih için illet veya sebep kıldığı bir şarta bağlanmış veya bir vasıfla kayıtlanmış olması gibi."},{"k":"ar","a":"يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا…","x":"Örnek. Buradaki \"yıkayın\" emrinin illeti veya sebebi namazdır. Bir şeyin illeti ve sebebi tekrarlandıkça o şey de tekrarlanır."},{"k":"h","x":"Emrin fevr ve terâhîye delaleti"},{"k":"li","x":"Bu konuda ihtilaf olmakla birlikte en isabetli görüş şudur: Emir, kendi sîgasıyla fevre veya terâhîye delalet etmez. Ancak karine bulunursa fevre veya terâhîye delalet edebilir."},{"k":"ornek","x":"\"Bana su ver!\" fevre delalet eder. \"Bir hafta sonra şöyle yap!\" terâhîye delalet eder."},{"k":"li","x":"5 vakit namaz gibi muvassa' vâcibler terâhîye delalet eder."},{"k":"li","x":"Ramazan orucu gibi mudayyak vâcibler fevre delalet eder."},{"k":"h","x":"Nehiy"},{"k":"dikkat","x":"Nehiy ise ihtilafsız fevr ve tekrara delalet eder. Şâri bir şeyi nehyetmişse mükellefin bunu derhâl terk etmesi ve hayatı boyunca hiçbir zaman yapmaması gerekir."}]}],"ht":[{"s":0,"x":"Hanefî delalet yolları: ibare (asıl sevk amacı), işaret (gereklilik: istişare topluluğu), delalet (dil bilgisiyle illet: \"öf\" → dövme), iktiza (takdir: \"ümmehâtüküm\" → nikâhları)."},{"s":1,"x":"Güç sırası: ibare > işaret > delalet > iktiza. Kısas ayetinin ibaresi, kasıt ayetinin işaretine tercih edilir: katile kısas."},{"s":1,"x":"Hata ayetinin delaleti kasıt ayetinin işaretiyle çatışır, işaret tercih edilir; işaret de kısas ayetinin ibaresiyle çatışır, ibare tercih edilir."},{"s":2,"x":"Cumhur: mantûk (= Hanefîlerin ibare, işaret, iktizası) ve mefhûm; mefhûmu'l-muvâfaka = delâletü'n-nass; mefhûmu'l-muhâlefe 5 çeşit."},{"s":3,"x":"Mefhûm-ı muhâlefe: sıfat (öz çocuk → süt çocuğu), gâye (başka kocayla nikâh), şart (hamile → nafaka), aded (100 değnek), lakab (Muhammed resuldür)."},{"s":4,"x":"Mefhûmu'l-lakab ittifakla hüccet değil. Diğerleri nass dışında ittifakla hüccet; nasslarda cumhura göre hüccet, Hanefîlere göre değil."},{"s":4,"x":"Amel şartı: kaydın, hükmün sona ereceğini göstermekten başka faydası olmamalı (\"taze et\" nimeti hatırlatır)."},{"s":5,"x":"Açık lafızlar (Hanefî): zâhir (asıl sevk değil, tevil var), nass (asıl sevk, tevil var), müfesser (tevil yok, nesih var: \"80 değnek\"), muhkem (tevil de nesih de yok: \"ebeden\")."},{"s":5,"x":"Kuvvet sırası terstir: muhkem > müfesser > nass > zâhir. Tefsir şâriden, kat'î; tevil şârihten, zannî."},{"s":6,"x":"Kapalı lafızlar (Hanefî): hafî (fertlerde: tarrâr, nebbâş), müşkil (sîgada; müşterekte: kurû'), mücmel (yalnız şâriin beyanı: mevlâ, salât, helû'), müteşâbih (hurûf-ı mukattaa, yed, vech)."},{"s":6,"x":"Kurû': Şâfiîlere göre temizlik (müzekker sayı); Hanefîlere göre hayız (iddetin hikmeti, âyise ayeti, cariye hadisi). Mücmelin beyanı tamsa müfessere (salât), değilse müşkile (ribâ) döner."},{"s":7,"x":"Hanefî dışı: zâhir (zannî), nass (kat'î = Hanefî müfesseri), muhkem ikisini kapsar; kapalı: mücmel, müteşâbih. Fark yalnızca terimde."},{"s":8,"x":"Müşterek: ayrı vaz'larla birden fazla mana (ayn, kur'). Sebepleri: kabile farkı (zirâ'), mecazın yaygınlaşması (seyyâre, derrâce), şer'î manaya nakil (salât, zekât)."},{"s":8,"x":"Nassta: sözlük/şer'î müştereklikte şer'î mana (namaz, dua değil); birkaç sözlük manasında içtihad (kurû'). Asıl olan müşterek olmamaktır."},{"s":9,"x":"Umûmu'l-müşterek: Hanefîlere göre hiç caiz değil; Şâfiîlere göre caiz (secde ayeti); bazı Hanefîlere göre yalnız olumsuz cümlede (mevlâ yemini)."},{"s":10,"x":"Âmm: tek vaz', bütün fertler. Lafızları: küll, cemî', lâm-ı tarifli cins ve çoğul, mevsul, şart isimleri, nefiyden sonra nekre (istifham). Âmmın umumu şümûlî (bütün hırsızlar), mutlakın bedelî (herhangi bir köle)."},{"s":11,"x":"Tahsisten sonra âmm herkese göre zannî. Tahsisten önce: cumhura göre zannî (zannî delille tahsis), Hanefîlere göre kat'î (ancak kat'î delille)."},{"s":12,"x":"Cumhur: müstakil (akıl, örf, nass), gayr-ı müstakil (istisna, şart, sıfat, gaye), mukârin ve gayr-ı mukârin hepsi tahsis. Hanefî: yalnız müstakil + mukârin tahsis; gayr-ı müstakil kasr; gayr-ı mukârin nesh."},{"s":12,"x":"«العبرة بعموم اللفظ لا بخصوص السبب» (deniz suyu hadisi)."},{"s":13,"x":"Hâss: tek vaz', tek mana; mutlak, mukayyed, emir, nehiy olarak gelir. Delaleti kat'î (\"on fakir\"); delil varsa başka manaya hamledilir (Hanefîler: koyun → değeri)."},{"s":14,"x":"Mutlak, kayıtlayan nass yoksa mutlak hâliyle amel edilir (kaza orucu \"eyyâm\"). Mukayyed, mutlak nass yoksa mukayyed hâliyle (keffarette peş peşe iki ay)."},{"s":15,"x":"Sebepte ıtlak-takyid (fitre): Hanefîlere göre hamledilmez, cumhura göre hamledilir. Hükümde: aynı-aynı → ittifakla haml; farklı-farklı ve sebep aynı-hüküm farklı → ittifakla haml yok; hüküm aynı-sebep farklı → Hanefî hayır, cumhur evet."},{"s":16,"x":"Karinesiz emir çoğunluğa göre vücub (karineyle ibaha, nedb, irşad, te'dib); karinesiz nehiy tahrîm (karineyle kerahet, irşad, dua)."},{"s":17,"x":"Emir kendi sîgasıyla tekrara delalet etmez; illet/sebep olan şarta bağlıysa tekrarlanır (abdest-namaz). Fevr ve terâhîyi karine belirler (muvassa' terâhî, mudayyak fevr). Nehiy ihtilafsız fevr ve tekrar ifade eder."}]},{"t":"Teşriî Usûlî Kaideler","intro":"Teşriin genel gayeleri (zarûriyyât, hâciyyât, tahsîniyyât) ve ilgili kaideler; Allah hakları ve kul hakları; içtihadın caiz olduğu alanlar; hükmün neshi.","s":[{"h":"1. Teşriin genel gayeleri / maksatları","b":[{"k":"li","x":"Teşriin genel gayesi, insanlar için fayda sağlamak, onlardan zararı savmaktır."},{"k":"h","x":"Makâsıdın nevileri"},{"k":"h","x":"1. Zarûriyyât"},{"k":"d","t":"Zarûriyyât","x":"Toplumun varlığını koruyabilmesi için kaçınılmaz olan değerlerdir. Bunlar yitirildiğinde hayat düzeni bozulur ve insanlar arasında kaos ve başıboşluk yayılır."},{"k":"li","x":"Bu zaruri değerler şunlardır (Zarûrât-ı hamse):"},{"k":"n","n":1,"x":"**Din** (Dinin korunması için cihad farz kılınmıştır.)"},{"k":"n","n":2,"x":"**Nefis – can** (Canın korunması için zaruri miktarda yemek-içmek, kısas, diyet gibi hükümler farz kılınmıştır.)"},{"k":"n","n":3,"x":"**Akıl** (Aklın korunması için içki gibi sarhoş edici şeyler yasaklanmıştır.)"},{"k":"n","n":4,"x":"**Irz – nesil** (Neslin korunması için zina ve zina iftirası yasaklanmıştır.)"},{"k":"n","n":5,"x":"**Mal** (Malın korunması için hırsızlık, faiz, aldatma gibi fiiller yasaklanmıştır.)"},{"k":"h","x":"2. Hâciyyât"},{"k":"d","t":"Hâciyyât","x":"Hayatı kolaylaştırıcı, yokluğu insanlara zorluk ve sıkıntı verebilen ancak hayat düzenini bozmayan düzenlemelerdir."},{"k":"li","x":"İbadât alanında: Su bulamayan için teyemmümün meşru kılınması gibi."},{"k":"li","x":"Muamelât alanında: Selem akdinin cevazı gibi."},{"k":"li","x":"Ukubât alanında: Hataen adam öldürenin diyetini âkilenin ödemesi gibi."},{"k":"h","x":"3. Tahsîniyyât"},{"k":"d","t":"Tahsîniyyât","x":"Kâmil insan, üstün ahlak ve güzel davranış niteliklerinin gerektirdiği durumlardır. Yokluğu hayat düzenini bozmaz veya insanları zorluğa ve sıkıntıya sokmaz; ancak selim akıl sahiplerinin nazarında bu özelliklerden mahrum olan kimse nahoş ve çirkin görünür."},{"k":"li","x":"İbadâtta: Beden ve elbise temizliği, setr-i avret gibi hükümler."},{"k":"li","x":"Muamelâtta: Telakki'l-celeb, neceş gibi fiillerin haram kılınması gibi."},{"k":"li","x":"Ukubâtta: Savaş âdâbı (kadın ve çocukların öldürülmesi hususunda) gibi."},{"k":"dikkat","x":"Bu zaruri değerlerin tertibi → Z > H > T."},{"k":"not","x":"Bu taksimin bu 3'lüde hasrının delili his ve müşahededir."},{"k":"tbl","r":[["Alan","Hâciyyât","Tahsîniyyât"],["**İbadât**","Su bulamayana teyemmüm","Beden ve elbise temizliği, setr-i avret"],["**Muamelât**","Selem akdinin cevazı","Telakki'l-celeb, neceş yasağı"],["**Ukubât**","Hataen öldürmede diyeti âkilenin ödemesi","Savaş âdâbı (kadın ve çocuklar)"]]}]},{"h":"Mükemmilât","b":[{"k":"d","t":"Mükemmilât","x":"Bu 3 değeri tamamlayıcı hükümler."},{"k":"li","x":"**Zarûriyyâta örnek:** Dinin korunması için namaz farz kılındığı gibi, ezan ve cemaatle namaz da meşru kılınmıştır."},{"k":"li","x":"**Hâciyyâta örnek:** Yolculukta kasr-ı salâta cevaz verildiği gibi, cem'e de cevaz verilmiştir."},{"k":"li","x":"**Tahsîniyyâta örnek:** Sadaka vererek sevap kazanmanın meşru olduğu gibi, verirken iyisinden vermek tavsiye edilmiştir."}]},{"h":"Zarûriyyât ile ilgili kaideler (Def'-i zarar)","b":[{"k":"ar","a":"الضَّرَرُ يُزَالُ شَرْعًا","x":"1. → Şuf'a gibi. Türkçesi: Zarar şer'an giderilir."},{"k":"ar","a":"الضَّرَرُ لَا يُزَالُ بِالضَّرَرِ","x":"2. → Kişi kendi malını korumak için başkasının malına zarar veremez. Türkçesi: Zarar zararla giderilmez."},{"k":"ar","a":"يُتَحَمَّلُ الضَّرَرُ الْخَاصُّ لِدَفْعِ الضَّرَرِ الْعَامِّ","x":"3. → Toplumun can güvenliği için katile kısas uygulamak gibi. Türkçesi: Genel zararı defetmek için özel zarara katlanılır."},{"k":"ar","a":"يُرْتَكَبُ أَخَفُّ الضَّرَرَيْنِ لِاتِّقَاءِ أَشَدِّهِمَا","x":"4. → Avret yerini örtecek elbise bulamayanın namazı terk etmek yerine öyle kılması gibi. Türkçesi: İki zarardan ağırından korunmak için hafifi irtikâp edilir."},{"k":"ar","a":"دَفْعُ الْمَضَارِّ مُقَدَّمٌ عَلَى جَلْبِ الْمَنَافِعِ","x":"5. → Oruçlunun mazmaza ve istinşakta mübalağa yapmasının mekruh olması gibi. Türkçesi: Zararları defetmek, menfaat celbinden önce gelir."},{"k":"ar","a":"الضَّرُورَاتُ تُبِيحُ الْمَحْظُورَاتِ","x":"6. → Izdırar hâlinde domuz eti yemek gibi. Türkçesi: Zaruretler yasakları mübah kılar."},{"k":"ar","a":"الضَّرُورَاتُ تُقَدَّرُ بِقَدَرِهَا","x":"7. → Ve domuz etini ölmeyecek kadar yemek. Türkçesi: Zaruretler kendi miktarlarınca takdir olunur."}]},{"h":"Hâciyyât ile ilgili kaideler (Def'-i haraç)","b":[{"k":"ar","a":"الْمَشَقَّةُ تَجْلِبُ التَّيْسِيرَ","x":"1. → Sefer, hastalık, ikrah, unutmak, cehalet, umûm-i belvâ ve nâkıs olmak. Sebebi 7'dir. Türkçesi: Meşakkat kolaylık getirir."},{"k":"ar","a":"الْحَرَجُ شَرْعًا مَرْفُوعٌ","x":"2. → İstikbâl-i kıble konusunda zann-ı gâlip ile hareket edilebilmesi gibi. Türkçesi: Haraç (darlık) şer'an kaldırılmıştır."},{"k":"ar","a":"الْحَاجَاتُ تُنَزَّلُ مَنْزِلَةَ الضَّرُورَاتِ فِي إِبَاحَةِ الْمَحْظُورَاتِ","x":"3. → Selem akdine cevaz verilmesi gibi. Türkçesi: Yasakları mübah kılmada ihtiyaçlar zaruretler yerine konur."}]},{"h":"2. Allah hakları ve kul hakları","b":[{"k":"li","x":"Mahkûmun fîhten maksat toplumun maslahatı ise sadece Allah hakkıdır ve tenfizinde hıyar yoktur."},{"k":"li","x":"Sadece mükellefin maslahatı ise sadece mükellefin hakkıdır ve tenfizinde hıyar vardır."},{"k":"li","x":"Her ikisinin de maslahatı söz konusu olabilir. Bu durumda hangisi baskınsa ona göre ya 1. gruba ya da 2. gruba girer."},{"k":"h","x":"Sadece Allah hakları"},{"k":"n","n":1,"x":"Mahza ibadet. (Namaz gibi.)"},{"k":"n","n":2,"x":"Malî yükümlülük barındıran ibadet. (Fitre gibi.)"},{"k":"n","n":3,"x":"Ziraî arazi hakkında farz kılınan vergiler. (Öşür.)"},{"k":"n","n":4,"x":"Ganimetler ve yer altında bulunan hazine ve madenler hakkında farz kılınan vergi. (Ganimetten 1/5.)"},{"k":"n","n":5,"x":"Kâmil (tam) ceza çeşitleri. (Hadler gibi.)"},{"k":"n","n":6,"x":"Kâsır (eksik) ceza çeşitleri. (Katilin mirastan mahrum bırakılması gibi.)"},{"k":"n","n":7,"x":"İbadet anlamındaki keffaretler. (Yemin keffareti gibi.)"},{"k":"h","x":"Sadece kul hakkı"},{"k":"ornek","x":"Borçlunun borcunu ödemesi."},{"k":"h","x":"Müşterek haklar"},{"k":"n","n":1,"x":"Allah hakkının baskın olduğu: Kazf haddi gibi."},{"k":"n","n":2,"x":"Kul hakkının baskın olduğu: Kısas haddi gibi."},{"k":"not","x":"Zekât, Hanefîlere göre mahza ibadettir (1. kısımdan). Cumhura göre 2. kısımdandır."},{"k":"tbl","r":[["Maksat","Hak","Tenfizinde hıyar"],["**Toplumun maslahatı**","Sadece Allah hakkı","Yok"],["**Sadece mükellefin maslahatı**","Sadece kul hakkı","Var"],["**İkisinin de maslahatı**","Baskın olana göre (kazf: Allah hakkı · kısas: kul hakkı)","—"]]}]},{"h":"3. İçtihadın caiz olduğu alanlar","b":[{"k":"dikkat","x":"Hakkında sarih kat'î nass bulunan bir konuda içtihad yapılamaz. (Hakkında nass olmayan veya kat'î olmayan nass bulunan konularda yapılabilir.)"},{"k":"d","t":"İçtihad","x":"Şer'î amelî hükümleri tafsîlî delillerinden çıkarabilmek için tüm çabayı sarf etmek."},{"k":"h","x":"İçtihad yapabilme şartları (başlıca)"},{"k":"n","n":1,"x":"Arap diline vâkıf olma."},{"k":"n","n":2,"x":"Kur'an ilimlerine vâkıf olma."},{"k":"n","n":3,"x":"Hadis ilimlerine vâkıf olma."},{"k":"n","n":4,"x":"Kıyas veçhelerini bilme (illet, hikmet, illetin şartları vb.)."},{"k":"h","x":"İçtihadla ilgili dikkat çekilmesi gereken 3 husus"},{"k":"n","n":1,"x":"**İçtihad, bölünmeyi kabul etmez.** Yani bir müçtehidin talak ile ilgili hükümleri bilip bey' ile ilgili hükümleri bilmemesi düşünülemez. Her konuda bilgi sahibi olmalı."},{"k":"n","n":2,"x":"**Müçtehid, ecir kazanır.** İsabet ederse 2, etmezse 1 sevap alır."},{"k":"n","n":3,"x":"**İçtihad, misliyle nakzedilmez.** Yani bir müçtehid bir mesele hakkında bir içtihad ederse ve daha sonra aynı mesele ile ilgili farklı bir içtihad ederse ne kendisi ne de bir başkası 1. içtihadı bozamaz. Çünkü bu anarşi, istikrarsızlık ve güvensizliğe yol açar."},{"k":"not","x":"Bu konuda tafsilat vardır…"}]},{"h":"4. Hükmün neshi","b":[{"k":"dikkat","x":"Resulün vefatından sonra nesih yoktur."},{"k":"ar","a":"رَفْعُ الْحُكْمِ الشَّرْعِيِّ بِدَلِيلٍ شَرْعِيٍّ","x":"Nesh. Türkçesi: Şer'î bir hükmün şer'î bir delille kaldırılması."},{"k":"h","x":"Hikmeti"},{"k":"n","n":1,"x":"Maslahatların değişiklik göstermesi."},{"k":"n","n":2,"x":"Tedricilik."},{"k":"n","n":3,"x":"(İmtihan.) — Kitapta 2."},{"k":"h","x":"Çeşitleri"},{"k":"n","n":1,"x":"**Sarih:** Şâriin önceki hükmü ilga ettiğini açıkça ifade etmesidir."},{"k":"ornek","x":"Hz. Peygamber'in önce kabir ziyaretini yasaklayıp sonra izin vermesi."},{"k":"n","n":2,"x":"**Zımnî:** Şâriin açıkça nesihten bahsetmeyip önceki hükme – aralarını bulamayacak şekilde – muarız bir hüküm koymasıdır."},{"k":"not","x":"Cumhur – Hanefîlere göre bu kayıt yok."},{"k":"ornek","x":"Vasiyet ayetini Hz. Peygamber'in «لَا وَصِيَّةَ لِوَارِثٍ» hadisi neshetmiştir."},{"k":"h","x":"Bazen de küllî ve cüz'î olabilir"},{"k":"n","n":1,"x":"**Küllî:** Önceki hükmü herkes için tamamen ilga etmek."},{"k":"ornek","x":"Vefat edenin karısının önce 1 yıl, sonra 4 ay 10 gün iddeti."},{"k":"n","n":2,"x":"**Cüz'î:** Önceki hükmü bazı hâllerde ve bazı kimseler hakkında ilga etmek."},{"k":"ornek","x":"Kazifte bulunup 4 şahit getiremeyene 80 sopa. Ama bu eğer kocaysa 80 sopa değil, liânlaşır."}]},{"h":"Nesh kabul etmeyen nasslar","b":[{"k":"n","n":1,"x":"Hiçbir durumda değişmeyen temel hükümler. İman esasları gibi."},{"k":"n","n":2,"x":"Sîgası te'bid ifade eden hükümler. Kazifler hakkındaki «وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا» ayeti gibi."},{"k":"n","n":3,"x":"Gerçekleşmiş olaylar hakkındaki nasslar. Çünkü böyle bir durumda nesih, şâriin yalanlanmaya götürür. Ki bu da muhaldir."},{"k":"h","x":"Ne ile nesh gerçekleşir?"},{"k":"ar","a":"مَا نَنْسَخْ مِنْ آيَةٍ أَوْ نُنْسِهَا نَأْتِ بِخَيْرٍ مِنْهَا أَوْ مِثْلِهَا","x":"Genel kural: Bu ayetinde de belirtildiği gibi bir nassı ancak onun seviyesinde veya daha ondan daha üstün, kuvvetli bir nass neshedebilir."},{"k":"li","x":"İcmâ, nassı neshedemez. Çünkü nass kat'î ise icmâ söz konusu olamaz. Zannî ise başka bir kat'î nassa dayanıp icmâ yapılır ve bu durumda nâsih, icmâ değil, dayandığı kat'î nass olur."},{"k":"li","x":"Aynı şekilde icmâ, icmâyı neshedemez."},{"k":"li","x":"Kıyas; Kitap, Sünnet ve icmâyı neshedemez. Çünkü kıyasın Kitap, Sünnet ve icmâya aykırı olmaması şartı vardır."},{"k":"li","x":"Aynı şekilde kıyas, kıyası neshedemez."}]}],"ht":[{"s":0,"x":"Teşriin gayesi: fayda sağlamak, zarar savmak. Tertip: zarûriyyât > hâciyyât > tahsîniyyât (delili his ve müşahede)."},{"s":0,"x":"Zarûrât-ı hamse: din (cihad), can (yeme-içme, kısas, diyet), akıl (içki yasağı), nesil (zina ve zina iftirası yasağı), mal (hırsızlık, faiz, aldatma yasağı)."},{"s":0,"x":"Hâciyyât: teyemmüm, selem, âkilenin diyeti. Tahsîniyyât: temizlik ve setr-i avret, telakki'l-celeb ve neceş yasağı, savaş âdâbı."},{"s":1,"x":"Mükemmilât: namaza ezan ve cemaat; kasra cem'; sadakada iyisini vermek."},{"s":2,"x":"Def'-i zarar kaideleri: zarar giderilir (şuf'a) · zararla giderilmez · genel zarar için özel zarara katlanılır (kısas) · ehven-i şerreyn (örtüsüz namaz) · def'-i mefâsid celb-i menâfiden önce (oruçluya mübalağa mekruh) · zaruret yasağı mübah kılar (domuz eti) · zaruret kendi miktarınca (ölmeyecek kadar)."},{"s":3,"x":"Def'-i haraç: meşakkat kolaylık getirir (7 sebep: sefer, hastalık, ikrah, unutmak, cehalet, umûm-i belvâ, nâkıslık) · haraç kaldırılmıştır (kıblede zann-ı gâlip) · ihtiyaç zaruret yerine geçer (selem)."},{"s":4,"x":"Toplum maslahatı → Allah hakkı (hıyar yok); mükellef maslahatı → kul hakkı (hıyar var). Müşterek: Allah hakkı baskın (kazf), kul hakkı baskın (kısas). Zekât: Hanefîlere göre mahza ibadet."},{"s":5,"x":"Sarih kat'î nass olan yerde içtihad yok. Şartlar: Arapça, Kur'an ilimleri, hadis ilimleri, kıyas veçheleri. İçtihad bölünmez · isabette 2, hatada 1 ecir · misliyle nakzedilmez."},{"s":6,"x":"Nesih: şer'î hükmün şer'î delille kaldırılması; vefattan sonra yok. Hikmeti: maslahatın değişmesi, tedric (imtihan). Sarih (kabir ziyareti) / zımnî (vasiyet ayeti – «لا وصية لوارث»). Küllî (iddet 1 yıl → 4 ay 10 gün) / cüz'î (kazifte koca için liân)."},{"s":7,"x":"Nesih kabul etmeyenler: iman esasları, te'bidli hükümler (\"ebeden\"), gerçekleşmiş olaylar. Nassı ancak dengi veya üstü nesheder; icmâ nassı ve icmâyı, kıyas Kitap, Sünnet, icmâ ve kıyası neshedemez."}]},{"t":"Tearuz ve Tercih","intro":"Delillerin tearuzu; Hanefîlere, cumhura ve muhaddislere göre tercih metodu; cem ve telif örneği.","s":[{"h":"Delillerin tearuzu","b":[{"k":"d","t":"Delillerin tearuzu","x":"Aynı meselede iki delilden birinin, diğerinin gerektirdiğiyle çelişen bir hükmü gerektirmesidir."},{"k":"ar","a":"إِنَّمَا الرِّبَا فِي النَّسِيئَةِ","x":"Örnek → Sadece vade, fazlalık değil."},{"k":"ar","a":"لَا تَبِيعُوا الْبُرَّ بِالْبُرِّ إِلَّا سَوَاءً بِسَوَاءٍ","x":"→ Fazlalık."},{"k":"li","x":"Bu iki hadis ribe'l-fazl konusunda tearuz etmiştir."},{"k":"dikkat","x":"İki ayet arasında veya iki sahih hadis arasında veya ayet ve sahih hadis arasında hakiki tearuz yoktur."}]},{"h":"Tercih metodu","b":[{"k":"li","x":"**Hanefîlere göre:** Sırasıyla → Nesh, Tercih, Cem ve telif / tevfik, Terk."},{"k":"li","x":"**Cumhura göre:** Sırasıyla → Cem ve telif / tevfik, Tercih, Nesh, Tevakkuf."},{"k":"li","x":"**Muhaddislere göre:** Sırasıyla → Cem ve telif / tevfik, Nesh, Tercih, Tevakkuf."},{"k":"not","x":"Kitabımız, cumhura göre almıştır."},{"k":"tbl","r":[["Sıra","Hanefîler","Cumhur","Muhaddisler"],["**1**","Nesh","Cem ve telif / tevfik","Cem ve telif / tevfik"],["**2**","Tercih","Tercih","Nesh"],["**3**","Cem ve telif / tevfik","Nesh","Tercih"],["**4**","Terk","Tevakkuf","Tevakkuf"]]}]},{"h":"Cem ve telif örneği","b":[{"k":"not","x":"Kitabımızda sadece cem ve telifin örneği vardır."},{"k":"ar","a":"وَالَّذِينَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُونَ أَزْوَاجًا يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا","x":"1. ayet"},{"k":"ar","a":"وَأُولَاتُ الْأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ","x":"2. ayet"},{"k":"li","x":"**Hanefîlere göre:** 2. ayet 1. ayeti neshetmiştir ve hamile kadının iddeti her hâlükârda doğumdur."},{"k":"li","x":"**Cumhura göre:** Nesih değil de cem ve telif yoluna gidilir ve hamile kadın eğer 4 ay 10 günden önce doğurursa bu süreyi tamamlar; sonra doğurursa zaten süreyi tamamlamış olur. Yani hamile kadının iddeti her hâlükârda 4 ay 10 gündür."},{"k":"tbl","r":[["","Yol","Hamile dulun iddeti"],["**Hanefîler**","Nesh (2. ayet 1.'yi nesheder)","Her hâlükârda doğum"],["**Cumhur**","Cem ve telif","Doğum 4 ay 10 günden önceyse süre tamamlanır"]]}]}],"ht":[{"s":0,"x":"Tearuz: aynı meselede iki delilin çelişen hüküm gerektirmesi (ribe'l-fazl hadisleri). İki ayet, iki sahih hadis ya da ayet ile sahih hadis arasında hakiki tearuz yoktur."},{"s":1,"x":"Hanefî: nesh → tercih → cem ve telif → terk. Cumhur: cem ve telif → tercih → nesh → tevakkuf. Muhaddisler: cem ve telif → nesh → tercih → tevakkuf."},{"s":2,"x":"Hamile dulun iddeti: Hanefîlere göre nesh → doğumla biter. Cumhura göre cem ve telif → 4 ay 10 gün dolmadan doğurursa süre tamamlanır."}]}];
const SORULAR = [{"u":0,"q":"Fıkıh tarifindeki «الشرعية» kaydı hangi hükümleri dışarıda bırakır?","a":["Aklî ve hissî hükümleri","İtikadi ve ahlaki hükümleri","Vaz'î hükümleri","Tafsîlî delillerden çıkmayan hükümleri"],"x":"\"Şer'î\" kaydıyla aklî (bir, ikinin yarısıdır) ve hissî (ateş yakıcıdır) hükümler; \"amelî\" kaydıyla itikadi ve ahlaki hükümler dışarıda kalır."},{"u":0,"q":"Fıkıh tarifindeki «العملية» kaydı hangi hükümleri dışarıda bırakır?","a":["İtikadi ve ahlaki hükümleri","Aklî ve hissî hükümleri","İbadetle ilgili hükümleri","Muamelatla ilgili hükümleri"],"x":"\"Amelî\" kaydı itikadi ve ahlaki hükümleri; \"şer'î\" kaydı ise aklî ve hissî hükümleri dışarıda bırakır."},{"u":0,"q":"\"Kişinin lehine ve aleyhine olanı bilmesi\" şeklindeki fıkıh tanımı kime aittir?","a":["İmam Ebû Hanîfe","İmam Şâfiî","Gazzâlî","Serahsî"],"x":"Ebû Hanîfe'ye göre fıkıh «مَعْرِفَةُ النَّفْسِ مَا لَهَا وَمَا عَلَيْهَا»dır."},{"u":0,"q":"Usûl-i fıkhın konusu nedir?","a":["Küllî şer'î delil; kendisiyle sabit olan küllî hükümler bakımından","Mükellefin fiili; kendisi için sabit olan şer'î hükümler bakımından","Şer'î hükümleri insanların fiil ve sözlerine uygulamak","Cüz'î delillerden hüküm çıkarmak"],"x":"Fıkhın konusu mükellefin fiili, usûl-i fıkhın konusu ise küllî şer'î delildir."},{"u":0,"q":"Aşağıdakilerden hangisi küllî bir hükümdür?","a":["İcab","Emir","Kıyas","Âmm"],"x":"Küllî hüküm, içinde çeşitli cüz'î hükümlerin toplandığı nevidir: icab, tahrîm, sıhhat, butlan. Emir, âmm, kıyas ise küllî delildir."},{"u":0,"q":"Hangisi fukahâ metodunun özelliklerinden biri değildir?","a":["Kıyas (tümdengelim) yöntemini kullanır","Hanefî mezhebine sıkı biçimde bağlıdır","Akla önem vermez, nakle dayanır","Misalleri boldur"],"x":"Fukahâ metodu istikrâ (tümevarım) yöntemini kullanır. Kıyas (tümdengelim) mütekellimîn metodunun özelliğidir."},{"u":0,"q":"Hangisi mütekellimîn metodunun özelliğidir?","a":["Herhangi bir mezhebe bağlı değildir ve akla önem verir","Hanefî mezhebine sıkı biçimde bağlıdır","Kelâmî konulara az yer verir","Misalleri boldur"],"x":"Mütekellimîn metodu mezhepten bağımsızdır, akla önem verir, kıyas (tümdengelim) yöntemini kullanır, kelâmî konuları işler ve misalleri azdır."},{"u":0,"q":"el-Mustasfâ hangi usûl telif yolunun eseridir?","a":["Mütekellimîn metodu","Fukahâ metodu","Memzuc metot","Hiçbiri; fıkıh eseridir"],"x":"Mütekellimîn metodunun eserleri: el-Umed, el-Mu'temed, el-Burhân ve Gazzâlî'nin el-Mustasfâ'sı."},{"u":0,"q":"Hangisi memzuc (iki metodu birleştiren) eserlerden biridir?","a":["et-Tahrîr","Takvîmü'l-edille","el-Burhân","el-Fusûl fi'l-usûl"],"x":"Memzuc eserler: Bedîu'n-nizâm, et-Tavzîh, Cem'u'l-cevâmi' ve İbnü'l-Hümâm'ın et-Tahrîr'i."},{"u":0,"q":"Hangisi fukahâ metoduyla yazılmış bir eserdir?","a":["Takvîmü'l-edille","el-Mu'temed","Cem'u'l-cevâmi'","el-Umed"],"x":"Fukahâ metodu eserleri: el-Fusûl (Cessâs), Takvîmü'l-edille (Debûsî), Kenzü'l-vüsûl (Pezdevî), el-Usûl (Serahsî)."},{"u":1,"q":"Hangisi muhtelefun fîh (üzerinde ihtilaf edilen) delillerden biri değildir?","a":["Kıyas","İstihsan","Sahâbe kavli","İstishab"],"x":"Kıyas, Kitap, Sünnet ve icmâ ile birlikte müttefekun aleyh dört delilden biridir."},{"u":1,"q":"Kur'an hükümlerinin delaleti ne zaman kat'î olur?","a":["Lafız birden fazla manaya ihtimalli değilse","Ayet Medine'de inmişse","Hüküm itikadi bir konudaysa","Ayet tevatürle nakledilmişse"],"x":"Kur'an'ın sübûtu kat'îdir. Delaleti ise lafız tek manaya ihtimalliyse kat'î (\"yüz değnek\"), birden fazla manaya ihtimalliyse zannîdir (\"kurû'\")."},{"u":1,"q":"«وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ» ayeti hangisine örnektir?","a":["Delaleti zannî olan Kur'an hükmüne","Delaleti kat'î olan Kur'an hükmüne","Sübûtu zannî olan bir nassa","Muhkem bir lafza"],"x":"«قُرُوء» kelimesi birden fazla manaya (hayız, temizlik) ihtimalli olduğu için ayetin delaleti zannîdir."},{"u":1,"q":"Hz. Peygamber'in bazı sahabelerin söz ve fiillerini susarak veya överek onaylamasına ne denir?","a":["Takrirî sünnet","Fiilî sünnet","Kavlî sünnet","Sünnet-i zâide"],"x":"Takrirî sünnet, sahabelerden meydana gelen söz ve fiillerin susarak, gülerek, överek veya dua ederek onaylanmasıdır."},{"u":1,"q":"Sünnetin, Kur'an'da bulunmayan bir hükmü isbat etmesine örnek hangisidir?","a":["(Erkeklere) altın ve gümüşün haram oluşu","Namazın nasıl kılınacağı","\"Namaz kılın\" emrinin sünnette de geçmesi","Vasiyet ayetinin neshi"],"x":"Namazın nasıl kılınacağı tebyine, \"namaz kılın\" te'kide örnektir. Altın ve gümüşün haram oluşu Kur'an'da bulunmayan bir hükmün isbatıdır."},{"u":1,"q":"Hanefîlere göre ilk tabakada tevatür sayısına ulaşmamış, fakat 2. ve 3. tabakada ulaşmış rivayete ne denir?","a":["Meşhur","Mütevâtir","Âhâd","Garîb"],"x":"Hanefîlere göre sünnet senedine göre mütevâtir, meşhur ve âhâd olmak üzere üçe ayrılır. Tarif edilen meşhurdur."},{"u":1,"q":"Cumhura göre âhâd haberin kısımlarında \"garîb\" hadisin herhangi bir tabakadaki ravi sayısı kaçtır?","a":["1","2","3","4"],"x":"Cumhura göre âhâd: meşhur/müstefîz (3), azîz (2), garîb (1)."},{"u":1,"q":"Hangisi teşrî özelliği olmayan sünnetlere örnektir?","a":["Hurma aşılama meselesi","Beş vakit namazın edası","Cemaatle namaz","Fitrenin verilmesi"],"x":"Dünya işlerinde ustalık ve tecrübeye dayanan fiiller (hurma aşılama) teşrî özelliği taşımaz. Diğerleri: insan tabiatı gereği yapılanlar ve Peygambere özel olanlar."},{"u":1,"q":"Âhâd haberi kabulde raviye yemin ettiren sahâbî kimdir?","a":["Hz. Ali","Hz. Ebû Bekir","Hz. Ömer","Hz. Osman"],"x":"Hz. Ebû Bekir ve Hz. Ömer iki kişi işittiğini söylediğinde kabul eder, Hz. Ali raviye yemin ettirirdi."},{"u":1,"q":"Âhâd haberin \"umûm-i belvâdan olmaması\" şartını hangi mezhep koşar?","a":["Hanefîler","Mâlikîler","Şâfiîler","Hanbelîler"],"x":"Hanefîlerin ek şartları: ravinin rivayetine aykırı amel etmemesi, hadisin umûm-i belvâdan olmaması, ravi müçtehid değilse kıyasa aykırı olmaması."},{"u":1,"q":"Âhâd haberin Medine ehlinin ameline aykırı olmamasını şart koşan mezhep hangisidir?","a":["Mâlikîler","Hanefîler","Şâfiîler","Hanbelîler"],"x":"Mâlikîler hadisin Medine ameline aykırı olmamasını, Şâfiîler senedin sahih ve muttasıl olmasını şart koşar; Hanbelîler ek şart koşmaz."},{"u":1,"q":"İcmâın hücciyetine delil getirilen ayetteki «أُولِي الْأَمْرِ» İbn Abbas gibi müfessirlere göre kimdir?","a":["Ulemâ","Ümerâ (devlet başkanları)","Sahâbe","Kumandanlar"],"x":"İcmâın delili «وَأُولِي الْأَمْرِ مِنْكُمْ» ayeti ve \"Ümmetim hata üzerinde birleşmez\" hadisidir; İbn Abbas gibi müfessirlere göre ulu'l-emr ulemâdır."},{"u":1,"q":"İcmâın mümkün olmadığını savunanlar kimlerdir?","a":["Nazzâm ve bazı Şiîler","Cumhur","Hanefîler","Mâlikîler"],"x":"Nazzâm ve bazı Şiîler icmâın mümkün olmadığını savunur. Cumhura göre mümkündür ve bilfiil vuku bulmuştur."},{"u":1,"q":"Hangisi bilfiil vuku bulmuş icmâya örnek gösterilmez?","a":["Yağmurda namazların cem'i","Hz. Ebû Bekir'in hilafeti","Domuz iç yağının haram oluşu","Ninenin altıda bire varis olması"],"x":"Yağmurda cem', münâsib-i mülâim konusunda kıyas örneğidir. Diğer üçü icmâ örneğidir."},{"u":1,"q":"Hallâf'a göre icmâ nasıl mümkün olabilir?","a":["Ancak devlet eliyle","Ancak sahâbe döneminde","Ancak Medine ehliyle","Hiçbir şekilde"],"x":"Hallâf'a göre icmâ ancak devlet eliyle mümkün olabilir."},{"u":1,"q":"Sükûtî icmâ ile ilgili hangisi doğrudur?","a":["Delaleti zannîdir; Şâfiîler ve Mâlikîler kabul etmez","Delaleti kat'îdir; uymak vâcib, uymamak haramdır","Hakiki icmâ olarak da adlandırılır","Bütün müçtehidlerin görüşünü açıkça belirtmesidir"],"x":"Sükûtî (itibarî) icmâda bazı müçtehidler susar; delaleti zannîdir. Sarih (hakiki) icmâ ise kat'îdir."},{"u":1,"q":"\"Kıyas müsbit değil, muzhirdir\" sözü ne anlatır?","a":["Kıyas hükmü ortaya koymaz, var olan hükmü ortaya çıkarır","Kıyasla sabit olan hüküm kesindir","Kıyas yalnızca ibadetlerde geçerlidir","Kıyas nassı nesheder"],"x":"Kıyas yeni bir hüküm koymaz; nassta var olan hükmü illet birliğiyle fer'de ortaya çıkarır."},{"u":1,"q":"Kıyasın hücciyetine sahâbe fiillerinden delil olarak ne gösterilir?","a":["Hz. Ebû Bekir'in hilafetinin namaz imamlığına kıyas edilmesi","Muâz b. Cebel hadisi","«فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ» ayeti","Kur'an'ın cem'i"],"x":"Sahâbe \"Resulullah onu dinimiz için uygun gördü, dünyamız için uygun görmeyelim mi?\" diyerek hilafeti imamlığa kıyas etmiştir."},{"u":1,"q":"Kıyasın rükünlerinden \"fer'\" nedir?","a":["Hükmü hakkında nass bulunmayan","Hükmü hakkında nass bulunan","Asla ait hükmün konulmasına sebep olan nitelik","Asla sabit olan ve fer'e uygulanmak istenen hüküm"],"x":"Fer'e «الْمَقِيس، الْمَحْمُول، الْمُشَبَّه» da denir; hükmü hakkında nass bulunmayandır."},{"u":1,"q":"Hz. Peygamber'in dörtten fazla evliliğine kıyas yapılamaması hangi şarta örnektir?","a":["Aslın hükmü asla has olmamalı","Aslın hükmü nassla sabit olmalı","Aslın hükmü taabbüdî olmamalı","İllet müteaddî olmalı"],"x":"Aslın hükmünün şartları: nassla sabit olmak, aklen idrak edilebilir illeti olmak ve asla has olmamak."},{"u":1,"q":"Seferde kasr-ı salâtta \"meşakkatin def'i\" nedir?","a":["Hikmet","İllet","Sebep","Mâni"],"x":"Hikmet hükmün konuluş amacıdır (meşakkatin def'i); illet ise hükmün bağlandığı niteliktir (sefer)."},{"u":1,"q":"Güneşin batması akşam namazının farziyeti için nedir?","a":["Sebeptir, illet değildir","Hem illet hem sebeptir","İllettir, sebep değildir","Hikmettir"],"x":"Akılla idrak edilemeyen şeye sadece sebep denir. Sefer ise kasr için hem illet hem sebeptir."},{"u":1,"q":"İlletin \"müteaddî\" olması ne demektir?","a":["Kişiye özel (kâsır) olmayıp başka yerlere geçebilmesi","Açık olması","Şahıstan şahısa değişmemesi","Hükme uygun olması"],"x":"İlletin şartları: zâhir (açık), munzabıt (standart, şahıstan şahısa değişmeyen), münâsib (uygun), müteaddî (kâsır olmayan)."},{"u":1,"q":"Nass veya icmâ ile bizzat hükme illet olduğu sabit olan vasfa ne denir?","a":["el-Münâsibü'l-müessir","el-Münâsibü'l-mülâim","el-Münâsibü'l-mürsel","el-Münâsibü'l-mülgâ"],"x":"Örneği hayız ayetidir: hüküm «اعْتِزَال», illet «أَذًى»."},{"u":1,"q":"Şâriin itibar veya ilga ettiğine dair bir delil bulunmayan vasfa ne denir?","a":["el-Münâsibü'l-mürsel","el-Münâsibü'l-mülgâ","el-Münâsibü'l-müessir","el-Münâsibü'l-mülâim"],"x":"el-Münâsibü'l-mürsele maslahat-ı mürsele de denilebilir. İlga edildiğine dair delil varsa mülgâ olur."},{"u":1,"q":"Erkek ve kızın karabette eşit, mirasta farklı olması hangi münasebete örnektir?","a":["el-Münâsibü'l-mülgâ","el-Münâsibü'l-mürsel","el-Münâsibü'l-mülâim","el-Münâsibü'l-müessir"],"x":"Şâri mirasta eşitlik vasfını ilga etmiştir; bu vasıf mülgâdır."},{"u":1,"q":"«لَا يَرِثُ الْقَاتِلُ» hadisinde illet hangi yolla bulunur?","a":["Îmâ ve işaret","Kat'î sarih nass","Zannî sarih nass","Sebr ve taksim"],"x":"Talil edatı yoktur; hükmün türemiş kelimeye («الْقَاتِل») bağlanması, kökünün («الْقَتْل») illet olduğunu hissettirir."},{"u":1,"q":"Hangisi yalnızca talil manasında gelen (kat'î) edatlardandır?","a":["«لِأَجْلِ»","«لِ»","«بِ»","«إِنَّ»"],"x":"Kat'î edatlar: «مِنْ أَجْلِ، لِأَجْلِ، لِأَنَّ، كَيْ…». «لِ، بِ، فَ، إِنَّ» başka manalara da gelebildiği için zannîdir."},{"u":1,"q":"Muhtemel seçenekleri belirleyip (hasr) birer birer eleyerek (hazf) tek seçeneği bırakmaya ne denir?","a":["Sebr ve taksim","Tahkîku'l-menât","Tahrîcü'l-menât","Kıyas maa'l-fârık"],"x":"Sebr deneme-sınama, taksim ayırma-bölmedir."},{"u":1,"q":"Tenkîhu'l-menâtı sebr ve taksimden ayıran özellik nedir?","a":["Vasıfların nassta geçmesi","İlletin fer'de bulunduğundan emin olunması","İcmâya dayanması","Talil edatı bulunması"],"x":"Tenkîhu'l-menât, nassta geçen vasıflardan illet olmaya elverişli olanı tespit etmektir."},{"u":1,"q":"Asılda geçen illetin fer'de bulunduğundan emin olmaya ne denir?","a":["Tahkîku'l-menât","Tenkîhu'l-menât","Tahrîcü'l-menât","Sebr ve taksim"],"x":"Tahrîc illeti bulmak, tenkîh nasstaki vasıflardan ayıklamak, tahkîk illetin fer'de olduğunu doğrulamaktır."},{"u":1,"q":"Fer' hakkında nass varken kıyas yapmaya ne denir?","a":["Kıyas fâsidü'l-i'tibâr","Kıyas maa'l-fârık","Kıyas-ı hafî","Kıyas-ı celî"],"x":"Kıyas maa'l-fârık ise illet birliğinin sağlanamadığı kıyastır."},{"u":1,"q":"Hanefîlere göre yırtıcı kuşların artıklarının temiz sayılması hangi delille açıklanır?","a":["İstihsan (kıyas-ı hafînin kıyas-ı celîye tercihi)","Maslahat-ı mürsele","Sedd-i zerâi","İstishab"],"x":"Vech-i istihsan: Yırtıcı kuşlar temiz bir kemik olan gagalarıyla içer, tükürükleri artığa karışmaz."},{"u":1,"q":"Selem akdinin istihsanen caiz olması istihsanın hangi çeşidine örnektir?","a":["Küllî hükmün bırakılıp istisnaî hükmün tercihi","Kıyas-ı hafînin kıyas-ı celîye tercihi","Örfe dayalı istihsan","Sedd-i zerâi"],"x":"Küllî hüküm ma'dûmun satışının yasak olmasıdır; selem ihtiyaçtan dolayı istisnaî olarak caizdir."},{"u":1,"q":"Hangisi maslahat-ı mürselenin şartlarından biri değildir?","a":["Bir nassla açıkça itibar edilmiş olması","Hakiki olup vehmî olmaması","Umumi olup şahsi olmaması","Nass veya icmâ ile sabit bir hükme muarız olmaması"],"x":"Maslahat-ı mürsele, itibar veya ilgasına dair bir delil bulunmayan maslahattır."},{"u":1,"q":"Sedd-i zerâide \"çoğu zaman mefsedete götüren mübah\" vasıtalar hangi mezheplere göre yasaklanır?","a":["Mâlikî ve Hanbelîlere göre","Şâfiî ve Hanefîlere göre","Bütün mezheplere göre","Zâhirîlere göre"],"x":"Son iki kısım Mâlikî ve Hanbelîlere göre yasaklanır; Şâfiî, Hanefî ve Zâhirîlere göre yasaklanmaz."},{"u":1,"q":"Üzüm üretiminin yasaklanmaması sedd-i zerâide hangi kısma örnektir?","a":["Nadiren mefsedete götüren mübah vasıta","Çoğu zaman mefsedete götüren mübah vasıta","Haram vasıta","Amacı dışında kullanılan meşru fiil"],"x":"Nadiren de olsa içki üretimine vesile olabilir; bu kısım ittifakla yasaklanmaz."},{"u":1,"q":"Örf ile icmâ arasındaki fark nedir?","a":["Örf halkın, icmâ müçtehidlerin ittifakıdır","Örf kat'î, icmâ zannîdir","Örf yazılı, icmâ sözlüdür","İkisi aynı şeydir"],"x":"Halkın ittifakı örf, müçtehidlerin ittifakı icmâdır."},{"u":1,"q":"\"Veled\" lafzının sadece erkek çocuk için kullanılması hangi örfe örnektir?","a":["Kavlî örf","Amelî örf","Bâtıl örf","Şer'î örf"],"x":"Teâtî satışı amelî örfe, \"veled\" lafzının kullanımı kavlî örfe örnektir."},{"u":1,"q":"Müçtehidin başvurduğu son delil hangisidir?","a":["İstishab","Örf","İstihsan","Sahâbe kavli"],"x":"İstishab, değiştiğine dair delil bulunmadıkça mevcut hâlin devamına hükmetmektir."},{"u":1,"q":"Kur'an'da mutlak olarak zikredilen önceki şeriat hükmü (şer'u men kablenâ) kimlere göre bizim için de şeriattır?","a":["Hanefî, Mâlikî ve Şâfiîlere göre","Yalnızca Hanefîlere göre","Hiçbir mezhebe göre","Yalnızca Zâhirîlere göre"],"x":"Kur'an'da geçmeyen ve neshedilenler şeriat değildir; emredilenler şeriattır; mutlak zikredilenler Hanefî, Mâlikî ve Şâfiîlere göre şeriattır."},{"u":1,"q":"Sahâbenin kendi rey ve içtihadıyla söyleyip ittifak edilmeyen görüşleri için hangisi doğrudur?","a":["Hanefîlere göre hüccettir, Şâfiîlere göre değildir","Şâfiîlere göre hüccettir, Hanefîlere göre değildir","İttifakla hüccettir","İttifakla hüccet değildir"],"x":"Sahâbenin ittifak ettiği ve içtihada kapalı konulardaki sözleri ihtilafsız hüccettir."},{"u":2,"q":"Hüsün ve kubhun akılla bilinemeyip şer'î olduğunu söyleyen kimdir?","a":["Eş'arîler","Mâtürîdîler","Mu'tezile","Hanefîler"],"x":"Mâtürîdî ve Mu'tezileye göre hüsün-kubuh akılla bilinebilir; Eş'arîye göre bilinemez, şer'îdir."},{"u":2,"q":"«وَإِذَا حَلَلْتُمْ فَاصْطَادُوا» ayeti hangi teklifî hükme örnektir?","a":["Tahyîrî hüküm","Talebü'l-fiil","Talebü't-terk","Vaz'î hüküm"],"x":"Bu emir karineyle ibahaya delalet eder; tahyîr ibaha ifade eder."},{"u":2,"q":"«لَا نِكَاحَ إِلَّا بِشَاهِدَيْنِ» hadisi hangi vaz'î hükme örnektir?","a":["Şart","Sebep","Mâni","Ruhsat"],"x":"Vaz'î hüküm örnekleri: sebep (hırsızlıkta el kesme), şart (nikâhta iki şahit), mâni (katilin mirasçı olamaması)."},{"u":2,"q":"Teklifî ile vaz'î hüküm arasındaki farklardan biri hangisidir?","a":["Teklifîde talep vardır, vaz'îde yoktur","Vaz'î hüküm her zaman mükellefin kudreti dahilindedir","Teklifî hüküm bazen kudret dışındadır","Vaz'î hükümde tahyîr vardır"],"x":"Teklifî hüküm hep mükellefin kudreti dahilindedir; vaz'î hüküm bazen dahilinde, bazen değildir (akrabalığın mirasa sebep olması)."},{"u":2,"q":"Vakit içinde kendi cinsinden başka bir ibadetin yapılabildiği vâcibe ne denir?","a":["Muvassa'","Mudayyak","Mutlak","Muhayyer"],"x":"Öğle namazı muvassa', Ramazan orucu mudayyak vâcibe örnektir."},{"u":2,"q":"Yemin keffareti vâcibin hangi kısmına örnektir?","a":["Muhayyer","Muayyen","Muhadded","Kifâî"],"x":"Muhayyer vâcib, şâriin belirli şeylerden birini istediği vâcibtir. Kurban ise muayyendir."},{"u":2,"q":"Cenaze namazı vâcibin hangi kısmına örnektir?","a":["Kifâî","Aynî","Muayyen","Mudayyak"],"x":"Yapılması istenmesi bakımından vâcib kifâî (topluca: cenaze namazı) ve aynî (herkes: beş vakit) olarak ikiye ayrılır."},{"u":2,"q":"Terki ikab değil itab gerektiren mendub hangisidir?","a":["Sünnet-i müekkede (hüdâ)","Sünnet-i zâide","Nâfile","Zâid"],"x":"Cemaatle namaz gibi sünnet-i müekkedenin terki itab gerektirir; gayr-ı müekkedenin terki ikab ve itab gerektirmez."},{"u":2,"q":"Gasbedilmiş elbiseyle kılınan namaz hangi kısma örnektir?","a":["Li-gayrihî muharram","Li-zâtihî muharram","Mekruh","Bâtıl ibadet"],"x":"Li-gayrihî haramlar sonradan meydana gelen bir sebepten dolayı haramdır; işlenmesi haram olsa da ibadet makbul, akid sahihtir."},{"u":2,"q":"Hanefîlere göre teklifî hükümler kaç kısımdır?","a":["7","5","4","6"],"x":"Farz, vâcib, haram, mendub, tenzîhen mekruh, tahrîmen mekruh, mübah. Cumhura göre 5 kısımdır."},{"u":2,"q":"Farz ile vâcib arasındaki farka göre vâcibi inkâr etmenin hükmü nedir?","a":["Bid'at ve sapıklıktır","Küfürdür","Mekruhtur","Hiçbir sonucu yoktur"],"x":"Farzın sübut ve delaleti kat'îdir, inkârı küfürdür. Vâcibin biri kat'î biri zannîdir, inkârı bid'at ve sapıklıktır."},{"u":2,"q":"\"Kişi nisab miktarı mala sahip ama borcu var\" örneği neye örnektir?","a":["Sebebi geçersiz kılan mâniye","Hükme mâniye","Ca'lî şarta","Iskat ruhsatına"],"x":"Borç, zekâtın sebebi olan nisaba sahip olmaya engeldir. Hayız ise hükme (namazın vücubuna) mânidir."},{"u":2,"q":"Şartla ilgili hangisi doğrudur?","a":["Şartın varlığı meşrutun varlığını gerektirmez","Şartın yokluğu hükmün yokluğunu gerektirmez","Şart yalnızca şâri tarafından konabilir","Şart ile sebep aynı şeydir"],"x":"Abdest alınması namazın kılınmasını gerektirmez; ama abdest yoksa namaz da olmaz. Mükellefin koştuğu şarta ca'lî şart denir."},{"u":2,"q":"Hanefîlere göre ölmemek için domuz eti yemek hangi ruhsata örnektir?","a":["Iskat ruhsatı","Terfih ruhsatı","Azîmet","Hâciyyât"],"x":"Iskat ruhsatında azîmetin hükmü kalmaz ve ruhsatla amel vâcib olur; yemeyip ölen günahkâr olur."},{"u":2,"q":"İkrah altında küfür kelimesi söylemek Hanefîlere göre hangi ruhsata örnektir?","a":["Terfih ruhsatı","Iskat ruhsatı","Zaruret ruhsatı değildir","Azîmettir"],"x":"Terfih ruhsatında azîmetin hükmü ve delili kalır; kişi azîmeti seçip şehid de olabilir."},{"u":2,"q":"Hanefîlere göre muamelatta rükünlerinde eksiklik olan akde ne denir?","a":["Bâtıl","Fâsid","Mekruh","Mevkûf"],"x":"Sıhhat şartlarında eksiklik olan fâsid, rükünlerinde eksiklik olan bâtıldır. İbadetlerde Hanefîler cumhurla aynıdır."},{"u":2,"q":"Dârülislâmda yaşayıp \"hükmü bilmiyordum\" demenin mazeret sayılmaması hangi şartla ilgilidir?","a":["Teklifin yetkiliden geldiğinin bilinmesi (bilme imkânı)","Fiilin tam olarak bilinmesi","Fiilin kudret dahilinde olması","Mükellefin akıllı olması"],"x":"Buradaki bilmeden maksat bilme imkânıdır; dârülislâmda bu imkân vardır, dârülharpte bilmemek mazeret olabilir."},{"u":2,"q":"İnsanın bir vasıta olmadan uçması hangi kısma örnektir?","a":["Li-gayrihî müstahil","Li-zâtihî müstahil","Başkasının fiili","Alışılmış meşakkat"],"x":"Aklen mümkün, âdeten imkânsız olan li-gayrihî müstahildir. İki zıddın cem'i ise aklen de imkânsızdır (li-zâtihî)."},{"u":2,"q":"Anne karnındaki ceninin ehliyeti nedir?","a":["Nâkıs vücûb ehliyeti","Tam vücûb ehliyeti","Nâkıs edâ ehliyeti","Tam edâ ehliyeti"],"x":"Cenin hakları elde etmeye elverişli, sorumlulukları üstlenmeye elverişsizdir. Tam vücûb ehliyeti sağ doğumla başlar."},{"u":2,"q":"Nâkıs edâ ehliyetine sahip birinin hibe ve sadaka alması nasıldır?","a":["Geçerlidir","Geçersizdir","Velinin iznine bağlıdır","Mekruhtur"],"x":"Mahza yarar sağlayan tasarruflar geçerli, mahza zarar verenler (teberru) geçersiz, iki ihtimalliler velinin iznine bağlıdır."},{"u":2,"q":"Hanefîlere göre rüşdün üst sınırı kaç yaştır?","a":["25","18","21","15"],"x":"Hanefîlere göre üst sınır \"dedelik yaşı\" denilen 25'tir; bu yaşta rüşde ulaşmasa da malı teslim edilir. Cumhur yaşa değil rüşde bakar."},{"u":2,"q":"Hangisi ehliyeti azaltan arızadır?","a":["Ateh","Delilik","Uyku","Sefeh"],"x":"Delilik, uyku ve baygınlık ehliyeti izale eder; ateh azaltır; sefeh ehliyeti etkilemez ama hacr gibi hükümler doğurur."},{"u":3,"q":"«وَشَاوِرْهُمْ فِي الْأَمْرِ» ayetinden \"istişare edilecek bir topluluk oluşturma gerekliliği\" hangi delaletle anlaşılır?","a":["İşâretü'n-nass","İbâretü'n-nass","Delâletü'n-nass","İktizâü'n-nass"],"x":"İbâretü'n-nass istişarenin gerekliliği; işâretü'n-nass topluluğun gerekliliğidir."},{"u":3,"q":"«فَلَا تَقُلْ لَهُمَا أُفٍّ» ayetinden dövmenin de yasak olduğu hangi delaletle anlaşılır?","a":["Delâletü'n-nass","İşâretü'n-nass","İktizâü'n-nass","Kıyas"],"x":"Dili bilmekle anlaşılan ortak illet (eziyet) sebebiyle hüküm nassta geçmeyen duruma da sabit olur. Kıyastan farkı sadece dil bilgisinin yeterli olmasıdır."},{"u":3,"q":"«حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ» ayetinde \"nikâhları\" kelimesinin takdir edilmesi hangi delalettir?","a":["İktizâü'n-nass","İbâretü'n-nass","İşâretü'n-nass","Delâletü'n-nass"],"x":"İktiza, nassın sahih anlaşılması için takdir edilmesi gereken manadır."},{"u":3,"q":"Hanefîlere göre delaletlerin güç sıralaması hangisidir?","a":["İbare > işaret > delalet > iktiza","İşaret > ibare > iktiza > delalet","Delalet > ibare > işaret > iktiza","İktiza > delalet > işaret > ibare"],"x":"En güçlüsü ibaredir;
