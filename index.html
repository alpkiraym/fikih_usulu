,"x":"Cenin hakları elde etmeye elverişli, sorumlulukları üstlenmeye elverişsizdir. Tam vücûb ehliyeti sağ doğumla başlar."},{"u":2,"q":"Nâkıs edâ ehliyetine sahip birinin hibe ve sadaka alması nasıldır?","a":["Geçerlidir","Geçersizdir","Velinin iznine bağlıdır","Mekruhtur"],"x":"Mahza yarar sağlayan tasarruflar geçerli, mahza zarar verenler (teberru) geçersiz, iki ihtimalliler velinin iznine bağlıdır."},{"u":2,"q":"Hanefîlere göre rüşdün üst sınırı kaç yaştır?","a":["25","18","21","15"],"x":"Hanefîlere göre üst sınır \"dedelik yaşı\" denilen 25'tir; bu yaşta rüşde ulaşmasa da malı teslim edilir. Cumhur yaşa değil rüşde bakar."},{"u":2,"q":"Hangisi ehliyeti azaltan arızadır?","a":["Ateh","Delilik","Uyku","Sefeh"],"x":"Delilik, uyku ve baygınlık ehliyeti izale eder; ateh azaltır; sefeh ehliyeti etkilemez ama hacr gibi hükümler doğurur."},{"u":3,"q":"«وَشَاوِرْهُمْ فِي الْأَمْرِ» ayetinden \"istişare edilecek bir topluluk oluşturma gerekliliği\" hangi delaletle anlaşılır?","a":["İşâretü'n-nass","İbâretü'n-nass","Delâletü'n-nass","İktizâü'n-nass"],"x":"İbâretü'n-nass istişarenin gerekliliği; işâretü'n-nass topluluğun gerekliliğidir."},{"u":3,"q":"«فَلَا تَقُلْ لَهُمَا أُفٍّ» ayetinden dövmenin de yasak olduğu hangi delaletle anlaşılır?","a":["Delâletü'n-nass","İşâretü'n-nass","İktizâü'n-nass","Kıyas"],"x":"Dili bilmekle anlaşılan ortak illet (eziyet) sebebiyle hüküm nassta geçmeyen duruma da sabit olur. Kıyastan farkı sadece dil bilgisinin yeterli olmasıdır."},{"u":3,"q":"«حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ» ayetinde \"nikâhları\" kelimesinin takdir edilmesi hangi delalettir?","a":["İktizâü'n-nass","İbâretü'n-nass","İşâretü'n-nass","Delâletü'n-nass"],"x":"İktiza, nassın sahih anlaşılması için takdir edilmesi gereken manadır."},{"u":3,"q":"Hanefîlere göre delaletlerin güç sıralaması hangisidir?","a":["İbare > işaret > delalet > iktiza","İşaret > ibare > iktiza > delalet","Delalet > ibare > işaret > iktiza","İktiza > delalet > işaret > ibare"],"x":"En güçlüsü ibaredir; k olan lafız hangisidir?","a":["Müfesser","Muhkem","Nass","Zâhir"],"x":"Müfesser tevile kapalı, neshe açıktır; muhkem ise neshe de kapalıdır."},{"u":3,"q":"Hz. Peygamber'in vefatından sonra müfesser lafız neye döner?","a":["Muhkeme","Zâhire","Müşkile","Mücmele"],"x":"Vefattan sonra nesih olmadığı için müfesser muhkeme döner."},{"u":3,"q":"Tefsir ile tevil arasındaki fark hangisidir?","a":["Tefsir şâriden ve kat'î; tevil şârihten ve zannîdir","Tefsir zannî, tevil kat'îdir","İkisi de şâri tarafından yapılır","Tevil yalnızca muhkem lafızlarda olur"],"x":"Tevil, lafzı bir delille zâhirinden çevirmektir."},{"u":3,"q":"Hanefîlere göre açık lafızlar arasında kuvvet sıralaması nasıldır?","a":["Muhkem > müfesser > nass > zâhir","Zâhir > nass > müfesser > muhkem","Nass > zâhir > muhkem > müfesser","Müfesser > muhkem > zâhir > nass"],"x":"Kuvvet sıralaması tanım sırasının tersidir; tearuzda bu sıra takip edilir."},{"u":3,"q":"Tarrâr (yankesici) ve nebbâş meselesi hangi kapalı lafza örnektir?","a":["Hafî","Müşkil","Mücmel","Müteşâbih"],"x":"«سَارِق» lafzının manası açık, hangi fertleri kapsadığı kapalıdır."},{"u":3,"q":"İmam Şâfiî ve Ebû Yûsuf'a göre nebbâş (kefen soyucu) nasıl değerlendirilir?","a":["Hırsız sayılır","Hırsız sayılmaz, ta'zir edilir","Hiçbir ceza verilmez","Yankesici gibi değerlendirilmez"],"x":"Diğer Hanefî ulemâsına göre hırsız sayılmaz, ta'zir cezası verilir."},{"u":3,"q":"Hafî ile müşkil arasındaki fark nedir?","a":["Hafîde kapalılık fertleri kapsamada, müşkilde bizzat sîgadadır","Hafîde kapalılık sîgada, müşkilde fertlerdedir","Hafî ancak şâriin beyanıyla açılır","Müşkil hiçbir şekilde açılamaz"],"x":"Müşkil müşterek lafızlarda bulunur ve içtihadla belirlenir."},{"u":3,"q":"Şâfiîlere göre «قُرُوء» kelimesi neyi ifade eder ve delili nedir?","a":["Temizlik; «ثَلَاثَة» adedinin müzekker gelmesi","Hayız; iddetin hikmeti","Hayız; «وَاللَّائِي يَئِسْنَ» ayeti","Temizlik; cariye hadisi"],"x":"Hanefîlere göre ise hayızdır: iddetin hikmeti, âyise ayeti ve \"cariyeni :3,"q":"Hüküm ve sebebin aynı olduğu mutlak–mukayyed durumunda ne olur?","a":["Mutlak mukayyede ittifakla hamledilir","İttifakla hamledilmez","Hanefîlere göre hamledilmez, cumhura göre hamledilir","İki nass da terk edilir"],"x":"Örnek: «الدَّم» mutlak, «دَمًا مَسْفُوحًا» mukayyed; hüküm haramlık, sebep zarardır."},{"u":3,"q":"Zıhar keffaretindeki «رَقَبَة» ile katl keffaretindeki «رَقَبَةٍ مُؤْمِنَةٍ» hangi duruma örnektir?","a":["Hüküm aynı, sebep farklı","Hüküm ve sebep aynı","Sebep aynı, hüküm farklı","Hüküm ve sebep farklı"],"x":"Bu durumda Hanefîlere göre hamledilmez, cumhura göre hamledilir."},{"u":3,"q":"Çoğunluğa göre karinesiz gelen emir neye delalet eder?","a":["Vücuba","İbahaya","Nedbe","İrşada"],"x":"Karine varsa ibaha («وَكُلُوا وَاشْرَبُوا»), nedb (mükâtebe), irşad (deyn ayeti), te'dib (\"sağ elinle ye\") ifade eder."},{"u":3,"q":"«رَبَّنَا لَا تُزِغْ قُلُوبَنَا» nehyi neye delalet eder?","a":["Duaya","Tahrîme","Kerahete","İrşada"],"x":"Çoğunluğa göre karinesiz nehiy tahrîme delalet eder; karine varsa kerahet, irşad veya dua ifade eder."},{"u":3,"q":"Emrin tekrara delaletiyle ilgili tercih edilen görüş hangisidir?","a":["Kendi sîgasıyla tekrara delalet etmez; illet veya sebep olan şarta bağlıysa tekrarlanır","Her emir kendi sîgasıyla tekrara delalet eder","Emir hiçbir şekilde tekrara delalet etmez","Emir yalnızca ibadetlerde tekrara delalet eder"],"x":"Abdest emrinin sebebi namazdır; namaz tekrarlandıkça abdest de tekrarlanır."},{"u":3,"q":"Hangisi ihtilafsız fevr ve tekrara delalet eder?","a":["Nehiy","Emir","Muvassa' vâcib","Mutlak vâcib"],"x":"Şâri bir şeyi nehyetmişse mükellef onu derhâl ve hayatı boyunca terk etmelidir."},{"u":4,"q":"Teşriin makâsıdı arasındaki tertip hangisidir?","a":["Zarûriyyât > hâciyyât > tahsîniyyât","Hâciyyât > zarûriyyât > tahsîniyyât","Tahsîniyyât > hâciyyât > zarûriyyât","Zarûriyyât > tahsîniyyât > hâciyyât"],"x":"Bu taksimin delili his ve müşahededir."},{"u":4,"q":"Aklın korunması için konan hüküm hangisidir?","a":["İçk  sahâbe döneminde olur","İcmâ kıyasa dayanır"],"x":"Kıyas da Kitap, Sünnet ve icmâyı neshedemez; çünkü onlara aykırı olmaması şartı vardır."},{"u":5,"q":"Tearuza örnek gösterilen iki hadis hangi konuda çelişir?","a":["Ribe'l-fazl","Hamile kadının iddeti","Kabir ziyareti","Vasiyet"],"x":"«إِنَّمَا الرِّبَا فِي النَّسِيئَةِ» ile «لَا تَبِيعُوا الْبُرَّ بِالْبُرِّ إِلَّا سَوَاءً بِسَوَاءٍ» ribe'l-fazl konusunda tearuz etmiştir."},{"u":5,"q":"Hangileri arasında hakiki tearuz yoktur?","a":["İki ayet, iki sahih hadis veya ayet ile sahih hadis","Yalnızca iki ayet","Yalnızca iki sahih hadis","Hiçbiri; hepsinde hakiki tearuz olabilir"],"x":"Tearuz örneği ise ribe'l-fazl hadisleridir."},{"u":5,"q":"Hanefîlere göre tearuzda ilk başvurulan yol hangisidir?","a":["Nesh","Cem ve telif","Tercih","Tevakkuf"],"x":"Hanefî sırası: nesh, tercih, cem ve telif, terk."},{"u":5,"q":"Cumhura göre tearuzda yolların sırası hangisidir?","a":["Cem ve telif, tercih, nesh, tevakkuf","Nesh, tercih, cem ve telif, terk","Cem ve telif, nesh, tercih, tevakkuf","Tercih, nesh, cem ve telif, tevakkuf"],"x":"Muhaddislere göre: cem ve telif, nesh, tercih, tevakkuf."},{"u":5,"q":"Muhaddislerin tercih metodunda ikinci sırada ne vardır?","a":["Nesh","Tercih","Tevakkuf","Terk"],"x":"Muhaddisler cem ve telif'ten sonra neshe, sonra tercihe başvurur."},{"u":5,"q":"Hanefîlere göre kocası vefat eden hamile kadının iddeti nedir?","a":["Her hâlükârda doğumdur","Her hâlükârda 4 ay 10 gündür","Doğum ile 4 ay 10 günün uzun olanıdır","1 yıldır"],"x":"Hanefîlere göre «وَأُولَاتُ الْأَحْمَالِ» ayeti vefat iddeti ayetini neshetmiştir."},{"u":5,"q":"Hamile dulun iddeti meselesinde cumhur hangi yolu izler?","a":["Cem ve telif","Nesh","Tercih","Tevakkuf"],"x":"Cumhura göre doğum 4 ay 10 günden önceyse süre tamamlanır, sonraysa süre zaten dolmuştur."}];
const SINAV = [{"t":"2022 · 1. dönem","q":[{"q":"Fıkıh Usulü, İstishab, Sedd-i Zerâi, Tenkîhu'l-Menât, Nüfâtu'l-Kıyas, Sebr-Taksim, Mazinne, İllet, Delil, Vechu'l-İstihsan kavramlarını açıklayınız.","r":[[0,1],[1,20],[1,18],[1,15],[1,11],[1,13],[1,0],[1,16]],"x":["**Usûl-i fıkıh:** Şer'î amelî hükümleri tafsîlî delillerinden çıkarmaya (istinbat) vasıta olan kaideleri bilmektir.","**İstishab:** «إِبْقَاءُ مَا كَانَ عَلَى مَا كَانَ»; değiştiğine dair bir delil bulunmadıkça mevcut hâlin devamına hükmedilmesidir. Müçtehidin başvurduğu son delildir.","**Sedd-i zerâi:** Mefsedete götüren vasıtaların yasaklanmasıdır.","**Tenkîhu'l-menât:** Nassta geçen vasıflardan illet olmaya elverişli olanı tespit etmektir. Sebr ve taksimden farkı vasıfların nassta geçmesidir.","**Nüfâtu'l-kıyas (kıyası kabul etmeyenler):** Nazzâm, Zâhirîler ve bazı Şiî âlimler.","**Sebr ve taksim:** Sebr deneme-sınama, taksim ayırma-bölmedir. Bir konuda muhtemel seçenekleri belirleyip (hasr) birer birer eleyerek (hazf) tek bir seçenek bırakmaktır.","**Mazinne:** Mazinne (مَظِنَّة) illete, mi'inne (مَئِنَّة) hikmete karşılık gelir.","**İllet:** Hükmün üzerine kurulduğu, varlığı onun varlığına, yokluğu da onun yokluğuna bağlanan niteliktir. Diğer adları: menât, emâre, sebep.","**Delil:** Sözlükte hissî olsun manevî olsun, hayır olsun şer olsun herhangi bir şeye götürendir. Istılahta kendisinden kat'î veya zannî yolla şer'î amelî bir hüküm elde edilendir.","**Vech-i istihsan:** İstihsanın gerekçesidir. Örneğin Hanefîlere göre yırtıcı kuşların artıkları temizdir; çünkü etleri haram olsa da temiz bir kemik olan gagalarıyla içtikleri için tükürükleri artıklarına karışmaz."],"n":"**Mazinne** kavramı kaynakta yalnızca kısa bir notla (mazinne → illet, mi'inne → hikmet) geçiyor; ayrıca tanımlanmıyor."},{"q":"Fıkıh usulünün ana ekollerinin özelliklerini yazarak bu ekollere ait 5'er tane eseri müellifleriyle birlikte yazınız ve fukahâ metodunun amaçlarını \"Fukahâ Metodunun Genel Yapısı Üzerine\" adlı makale bağlamında açıklayınız.","r":[[0,5],[0,6]],"x":["**Fukahâ metodu:** En çok Hanefîlerle özdeşleştirilir; Hanefî mezhebine sıkı biçimde bağlıdır; akla önem vermez (nakil); istikrâ (tümevarım) yöntemini kullanır; kelâmî konular azdır; misaller boldur.","**Mütekellimîn metodu:** Herhangi bir mezhebe bağlı değildir; akla önem verir; kıyas (tümdengelim) yöntemini kullanır; kelâmî konuları işler; misaller azdır.","**Memzuc metot:** Bu iki metodu birleştirerek yazılan eserlerin yoludur.","**Fukahâ eserleri:** el-Fusûl fi'l-usûl (Cessâs), Takvîmü'l-edille (Debûsî), Kenzü'l-vüsûl ilâ ma'rifeti'l-usûl (Pezdevî), el-Usûl (Serahsî).","**Mütekellimîn eserleri:** el-Umed (Kâdî Abdülcebbâr), el-Mu'temed (Ebü'l-Hüseyin el-Basrî), el-Burhân (Cüveynî), el-Mustasfâ (Gazzâlî).","**Memzuc eserler:** Bedîu'n-nizâm (Muzafferüddin Ahmed b. Ali es-Saâtî), et-Tavzîh şerhu't-Tenkîh (Sadrüşşerîa), Cem'u'l-cevâmi' (İbnü's-Sübkî), et-Tahrîr (Kemâl İbnü'l-Hümâm)."],"n":"Kaynakta her ekol için **4 eser** var; beşinci eser ve \"Fukahâ Metodunun Genel Yapısı Üzerine\" makalesi kaynakta yok."},{"q":"İlleti belirleme yollarını açıklayarak sebr ve taksim ile tenkîhu'l-menât arasındaki farkı yazınız.","r":[[1,15]],"x":["**1. Nass:** A) Sarih: talil edatı bulunan nass. Kat'î olanlar sadece talil manasına gelir («مِنْ أَجْلِ، لِأَجْلِ، لِأَنَّ، كَيْ…»); zannî olanlar başka manaya da gelebilir («لِ، بِ، فَ، إِنَّ»). B) Îmâ ve işaret: talil edatı bulunmayan nass. Örnek: «لَا يَرِثُ الْقَاتِلُ»; hükmün türemiş kelimeye bağlanması kökün («الْقَتْل») illet olduğunu hissettirir.","**2. İcmâ.**","**3. Sebr ve taksim:** Muhtemel seçenekleri belirleyip (hasr) birer birer eleyerek (hazf) tek seçeneği bırakmak. Örnek: hamr ve kokainde akıcılık, renk, koku, tat elenir; sarhoş edicilik kalır.","**Fark:** Tenkîhu'l-menâtta illet olmaya elverişli vasıflar **nassta geçer**; sebr ve taksimde seçenekleri müçtehid kendisi belirler."],"n":""},{"q":"Sahâbî kavli ile amel konusundaki görüşleri yazınız.","r":[[1,22]],"x":["A) Sahâbe bir konuda ittifak etmişse hüccettir; bu konuda ihtilaf yoktur.","B) İçtihada kapalı konularda da hüccettir; ihtilaf yoktur.","C) Sahâbenin kendi rey ve içtihadıyla söylediği, ittifak edilmeyen konularda: Hanefîlere göre hüccettir, Şâfiîlere göre değildir."],"n":""},{"q":"Sünnetin Kur'an'a nispetini açıklayınız.","r":[[1,4]],"x":["Delil olarak Kur'an'a göre 2. sırada gelir. Getirdiği hükümler yönünden:","1) **Te'kid:** \"Namaz kılın\" gibi; hüküm ikisinde de vardır.","2) **Mücmeli tebyin, mutlakı takyid, âmmı tahsis:** Namazın nasıl kılınacağı gibi.","3) **Kur'an'da bulunmayan bir hükmü isbat:** (Erkeklere) altın ve gümüşün haram oluşu gibi.","4) **Hanefîlere göre nâsih olması.**"],"n":""},{"q":"Günümüzde size göre icmâ ile amel edilebilir mi?","r":[[1,8],[1,9],[1,10]],"x":["Bu bir görüş sorusudur; cevabınızı aşağıdaki görüşlere dayandırabilirsiniz.","**Mümkün değil diyenler** (Nazzâm ve bazı Şiîler): İçtihad seviyesini ölçmenin bir ölçüsü yoktur; farklı bölge ve kıtalardaki müçtehidlerin kesin görüşlerine ulaşılamaz; ulaşılsa da görüş değiştirmediklerinden emin olunamaz; icmânın dayandığı delil kat'îyse gizli kalmaz, zannîyse onunla icmâ olmaz.","**Mümkün diyenler** (cumhur): İcmâ bilfiil vuku bulmuştur (Hz. Ebû Bekir'in hilafeti, domuz iç yağının haramlığı, ninenin 1/6 mirası).","**Hallâf:** İcmâ ancak devlet eliyle mümkün olabilir.","Ayrıca şartlar ağırdır: Bütün müçtehidlerin ittifakı gerekir; biri bile muhalefet ederse icmâ olmaz. Sarih icmâ kat'î, sükûtî icmâ zannîdir."],"n":""}]},{"t":"Soru–cevap çalışması: İcmâ, kıyas ve illet","q":[{"q":"Üçüncü delil olan icmâın tarifini yapınız.","r":[[1,8]],"x":["«الْإِجْمَاعُ هُوَ اتِّفَاقُ جَمِيعِ الْمُجْتَهِدِينَ مِنَ الْمُسْلِمِينَ فِي عَصْرٍ مِنَ الْعُصُورِ بَعْدَ وَفَاةِ الرَّسُولِ ﷺ عَلَى حُكْمٍ شَرْعِيٍّ فِي وَاقِعَةٍ»","İcmâ, Hz. Muhammed'in vefatından sonraki bir asırda bütün Müslüman müçtehidlerin gerçekleşmiş bir olay hakkında şer'î bir hüküm üzerinde ittifak etmeleridir."],"n":""},{"q":"İcmâın rükünleri nelerdir? Açıklayınız.","r":[[1,8]],"x":["İcmâın dört rüknü vardır:","1) Olayın vuku bulduğu asırda birkaç müçtehidin bulunması gerekir. (Tek bir müçtehidin bulunduğu bir zamanda icmâ olmaz.)","2) Olayın vuku bulduğu anda memleketleri, ırkları, taifeleri nazar-ı itibara alınmaksızın bütün Müslüman müçtehidlerin birleşmeleri gerekir. (Mesela bir meselede sadece Medine müçtehidleri birleşse icmâ gerçekleşmez.)","3) Her bir müçtehid fikrini açıkça ortaya koymuş olmalıdır. (Fetva vererek, sözlü beyan ederek ya da kitabında yazarak.)","4) Bütün müçtehidlerin o hükümde birleşmeleri gerekir. (Büyük çoğunluğu birleşip çok azı muhalefet etse bile icmâ gerçekleşmez.)"],"n":""},{"q":"İcmâın delil oluşunu açıklayınız.","r":[[1,8]],"x":["1) Allah Teâlâ Kur'an'da müminlere kendisine ve elçisine itaati emrettiği gibi ulu'l-emre itaati de emretmiştir: «يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ فَإِنْ تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ إِنْ كُنْتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ذَلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا» (Nisâ 4/59). Emir lafzı \"iş\" manasında olup hem din hem dünya işine şâmildir. Dünya işlerinin sahipleri kumandanlar ve valiler, din işlerinin sahipleri ise müçtehidler ve müftülerdir. İbn Abbas'ın başında bulunduğu müfessirler bu lafzı âlimler olarak anlamışlardır.","2) Bütün müçtehidlerin fikirlerinin birleştiği bir hüküm, müçtehidleri tarafından temsil edilen İslam ümmetinin hükmüdür. Birçok hadis ümmetin hatadan masum olduğunu gösterir: \"Allah ümmetimi sapıklık üzerinde birleştirmez.\"","3) Şer'î bir hüküm üzerine icmâ etmek için icmâın mutlaka şer'î bir dayanak üzerine bina edilmesi şarttır. Olay hakkında nass varsa müçtehidin içtihadı nassı anlamaktır; nass yoksa içtihad, onun hükmünü nassı olan hükme kıyaslamak ya da diğer usul kurallarıyla bir hükme varmaktır."],"n":""},{"q":"İcmâın gerçekleşme imkânını açıklayınız.","r":[[1,9]],"x":["Usulcülere göre şu şartlar bir arada bulunmadıkça icmâ gerçekleşmez:","1) Fikir birliği edenler müçtehid olmalıdır.","2) Bütün müçtehidler fikir birliği etmiş olmalıdır.","3) Müçtehidler Hz. Muhammed'in ümmetinden olmalıdır.","4) İcmâ Hz. Peygamber'in vefatından sonra meydana gelmelidir.","5) İttifak edilen hüküm vücub, sıhhat, hürmet ve fesad gibi bir meselenin şer'î hükmüne dair olmalıdır."],"n":""},{"q":"İcmâın fiilen gerçekleşmesini açıklayınız.","r":[[1,9]],"x":["Cumhur icmâın mümkün olduğunu ve fiilen meydana geldiğini kabul etmiş; sahâbe döneminde ve sonraki dönemlerde meydana gelen icmâları delil göstermiştir. Ninenin mirastan altıda bir pay alması, gıda maddesini satın alanın teslim almadan satmasının caiz olmaması bu örneklerdendir.","Nazzâm gibi bazı Mu'tezilîler, Hâricîler ve Şîa böyle bir icmâyı kabul etmemiştir. Onlara göre icmâya katılacak müçtehidlerin kimler olduğu ve her birinin görüşünün ne olduğu bilinmelidir; bu ise imkânsızdır.","Usul âlimlerinin çoğunluğunun şartlarına uygun bir icmâın her devirde oluştuğunu düşünmek zordur. Bu şartları taşıyan icmâın sahâbenin ilk döneminde, yani Hz. Ebû Bekir ve Hz. Ömer döneminde gerçekleştiği genel kabul görmüştür. İcmâya karşı olduğu nakledilen Ahmed b. Hanbel'in bile bu dönemdeki icmâya karşı çıkmadığı belirtilir; çünkü katılacak sahâbe fakihlerinin sayısı belliydi ve bir araya gelmeleri kolaydı.","Klasik usulcülerin icmâyı zor şartlara bağlaması şöyle de yorumlanabilir: İcmâ gerçekleşince kesinlik ifade eder ve dışına çıkılamaz. Bu, özellikle fıkhın oluşum döneminde içtihad hürriyetini olumsuz etkileyebilirdi; içtihada daha fazla alan bırakmak için şartlar sıkı tutulmuştur.","Hallâf'a göre icmâ, oluşma şartları göz önüne alınırsa mümkün değildir; fakat devlet yoluyla yapılabilir. Sahâbenin icmâı da bu manada değil, şûrâ meclisi kararıdır."],"n":""},{"q":"İcmâın çeşitlerini açıklayınız.","r":[[1,10]],"x":["**Meydana gelişine göre:**","1) **Sarih icmâ:** Bir asrın bütün müçtehidlerinin, bir olayın hükmü üzerinde her birinin fikrini fetva veya hüküm şeklinde açıklayarak birleşmeleridir. Gerçek icmâ budur; çoğunluğa göre şer'î bir hüccettir.","2) **Sükûtî icmâ:** Bir asrın bazı müçtehidlerinin fikirlerini açıkça ortaya koyup geri kalanların muvafık veya muhalif fikirlerini açıklamayıp susmalarıdır. İtibarî (hükmî) icmâdır; çünkü susanın muvafakati kesin değildir. Cumhur delil olarak kabul etmezken Hanefîler kabul eder. Hanefîler, susan müçtehide olayın bildirilmesini ve araştırıp fikrini açıklayabileceği kadar süre verilmesini şart koşar; buna rağmen susarsa bu muvafakat sayılır. Bir görüşe göre ise (çoğunluğa katılarak) sükût edenin fikri yok sayılır.","**Hallâf'a göre hükme delaletine göre:**","a) **Delaleti kat'î icmâ:** Delalet ettiği hüküm kesindir; o olayda artık içtihad yapılamaz.","b) **Delaleti zannî icmâ:** Hükmü ağır basan bir zanna dayanır; olay hakkında içtihada imkân vardır. Çünkü bu hüküm cumhurun değil bir grup müçtehidin fikrinden ibarettir."],"n":""},{"q":"Kıyasın ıstılahî tarifini yapınız.","r":[[1,11]],"x":["Istılahta kıyas: Aralarındaki illet birliği dolayısıyla hakkında nass bulunmayan bir meselenin şer'î hükmünü, hakkında nass bulunan bir meselenin hükmüne ilhak etmek, bağlamaktır."],"n":""},{"q":"Kıyasın delil oluşunu anlatınız.","r":[[1,11]],"x":["Cumhurun mezhebi, kıyasın amelî hükümlerde delil olmasıdır. Kıyas şer'î deliller dizisinde dördüncü sıradadır. Nazzâmiyye, Zâhiriyye ve bazı Şiî gruplar kıyası delil olarak kabul etmez. Kabul edenler şu delilleri getirir:","1) **Kur'an:** «فَإِنْ تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ» (Nisâ 4/59); «فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ» (Haşr 59/2); «قَالَ مَنْ يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ قُلْ يُحْيِيهَا الَّذِي أَنْشَأَهَا أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ» (Yâsîn 36/78-79).","2) **Sünnet:** Yemen'e giden Muâz b. Cebel'in Hz. Peygamber ile diyaloğu. Ayrıca hakkında vahiy gelmeyen olaylarda Hz. Peygamber'in hüküm verdiği sabittir; açık nassın bulunmadığı durumlarda kıyas yapmak da onun sünnetidir. Hz. Ömer'in oruçlunun eşini (inzal olmaksızın) öpmesini sorması ve Hz. Peygamber'in bunu oruçluyken ağzı çalkalamaya kıyas etmesi güzel bir örnektir.","3) **Sahâbe:** Sahâbe Hz. Ebû Bekir'in halifeliğini namaz imamlığına kıyaslayarak biat etti. Hz. Peygamber hayattayken içtihad eden sahabesini azarlamadı; sahâbe de içtihad ve kıyas ettikleri için birbirini kınamadı.","4) **Akıl:** a) Allah maslahatsız bir esas koymamıştır; şarabın haram, aynı sarhoş edicilik özelliğini taşıyan başka bir içkinin mübah olması akılla bağdaşmaz. b) Kur'an ve Sünnet sınırlı, olaylar sınırsızdır; kıyas yeni olayların hükmünü açıklar. c) Kıyas, insanın selim tabiatının ve doğru mantığın teyit ettiği bir delildir."],"n":""},{"q":"Kıyasın rükünleri nelerdir? Açıklayınız.","r":[[1,12]],"x":["1) **Asıl:** Hükmü hakkında nass olan rükündür. Makîs aleyh, mahmûl aleyh ve müşebbeh bih diye de isimlendirilir.","2) **Fer':** Hükmü hakkında ne nass ne de icmâ olan rükündür. Makîs, mahmûl ve müşebbeh isimleri de verilir.","3) **Aslın hükmü:** Hakkında nass bulunan şer'î hükümdür; fer'î hükmün kendisine kıyas edildiği aslî hükümdür. Aslî hükmün fer'e geçmesi için şartlar: a) nass ile sabit şer'î amelî bir hüküm olması, b) illetini aklın bilebilmesi, c) sadece asla has olmaması.","4) **İllet:** Hükmün kendisi üzerine bina edildiği ve asıldaki hükmün fer'e geçtiğinin kendisiyle bilindiği vasıftır. Rükünlerin en önemlisidir; çünkü illet kıyasın temel meselesidir."],"n":""},{"q":"Kıyasın rükünlerinden olan illetin tarifi ve şartları nelerdir? Açıklayınız.","r":[[1,13]],"x":["«الْعِلَّةُ هِيَ الْوَصْفُ الَّذِي بُنِيَ عَلَيْهِ حُكْمُ الْأَصْلِ»: Aslın hükmünün üzerine bina edildiği vasıftır.","İlletin «ظَاهِر، مُنْضَبِط، مُنَاسِب، غَيْر قَاصِر» olması gerekir:","1) **Zâhir (açık) olmalı:** Asıldaki vasıf akıl ve duyularla kavranabilir olmalıdır.","2) **Munzabıt (istikrarlı) olmalı:** Kişilere, durumlara ve çevrelere göre değişmemeli; ifade ettiği anlam sınırlı olmalıdır.","3) **Hükme münâsib (uygun) olmalı:** Hükmün hikmetinin tahakkukunu sağlayacak bir vasıf olmalıdır.","4) **Müteaddî (sirayetli) olmalı:** Kâsır, yani asla mahsus olmamalı; başka mesele ve maddelere de geçebilmelidir."],"n":""},{"q":"Kıyası kabul edenlerin delilleri nelerdir? Açıklayınız.","r":[[1,11]],"x":["1) **Kur'an:** «يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ فَإِنْ تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ…» (Nisâ 4/59).","2) **Sünnet:** Muâz b. Cebel hadisi. Sahih hadislerde geçen kıyaslar: Cariyenin babası adına haccı meselesinde Allah'a borç kul borcuna kıyas edilir; Hz. Ömer'in oruçluyken eşini öpmesi mazmazaya kıyas edilir; renk farkından dolayı çocuğunu reddeden adama deveden kıyas yapılır.","3) **Sahâbenin bazı fiilleri:** Hz. Ebû Bekir'in hilafetinin imamlığa kıyası (dünyayı dine kıyaslamak); Hz. Ömer'in Ebû Mûsâ el-Eş'arî'ye \"kıyas et\" demesi.","4) **Aklî deliller:** Maslahatın olduğu yerde aynı hüküm verilir; Kur'an ve hadisler sınırlı, hadiseler sınırsızdır; kıyas selim bir fıtratın gereğidir."],"n":""},{"q":"Kıyası kabul etmeyenlerin delillerini açıklayınız.","r":[[1,11]],"x":["1) **\"Kıyas zan üzerine kuruludur.\"** Allah zanla amel etmeyi kınamıştır: «وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ» (İsrâ 17/36). **Cevap:** Allah'ın kınadığı zan akidede olandır. Amelî delillerin çoğunun delaleti zannîdir; bu görüşe göre delaleti zannî olan nasslarla da amel edilmemesi gerekir. Bu ise ittifakla bâtıldır.","2) **\"Kıyas bakış açılarının farklılığına dayanır; bu da hükümlerin farklı ve zıt olmasına yol açar, şeriatta ise zıtlık olmamalıdır.\"** **Cevap:** Kıyasla ilgili ihtilaf itikad ve dinin temellerinde değil, amelî cüz'î hükümlerdedir. Bu da insanlara rahmettir ve maslahata yardımcı olur.","3) **\"Kıyas reyle yapılır; Hz. Ömer gibi bazı sahabeler reyle hüküm verenleri kınamıştır.\"** **Cevap:** Bu kınamalarda kastedilen hevâ ve hevesle yapılan reydir, kıyas değildir."],"n":""},{"q":"İlletin kısımları nelerdir? Açıklayınız.","r":[[1,14]],"x":["a) **Müessir uygun (münâsib) nitelik:** Nass veya icmâ ile bizzat hükme illet olduğu sabit olan vasıf (hayız ayetinde «أَذًى»).","b) **Elverişli (mülâim) nitelik:** Bizzat o hükme değil, cinsinin cinsine itibar edilen vasıf (yağmurda namazların cem'i).","c) **Mutlak (mürsel) uygun nitelik:** Şâriin itibar veya ilga ettiğine dair bir delil bulunmayan vasıf; maslahat-ı mürsele.","d) **Mülgâ uygun nitelik:** Şâriin ilga ettiğine dair delil bulunan vasıf (erkek ve kızın karabette eşit, mirasta farklı olması)."],"n":""},{"q":"İlleti bulma yollarını açıklayınız.","r":[[1,15]],"x":["1) **Nass:** A) Sarih (talil edatı bulunan): kat'î edatlar sadece talil bildirir («مِنْ أَجْلِ، لِأَجْلِ، لِأَنَّ، كَيْ، لِعِلَّةِ كَذَا، لِسَبَبِ كَذَا»); zannî edatlar başka manaya da gelebilir («لِ، بِ، فَ، إِنَّ»). B) Îmâ ve işaret (talil edatı bulunmayan): «لَا يَرِثُ الْقَاتِلُ»; illet, «الْقَاتِل»in türediği «الْقَتْل»dir.","2) **İcmâ.**","3) **Sebr ve taksim:** Muhtemel seçenekler belirlenir (hasr), birer birer elenir (hazf), kalan seçenek illettir.","Menât kavramları: **Tahrîcü'l-menât** illeti bu yollarla tespit etmek; **tenkîhu'l-menât** nassta geçen vasıflardan illete elverişli olanı tespit etmek; **tahkîku'l-menât** asıldaki illetin fer'de bulunduğundan emin olmaktır."],"n":""}]}];
const ESER_T = [{"u":0,"s":6,"e":"el-Fusûl fi'l-usûl","m":"Cessâs","not":""},{"u":0,"s":6,"e":"Takvîmü'l-edille","m":"Debûsî","not":""},{"u":0,"s":6,"e":"Kenzü'l-vüsûl ilâ ma'rifeti'l-usûl","m":"Pezdevî","not":""},{"u":0,"s":6,"e":"el-Usûl","m":"Serahsî","not":""},{"u":0,"s":6,"e":"el-Umed","m":"Kâdî Abdülcebbâr","not":""},{"u":0,"s":6,"e":"el-Mu'temed","m":"Ebü'l-Hüseyin el-Basrî","not":""},{"u":0,"s":6,"e":"el-Burhân","m":"Cüveynî","not":""},{"u":0,"s":6,"e":"el-Mustasfâ","m":"Gazzâlî","not":""},{"u":0,"s":6,"e":"Bedîu'n-nizâm","m":"Muzafferüddin Ahmed b. Ali (Saâtî)","not":""},{"u":0,"s":6,"e":"et-Tavzîh şerhu't-Tenkîh","m":"Sadrüşşerîa","not":""},{"u":0,"s":6,"e":"Cem'u'l-cevâmi'","m":"İbnü's-Sübkî","not":""},{"u":0,"s":6,"e":"et-Tahrîr","m":"Kemâl İbnü'l-Hümâm","not":""}];
</script>
<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`);
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: fu_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('fu_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fu_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0
let uStat = store.get('units', {});   // ünite -> en iyi mini test (0-5)
function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); ozet(true); }
/* ---------- Giray Akademi özeti (alt çubuk · Karnem) ---------- */
const YAD = {home: 'Ana sayfa', study: 'Üniteler', quiz: 'Test', match: 'Eşleştirme', flash: 'Kavram kartları', oralView: 'Konu tekrarı', review: 'Hızlı tekrar', exam: 'Geçmiş sınav soruları', browse: 'Sözlük', progress: 'İlerlemem'};
function yer() {
  const v = curView, a = curArg;
  if (v === 'unitView') return {ad: (a + 1) + '. ünite', url: '/fikih_usulu/#unitView-' + a};
  if (v === 'quiz' && a && a.unit !== undefined && a.unit !== null) return {ad: (a.unit + 1) + '. ünite testi', url: '/fikih_usulu/#unitView-' + a.unit};
  if (v === 'quiz' || v === 'home') return {ad: YAD[v], url: '/fikih_usulu/'};
  return {ad: YAD[v] || 'Ana sayfa', url: '/fikih_usulu/#' + v};
}
function ozet(aktif) {
  if (typeof gaOzet !== 'function') return;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const n = UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
  gaOzet({bitti: n / UNITELER.length, etiket: n + '/' + UNITELER.length + ' ünite', d: tot.ok, y: tot.bad, kart: Object.values(boxes).filter(b => b >= 4).length, yer: yer(), aktif: !!aktif});
}
function alt(b) { if (typeof gaAltGizle === 'function') gaAltGizle(b); }

/* ---------- veri hazırlığı ---------- */
const TANIM = [], BOLUM = [];
UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
  BOLUM.push({u: ui, s: si, h: s.h});
  s.b.forEach(b => {
    if (b.k === 'd') TANIM.push({id: TANIM.length, u: ui, s: si, t: b.t, x: b.x});
    // İki sütunlu "… | Tanım/Anlamı" tabloları da kavram kartı olur
    if (b.k === 'tbl' && b.r[0].length === 2 && /^(Tanım|Anlamı)$/.test(b.r[0][1])) b.r.slice(1).forEach(r => TANIM.push({id: TANIM.length, u: ui, s: si, t: r[0].replace(/\*\*/g, '').replace(/^\d+\.\s*/, ''), x: r[1]}));
  });
}));
const ESER = ESER_T;
// Aynı adla birden çok müellife bağlanan eserler (el-Burhân, Mebâhis, Tefsir Usûlü…) ve bir müellifin birden çok eseri tek sorudan fazla üretilmez
const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/[,;]/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);
ESER_Q.forEach((r, i) => r.id = i);
const GECME = 4;
const uDone = () => UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;

/* ---------- soru üretici ---------- */
// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(kur'an|kuran|ayet|âyet)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return out;
};
function pickDistinct(cands, n, keyFn, exclude) {
  const seen = new Set(exclude.map(keyFn)), out = [];
  for (const c of cands) { const k = keyFn(c); if (!seen.has(k)) { seen.add(k); out.push(c); if (out.length === n) break; } }
  return out;
}
const nearFirst = (list, u) => [...shuffle(list.filter(x => x.u === u)), ...shuffle(list.filter(x => Math.abs(x.u - u) <= 2 && x.u !== u)), ...shuffle(list.filter(x => Math.abs(x.u - u) > 2))];
function qTanim(d) {
  const tersi = Math.random() < 0.65;
  const fk = x => norm(x.t);
  if (tersi) {   // tanımı göster, kavramı sor
    const metin = maskTerm(d.x, d.t);
    const cands = nearFirst(TANIM.filter(x => x.id !== d.id && !norm(d.x).includes(norm(x.t))), d.u);
    const dis = pickDistinct(cands, 3, fk, [d]);
    return {key: 'd:' + d.id, u: d.u, s: d.s, long: true, soru: `<small>Aşağıdaki tanım hangi kavrama aittir?</small>${fmt(metin)}`, dogru: d.t, sec: shuffle([d.t, ...dis.map(x => x.t)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
  }
  const cands = nearFirst(TANIM.filter(x => x.id !== d.id && norm(x.x) !== norm(d.x)), d.u);
  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);
  const kisalt = x => plain(maskTerm(x.x, x.t));
  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const cands = nearFirst(ESER.filter(x => norm(x.m) !== norm(r.m)), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<em>${fmt(r.e)}</em> kimin eseridir?`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}${r.not ? ` (ö. ${fmt(r.not)})` : ''}`};
}

function weightedPick(list, n) {

  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let tot = 0; list.forEach((x, i) => { if (!used.has(i)) tot += Math.max(w[i], .2); });
    let rnd = Math.random() * tot;

  }
  return out;
}

function flash(u) {
  const fu = (u === undefined || u === null) ? store.get('flashU', -1) : u;
  store.set('flashU', fu);
  const list = fu >= 0 ? TANIM.filter(d => d.u === fu) : TANIM;
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);
  F = {list: shuffle(sirali), i: 0, bildim: 0, u: fu};
  renderF();
}
function unitSelect(cur, fn) {
  return `<select class="select" onchange="${fn}(+this.value)"><option value="-1">Bütün üniteler</option>${UNITELER.map((u, i) => `<option value="${i}" ${cur === i ? 'selected' : ''}>${i + 1}. ${esc(u.t)}</option>`).join('')}</select>`;
}
function renderF() {
  const d = F.list[F.i], kutu = boxes[d.id] || 0;
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(F.u, 'flash')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">Ünite ${d.u + 1}</span><div class="t">${fmt(d.t)}</div><div class="s" style="color:var(--muted)">Tanımı nedir?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>
    <div class="face back"><div class="t" style="font-size:1.15rem">${fmt(d.t)}</div><div class="s">${fmt(d.x)}</div></div>
  </div></div>
  <div class="actions" style="justify-content:center">
    <button class="btn red" onclick="fAns(false)">Bilemedim</button>
    <button class="btn" onclick="fAns(true)">Bildim</button>
  </div>
  <div style="text-align:center;margin-top:10px">${bldButton('d:' + d.id, 'Kavram kartı · Ünite ' + (d.u + 1) + ' · ' + UNITELER[d.u].s[d.s].h, plain(d.t) + ': ' + plain(d.x))}</div>`;
}
function fAns(ok) {
  const d = F.list[F.i];
  boxes[d.id] = ok ? Math.min((boxes[d.id] || 0) + 1, 5) : 1; store.set('boxes', boxes); ozet(true);
  record('d:' + d.id, ok); if (ok) F.bildim++;
  F.i++;
  if (F.i < F.list.length) renderF();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">${F.bildim}/${F.list.length}</div><p class="lead">Deste bitti. Bilemediklerin bir sonraki destede önce gelecek.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="flash()">Yeni deste</button></div></div>`;
}

/* ---------- konu tekrarı ---------- */
let O = null;
const bKey = b => b.u + '-' + b.s;
function oralView(u) {
  const fu = (u === undefined || u === null) ? store.get('oralU', -1) : u;
  store.set('oralU', fu);
  const list = BOLUM.filter(b => (fu < 0 || b.u === fu) && UNITELER[b.u].s[b.s].b.length >= 2);
  const sirali = shuffle(list).sort((a, b) => (oral[bKey(a)] ?? -1) - (oral[bKey(b)] ?? -1));
  O = {list: sirali.slice(0, 10), i: 0, u: fu};
  renderO();
}
function renderO() {
  const b = O.list[O.i], d = oral[bKey(b)], s = UNITELER[b.u].s[b.s];
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(O.u, 'oralView')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * O.i / O.list.length}%"></i></div><span class="count">${O.i + 1} / ${O.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">Ünite ${b.u + 1} · ${esc(UNITELER[b.u].t)}${d === 1 ? ' · daha önce bildin' : d === 0 ? ' · daha önce bilemedin' : ''}</span>${bldButton('b:' + b.u + '-' + b.s, 'Konu tekrarı · Ünite ' + (b.u + 1) + ' · ' + UNITELER[b.u].t, s.h)}</div>
    <div class="q">${fmt(s.h)}</div>
    <p class="lead" id="think" style="font-size:.9rem">Bu bölümde neler olduğunu önce kendin anlat (tanım, maddeler, eserler), sonra içeriği aç.</p>
    <div class="answer lesson" id="ans">${s.b.map(blockHTML).join('')}</div>
    <div class="actions" id="oa"><button class="btn" onclick="showAns()">İçeriği göster</button></div>
  </div>`;
}
function showAns() {
  $('#ans').classList.add('show'); $('#think').classList.add('hide');
  $('#oa').innerHTML = `<button class="btn red" onclick="oAns(0)">Bilemedim</button><button class="btn" onclick="oAns(1)">Bildim</button>`;
}
function oAns(v) {
  oral[bKey(O.list[O.i])] = v; store.set('oral', oral); O.i++;
  if (O.i < O.list.length) renderO();
  else $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">Bu turdaki ${O.list.length} bölümü bitirdin.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="oralView()">Yeni tur</button></div></div>`;
}

/* ---------- hızlı tekrar ---------- */
function review(u) {
  const fu = (u === undefined || u === null) ? store.get('reviewU', -1) : u;
  store.set('reviewU', fu);
  const list = UNITELER.map((x, i) => i).filter(i => fu < 0 || i === fu);
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Hızlı tekrar</h2>
  <p class="lead">Her ünitenin en önemli maddeleri. Bir maddenin yanındaki › ile o bölüme gidebilirsin.</p>
  <div class="rowctl">${unitSelect(fu, 'review')}</div>
  ${list.map(i => `<div class="htu"><div class="htt"><span class="no">${i + 1}</span>${esc(UNITELER[i].t)}</div>${htHTML(i, true)}</div>`).join('')}`;
}

/* ---------- geçmiş sınav soruları ---------- */
function exam() {
  let k = 0;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Geçmiş sınav soruları</h2>
  <p class="lead">Önce kendin cevapla, sonra <b>Cevabı göster</b>'e dokun. Cevaplar ünitelerdeki bilgilere dayanır; altındaki bağlantılar ilgili bölümü açar.</p>
  ${SINAV.map((g, gi) => `<div class="section-title">${esc(g.t)}</div>${g.q.map((q, qi) => { k++; const id = 'x' + gi + '-' + qi; return `<div class="exq"><div class="qq"><span class="no">${qi + 1}</span><span>${fmt(q.q)}</span>${bldButton('x:' + (gi + 1) + '-' + (qi + 1), 'Geçmiş sınav soruları · ' + g.t, plain(q.q))}</div>
    <div class="actions" style="justify-content:flex-start;margin-top:10px" id="${id}b"><button class="btn sec" onclick="exShow('${id}')">Cevabı göster</button></div>
    <div class="exa hide" id="${id}"><div class="exl">Cevap</div>${q.x.map(x => `<p>${fmt(x)}</p>`).join('')}${q.n ? `<div class="box bk" style="margin-top:8px"><b class="lb">Not</b>${fmt(q.n)}</div>` : ''}
    ${q.r.length ? `<div class="links">${q.r.map(([u, s]) => `<button onclick="toSection(${u},${s})">Ü${u + 1} · ${esc(UNITELER[u].s[s].h)}</button>`).join('')}</div>` : ''}</div></div>`; }).join('')}`).join('')}`;
}
function exShow(id) { $('#' + id).classList.remove('hide'); $('#' + id + 'b').classList.add('hide'); }
function toSection(u, s) { pendingFocus = {id: `ls-${u}-${s}`}; go('unitView', u); }

/* ---------- sözlük ---------- */
let bTab = 'kavram';
function browse() {
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">Kavram ve eser sözlüğü</h2>
  <div class="rowctl" style="margin:12px 0 10px">
    <button class="btn ${bTab === 'kavram' ? '' : 'sec'}" onclick="bTab='kavram';browse()">Kavramlar (${TANIM.length})</button>
    <button class="btn ${bTab === 'eser' ? '' : 'sec'}" onclick="bTab='eser';browse()">Eserler (${ESER.length})</button>
  </div>
  <input class="search" id="bq" type="search" placeholder="${bTab === 'kavram' ? 'Kavram ya da tanımda ara…' : 'Eser ya da müellif ara…'}" oninput="doBrowse()">
  <div class="list" id="bl"></div>`;
  doBrowse();
}
function doBrowse() {
  const t = norm($('#bq').value || '');
  const src = bTab === 'kavram' ? TANIM : ESER;
  const hits = src.filter(r => !t || norm(bTab === 'kavram' ? r.t + ' ' + r.x : r.e + ' ' + r.m).includes(t));
  $('#bl').innerHTML = hits.length ? hits.map(r => bTab === 'kavram'
    ? `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.t)}</div><div class="n">${fmt(r.x)}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`
    : `<button class="row" onclick="toSection(${r.u},${r.s})"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)}${r.not ? ` <span style="color:var(--muted)">(${fmt(r.not)})</span>` : ''}</div><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].s[r.s].h)}</div></button>`).join('')
    : '<p class="empty">Sonuç yok.</p>';
}

/* ---------- ilerleme ---------- */
function progress() {
  const satir = UNITELER.map((u, i) => {
    let ok = 0, bad = 0; unitItems(i).forEach(x => { const s = stats[x.key]; if (s) { ok += s.ok; bad += s.bad; } });
    const p = ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
    return `<div class="meter"><span title="${esc(u.t)}">${i + 1}. ${esc(u.t)}</span><div class="progress"><i style="width:${p ?? 0}%;background:${p === null ? 'transparent' : p >= 70 ? 'var(--green-2)' : p >= 45 ? 'var(--gold)' : 'var(--red)'}"></i></div><span class="count">${p === null ? '—' : '%' + p}</span></div>`;
  }).join('');
  const byKey = {}; HAVUZ.forEach(x => byKey[x.key] = x);
  const zayif = Object.entries(stats).filter(([k, s]) => s.bad > 0 && byKey[k]).sort((a, b) => (b[1].bad - b[1].ok * .5) - (a[1].bad - a[1].ok * .5)).slice(0, 12).map(([k]) => k);
  const etiket = k => { const [t, id] = k.split(':');
    if (t === 'd') return `<b>${fmt(TANIM[id].t)}</b>: ${fmt(TANIM[id].x)}`;
    if (t === 'e') return `<b>${fmt(ESER_Q[id].e)}</b> → ${fmt(ESER_Q[id].m)}`;
    return `${fmt(SORULAR[id].q)} <b>${fmt(SORULAR[id].a[0])}</b>`; };
  const oralN = Object.keys(oral).length, oralOk = Object.values(oral).filter(v => v === 1).length;
  $('#app').innerHTML = `
  <h2 style="margin-top:22px">İlerlemem</h2>
  <div class="card" style="margin-top:14px">${satir}
    <p class="lead" style="font-size:.88rem;margin-top:12px">Çalış bölümü: ${uDone()} / ${UNITELER.length} ünite tamamlandı.<br>Konu tekrarı: ${oralN} bölüm çalışıldı, ${oralOk} tanesini bildin.</p></div>
  <div class="section-title">En çok karıştırdıkların</div>
  ${zayif.length ? `<div class="list">${zayif.map(k => `<div class="row"><div class="n">${etiket(k)}</div></div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick='quiz({keys:${JSON.stringify(zayif)}})'>Bunlarla test çöz</button></div>` : '<p class="empty">Henüz yanlış yok. Biraz test çözünce burada görünecek.</p>'}
  <div class="actions" style="margin-top:30px"><button class="btn sec" onclick="sifirla()">İlerlemeyi sıfırla</button></div>`;
}
function sifirla() {
  if (!confirm('Bütün ilerleme kaydın silinsin mi?')) return;
  stats = {}; boxes = {}; oral = {}; uStat = {};
  store.set('stats', stats); store.set('boxes', boxes); store.set('oral', oral); store.set('units', uStat); progress();
}

/* ---------- genel arama ---------- */
let SIDX = null;
function bTxt(b) {
  if (b.k === 'tbl') return b.r.map(r => r.filter(Boolean).map(plain).join(' – ')).join(' · ');
  if (b.k === 'steps') return b.x.map(plain).join(' · ');
  if (b.k === 'ar') return plain(b.x || '');
  if (b.k === 'sc') return plain(b.q + ' ' + b.x);
  return plain((b.t ? b.t + ': ' : '') + b.x);
}
function buildIndex() {
  SIDX = [];
  UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
    SIDX.push({u: ui, s: si, kind: 'b', t: s.h, x: s.b.map(bTxt).join(' · ')});
  }));
}
function openSearch() {
  if (!SIDX) buildIndex();
  $('#sov').classList.add('open');
  try { history.pushState(Object.assign({}, history.state, {search: true}), ''); } catch (e) {}
  $('#sq').value = ''; doGlobalSearch(); setTimeout(() => $('#sq').focus(), 30);
}
function closeSearch(viaPop) {
  $('#sov').classList.remove('open');
  if (!viaPop && history.state && history.state.search) { try { history.back(); } catch (e) {} }
}
function markText(text, t) {
  const n = norm(text); const i = n.indexOf(t);
  if (!t || i < 0) return esc(text.slice(0, 160)) + (text.length > 160 ? '…' : '');
  // norm uzunluğu yaklaşık korunduğundan konuma yakın bir pencere al
  const a = Math.max(0, i - 60), b = Math.min(text.length, i + t.length + 100);
  return (a ? '…' : '') + esc(text.slice(a, b)) + (b < text.length ? '…' : '');
}
function doGlobalSearch() {
  const t = norm($('#sq').value || '');
  if (t.length < 2) { $('#sres').innerHTML = '<p class="empty">En az iki harf yaz.</p>'; return; }
  const kav = TANIM.filter(d => norm(d.t).includes(t)).slice(0, 12);
  const bol = SIDX.filter(r => norm(r.t + ' ' + r.x).includes(t)).slice(0, 30);
  $('#sres').innerHTML = (kav.length ? `<div class="sgrp">Kavramlar</div>${kav.map(d => `<button class="sitem" onclick="hit(${d.u},${d.s})"><div class="w">Ünite ${d.u + 1}</div><div class="t">${fmt(d.t)}</div><div class="x">${esc(plain(d.x).slice(0, 140))}</div></button>`).join('')}` : '')
    + (bol.length ? `<div class="sgrp">Konu anlatımları</div>${bol.map(r => `<button class="sitem" onclick="hit(${r.u},${r.s})"><div class="w">Ünite ${r.u + 1} · ${esc(UNITELER[r.u].t)}</div><div class="t">${esc(r.t)}</div><div class="x">${markText(r.x, t)}</div></button>`).join('')}` : '')
    || '<p class="empty">Sonuç yok.</p>';
}
function hit(u, s) { $('#sov').classList.remove('open'); pendingFocus = {id: `ls-${u}-${s}`}; if (history.state && history.state.search) { try { history.replaceState({view: curView, arg: curArg, d: (history.state.d || 0)}, ''); } catch (e) {} } go('unitView', u); }
function focusHit(f) { jump(f.id); }

/* ---------- başlat ---------- */
const ilkHash = (location.hash || '').slice(1);
try { history.replaceState({view: 'home', arg: null, d: 0}, '', location.pathname + location.search); } catch (e) {}
render('home');
// Alt çubuktaki "Devam et" / "Dersler" bağlantısıyla gelindiyse kaldığı yere aç (ör. #unitView-7)
(function () {
  const h = ilkHash; if (!h) return;
  const m = h.match(/^(\w+?)(?:-(\d+))?$/); if (!m) return;
  const v = m[1], a = m[2] === undefined ? undefined : +m[2];
  if (!['study', 'unitView', 'match', 'flash', 'oralView', 'review', 'exam', 'browse', 'progress'].includes(v)) return;
  if (v === 'unitView' && !(a >= 0 && a < UNITELER.length)) return;
  if (v === 'unitView') { go('study'); go('unitView', a); } else go(v);
})();
</script>
</body>
</html>
