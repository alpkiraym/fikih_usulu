<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- Fıkıh Usulü: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}
details.ht{background:var(--green-soft);border:1px solid #cfe0d6;border-radius:var(--radius);margin:16px 0 10px;padding:0}
details.ht summary{cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:700;color:var(--green);font-size:1.08rem;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.ht summary::-webkit-details-marker{display:none}
details.ht summary small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.82rem;width:100%;margin-left:36px;margin-top:-6px}
details.ht .hti{width:26px;height:26px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:none}

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);
    q('add').onclick = () => { const l = getL(); l.push(get()); setL(l); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
  }
  function openList() {
    const l = getL(), su = `[${APP} Hata] Toplu bildirim (${l.length} hata)`, bo = l.map((r, i) => `--- ${i + 1} ---\n${body1(r)}`).join('\n\n');
    open(`<h3 id="bldTitle">Bildirimlerim (${l.length})</h3>
      ${l.length ? `<ul class="bld-list">${l.map((r, i) => `<li><div><b>${E(r.bas.slice(0, 90))}</b><br><small>${E(r.yer)} · ${E(r.type)}${r.note ? ' — ' + E(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
      <div class="bld-btns">${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}<button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div><div class="bld-hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    box.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { const L = getL(); L.splice(+x.dataset.del, 1); setL(L); openList(); });
    if (!l.length) return;
    q('mail').onclick = () => { const u = mailto(su, bo); if (u.length > 1900) msg.textContent = `Liste uzun; e-posta uygulaması metni kesebilir. Kesilirse “Gmail'de aç” veya “Metni kopyala”yı kullan.`; location.href = u; };
    q('gmail').href = gmail(su, bo);
    q('copy').onclick = () => copy(bo, msg);
    q('clear').onclick = () => { setL([]); openList(); };
  }
  document.addEventListener('click', e => { const b = e.target.closest('.rep[data-k]'); if (!b) return; e.preventDefault(); e.stopPropagation(); report(b); }, true);
  new MutationObserver(() => { if (!lbtn) slot(); mark(); }).observe(document.body, {childList: true, subtree: true});
  window.bldButton = (k, yer, bas, txt) => `<button type="button" class="rep" data-k="${E(k)}" data-yer="${E(yer)}" data-bas="${E(String(bas).slice(0, 400))}" title="Bu kayıttaki bir hatayı bildir">${txt || '⚑ Bildir'}</button>`;
  window.bldOpenList = openList;
  sync();
})();
</script>

  .gab-sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;z-index:57;max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#f7f3ea;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(40,30,10,.18);padding:8px 14px calc(var(--gab-h,84px) + 12px);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2a24;font-size:15px;line-height:1.45}

  .gab-sheet.full{max-height:calc(100% - 44px - env(safe-area-inset-top))}
  .gab-sheet.gab-anim{transition:transform .2s ease-out,max-height .2s ease-out}
  @keyframes gabUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
.gab-grab{position:relative;width:38px;height:5px;border-radius:3px;background:#d9cfb9;margin:2px auto 8px;cursor:grab}
.gab-grab::before{content:'';position:absolute;left:-90px;right:-90px;top:-14px;bottom:-12px}
.gab-grab,.gab-hd{touch-action:none}
.gab-hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.gab-hd b{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:1.25rem;color:#1f5a45;font-weight:700}
.gab-x{width:34px;height:34px;border-radius:50%;border:1px solid #e3dccb;background:#fffdf8;color:#6b7068;font-size:20px;line-height:1;cursor:pointer}
.gab-li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;padding:10px 12px;margin:0 0 8px;color:inherit;font:inherit;cursor:pointer;text-decoration:none}
.gab-li.cur{border-color:#2f7a5f;box-shadow:inset 0 0 0 1px #2f7a5f}
.gab-pm{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:#1f5a45;color:#d9b45a}
.gab-pm svg{width:19px;height:19px}
.gab-tx{flex:1 1 auto;min-width:0}
.gab-tx b{display:block;font-weight:600;font-size:.98rem}
.gab-tx small{display:block;color:#6b7068;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gab-tag{flex:none;font-size:.72rem;font-weight:600;color:#1f5a45;background:#e4efe8;border-radius:999px;padding:2px 9px}
.gab-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.gab-st div{background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;padding:9px 6px;text-align:center}
.gab-st b{display:block;font-size:1.3rem;color:#1f5a45;font-weight:700;line-height:1.1}
.gab-st span{font-size:.76rem;color:#6b7068}
.gab-streak{display:flex;gap:8px;align-items:center;background:#f4ead3;border:1px solid #e6d6ae;border-radius:12px;padding:8px 12px;margin:0 0 10px;font-size:.86rem;color:#6b4f17}
.gab-k{background:#fffdf8;border:1px solid #e3dccb;border-radius:12px;overflow:hidden;margin:0 0 10px}
.gab-kr{display:grid;grid-template-columns:1fr 58px 62px;gap:6px;align-items:center;padding:9px 12px;border-top:1px solid #f0eadb;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.gab-kr:first-child{border-top:0}
.gab-kh{background:#e4efe8;color:#1f5a45;font-weight:600;font-size:.78rem;cursor:default}
.gab-kr .n{text-align:right;font-variant-numeric:tabular-nums}
.gab-kr .nm b{display:block;font-weight:600;font-size:.92rem}
.gab-kr .nm small{display:block;color:#6b7068;font-size:.76rem}
.gab-bar{grid-column:1/-1;height:5px;border-radius:3px;background:#e4efe8;margin-top:-2px}
.gab-bar i{display:block;height:5px;border-radius:3px;background:#2f7a5f}
.gab-g{font-weight:700;color:#1f5a45}.gab-g.o{color:#9a7428}.gab-g.z{color:#a8432f}.gab-g.e{color:#b9b3a6;font-weight:400}
.gab-kr.bos .nm b{color:#8b8f86}
.gab-note{font-size:.78rem;color:#6b7068;margin:4px 2px 12px}
.gab-mail{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid #e3dccb;border-radius:12px;background:#fffdf8;color:#1f5a45;font-weight:600;font-size:.9rem;text-decoration:none}
.gab-toast{position:fixed;left:50%;bottom:calc(var(--gab-h,84px) + 14px);transform:translateX(-50%);z-index:59;background:#1f2a24;color:#fff;font:500 .85rem/1.35 system-ui,-apple-system,sans-serif;padding:8px 14px;border-radius:999px;max-width:88vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
</style>

<div class="gab-sheet" id="gabSheet" role="dialog" aria-modal="true" aria-labelledby="gabT"><div class="gab-grab"></div><div class="gab-hd"><b id="gabT"></b><button class="gab-x" type="button" id="gabX" aria-label="Kapat">×</button></div><div id="gabB"></div></div>
<nav class="gab" id="gab" aria-label="Giray Akademi gezinme">
  <div class="gab-row">
    <a class="gab-b" data-k="ana" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>Ana sayfa</a>

    <button class="gab-b" type="button" data-k="devam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.3l5.8 3.7-5.8 3.7z"/></svg>Devam et</button>
    <button class="gab-b" type="button" data-k="karne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>Karnem</button>

</nav>
<script>
(function(){
  var APP = window.GA_APP || 'ana';
  var I = {
    kitap:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"/>',
    terazi:'<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a4 4 0 0 0 6 0z"/><path d="M19 7l-3 7a4 4 0 0 0 6 0z"/><path d="M8 21h8"/>',
    bina:'<path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-6a2 2 0 0 1 4 0v6"/>',
    zincir:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    kalem:'<path d="M3 21.5h11"/><path d="M4.5 21.5v-3.5a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v3.5"/><path d="M7.5 15v-2h3v2"/><path d="M9 13l12.5-10.5"/><path d="M21.5 2.5C16 2.5 12.5 5 11 9.5"/><path d="M21.5 2.5C21.5 8 19 11.5 14.5 13"/>',
    kandil:'<path d="M2 19c3-1.2 6.5-1.2 10 0c3.5-1.2 7-1.2 10 0V10c-3-1.2-6.5-1.2-10 0C8.5 8.8 5 8.8 2 10z"/><path d="M12 10v9"/><path d="M12 1.8c1.5 1.5 2 2.7 2 3.6a2 2 0 0 1-4 0c0-.9.5-2.1 2-3.6z"/>',
    agac:'<path d="M12 2a4.5 4.5 0 0 0-4.4 3.6A4 4 0 0 0 5 13h14a4 4 0 0 0-2.6-7.4A4.5 4.5 0 0 0 12 2z"/><path d="M12 8.5v8"/><path d="M4.5 16.5h15"/><path d="M12 16.5c0 2.2-2.2 3.5-5 4.5M12 16.5c0 2.2 2.2 3.5 5 4.5M12 16.5v5"/>'
  };
  // Yeni ders hazır olunca buraya bir satır eklenir (ana sayfadaki "Programlar" sırasıyla aynı).
  var GA_PROGS = [
    {k:'atlas',  ad:'Eser–Müellif Atlası',   url:'/eser_muellif_atlasi/', i:'kitap'},
    {k:'mecelle',ad:'Mecelle Küllî Kâideler', url:'/mecelle/',             i:'terazi'},
    {k:'medhal', ad:'Medhal',                 url:'/madhal/',              i:'bina'},
    {k:'hadis',  ad:'Hadis Usulü',            url:'/hadis_usulu/',         i:'zincir'},
    {k:'muhtar', ad:"Muhtâr li'l-Fetvâ",      url:'/muhtar_lil_fetva/',    i:'kalem'},
    {k:'tefsir', ad:'Tefsir Usulü',           url:'/tefsir_usulu/',        i:'kandil'},
    {k:'fikih',  ad:'Fıkıh Usulü',            url:'/fikih_usulu/',         i:'agac'}
  ];
  var MAIL = 'alpkiraymehmet@gmail.com';
  function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||'')+'</svg>'}
  function gun(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

  /* ---- programların kullandığı işlevler ---- */
  window.gaOzet = function(o){
    if(!o||APP==='ana')return;
    var all = rd('ga_ozet',{}), cur = all[APP]||{};
    ['bitti','etiket','d','y','kart'].forEach(function(f){ if(o[f]!==undefined) cur[f]=o[f]; });
    if(o.yer){ cur.yer = o.yer; cur.t = Date.now(); }
    all[APP] = cur; wr('ga_ozet', all);
    if(o.aktif){ var g = rd('ga_gunler',[]), b = gun(Date.now()); if(g[g.length-1]!==b){ g.push(b); wr('ga_gunler', g.slice(-120)); } }
  };
  window.gaAltGizle = function(b){ try{ document.documentElement.classList.toggle('gab-off', !!b); }catch(e){} if(b) close(); };

  /* ---- çubuk ---- */
  var bar=document.getElementById('gab'), sh=document.getElementById('gabSheet'), dim=document.getElementById('gabDim'),
      T=document.getElementById('gabT'), B=document.getElementById('gabB');
  function setH(){ try{ document.documentElement.style.setProperty('--gab-h', (bar.offsetHeight||84)+'px'); }catch(e){} }
  setH(); addEventListener('resize', setH);
  var base = APP==='ana' ? 'ana' : 'dersler', openK = null;
  function mark(){ [].forEach.call(bar.querySelectorAll('.gab-b'), function(b){ b.classList.toggle('on', b.dataset.k === (openK||base)); }); }
  mark();

  var pushed=false, closing=false;
  function open(k){
    openK = k; mark();
    if(k==='dersler'){ T.textContent='Dersler'; B.innerHTML=dersler(); }
    else { T.textContent='Karnem'; B.innerHTML=karne(); }
    sh.scrollTop=0; sh.classList.add('open'); dim.classList.add('open'); setH(); kilit(true);
    if(!pushed){ try{ history.pushState(Object.assign({}, history.state, {gab:1}), ''); pushed=true; }catch(e){ pushed=false; } }
  }
  function close(){
    if(!sh.classList.contains('open')) return;
    sh.classList.remove('open','full','gab-anim'); sh.style.transform=''; dim.classList.remove('open'); openK=null; mark(); kilit(false);
    if(pushed){ pushed=false; closing=true; try{ history.back(); }catch(e){ closing=false; } }
  }
  // Geri hareketi önce pencereyi kapatsın; programın kendi gezinmesine geçmesin
  addEventListener('popstate', function(e){
    if(closing){ closing=false; e.stopImmediatePropagation(); return; }
    if(sh.classList.contains('open')||pushed){ sh.classList.remove('open','full','gab-anim'); sh.style.transform=''; dim.classList.remove('open'); openK=null; mark(); kilit(false); pushed=false; e.stopImmediatePropagation(); }
  }, true);
  // Pencere açıkken arkadaki sayfa kaymasın (iPhone kaydırmayı arkaya geçiriyordu)
  var kY=0;
  function kilit(on){ try{ document.documentElement.classList.toggle('gab-lock', !!on); }catch(e){} }
  // Üstteki çizgiden (ya da başlıktan) tutup sürükleme: aşağı çekince kapanır, yukarı çekince büyür.
  // Pencere en baştayken içerikten aşağı çekmek de pencereyi sürükler (iPhone'daki gibi).
  var drag=null;
  sh.addEventListener('touchstart', function(e){
    kY=e.touches[0].clientY;
    drag={y:kY, t:Date.now(), tut:!!(e.target.closest('.gab-grab,.gab-hd') && !e.target.closest('.gab-x')), on:false, dy:0};
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!sh.classList.contains('open')) return;
    if(!sh.contains(e.target)){ e.preventDefault(); return; }
    var dy=e.touches[0].clientY-kY;
    if(drag && (drag.on || drag.tut || (sh.scrollTop<=0 && dy>0))){
      e.preventDefault(); drag.on=true; drag.dy=dy;
      sh.classList.remove('gab-anim');
      sh.style.transform='translateY('+(dy>0 ? dy : dy/4)+'px)';
      return;
    }
    var ust=sh.scrollTop<=0, alt_=sh.scrollTop+sh.clientHeight>=sh.scrollHeight-1;
    if(sh.scrollHeight<=sh.clientHeight || (ust&&dy>0) || (alt_&&dy<0)) e.preventDefault();
  }, {passive:false});
  function birak(){
    if(!drag||!drag.on){ drag=null; return; }
    var d=drag.dy, hiz=d/Math.max(1,Date.now()-drag.t); drag=null;
    sh.classList.add('gab-anim');
    if(d>120 || (d>40 && hiz>0.6)){ sh.style.transform='translateY(100%)'; setTimeout(close,180); return; }
    if(d<-40) sh.classList.add('full');
    else if(d>40) sh.classList.remove('full');
    sh.style.transform='';
  }
  sh.addEventListener('touchend', birak); sh.addEventListener('touchcancel', birak);
  dim.onclick=close; document.getElementById('gabX').onclick=close;
  addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  function gitUrl(u){ close(); setTimeout(function(){ location.href=u; }, 30); }

  bar.addEventListener('click', function(e){
    var b=e.target.closest('.gab-b'); if(!b) return;
    var k=b.dataset.k;
    if(k==='ana'){ if(APP==='ana'){ e.preventDefault(); if(openK) close(); scrollTo({top:0,behavior:'smooth'}); } return; }
    e.preventDefault();
    if(k==='devam'){ devam(); return; }
    if(openK===k) close(); else open(k);
  });
  B.addEventListener('click', function(e){
    if(e.target.closest('[data-cur]')){ e.preventDefault(); close(); return; }
    var a=e.target.closest('[data-u]'); if(a){ e.preventDefault(); gitUrl(a.dataset.u); }
  });

  function sonYer(){ // en son çalışılan yer; bulunduğunuz programın dışındakiler önce
    var all=rd('ga_ozet',{}), L=[];
    GA_PROGS.forEach(function(p){ var o=all[p.k]; if(o&&o.yer&&o.t) L.push({p:p,o:o}); });
    L.sort(function(a,b){ return b.o.t-a.o.t; });
    return L.filter(function(x){ return x.p.k!==APP; })[0] || null;
  }
  function devam(){
    var s=sonYer();
    if(s){ gitUrl(s.o.yer.url); return; }
    toast(APP==='ana' ? 'Henüz bir programda çalışmadınız. Bir ders seçin.' : 'Başka bir programda kaldığınız yer yok.');
    open('dersler');
  }
  var tt;
  function toast(m){ var d=document.createElement('div'); d.className='gab-toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(function(){ d.remove(); }, 2600); }

  function dersler(){
    var all=rd('ga_ozet',{});
    return GA_PROGS.map(function(p){
      var o=all[p.k], cur=p.k===APP, u=(o&&o.yer&&o.yer.url)||p.url;
      var alt = cur ? '' : (o&&o.yer ? 'Kaldığınız yer: '+esc(o.yer.ad) : '');
      return '<a class="gab-li'+(cur?' cur':'')+'" href="'+esc(p.url)+'" '+(cur?'data-cur="1"':'data-u="'+esc(u)+'"')+'><span class="gab-pm">'+svg(p.i)+'</span><span class="gab-tx"><b>'+esc(p.ad)+'</b>'+(alt?'<small>'+alt+'</small>':'')+'</span>'+(cur?'<span class="gab-tag">buradasınız</span>':'')+'</a>';
    }).join('') + '<p class="gab-note">Diğer dersler hazırlanıyor; hazır oldukça bu listeye eklenecek.</p>';
  }
  function seri(){
    var g=rd('ga_gunler',[]); if(!g.length) return 0;
    var set={}; g.forEach(function(x){ set[x]=1; });
    var d=new Date(), n=0; if(!set[gun(d)]) d.setDate(d.getDate()-1);
    while(set[gun(d)]){ n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function karne(){
    var all=rd('ga_ozet',{}), D=0, Y=0, K=0, var_=false;
    var rows = GA_PROGS.map(function(p){
      var o=all[p.k];
      if(!o) return '<button class="gab-kr bos" type="button" data-u="'+esc(p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>Henüz başlanmadı</small></span><span class="n gab-g e">—</span><span class="n gab-g e">—</span></button>';
      var_=true; var d=o.d||0, y=o.y||0; D+=d; Y+=y; K+=o.kart||0;
      var b=Math.round((o.bitti||0)*100), q=d+y?Math.round(d/(d+y)*100):null;
      var c=q===null?'e':(q>=75?'':(q>=50?'o':'z'));
      return '<button class="gab-kr" type="button" data-u="'+esc((o.yer&&o.yer.url)||p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>'+esc(o.etiket||'')+'</small></span><span class="n">%'+b+'</span><span class="n gab-g '+c+'">'+(q===null?'—':'%'+q)+'</span><span class="gab-bar"><i style="width:'+b+'%"></i></span></button>';
    }).join('');
    var S=D+Y, P=S?Math.round(D/S*100):null, sr=seri();
    return '<div class="gab-st"><div><b>'+S+'</b><span>soru çözüldü</span></div><div><b>'+(P===null?'—':'%'+P)+'</b><span>doğru</span></div><div><b>'+K+'</b><span>kart biliniyor</span></div></div>'
      + (sr>1 ? '<div class="gab-streak">🔥 '+sr+' gündür aralıksız çalışıyorsunuz</div>' : (sr===1 ? '<div class="gab-streak">🔥 Bugün çalıştınız. Yarın da gelirseniz seri başlar.</div>' : ''))
      + '<div class="gab-k"><div class="gab-kr gab-kh"><span>Ders</span><span class="n">Bitti</span><span class="n">Doğru</span></div>'+rows+'</div>'
      + '<p class="gab-note">'+(var_?'Bir derse dokunursanız kaldığınız yere gidersiniz. ':'')+'İlerlemeniz yalnızca bu cihazda, bu tarayıcıda saklanır.</p>'
      + '<a class="gab-mail" href="mailto:'+MAIL+'?subject='+encodeURIComponent('[Giray Akademi] Öneri / soru')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>İletişim · öneri ve soru gönderin</a>';
  }
})();
</script>

<script>

َوِ الظَّنِّ","x":"Istılahta delil"},{"k":"d","t":"Delil (ıstılahta)","x":"Kendisinden kat'î veya zannî yolla şer'î amelî bir hüküm elde edilendir."},{"k":"tbl","r":[["","Kısım","Deliller"],["**A**","Müttefekun aleyh (4)","Kitap, Sünnet, İcmâ, Kıyas"],["**B**","Muhtelefun fîh (7)","Maslahat-ı mürsele, İstihsan, Örf, Sedd-i zerâi, Şer'u men kablenâ, Sahâbe kavli, İstishab"]]},{"k":"ar","a":"الْكِتَابُ وَالسُّنَّةُ وَالْإِجْمَاعُ وَالْقِيَاسُ","x":"Müttefekun aleyh"},{"k":"ar","a":"الْمَصَالِحُ الْمُرْسَلَةُ وَالِاسْتِحْسَانُ وَالْعُرْفُ وَسَدُّ الذَّرَائِعِ وَشَرْعُ مَنْ قَبْلَنَا وَقَوْلُ الصَّحَابِيِّ وَالِاسْتِصْحَابُ","x":"Muhtelefun fîh"}]},{"h":"A1. Kitap","b":[{"k":"ar","a":"هُوَ كَلَامُ اللَّهِ الْمُنَزَّلُ عَلَى نَبِيِّهِ الْمَكْتُوبُ فِي الْمَصَاحِفِ الْمَنْقُولُ بِالتَّوَاتُرِ الْمُتَعَبَّدُ بِتِلَاوَتِهِ الْمُعْجِزُ وَلَوْ بِسُورَةٍ","x":""},{"k":"d","t":"Kitap","x":"Allah'ın Peygamberine indirilen, mushaflarda yazılı, tevatürle nakledilen, tilavetiyle ibadet edilen ve bir suresiyle bile mucize olan kelamıdır."},{"k":"h","x":"Özellikleri"},{"k":"n","n":1,"x":"Lafzı ve manası Allah'a aittir."},{"k":"n","n":2,"x":"Lafızlarının müteradifleri ne kadar uysa da Kur'an değildir."},{"k":"n","n":3,"x":"Başka bir dile çevirisi Kur'an değildir."},{"k":"n","n":4,"x":"Tevatür yoluyla nakledilmiştir."},{"k":"n","n":5,"x":"Arapçadır."},{"k":"h","x":"Hücciyeti"},{"k":"li","x":"Kur'an'ın hüccet oluşunun delili Allah'ın kelamı olmasıdır. Allah'ın kelamı oluşunun delili ise insanların benzerini getirmekten aciz kalmalarıdır."},{"k":"h","x":"Kaynak değeri"},{"k":"li","x":"Delil bakımından 1. sırada gelir. Bir hüküm Kur'an'da bulunduğu sürece başka bir delile başvurulmaz."}]},{"h":"Kur'an'daki hükümler ve delaleti","b":[{"k":"li","x":"Kur'an'daki hükümler üç çeşittir: 1) İtikadî, 2) Ahlakî, 3) Amelî."},{"k":"li","x":"Kur'an hükümlerinin **sübûtu kat'îdir**. Delaleti ise iki çeşittir:"},{"k":"tbl","r":[["Delalet","Ne zaman","Örnek"],["**A. Kat'î**","Birden fazla manaya ihtimalli değilse","«فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ» (sayı kesindir)"],["**B. Zannî**","Birden fazla manaya ihtimalliyse","«وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ» («قُرُوء» kelimesi)"]]}]},{"h":"A2. Sünnet","b":[{"k":"d","t":"Sünnet","x":"Hz. Peygamber'in söz, fiil ve takrirleridir."},{"k":"tbl","r":[["Çeşit","Anlamı","Örnek"],["**A. Kavlî**","Sözleri","«لَا ضَرَرَ وَلَا ضِرَارَ»"],["**B. Fiilî**","Fiilleri","Beş vakit namazı edası"],["**C. Takrirî**","Bazı sahabelerden meydana gelen söz ve fiilleri susarak, gülerek, överek veya dua ederek onaylaması","—"]]},{"k":"h","x":"Hücciyeti"},{"k":"li","x":"Sünnetin delil oluşunun delilleri 3'tür:"},{"k":"n","n":1,"x":"Kur'an ayetleri: «يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ»"},{"k":"n","n":2,"x":"Sahâbe icmâı."},{"k":"n","n":3,"x":"Allah'ın Kur'an'da açıklamadığı mücmel farzların anlaşılmasında sünnetin rolü."},{"k":"ornek","x":"Kur'an \"Namaz kılın\" diyor; nasıl kılınacağını sünnet gösterir."}]},{"h":"Sünnetin Kur'an'a nispeti","b":[{"k":"li","x":"Delil olarak Kur'an'a göre **2. sırada** gelir."},{"k":"li","x":"Getirdiği hükümler yönünden Kur'an'a nispeti:"},{"k":"n","n":1,"x":"**Te'kid:** \"Namaz kılın\" gibi; hüküm ikisinde de vardır."},{"k":"n","n":2,"x":"**Mücmeli tebyin, mutlakı takyid, âmmı tahsis eder:** Namazın nasıl kılınacağı gibi."},{"k":"n","n":3,"x":"**Kur'an'da bulunmayan bir hükmü isbat eder:** (Erkeklere) altın ve gümüşün haram oluşu gibi."},{"k":"n","n":4,"x":"**Hanefîlere göre nâsih olması.**"}]},{"h":"Senedine göre sünnet","b":[{"k":"tbl","r":[["Kısım","Tanımı"],["**1. Mütevâtir**","Her tabakada adeten yalan üzere ittifakları mümkün olmayacak sayıda bir topluluk tarafından rivayet edilendir."],["**2. Meşhur**","İlk tabakada tevatür sayısına ulaşmamış, fakat 2. ve 3. tabakada tevatür sayısına ulaşmış raviler tarafından rivayet edilendir."],["**3. Âhâd**","Hiçbir tabakada ravilerin tevatür sayısına ulaşmadığı rivayettir. Sünnetin büyük çoğunluğu bu yolla gelmiştir."]]},{"k":"dikkat","x":"Bu taksim **Hanefîlere** göredir. Cumhura göre sünnet ikiye ayrılır: mütevâtir ve âhâd. Mütevâtir aynıdır; meşhur ise farklıdır."},{"k":"h","x":"Cumhura göre âhâdın kısımları"},{"k":"tbl","r":[["Kısım","Herhangi bir tabakada ravi sayısı"],["**1. Meşhur (müstefîz)**","3"],["**2. Azîz**","2"],["**3. Garîb**","1"]]}]},{"h":"Teşrî özelliği olmayan sünnetler","b":[{"k":"n","n":1,"x":"İnsan tabiatı gereği yaptığı şeyler (yeme-içme gibi)."},{"k":"n","n":2,"x":"Dünya işleri konusunda ustalık ve tecrübe gereği yaptığı şeyler (hurma aşılama meselesi gibi)."},{"k":"n","n":3,"x":"Peygambere özel olup örneklik teşkil etmeyen durumlar (dörtten fazla evlilik gibi)."}]},{"h":"Âhâd sünnetle amel etme metodu","b":[{"k":"h","x":"A. Sahâbe"},{"k":"li","x":"Allah Resulü'ne ait olduğundan emin olmadıkça kabul etmezdi. Bu hususun tespitinde farklı metotlar takip ediyorlardı:"},{"k":"tbl","r":[["Metot","Kim"],["İki kişi işittiğini ifade ettiğinde kabul","Hz. Ebû Bekir ve Hz. Ömer"],["Raviye yemin ettirme","Hz. Ali"],["Raviye güvendikleri için kabul","Bazen"]]},{"k":"h","x":"B. Mezhep imamları"},{"k":"li","x":"Bütün mezhep imamları ravinin **Müslüman, âdil, akıl-bâliğ ve zabt ehli** olması hususunda müttefiktirler. Bu 4 şart dışında:"},{"k":"tbl","r":[["Mezhep","Ek şartlar"],["**1. Hanefîler**","a) Ravinin, rivayet ettiği hadisin aksine amel etmemesi veya bu rivayete aykırı fetva vermemiş olması. b) Hadisin umûm-i belvâdan olmaması (namazda olduğu gibi herkesin bilmesi gereken bir konu). c) Ravi müçtehid değilse hadisin kıyasa ve şer'î esaslara aykırı olmaması."],["**2. Mâlikîler**","Hadis, Medine ehlinin ameline aykırı olmamalı."],["**3. Şâfiîler**","Senedin sahih ve muttasıl olması."],["**4. Hanbelîler**","Ek bir şart koşmazlar."]]}]},{"h":"A3. İcmâ","b":[{"k":"d","t":"İcmâ","x":"Hz. Peygamber'in vefatından sonra bütün Müslüman müçtehidlerin herhangi bir asırda bir olay hakkında şer'î bir hüküm üzerinde ittifak etmeleridir."},{"k":"h","x":"Rükünleri / şartları"},{"k":"n","n":1,"x":"Olayın meydana geldiği asırda birkaç müçtehid bulunmalı. (Tek bir müçtehidle ittifak olmaz.)"},{"k":"n","n":2,"x":"O olayın hükmü üzerinde bütün müçtehidler (memleket, cins vb. ayrımı yapılmaksızın) ittifak etmeli."},{"k":"n","n":3,"x":"Bir görüşe göre müçtehidler görüşlerini sarih olarak beyan etmeli; buna göre sükûtî icmâ sayılmaz."},{"k":"n","n":4,"x":"Bütün müçtehidler ittifak etmeli. Biri bile muhalefet ederse icmâ gerçekleşmez."},{"k":"li","x":"Diğer kaynaklarda bunlara ek olarak: müçtehidlerin Hz. Peygamber'in ümmetinden olmaları, icmânın Hz. Peygamber'in vefatından sonra meydana gelmesi ve icmânın konusunun dinî bir mesele olması."},{"k":"h","x":"Hücciyeti"},{"k":"n","n":1,"x":"«يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ» İbn Abbas gibi müfessirlere göre «أُولِي الْأَمْرِ» ulemâdır."},{"k":"n","n":2,"x":"«لَا تَجْتَمِعُ أُمَّتِي عَلَى خَطَأٍ»"}]},{"h":"İcmânın imkânı","b":[{"k":"h","x":"1. Mümkün değil"},{"k":"li","x":"Bu görüşü Nazzâm ve bazı Şiîler savunur. Çünkü:"},{"k":"li","x":"Bir kimsenin içtihad seviyesine ulaşıp ulaşmadığını bilmenin bir ölçüsü yoktur."},{"k":"li","x":"Diyelim ki ölçüldü ve tespit edildi; bunlar farklı bölge ve kıtalardayken kesin görüşlerine nasıl ulaşılacak?"},{"k":"li","x":"Diyelim ki ulaşıldı; daha sonra görüş değiştirmediklerinden nasıl emin olunacak?"},{"k":"li","x":"İcmâ münakid olursa müçtehidlerin dayandığı bir delil olması gerekir. Bu delil ya kat'î olur ki bunun Müslümanlardan gizli kalması mümkün değildir, ya da zannî olur ki bununla icmâ olmaz."},{"k":"dikkat","x":"Ahmed b. Hanbel'in de icmâyı kabul etmediği söylenir. Hâlbuki kabul eder; fakat ihtiyattan buna \"icmâ\" demez."},{"k":"h","x":"2. Mümkün"},{"k":"li","x":"Cumhur bu görüştedir ve icmâ bilfiil vuku bulmuştur."},{"k":"ornek","x":"Hz. Ebû Bekir'in hilafeti, domuz iç yağının haram oluşu, ninenin altıda bire (1/6) varis olması."},{"k":"not","x":"Hallâf'a göre icmâ ancak devlet eliyle mümkün olabilir."}]},{"h":"İcmânın kısımları ve kaynak değeri","b":[{"k":"tbl","r":[["Kısım","Tanımı","Diğer adı","Kaynak değeri"],["**1. Sarih icmâ**","Her bir müçtehidin görüşünü açıkça belirtmesidir.","Hakiki icmâ","Cumhura göre kesin bilgi ifade eder; uymak vâcip, uymamak haramdır. Delaleti kat'îdir."],["**2. Sükûtî icmâ**","Bazı müçtehidlerin görüşlerini açıkça belirtip bazılarının muvafakat veya muhalefetini belirtmeyip sustukları icmâ türüdür.","İtibarî icmâ","Delaleti zannîdir. Şâfiîler ve Mâlikîler bunu kabul etmez."]]}]},{"h":"A4. Kıyas","b":[{"k":"d","t":"Kıyas","x":"Hükmüne dair bir nass bulunmayan bir vakıayı, illetteki eşitlik nedeniyle hükmüne dair nass bulunan bir vakıaya ilhak etmektir."},{"k":"dikkat","x":"Kıyas hükmü ortaya koyan (müsbit) değil, ortaya çıkaran (muzhir) bir delildir."},{"k":"ornek","x":"Şarabın haramlığına rakı kıyas edilmiştir. İlletleri birdir, eşittir: sarhoşluk."},{"k":"h","x":"Hücciyeti"},{"k":"n","n":1,"x":"**Kitap:** «فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ»"},{"k":"n","n":2,"x":"**Sünnet:** Muâz b. Cebel hadisi."},{"k":"n","n":3,"x":"**Sahâbe fiilleri:** Hz. Ebû Bekir'in hilafetini namaz imamlığına kıyas etmeleri."},{"k":"ar","a":"رَضِيَهُ رَسُولُ اللَّهِ لِدِينِنَا أَفَلَا نَرْضَاهُ لِدُنْيَانَا","x":"Resulullah onu dinimiz için uygun gördü; biz onu dünyamız için uygun görmeyelim mi?"},{"k":"n","n":4,"x":"**Aklî deliller:** Maslahat esastır. Kur'an ve sünnet sınırlı, hadiseler sınırsızdır. Kıyas, selim bir fıtratın gereğidir."},{"k":"dikkat","x":"Nazzâm, Zâhirîler ve bazı Şiî âlimler kıyası kabul etmez."}]},{"h":"Kıyasın rükünleri ve aslın hükmünün şartları","b":[{"k":"tbl","r":[["Rükün","Tanımı","Diğer adları"],["**1. Asıl**","Hükmü hakkında nass bulunandır.","«الْمَقِيسُ عَلَيْهِ، الْمَحْمُولُ عَلَيْهِ، الْمُشَبَّهُ بِهِ»"],["**2. Fer'**","Hükmü hakkında nass bulunmayandır.","«الْمَقِيسُ، الْمَحْمُولُ، الْمُشَبَّهُ»"],["**3. Aslın hükmü**","Asla sabit olan ve fer'e uygulanmak istenen hükümdür.","—"],["**4. İllet**","Asla ait hükmün konulmasına sebep olan niteliktir.","—"]]},{"k":"h","x":"Aslın hükmünün şartları"},{"k":"n","n":1,"x":"**Nassla sabit olmalı.** Bu nass Kitap ve Sünnet ise ihtilaf yoktur. İcmâ ise iki görüş vardır: A) Kıyas yapılmaz. B) Kıyas yapılır."},{"k":"dikkat","x":"İttifakla, kıyas ile sabit olan bir hükme başka bir olay kıyas edilmez."},{"k":"n","n":2,"x":"**Akıl ile idrak edilebilecek bir illeti olmalı.** Yani illeti bildirilmeyen taabbüdî bir hüküm olmamalı."},{"k":"n","n":3,"x":"**Aslın hükmü asla has olmamalı.** Hz. Peygamber'in dörtten fazla evliliği gibi."}]},{"h":"İllet","b":[{"k":"li","x":"İlletin diğer adları: «مَنَاطٌ، أَمَارَةٌ، سَبَبٌ»"},{"k":"not","x":"Not: mazinne (مَظِنَّة) → illet · mi'inne (مَئِنَّة) → hikmet."},{"k":"h","x":"Hikmet ile illet arasındaki fark"},{"k":"d","t":"Hikmet","x":"Hükmün konuluş amacıdır."},{"k":"d","t":"İllet","x":"Hükmün üzerine kurulduğu, varlığı onun varlığına, yokluğu da onun yokluğuna bağlanan niteliktir."},{"k":"ornek","x":"Seferde kasr-ı salâtın hikmeti meşakkatin def'idir; illeti ise seferdir."},{"k":"h","x":"İllet ile sebep arasındaki fark"},{"k":"li","x":"Akıl ile idrak edilebiliyorsa hem illet hem sebep denir; akıl ile idrak edilemiyorsa sadece sebep denir."},{"k":"ornek","x":"Sefer, kasr-ı salât için hem illet hem sebeptir. Fakat güneşin batması akşam namazının farziyeti için sebeptir, illet değildir."},{"k":"li","x":"Aralarında umûm-husûs-ı mutlak (عموم وخصوص مطلق) vardır: her illet sebeptir, her sebep illet değildir."},{"k":"h","x":"İlletin şartları"},{"k":"tbl","r":[["Şart","Açıklama"],["**1. Zâhir**","Açık olacak."],["**2. Munzabıt**","Standart olacak; şahıstan şahısa değişmeyecek."],["**3. Münâsib**","Hükme uygun olacak."],["**4. Müteaddî**","Gayr-ı kâsır olacak; kişiye özel olmayacak."]]}]},{"h":"İllet ile hüküm arasındaki münasebet","b":[{"k":"tbl","r":[["Kısım","Tanım","Örnek"],["**1. el-Münâsibü'l-müessir**","Nass veya icmâ ile bizzat hükme illet olduğu sabit olan vasıf","Hayız ayeti: hüküm «اعْتِزَال», illet «أَذًى»"],["**2. el-Münâsibü'l-mülâim**","Nass veya icmâ ile bizzat o hükme illet olduğu sabit olmayan; ancak cinsinin cinsine itibar edilen vasıf","Yağmurda namazların cem'i"],["**3. el-Münâsibü'l-mürsel**","Şâriin itibar veya ilga ettiğine dair bir delil bulunmayan vasıf; maslahat-ı mürsele de denir","—"],["**4. el-Münâsibü'l-mülgâ**","Şâriin itibar etmediğine, ilga ettiğine dair bir delil bulunan vasıf","Erkek ve kızın karabette eşit, mirasta farklı olması"]]},{"k":"h","x":"1. el-Münâsibü'l-müessir"},{"k":"ar","a":"الْوَصْفُ الْمُنَاسِبُ الَّذِي رَتَّبَ الشَّارِعُ حُكْمًا عَلَى وَفْقِهِ وَثَبَتَ بِالنَّصِّ أَوِ الْإِجْمَاعِ اعْتِبَارُهُ بِعَيْنِهِ عِلَّةً لِلْحُكْمِ الَّذِي رُتِّبَ عَلَى وَفْقِهِ","x":"Kitabın tanımı"},{"k":"ar","a":"إِنِ اعْتُبِرَ بِنَصٍّ أَوْ إِجْمَاعٍ عَيْنُ الْوَصْفِ فِي عَيْنِ الْحُكْمِ","x":"Daha kısa bir tanım"},{"k":"ar","a":"وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ","x":"Örnek. Hüküm: «اعْتِزَال»; illet: «أَذًى»"},{"k":"h","x":"2. el-Münâsibü'l-mülâim"},{"k":"ar","a":"الْوَصْفُ الْمُنَاسِبُ الَّذِي رَتَّبَ الشَّارِعُ حُكْمًا عَلَى وَفْقِهِ وَلَمْ يَثْبُتْ بِالنَّصِّ أَوِ الْإِجْمَاعِ اعْتِبَارُهُ بِعَيْنِهِ عِلَّةً لِنَفْسِ الْحُكْمِ الَّذِي رُتِّبَ عَلَى وَفْقِهِ","x":"Kitabın tanımı"},{"k":"ar","a":"وَإِنْ لَمْ يُعْتَبَرْ بِهَا بَلْ بِتَرْتِيبِ الْحُكْمِ عَلَى وَفْقِهِ وَلَوْ بِاعْتِبَارِ جِنْسِهِ فِي جِنْسِهِ","x":"Daha kısa bir tanım"},{"k":"li","x":"3 kısmı vardır."},{"k":"ornek","x":"Yağmurda namazların cem'i. Yağmurun cem'in illeti olduğuna dair bir nass veya icmâ yoktur; fakat seferin cem'e illet olduğuna dair nass vardır. Yağmur buna kıyaslanmıştır."},{"k":"h","x":"3. el-Münâsibü'l-mürsel"},{"k":"li","x":"Şâriin itibar veya ilga ettiğine dair bir delil bulunmayan vasıftır. Maslahat-ı mürsele de denilebilir."},{"k":"h","x":"4. el-Münâsibü'l-mülgâ"},{"k":"li","x":"Şâriin itibar etmediğine, ilga ettiğine dair bir delil bulunan vasıftır."},{"k":"ornek","x":"Erkek ve kızın karabette eşit, mirasta ise farklı olmaları. Abdurrahman b. Hakem ve Yahyâ b. Yahyâ el-Leysî meselesi."}]},{"h":"Mesâliku'l-illet (illeti bulma yolları)","b":[{"k":"h","x":"1. Nass"},{"k":"tbl","r":[["Kısım","Açıklama","Edatlar"],["**A. Sarih**","Talil edatı bulunan nass","«مَا فِيهِ أَدَاةُ التَّعْلِيلِ»"],["**A-1. Kat'î**","Sadece talil manasında gelen, başka manaya gelmeyen edatlar","«مِنْ أَجْلِ، لِأَجْلِ، لِأَنَّ، كَيْ، لِعِلَّةِ كَذَا، لِسَبَبِ كَذَا، لِأَجْلِ كَذَا»"],["**A-2. Zannî**","Talil dışında başka manaya da gelebilen edatlar","«لِ، بِ، فَ، إِنَّ»"],["**B. Îmâ, işaret**","Talil edatı bulunmayan nass","«مَا لَيْسَ فِيهِ أَدَاةُ التَّعْلِيلِ»"]]},{"k":"ar","a":"لَا يَرِثُ الْقَاتِلُ","x":"Örnek. İlleti, «الْقَاتِل»in kendisinden türediği «الْقَتْل»dir."},{"k":"ar","a":"تَعْلِيقُ الْحُكْمِ بِالْمُشْتَقِّ يُشْعِرُ بِعِلِّيَّةِ الْمُشْتَقِّ مِنْهُ","x":"Hükmün türemiş bir kelimeye bağlanması, kelimenin türediği kökün illet olduğunu hissettirir."},{"k":"h","x":"2. İcmâ"},{"k":"d","t":"Kıyas maa'l-fârık","x":"İllet birliğinin sağlanamadığı kıyastır."},{"k":"d","t":"Kıyas fâsidü'l-i'tibâr","x":"Fer' hakkında nass varken kıyas yapmaktır."},{"k":"h","x":"3. Sebr ve taksim"},{"k":"d","t":"Sebr","x":"Deneme, sınamadır."},{"k":"d","t":"Taksim","x":"Ayırmak, bölmektir."},{"k":"steps","x":["Bir konuda muhtemel seçenekleri belirlemek (hasr)","Bunları birer birer elemek (hazf)","Geriye kalan tek seçeneği illet kabul etmek"]},{"k":"ornek","x":"Hamr ve kokain: akıcılık, renk, koku ve tat ikisinde ortak değildir, elenir; geriye **sarhoş edicilik** kalır. İllet budur."},{"k":"tbl","r":[["Vasıf","Hamr","Kokain"],["Akıcılık","✗","✗ (katılık)"],["Renk","✗","✗"],["Koku","✗","✗"],["Tat","✗","✗"],["**Sarhoş edicilik**","✓","✓"]]},{"k":"h","x":"Menât kavramları"},{"k":"d","t":"Tahrîcü'l-menât","x":"İlleti bulma yollarıyla illeti tespit etmektir."},{"k":"d","t":"Tenkîhu'l-menât","x":"Nassta geçen vasıflardan illet olmaya elverişli olanı tespit etmektir. Sebr ve taksimden farkı, vasıfların nassta geçmesidir."},{"k":"d","t":"Tahkîku'l-menât","x":"Asılda geçen illetin fer'de bulunduğundan emin olmaktır."}]},{"h":"B1. İstihsan","b":[{"k":"d","t":"İstihsan","x":"Müçtehidin kıyas-ı hafîyi kıyas-ı celîye veya istisnaî hükmü küllî hükme tercih etmesidir."},{"k":"h","x":"1. Kıyas-ı hafînin kıyas-ı celîye tercihi"},{"k":"ornek","x":"Hanefîlere göre yırtıcı kuşların artıkları temizdir."},{"k":"tbl","r":[["","Açıklama"],["**Açık (celî) kıyas**","Diğer yırtıcılarda olduğu gibi bunların da etleri haram olduğu gibi artıklarının da haram ve necis olması."],["**Gizli (hafî) kıyas**","Bunlar diğer yırtıcılar gibi değildir. Çünkü diğer yırtıcıların tükürükleri artıklarına bulaşır; onlar dilleriyle içerler."],["**Vech-i istihsan**","Yırtıcı kuşların eti haram olsa da tükürükleri artıklarına karışmaz; çünkü temiz bir kemik olan gagalarıyla içerler."]]},{"k":"h","x":"2. Küllî hükmün bırakılıp istisnaî hükmün tercihi"},{"k":"li","x":"**Küllî hüküm:** Ma'dûmun satışı yasaktır."},{"k":"li","x":"**İstisnaî hüküm:** Selem akdi ihtiyaçtan dolayı istihsanen caizdir."},{"k":"h","x":"Hücciyeti"},{"k":"li","x":"Hanefîlerin kabul ettiği bu delil ya kıyastır (1. çeşidi) ya da maslahat-ı mürseledir (2. çeşidi). Her ikisi de sahih bir istidlaldir."}]},{"h":"B2. Maslahat-ı mürsele","b":[{"k":"d","t":"Maslahat-ı mürsele","x":"İnsanlara bir fayda sağlayıp veya onlardan bir zararı giderip itibar veya ilgasına dair bir delil bulunmayan delil çeşididir."},{"k":"h","x":"Şartları"},{"k":"n","n":1,"x":"Maslahat hakiki olacak, vehmî olmayacak."},{"k":"n","n":2,"x":"Umumi olacak, şahsi değil."},{"k":"n","n":3,"x":"Maslahat, nass veya icmâ ile sabit bir hükme muarız olmayacak."},{"k":"h","x":"Hücciyeti"},{"k":"tbl","r":[["","Delilleri"],["**1. Kabul edenler**","A) İnsanların maslahatları yenilenir, bitmez. B) Sahâbe, tâbiîn ve müçtehid imamlar döneminde maslahatı sağlamak için birçok hüküm konmuştur (Kur'an'ın cem'i ve istinsahı gibi)."],["**2. Kabul etmeyenler**","A) Şâri zaten maslahatı nasslarda gözetmiştir. B) Bu yöntem hevâ ile hükmetmeye götürür."]]}]},{"h":"B3. Sedd-i zerâi","b":[{"k":"d","t":"Sedd-i zerâi","x":"Mefsedete götüren vasıtaların yasaklanmasıdır."},{"k":"h","x":"Mefsedete götüren vasıtalar"},{"k":"tbl","r":[["Vasıta","Hükmü","Örnek"],["**1. Haram**","İttifakla yasaklanır","Nesebin karışmasına sebep olan zina"],["**2-A. Mübah; nadiren mefsedete götüren**","İttifakla yasaklanmaz","Üzüm üretimi; nadiren de olsa içki üretimine vesile olabilir"],["**2-B. Mübah; çoğu zaman mefsedete götüren**","İhtilaflı","Bankaya kira ile (yer) vermek"],["**2-C. Konuluş amacı dışında bir sonuca vasıta kılınan meşru fiiller**","İhtilaflı","Ölüm hastalığında kişinin karısını mirastan men etmek için boşaması; normalde talak meşrudur"]]},{"k":"h","x":"Son iki kısım hakkında"},{"k":"li","x":"A) **Mâlikî ve Hanbelîlere** göre yasaklanır."},{"k":"li","x":"B) **Şâfiî, Hanefî ve Zâhirîlere** göre yasaklanmaz."},{"k":"not","x":"Sedd-i zerâi, maslahat-ı mürseleyi destekler ve kuvvetlendirir."}]},{"h":"B4. Örf / Âdet","b":[{"k":"d","t":"Örf","x":"İnsanların benimseyip alışkanlık hâline getirdikleri söz, fiil ve terktir."},{"k":"dikkat","x":"Halkın ittifakı **örf**, müçtehidlerin ittifakı **icmâdır**."},{"k":"tbl","r":[["Ayrım","Kısım","Örnek"],["**Konusuna göre**","1. Amelî örf","Teâtî satışı"],["","2. Kavlî örf","\"Veled\" lafzının sadece erkek çocuk için kullanılması"],["**Değerine göre**","A. Sahih örf: şer'î bir delile aykırı olmayan","İstisnâ (ısmarlama) akdi; mehrin muaccel ve müeccel olması"],["","B. Bâtıl örf: şer'î bir delile muhalif olan","İçkili düğünler"]]},{"k":"h","x":"Hükmü"},{"k":"li","x":"Müçtehid fetvasında, kadı kazasında örfe riayet etmelidir."},{"k":"ar","a":"الثَّابِتُ بِالْعُرْفِ كَالثَّابِتِ بِالنَّصِّ","x":"Âlimler örfle sabit olanı nassla sabit olan gibi sayıp ona önem göstermişlerdir."}]},{"h":"B5. İstishab","b":[{"k":"ar","a":"إِبْقَاءُ مَا كَانَ عَلَى مَا كَانَ","x":""},{"k":"d","t":"İstishab","x":"Değiştiğine dair bir delil bulunmadıkça mevcut hâlin devamına hükmedilmesidir."},{"k":"h","x":"Hücciyeti"},{"k":"li","x":"Müçtehidin başvurduğu son delildir."},{"k":"h","x":"İstishaba dayalı şer'î ilkeler"},{"k":"ar","a":"الْأَصْلُ فِي الْأَشْيَاءِ الْإِبَاحَةُ","x":"Eşyada asıl olan mübahlıktır."},{"k":"ar","a":"مَا ثَبَتَ بِالْيَقِينِ لَا يَزُولُ بِالشَّكِّ","x":"Kesin olarak sabit olan şüpheyle ortadan kalkmaz."},{"k":"ar","a":"الْأَصْلُ فِي الْإِنْسَانِ الْبَرَاءَةُ","x":"İnsanda asıl olan beraattir (suçsuzluktur)."}]},{"h":"B6. Şer'u men kablenâ","b":[{"k":"tbl","r":[["Durum","Hükmü","Örnek"],["**A. Kur'an'da geçmeyen**","Şeriat değildir","—"],["**B-1. Kur'an'da geçen; neshedilen**","Şeriat değildir","Günahı karşılığı tevbesi için kendisini öldürmesi"],["**B-2. Kur'an'da geçen; emredilen**","Şeriattır","Oruç"],["**B-3. Kur'an'da geçen; mutlak olarak zikredilen**","Hanefî, Mâlikî ve Şâfiîlere göre şeriattır; diğerlerine göre değildir","Kısas ayeti"]]},{"k":"ar","a":"وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالْأَنْفَ بِالْأَنْفِ وَالْأُذُنَ بِالْأُذُنِ وَالسِّنَّ بِالسِّنِّ وَالْجُرُوحَ قِصَاصٌ","x":"Mâide 5/45"}]},{"h":"B7. Sahâbe kavli","b":[{"k":"tbl","r":[["Durum","Hükmü"],["**A. Sahâbe bir konuda ittifak etmişse**","Hüccettir; bu konuda ihtilaf yoktur."],["**B. İçtihada kapalı konularda**","Hüccettir; ihtilaf yoktur."],["**C. Sahâbenin kendi rey ve içtihadıyla söylediği, ittifak edilmeyen konular**","Hanefîlere göre hüccettir; Şâfiîlere göre değildir."]]}]}],"ht":[{"s":0,"x":"Müttefekun aleyh 4 delil: Kitap, Sünnet, İcmâ, Kıyas. Muhtelefun fîh 7 delil: Maslahat-ı mürsele, İstihsan, Örf, Sedd-i zerâi, Şer'u men kablenâ, Sahâbe kavli, İstishab."},{"s":1,"x":"Kitap: lafız ve mana Allah'ın; müteradifi ve tercümesi Kur'an değil; tevatürle nakledilmiş; Arapça. Delil olarak 1. sırada."},{"s":2,"x":"Kur'an hükümleri: itikadî, ahlakî, amelî. Sübûtu kat'î; delaleti tek manaya ihtimalliyse kat'î, birden fazlaysa zannî."},{"s":3,"x":"Sünnet: kavlî, fiilî, takrirî. Hücciyeti: ayetler, sahâbe icmâı, mücmel farzların sünnetle anlaşılması."},{"s":4,"x":"Sünnetin Kur'an'a nispeti: te'kid · tebyin/takyid/tahsis · yeni hüküm isbatı · (Hanefîlere göre) nesih."},{"s":5,"x":"Hanefîlere göre: mütevâtir, meşhur, âhâd. Cumhura göre: mütevâtir ve âhâd; âhâd: meşhur/müstefîz (3), azîz (2), garîb (1)."},{"s":6,"x":"Teşrî özelliği olmayanlar: tabiat gereği (yeme-içme) · dünya işlerinde tecrübe (hurma aşılama) · Peygambere özel (dörtten fazla evlilik)."},{"s":7,"x":"Ortak 4 şart: Müslüman, âdil, akıl-bâliğ, zabt. Hanefî: ravi aksine amel etmemiş, umûm-i belvâ değil, (müçtehid değilse) kıyasa aykırı değil. Mâlikî: Medine ameline aykırı değil. Şâfiî: sahih ve muttasıl sened. Hanbelî: ek şart yok."},{"s":8,"x":"İcmânın şartları: birkaç müçtehid · hepsinin ittifakı (ayrım yok) · (bir görüşe göre) sarih beyan · biri muhalefet ederse icmâ olmaz."},{"s":8,"x":"İcmânın hücciyeti: ulu'l-emre itaat ayeti (ulu'l-emr = ulemâ) ve \"Ümmetim hata üzerinde birleşmez\" hadisi."},{"s":9,"x":"İcmâ mümkün değil: Nazzâm ve bazı Şiîler. Mümkün ve vaki: cumhur (Ebû Bekir'in hilafeti, domuz iç yağı, ninenin 1/6'sı). Hallâf: ancak devlet eliyle."},{"s":10,"x":"Sarih (hakiki) icmâ kat'î; sükûtî (itibarî) icmâ zannî, Şâfiî ve Mâlikîler kabul etmez."},{"s":11,"x":"Kıyas müsbit değil muzhirdir. Hücciyeti: Kitap (fa'teberû), Sünnet (Muâz hadisi), sahâbe (Ebû Bekir'in hilafeti), akıl. Kabul etmeyenler: Nazzâm, Zâhirîler, bazı Şiîler."},{"s":12,"x":"Kıyasın 4 rüknü: asıl (makîs aleyh), fer' (makîs), aslın hükmü, illet."},{"s":12,"x":"Aslın hükmünün şartları: nassla sabit · aklen idrak edilebilir illetli (taabbüdî değil) · asla has değil."},{"s":13,"x":"Hikmet: hükmün konuluş amacı (meşakkatin def'i). İllet: hükmün bağlandığı nitelik (sefer). Mazinne → illet, mi'inne → hikmet."},{"s":13,"x":"Aklen idrak edilen sebep hem illet hem sebep; edilemeyen sadece sebep (güneşin batması). İllet ile sebep arasında umûm-husûs-ı mutlak."},{"s":13,"x":"İlletin şartları: zâhir, munzabıt, münâsib, müteaddî."},{"s":14,"x":"Münasebet: müessir (nass/icmâ ile aynı vasıf aynı hükme: hayızda «أذى»), mülâim (cins cinse: yağmurda cem'), mürsel (itibar da ilga da yok: maslahat-ı mürsele), mülgâ (ilga edilmiş: mirasta eşitlik)."},{"s":15,"x":"İlleti bulma yolları: nass (sarih: kat'î/zannî; îmâ-işaret), icmâ, sebr ve taksim."},{"s":15,"x":"Sebr ve taksim: seçenekleri belirle (hasr), ele (hazf), kalan illettir. Tenkîhu'l-menâtta vasıflar nassta geçer."},{"s":15,"x":"Tahrîc: illeti bulmak · Tenkîh: nasstaki vasıflardan ayıklamak · Tahkîk: illetin fer'de olduğunu doğrulamak."},{"s":16,"x":"İstihsan: kıyas-ı hafîyi kıyas-ı celîye (yırtıcı kuş artığı) veya istisnaî hükmü küllî hükme (selem) tercih. 1. çeşidi kıyas, 2. çeşidi maslahat-ı mürseledir."},{"s":17,"x":"Maslahat-ı mürselenin şartları: hakiki (vehmî değil) · umumi (şahsi değil) · nass veya icmâya muarız değil."},{"s":18,"x":"Sedd-i zerâi: haram vasıta ittifakla yasak; nadiren mefsedete götüren mübah ittifakla serbest; çoğu zaman götüren ve amaç dışı kullanılan meşru fiil Mâlikî-Hanbelîye göre yasak, Şâfiî-Hanefî-Zâhirîye göre değil."},{"s":19,"x":"Örf: halkın ittifakı (icmâ müçtehidlerin). Amelî (teâtî) / kavlî (veled). Sahih (istisnâ) / bâtıl (içkili düğün). Müftü ve kadı riayet eder."},{"s":20,"x":"İstishab: \"olanı olduğu gibi bırakmak\"; müçtehidin son delili. Kaideleri: eşyada asıl ibaha, yakîn şekle zail olmaz, insanda asıl beraat."},{"s":21,"x":"Şer'u men kablenâ: Kur'an'da geçmeyen ve neshedilen şeriat değil; emredilen şeriat; mutlak zikredilen Hanefî-Mâlikî-Şâfiîye göre şeriat."},{"s":22,"x":"Sahâbe kavli: ittifak ettikleri ve içtihada kapalı konularda hüccet; kendi içtihatlarında Hanefîlere göre hüccet, Şâfiîlere göre değil."}]},{"t":"Mebâhisu'l-Ahkâm","intro":"Hâkim, hüküm, mahkûm fîh ve mahkûm aleyh; teklifî ve vaz'î hükümler ve kısımları; fiilin yükümlü kılınabilmesinin şartları; ehliyet ve ehliyet arızaları.","s":[{"h":"Temel kavramlar","b":[{"k":"tbl","r":[["Kavram","Tanımı","Arapça"],["**Hâkim**","Hükmün kendisinden sâdır olduğu (Allah)","«مَنْ صَدَرَ عَنْهُ الْحُكْمُ»"],["**Hüküm**","Allah'ın mükelleflerin fiillerine taalluk eden hitabı","«خِطَابُ اللَّهِ الْمُتَعَلِّقُ بِأَفْعَالِ الْمُكَلَّفِينَ»"],["**Mahkûm fîh**","Mükellefin fiili","«فِعْلُ الْمُكَلَّفِ»"],["**Mahkûm aleyh**","Mükellef","«الْمُكَلَّفُ»"]]},{"k":"d","t":"Hüküm","x":"Allah'ın mükelleflerin fiillerine taalluk eden hitabıdır."},{"k":"h","x":"Hüsün ve kubuh aklen bilinir mi?"},{"k":"tbl","r":[["Mezhep","Görüşü"],["**Mâtürîdî**","Hüsün ve kubuh akılla bilinebilir."],["**Mu'tezile**","Hüsün ve kubuh akılla bilinebilir."],["**Eş'arî**","Hüsün ve kubuh akılla bilinemez; şer'îdir."]]}]},{"h":"Hüküm: teklifî ve vaz'î","b":[{"k":"h","x":"1. Teklifî hüküm"},{"k":"d","t":"Teklifî hüküm","x":"Şâriin mükelleften yapmasını, terk etmesini ya da yapmakla terk etmek arasında muhayyer bırakılmasını istediği hükümdür."},{"k":"tbl","r":[["Kısım","","Örnek"],["**A. Talebî**","A1. Talebü'l-fiil","«أَقِيمُوا الصَّلَاةَ»"],["","A2. Talebü't-terk","«وَلَا تَقْرَبُوا الزِّنَا»"],["**B. Tahyîrî**","İbaha ifade eder","«وَإِذَا حَلَلْتُمْ فَاصْطَادُوا»"]]},{"k":"h","x":"2. Vaz'î hüküm"},{"k":"d","t":"Vaz'î hüküm","x":"Bir şeyin bir şeye sebep, şart veya engel (mâni) konulmasını gerektiren hükümdür."},{"k":"tbl","r":[["Kısım","Örnek"],["**A. Sebep**","«وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا»"],["**B. Şart**","«لَا نِكَاحَ إِلَّا بِشَاهِدَيْنِ»"],["**C. Mâni**","«لَا يَرِثُ الْقَاتِلُ»"]]},{"k":"h","x":"Teklifî ile vaz'î hüküm arasındaki farklar"},{"k":"tbl","r":[["","Teklifî hüküm","Vaz'î hüküm"],["**Talep**","Talep (emir, nehiy ve tahyîr) vardır","Talep yoktur"],["**Kudret**","Mükellefin kudreti dahilindedir","Bazen kudreti dahilindedir, bazen değildir («الْقَرَابَةُ سَبَبٌ لِلْإِرْثِ» gibi)"]]}]},{"h":"Teklifî hükümlerin kısımları: 1. Vâcib","b":[{"k":"d","t":"Vâcib","x":"Şâriin kesin olarak yapılmasını istediği şeydir."},{"k":"li","x":"Bu kesinlik bazen talep sîgasından, bazen yapılmaması hâlinde ceza bildirilmesinden, bazen de başka bir şer'î karineden bilinir."},{"k":"h","x":"Taksimi"},{"k":"tbl","r":[["Bakımından","Kısım","Tanımı","Örnek"],["**1. Zaman**","1A. Mutlak","Belli bir vakit tayin edilmeyen","Keffaretler"],["","1B. Muvakkat","Belli bir vakit tayin edilen; 3'e ayrılır","—"],["","1BA. Muvassa'","Vakit içinde kendi cinsinden başka bir ibadet yapılabilen","Öğle namazı"],["","1BB. Mudayyak","Vakit içinde kendi cinsinden başka bir ibadet yapılamayan","Ramazan orucu"],["","1BC. Zü'ş-şebeheyn","—","—"],["**2. Yapılması istenmesi**","2A. Kifâî","Topluca","Cenaze namazı"],["","2B. Aynî","Teker teker, herkes","Beş vakit namaz"],["**3. Miktar**","3A. Muhadded","Miktarı belirlenmiş","Zekât"],["","3B. Gayr-ı muhadded","Miktarı belirlenmemiş","İnfak"],["**4. Seçenek**","4A. Muayyen","«مَا طَلَبَهُ الشَّارِعُ بِعَيْنِهِ»","Kurban; kurban yerine infak olmaz"],["","4B. Muhayyer","«مَا طَلَبَهُ الشَّارِعُ وَاحِدًا مِنْ أُمُورٍ مُعَيَّنَةٍ»","Yemin keffareti"]]}]},{"h":"2. Mendub","b":[{"k":"d","t":"Mendub","x":"Şâriin kesin olmayarak yapılmasını istediği şeydir."},{"k":"li","x":"Bu kesin olmayan talep bazen sîgayla («فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًا» gibi), bazen de karineyle (müdâyene ayeti gibi) bilinir."},{"k":"h","x":"Taksimi"},{"k":"tbl","r":[["Kısım","Diğer adları","Hükmü","Örnek"],["**1. Kuvvetli bir şekilde yapılması istenen**","Sünnet-i müekkede, hüdâ","Faili sevap alır; terki ikab değil, itab gerektirir","Cemaatle namaz"],["**2. Yapılması meşru olan**","Sünnet-i gayr-ı müekkede, sünnet-i zâide, nâfile","Faili sevap alır; terki ikab ve itab gerektirmez","Perşembe orucu"],["**3. Zâid**","Mükellefin kemâliyyâtından sayılır","Hz. Peygamber'in insan olarak yaptığı işleri ona uyma maksadıyla yapmaktır; sevap alınır. Uyma maksadı yoksa yapılıp yapılmamasının olumlu ya da olumsuz bir karşılığı yoktur","Yemek, içmek, uyumak"]]}]},{"h":"3. Muharram","b":[{"k":"d","t":"Muharram","x":"Şâriin kesin olarak yapılmamasını istediği şeydir."},{"k":"li","x":"Bu kesinlik bazen nehiy sîgasıyla, bazen kesinliğe delalet eden nehiy sîgasıyla («وَلَا تَقْرَبُوا الزِّنَا» gibi), bazen ictinab sîgasıyla, bazen de yapılması hâlinde ceza bildirilmesinden bilinir."},{"k":"h","x":"Taksimi"},{"k":"tbl","r":[["Kısım","Tanımı","Örnek"],["**1. Li-zâtihî**","Baştan beri hükmü haram olan","Zina"],["**2. Li-gayrihî**","Sonradan meydana gelen bir sebepten dolayı haram olan. İşlenmesi haram olsa da akid sahih, ibadet makbuldür","Gasbedilmiş elbiseyle namaz; aldatma ile alım satım"]]}]},{"h":"4. Mekruh","b":[{"k":"d","t":"Mekruh","x":"Şâriin kesin olmayarak yapılmamasını istediği şeydir."},{"k":"li","x":"Bu kesin olmayan nehiy bazen «كُرِهَ» sîgasıyla, bazen kerahete delalet eden nehiy sîgasıyla, bazen de kerahete delalet eden bir karineyle ictinab emredilmesiyle bilinir."},{"k":"ar","a":"لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ","x":"Kerahete delalet eden nehiy sîgası"},{"k":"ar","a":"وَذَرُوا الْبَيْعَ","x":"Kerahete delalet eden karineyle ictinab emri"}]},{"h":"5. Mübah","b":[{"k":"ar","a":"مَا خَيَّرَ الشَّارِعُ الْمُكَلَّفَ بَيْنَ فِعْلِهِ وَتَرْكِهِ","x":""},{"k":"d","t":"Mübah","x":"Şâriin mükellefi yapmakla terk etmek arasında muhayyer bıraktığı şeydir."},{"k":"li","x":"Bu muhayyerlik bazen şer'î bir nassla («لَا جُنَاحَ عَلَيْكُمْ» gibi), bazen karineyle ibahaya delalet eden bir emirle («وَإِذَا حَلَلْتُمْ فَاصْطَادُوا» gibi), bazen de ibâha-i asliyye ile bilinir."},{"k":"h","x":"Hanefîlere göre teklifî hükümler"},{"k":"not","x":"Yukarıdaki beşli taksim cumhura göredir. Hanefîlere göre 7 kısımdır: 1) Farz, 2) Vâcib, 3) Haram, 4) Mendub, 5) Tenzîhen mekruh, 6) Tahrîmen mekruh, 7) Mübah."},{"k":"h","x":"Farz ile vâcib arasındaki fark"},{"k":"tbl","r":[["","Sübut ve delaleti","Terki","İnkârı"],["**Farz**","Sübutu da delaleti de kat'îdir","Azap gerektirir","Küfürdür"],["**Vâcib**","Sübut ve delaletinden biri kat'î, diğeri zannîdir","Azap gerektirir","Bid'at ve sapıklıktır"]]}]},{"h":"Vaz'î hükmün kısımları: Sebep, şart, mâni","b":[{"k":"h","x":"1. Sebep"},{"k":"ar","a":"مَا جَعَلَهُ الشَّارِعُ عَلَامَةً عَلَى مُسَبَّبِهِ (أَيِ الْحُكْمِ) وَرَبَطَ وُجُودَ الْمُسَبَّبِ بِوُجُودِهِ وَعَدَمَهُ بِعَدَمِهِ","x":""},{"k":"d","t":"Sebep","x":"Şâriin müsebbebine (hükme) alamet kıldığı, müsebbebin varlığını onun varlığına, yokluğunu onun yokluğuna bağladığı şeydir."},{"k":"tbl","r":[["Kısım","Örnek"],["**A. Teklifî bir hükme sebep olması**","«أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ»"],["**B. Mülkiyetin, helalliğin ispatına veya izalesine sebep olması**","1. çeşit: «كَالْبَيْعِ لِإِثْبَاتِ الْمِلْكِ وَإِزَالَتِهِ» · 2. çeşit: «كَالزَّوَاجِ وَالطَّلَاقِ»"]]},{"k":"li","x":"Her iki kısım da mükellefin gücü dahilinde olan ve olmayan diye ikiye ayrılır:"},{"k":"tbl","r":[["","Gücü dahilinde","Gücü dahilinde değil"],["**Teklifî**","Zekât","Beş vakit namaz (vakit)"],["**İspat–izale**","Katl","Miras"]]},{"k":"h","x":"2. Şart"},{"k":"ar","a":"مَا يَتَوَقَّفُ وُجُودُ الْحُكْمِ عَلَى وُجُودِهِ وَيَلْزَمُ مِنْ عَدَمِهِ عَدَمُ الْحُكْمِ","x":""},{"k":"d","t":"Şart","x":"Hükmün varlığının kendi varlığına bağlı olduğu, yokluğu hükmün yokluğunu gerektiren şeydir."},{"k":"dikkat","x":"Şartın yerine gelmesi meşrutun olmasını gerektirmez. Abdest alınması namazın kılınmasını gerektirmez."},{"k":"li","x":"A. **Şer'î şart:** Şâriin koyduğu şart."},{"k":"li","x":"B. **Ca'lî şart:** Mükellefin koştuğu şart; akidlerde olduğu gibi."},{"k":"h","x":"3. Mâni"},{"k":"ar","a":"مَا يَلْزَمُ مِنْ وُجُودِهِ عَدَمُ الْحُكْمِ أَوْ بُطْلَانُ السَّبَبِ","x":""},{"k":"d","t":"Mâni","x":"Varlığı hükmün yokluğunu veya sebebin bâtıl olmasını gerektiren şeydir."},{"k":"tbl","r":[["Kısım","Örnek"],["**A. Hükme mâni**","Namaz vakti girdi ama kadın hayızlı. Hayız, sebep olan vakte değil, hüküm olan namazın vücubuna engeldir."],["**B. Sebebi geçersiz kılan mâni**","Kişi nisab miktarı mala sahip ama borcu var. Borç, sebebe, yani zekâtın sebebi olan nisab miktarına sahip olmaya engeldir."]]}]},{"h":"4. Ruhsat ve az
