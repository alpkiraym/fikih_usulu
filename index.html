<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- Fıkıh Usulü: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}
details.ht{background:var(--green-soft);border:1px solid #cfe0d6;border-radius:var(--radius);margin:16px 0 10px;padding:0}
details.ht summary{cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:700;color:var(--green);font-size:1.08rem;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.ht summary::-webkit-details-marker{display:none}
details.ht summary small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.82rem;width:100%;margin-left:36px;margin-top:-6px}
details.ht .hti{width:26px;height:26px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:none}

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);
    q('add').onclick = () => { const l = getL(); l.push(get()); setL(l); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
  }
  function openList() {
    const l = getL(), su = `[${APP} Hata] Toplu bildirim (${l.length} hata)`, bo = l.map((r, i) => `--- ${i + 1} ---\n${body1(r)}`).join('\n\n');
    open(`<h3 id="bldTitle">Bildirimlerim (${l.length})</h3>
      ${l.length ? `<ul class="bld-list">${l.map((r, i) => `<li><div><b>${E(r.bas.slice(0, 90))}</b><br><small>${E(r.yer)} · ${E(r.type)}${r.note ? ' — ' + E(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
      <div class="bld-btns">${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}<button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div><div class="bld-hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    box.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { const L = getL(); L.splice(+x.dataset.del, 1); setL(L); openList(); });
    if (!l.length) return;
    q('mail').onclick = () => { const u = mailto(su, bo); if (u.length > 1900) msg.textContent = `Liste uzun; e-posta uygulaması metni kesebilir. Kesilirse “Gmail'de aç” veya “Metni kopyala”yı kullan.`; location.href = u; };
    q('gmail').href = gmail(su, bo);
    q('copy').onclick = () => copy(bo, msg);
    q('clear').onclick = () => { setL([]); openList(); };
  }
  document.addEventListener('click', e => { const b = e.target.closest('.rep[data-k]'); if (!b) return; e.preventDefault(); e.stopPropagation(); report(b); }, true);
  new MutationObserver(() => { if (!lbtn) slot(); mark(); }).observe(document.body, {childList: true, subtree: true});
  window.bldButton = (k, yer, bas, txt) => `<button type="button" class="rep" data-k="${E(k)}" data-yer="${E(yer)}" data-bas="${E(String(bas).slice(0, 400))}" title="Bu kayıttaki bir hatayı bildir">${txt || '⚑ Bildir'}</button>`;
  window.bldOpenList = openList;
  sync();
})();
</script>

  .gab-sig b{color:#1f5a45;font-weight:600}
  .gab-sig i{font-style:normal;opacity:.5}
  .gab-dim{position:fixed;inset:0;z-index:56;background:rgba(20,28,22,.38)}
  .gab-dim.open{display:block}
  html.gab-lock,html.gab-lock body{overflow:hidden!important}
  .gab-dim{touch-action:none}
  .gab-sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;z-index:57;max-height:78vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#f7f3ea;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(40,30,10,.18);padding:8px 14px calc(var(--gab-h,84px) + 12px);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2a24;font-size:15px;line-height:1.45}
  .gab-sheet.open{display:block;animation:gabUp .2s ease-out}
  .gab-sheet.full{max-height:calc(100% - 44px - env(safe-area-inset-top))}
  .gab-sheet.gab-anim{transition:transform .2s ease-out,max-height .2s ease-out}
  @keyframes gabUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
.gab-grab{position:relative;width:38px;height:5px;border-radius:3px;background:#d9cfb9;margin:2px auto 8px;cursor:grab}

.gab-hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}

.gab-kr:first-child{border-top:0}

.gab-kr .n{text-align:right;font-variant-numeric:tabular-nums}

.gab-bar i{display:block;height:5px;border-radius:3px;background:#2f7a5f}
.gab-g{font-weight:700;color:#1f5a45}.gab-g.o{color:#9a7428}.gab-g.z{color:#a8432f}.gab-g.e{color:#b9b3a6;font-weight:400}
.gab-kr.bos .nm b{color:#8b8f86}

.gab-mail{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid #e3dccb;border-radius:12px;background:#fffdf8;color:#1f5a45;font-weight:600;font-size:.9rem;text-decoration:none}
.gab-toast{position:fixed;left:50%;bottom:calc(var(--gab-h,84px) + 14px);transform:translateX(-50%);z-index:59;background:#1f2a24;color:#fff;font:500 .85rem/1.35 system-ui,-apple-system,sans-serif;padding:8px 14px;border-radius:999px;max-width:88vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
</style>

<nav class="gab" id="gab" aria-label="Giray Akademi gezinme">

    <a class="gab-b" data-k="ana" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>Ana sayfa</a>

<script>
(function(){
  var APP = window.GA_APP || 'ana';
  var I = {
    kitap:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M6.5 17A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"/>',
    terazi:'<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a4 4 0 0 0 6 0z"/><path d="M19 7l-3 7a4 4 0 0 0 6 0z"/><path d="M8 21h8"/>',
    bina:'<path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-6a2 2 0 0 1 4 0v6"/>',
    zincir:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    kalem:'<path d="M3 21.5h11"/><path d="M4.5 21.5v-3.5a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v3.5"/><path d="M7.5 15v-2h3v2"/><path d="M9 13l12.5-10.5"/><path d="M21.5 2.5C16 2.5 12.5 5 11 9.5"/><path d="M21.5 2.5C21.5 8 19 11.5 14.5 13"/>',
    kandil:'<path d="M2 19c3-1.2 6.5-1.2 10 0c3.5-1.2 7-1.2 10 0V10c-3-1.2-6.5-1.2-10 0C8.5 8.8 5 8.8 2 10z"/><path d="M12 10v9"/><path d="M12 1.8c1.5 1.5 2 2.7 2 3.6a2 2 0 0 1-4 0c0-.9.5-2.1 2-3.6z"/>',
    agac:'<path d="M12 2a4.5 4.5 0 0 0-4.4 3.6A4 4 0 0 0 5 13h14a4 4 0 0 0-2.6-7.4A4.5 4.5 0 0 0 12 2z"/><path d="M12 8.5v8"/><path d="M4.5 16.5h15"/><path d="M12 16.5c0 2.2-2.2 3.5-5 4.5M12 16.5c0 2.2 2.2 3.5 5 4.5M12 16.5v5"/>'
  };
  // Yeni ders hazır olunca buraya bir satır eklenir (ana sayfadaki "Programlar" sırasıyla aynı).
  var GA_PROGS = [
    {k:'atlas',  ad:'Eser–Müellif Atlası',   url:'/eser_muellif_atlasi/', i:'kitap'},
    {k:'mecelle',ad:'Mecelle Küllî Kâideler', url:'/mecelle/',             i:'terazi'},
    {k:'medhal', ad:'Medhal',                 url:'/madhal/',              i:'bina'},
    {k:'hadis',  ad:'Hadis Usulü',            url:'/hadis_usulu/',         i:'zincir'},
    {k:'muhtar', ad:"Muhtâr li'l-Fetvâ",      url:'/muhtar_lil_fetva/',    i:'kalem'},
    {k:'tefsir', ad:'Tefsir Usulü',           url:'/tefsir_usulu/',        i:'kandil'},
    {k:'fikih',  ad:'Fıkıh Usulü',            url:'/fikih_usulu/',         i:'agac'}
  ];
  var MAIL = 'alpkiraymehmet@gmail.com';
  function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||'')+'</svg>'}
  function gun(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

  /* ---- programların kullandığı işlevler ---- */
  window.gaOzet = function(o){
    if(!o||APP==='ana')return;
    var all = rd('ga_ozet',{}), cur = all[APP]||{};
    ['bitti','etiket','d','y','kart'].forEach(function(f){ if(o[f]!==undefined) cur[f]=o[f]; });
    if(o.yer){ cur.yer = o.yer; cur.t = Date.now(); }
    all[APP] = cur; wr('ga_ozet', all);
    if(o.aktif){ var g = rd('ga_gunler',[]), b = gun(Date.now()); if(g[g.length-1]!==b){ g.push(b); wr('ga_gunler', g.slice(-120)); } }
  };
  window.gaAltGizle = function(b){ try{ document.documentElement.classList.toggle('gab-off', !!b); }catch(e){} if(b) close(); };

  /* ---- çubuk ---- */
  var bar=document.getElementById('gab'), sh=document.getElementById('gabSheet'), dim=document.getElementById('gabDim'),
      T=document.getElementById('gabT'), B=document.getElementById('gabB');
  function setH(){ try{ document.documentElement.style.setProperty('--gab-h', (bar.offsetHeight||84)+'px'); }catch(e){} }
  setH(); addEventListener('resize', setH);
  var base = APP==='ana' ? 'ana' : 'dersler', openK = null;
  function mark(){ [].forEach.call(bar.querySelectorAll('.gab-b'), function(b){ b.classList.toggle('on', b.dataset.k === (openK||base)); }); }
  mark();

  var pushed=false, closing=false;
  function open(k){
    openK = k; mark();
    if(k==='dersler'){ T.textContent='Dersler'; B.innerHTML=dersler(); }
    else { T.textContent='Karnem'; B.innerHTML=karne(); }
    sh.scrollTop=0; sh.classList.add('open'); dim.classList.add('open'); setH(); kilit(true);
    if(!pushed){ try{ history.pushState(Object.assign({}, history.state, {gab:1}), ''); pushed=true; }catch(e){ pushed=false; } }
  }
  function close(){
    if(!sh.classList.contains('open')) return;
    sh.classList.remove('open','full','gab-anim'); sh.style.transform=''; dim.classList.remove('open'); openK=null; mark(); kilit(false);
    if(pushed){ pushed=false; closing=true; try{ history.back(); }catch(e){ closing=false; } }
  }
  // Geri hareketi önce pencereyi kapatsın; programın kendi gezinmesine geçmesin
  addEventListener('popstate', function(e){
    if(closing){ closing=false; e.stopImmediatePropagation(); return; }
    if(sh.classList.contains('open')||pushed){ sh.classList.remove('open','full','gab-anim'); sh.style.transform=''; dim.classList.remove('open'); openK=null; mark(); kilit(false); pushed=false; e.stopImmediatePropagation(); }
  }, true);
  // Pencere açıkken arkadaki sayfa kaymasın (iPhone kaydırmayı arkaya geçiriyordu)
  var kY=0;
  function kilit(on){ try{ document.documentElement.classList.toggle('gab-lock', !!on); }catch(e){} }
  // Üstteki çizgiden (ya da başlıktan) tutup sürükleme: aşağı çekince kapanır, yukarı çekince büyür.
  // Pencere en baştayken içerikten aşağı çekmek de pencereyi sürükler (iPhone'daki gibi).
  var drag=null;
  sh.addEventListener('touchstart', function(e){
    kY=e.touches[0].clientY;
    drag={y:kY, t:Date.now(), tut:!!(e.target.closest('.gab-grab,.gab-hd') && !e.target.closest('.gab-x')), on:false, dy:0};
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!sh.classList.contains('open')) return;
    if(!sh.contains(e.target)){ e.preventDefault(); return; }
    var dy=e.touches[0].clientY-kY;
    if(drag && (drag.on || drag.tut || (sh.scrollTop<=0 && dy>0))){
      e.preventDefault(); drag.on=true; drag.dy=dy;
      sh.classList.remove('gab-anim');
      sh.style.transform='translateY('+(dy>0 ? dy : dy/4)+'px)';
      return;
    }
    var ust=sh.scrollTop<=0, alt_=sh.scrollTop+sh.clientHeight>=sh.scrollHeight-1;
    if(sh.scrollHeight<=sh.clientHeight || (ust&&dy>0) || (alt_&&dy<0)) e.preventDefault();
  }, {passive:false});
  function birak(){
    if(!drag||!drag.on){ drag=null; return; }
    var d=drag.dy, hiz=d/Math.max(1,Date.now()-drag.t); drag=null;
    sh.classList.add('gab-anim');
    if(d>120 || (d>40 && hiz>0.6)){ sh.style.transform='translateY(100%)'; setTimeout(close,180); return; }
    if(d<-40) sh.classList.add('full');
    else if(d>40) sh.classList.remove('full');
    sh.style.transform='';
  }
  sh.addEventListener('touchend', birak); sh.addEventListener('touchcancel', birak);
  dim.onclick=close; document.getElementById('gabX').onclick=close;
  addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  function gitUrl(u){ close(); setTimeout(function(){ location.href=u; }, 30); }

  bar.addEventListener('click', function(e){
    var b=e.target.closest('.gab-b'); if(!b) return;
    var k=b.dataset.k;
    if(k==='ana'){ if(APP==='ana'){ e.preventDefault(); if(openK) close(); scrollTo({top:0,behavior:'smooth'}); } return; }
    e.preventDefault();
    if(k==='devam'){ devam(); return; }
    if(openK===k) close(); else open(k);
  });
  B.addEventListener('click', function(e){
    if(e.target.closest('[data-cur]')){ e.preventDefault(); close(); return; }
    var a=e.target.closest('[data-u]'); if(a){ e.preventDefault(); gitUrl(a.dataset.u); }
  });

  function sonYer(){ // en son çalışılan yer; bulunduğunuz programın dışındakiler önce
    var all=rd('ga_ozet',{}), L=[];
    GA_PROGS.forEach(function(p){ var o=all[p.k]; if(o&&o.yer&&o.t) L.push({p:p,o:o}); });
    L.sort(function(a,b){ return b.o.t-a.o.t; });
    return L.filter(function(x){ return x.p.k!==APP; })[0] || null;
  }
  function devam(){
    var s=sonYer();
    if(s){ gitUrl(s.o.yer.url); return; }
    toast(APP==='ana' ? 'Henüz bir programda çalışmadınız. Bir ders seçin.' : 'Başka bir programda kaldığınız yer yok.');
    open('dersler');
  }
  var tt;
  function toast(m){ var d=document.createElement('div'); d.className='gab-toast'; d.textContent=m; document.body.appendChild(d); clearTimeout(tt); tt=setTimeout(function(){ d.remove(); }, 2600); }

  function dersler(){
    var all=rd('ga_ozet',{});
    return GA_PROGS.map(function(p){
      var o=all[p.k], cur=p.k===APP, u=(o&&o.yer&&o.yer.url)||p.url;
      var alt = cur ? '' : (o&&o.yer ? 'Kaldığınız yer: '+esc(o.yer.ad) : '');
      return '<a class="gab-li'+(cur?' cur':'')+'" href="'+esc(p.url)+'" '+(cur?'data-cur="1"':'data-u="'+esc(u)+'"')+'><span class="gab-pm">'+svg(p.i)+'</span><span class="gab-tx"><b>'+esc(p.ad)+'</b>'+(alt?'<small>'+alt+'</small>':'')+'</span>'+(cur?'<span class="gab-tag">buradasınız</span>':'')+'</a>';
    }).join('') + '<p class="gab-note">Diğer dersler hazırlanıyor; hazır oldukça bu listeye eklenecek.</p>';
  }
  function seri(){
    var g=rd('ga_gunler',[]); if(!g.length) return 0;
    var set={}; g.forEach(function(x){ set[x]=1; });
    var d=new Date(), n=0; if(!set[gun(d)]) d.setDate(d.getDate()-1);
    while(set[gun(d)]){ n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function karne(){
    var all=rd('ga_ozet',{}), D=0, Y=0, K=0, var_=false;
    var rows = GA_PROGS.map(function(p){
      var o=all[p.k];
      if(!o) return '<button class="gab-kr bos" type="button" data-u="'+esc(p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>Henüz başlanmadı</small></span><span class="n gab-g e">—</span><span class="n gab-g e">—</span></button>';
      var_=true; var d=o.d||0, y=o.y||0; D+=d; Y+=y; K+=o.kart||0;
      var b=Math.round((o.bitti||0)*100), q=d+y?Math.round(d/(d+y)*100):null;
      var c=q===null?'e':(q>=75?'':(q>=50?'o':'z'));
      return '<button class="gab-kr" type="button" data-u="'+esc((o.yer&&o.yer.url)||p.url)+'"><span class="nm"><b>'+esc(p.ad)+'</b><small>'+esc(o.etiket||'')+'</small></span><span class="n">%'+b+'</span><span class="n gab-g '+c+'">'+(q===null?'—':'%'+q)+'</span><span class="gab-bar"><i style="width:'+b+'%"></i></span></button>';
    }).join('');
    var S=D+Y, P=S?Math.round(D/S*100):null, sr=seri();
    return '<div class="gab-st"><div><b>'+S+'</b><span>soru çözüldü</span></div><div><b>'+(P===null?'—':'%'+P)+'</b><span>doğru</span></div><div><b>'+K+'</b><span>kart biliniyor</span></div></div>'
      + (sr>1 ? '<div class="gab-streak">🔥 '+sr+' gündür aralıksız çalışıyorsunuz</div>' : (sr===1 ? '<div class="gab-streak">🔥 Bugün çalıştınız. Yarın da gelirseniz seri başlar.</div>' : ''))
      + '<div class="gab-k"><div class="gab-kr gab-kh"><span>Ders</span><span class="n">Bitti</span><span class="n">Doğru</span></div>'+rows+'</div>'
      + '<p class="gab-note">'+(var_?'Bir derse dokunursanız kaldığınız yere gidersiniz. ':'')+'İlerlemeniz yalnızca bu cihazda, bu tarayıcıda saklanır.</p>'
      + '<a class="gab-mail" href="mailto:'+MAIL+'?subject='+encodeURIComponent('[Giray Akademi] Öneri / soru')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>İletişim · öneri ve soru gönderin</a>';
  }
})();
</script>

ıl-bâliğ ve zabt ehli** olması hususunda müttefiktirler. Bu 4 şart dışında:"},{"k":"n","n":1,"x":"**Hanefîler:**"},{"k":"li","x":"a) Ravinin, rivayet ettiği hadisin aksine amel etmemesi veya bu rivayete aykırı fetva vermemiş olması."},{"k":"li","x":"b) Hadisin umûm-i belvâdan olmaması. (Namazı ehli bilir.)"},{"k":"li","x":"c) Ravi müçtehid değilse kıyasa ve şer'î esaslara aykırı olmaması."},{"k":"n","n":2,"x":"**Mâlikîler:** Hadis, ameli ehli Medine'ye aykırı olmamalı."},{"k":"n","n":3,"x":"**Şâfiîler:** Senedin sahih ve muttasıl olması."},{"k":"n","n":4,"x":"**Hanbelîler:** Ek bir şart koşmazlar."},{"k":"tbl","r":[["Mezhep","Ortak 4 şarta ek olarak"],["**Hanefîler**","Ravi hadise aykırı amel etmemiş · umûm-i belvâdan değil · (ravi müçtehid değilse) kıyasa aykırı değil"],["**Mâlikîler**","Medine ehlinin ameline aykırı değil"],["**Şâfiîler**","Sened sahih ve muttasıl"],["**Hanbelîler**","Ek şart yok"]]}]},{"h":"A3. İcmâ","b":[{"k":"d","t":"İcmâ","x":"Hz. Peygamber'in vefatından sonra bütün Müslüman müçtehidlerin herhangi bir asırda bir olay hakkında şer'î bir hüküm üzerine ittifak etmeleridir."},{"k":"h","x":"Rükünleri / şartları"},{"k":"n","n":1,"x":"Olayın meydana geldiği asırda birkaç müçtehid var olmalı. (Tek bir müçtehidle ittifak olmaz.)"},{"k":"n","n":2,"x":"O olayın hükmü üzerine bütün müçtehidlerin (memleket, cins vb. ayrımı yapılmaksızın) ittifak etmeleri gerekir."},{"k":"n","n":3,"x":"Bir görüşe göre: Sarih beyanda bulunmaları. Sükûtî olmaz."},{"k":"n","n":4,"x":"Bütün müçtehidler ittifak etmeli. Biri bile muhalefet ederse icmâ gerçekleşmez."},{"k":"li","x":"Bunlara ek olarak diğer kaynaklarda: Hz. Peygamber'in ümmetinden olmaları, Hz. Peygamber'in vefatından sonra meydana gelmeli, icmânın konusu dinî bir mesele olmalı."},{"k":"h","x":"Hücciyeti"},{"k":"n","n":1,"x":"«يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ» İbn Abbas gibi müfessirlere göre «أُولِي الْأَمْر» ulemâdır."},{"k":"n","n":2,"x":"«لَا تَجْتَمِعُ أُمَّتِي عَلَى خَطَأٍ»"}]},{"h":"İcmânın imkânı","b":[{"k":"h","x":"1. Mümkün değil"},{"k":"li","x":"Bu görüşü Nazzâm ve bazı Şiîler savunur. Çünkü:"},{"k":"li","x":"Bir kimsenin içtihad seviyesine ulaşıp ulaşmadığını bilmenin bir ölçüsü yok."},{"k":"li","x":"Diyelim ki ölçüldü ve tespit edildi. Bunlar farklı bölge ve kıtalardayken kesin görüşlerine nasıl ulaşacağız?"},{"k":"li","x":"Diyelim ki ulaştık. Daha sonra görüş değiştirmediklerinden nasıl emin olacağız?"},{"k":"li","x":"İcmâ münakid olursa müçtehidin dayandığı bir delil olması gerekir. Ve bu delil ya kat'î olur ki bunun Müslümanlardan gizli kalması mümkün değildir. Veya zannî olur ki bununla icmâ olmaz."},{"k":"li","x":"Ahmed b. Hanbel de kabul etmez. (Hâlbuki kabul eder. Fakat ihtiyattan buna icmâ demez.)"},{"k":"h","x":"2. Mümkün"},{"k":"li","x":"Cumhur bu görüştedir ve bilfiil vuku bulmuştur."},{"k":"ornek","x":"Hz. Ebû Bekir'in hilafeti, domuz iç yağının haram oluşu, ninenin 1/6'ya varis olması."},{"k":"not","x":"Hallâf'a göre: İcmâ ancak devlet eliyle mümkün olabilir."}]},{"h":"İcmânın kısımları ve kaynak değeri","b":[{"k":"h","x":"Kısımları"},{"k":"n","n":1,"x":"**Sarih:** Her bir müçtehidin görüşünü açıkça belirtmesi. Ki buna hakiki icmâ denir."},{"k":"n","n":2,"x":"**Sükûtî:** Bazı müçtehidlerin açıkça, bazılarının da muvafakat veya muhalefeti belirtmeyip sustukları icmâ türü. Ki buna itibarî icmâ da denir."},{"k":"h","x":"İcmânın kaynak değeri"},{"k":"li","x":"Delaleti kat'îdir."},{"k":"li","x":"**A. Sarih icmâ:** Cumhura göre kesin bilgi ifade eder; uymak vâcip, uymamak haram."},{"k":"li","x":"**B. Sükûtî icmâ:** Delaleti zannîdir. Şâfiî ve Mâlikîler bunu kabul etmez."},{"k":"tbl","r":[["Kısım","Diğer adı","Kaynak değeri"],["**Sarih icmâ**","Hakiki icmâ","Kesin bilgi; uymak vâcip, uymamak haram"],["**Sükûtî icmâ**","İtibarî icmâ","Delaleti zannî; Şâfiî ve Mâlikîler kabul etmez"]]}]},{"h":"A4. Kıyas","b":[{"k":"d","t":"Kıyas","x":"Hükmüne dair bir nass bulunmayan bir vakıayı, illetindeki eşitlik nedeniyle hükmüne dair bir nass bulunan bir vakıaya ilhak etmektir."},{"k":"dikkat","x":"Kıyas, müsbit değil, muzhirdir."},{"k":"ornek","x":"Şarabın haramlığı rakıya kıyas edilmiştir. İlletleri birdir, eşittir → Sarhoşluk."},{"k":"h","x":"Hücciyeti"},{"k":"n","n":1,"x":"**Kitap** → «فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ»"},{"k":"n","n":2,"x":"**Sünnet** → Muâz b. Cebel hadisi."},{"k":"n","n":3,"x":"**Sahâbe fiilleri** → Hz. Ebû Bekir'in hilafetini namaz imamlığına kıyas etmeleri."},{"k":"ar","a":"رَضِيَهُ رَسُولُ اللَّهِ لِدِينِنَا أَفَلَا نَرْضَاهُ لِدُنْيَانَا","x":"Türkçesi: Resulullah onu dinimiz için uygun gördü; dünyamız için onu uygun görmeyelim mi?"},{"k":"n","n":4,"x":"**Aklî deliller** → Maslahat esastır."},{"k":"li","x":"Kur'an ve sünnet sınırlı, hadiseler sınırsız."},{"k":"li","x":"Kıyas, selim bir fıtratın gereğidir."},{"k":"dikkat","x":"Nazzâm, Zâhirîler ve bazı Şia âlimleri kıyası kabul etmez."}]},{"h":"Kıyasın rükünleri","b":[{"k":"n","n":1,"x":"**Asıl:** Hükmü hakkında nass bulunandır. Buna «الْمَقِيسُ عَلَيْهِ، الْمَحْمُولُ عَلَيْهِ، الْمُشَبَّهُ بِهِ» de denir."},{"k":"n","n":2,"x":"**Fer':** Hükmü hakkında nass bulunmayandır. Buna «الْمَقِيسُ، الْمَحْمُولُ، الْمُشَبَّهُ» de denir."},{"k":"n","n":3,"x":"**Aslın hükmü:** Asla sabit olan ve fer'e uygulanmak istenen hüküm."},{"k":"n","n":4,"x":"**İllet:** Asla ait hükmün konulmasına sebep olan nitelik."},{"k":"h","x":"Aslın hükmünün şartları"},{"k":"n","n":1,"x":"**Nassla sabit olmalı.**"},{"k":"li","x":"Bu nass kitap ve sünnet ise ihtilaf yok."},{"k":"li","x":"İcmâ ise iki görüş var: A) Kıyas yapılmaz. B) Kıyas yapılır."},{"k":"li","x":"İttifakla kıyas ile sabit olan bir hükme başka bir olay kıyas edilmez."},{"k":"n","n":2,"x":"**Akıl ile idrak edilebilecek bir illeti olmalı.** Yani illeti bildirilmeyen taabbüdî hüküm olmamalı."},{"k":"n","n":3,"x":"**Aslın hükmü, asla has olmamalı.** Hz. Peygamber'in 4'ten fazla evliliği gibi."}]},{"h":"İllet","b":[{"k":"not","x":"Mazinne → illet · Mi'inne → hikmet"},{"k":"li","x":"İlletin diğer adları: «مَنَاطٌ، أَمَارَةٌ، سَبَبٌ»"},{"k":"h","x":"Hikmet ile illet arasındaki fark"},{"k":"d","t":"Hikmet","x":"Hükmün konuluş amacıdır."},{"k":"d","t":"İllet","x":"Hükmün üzerine kurulduğu, varlığı onun varlığına, yokluğu da onun yokluğuna bağlanan niteliktir."},{"k":"ornek","x":"Seferde kasr-ı salâtın hikmeti meşakkatin def'idir; illeti ise seferdir."},{"k":"h","x":"İllet ile sebep arasındaki fark"},{"k":"li","x":"Akıl ile idrak edilebiliyorsa hem illet hem sebep denir; akıl ile idrak edilemiyorsa sadece sebep denir."},{"k":"ornek","x":"Sefer, kasr-ı salât için hem illet hem sebeptir. Fakat güneşin batması akşam namazının farziyeti için sebeptir, illet değildir."},{"k":"li","x":"Aralarında → «عُمُومٌ وَخُصُوصٌ مُطْلَقٌ» var."},{"k":"h","x":"İlletin şartları"},{"k":"n","n":1,"x":"**Zâhir** olacak."},{"k":"n","n":2,"x":"**Munzabıt** olacak. Standart. (Not: Şahıstan şahısa değişmeyecek.)"},{"k":"n","n":3,"x":"**Münâsib** olacak."},{"k":"n","n":4,"x":"**Müteaddî** olacak. Gayr-ı kâsır. (Not: Kişiye özel olmayacak.)"}]},{"h":"İllet ile hüküm arasındaki münasebet","b":[{"k":"h","x":"1. el-Münâsibü'l-müessir"},{"k":"ar","a":"الْوَصْفُ الْمُنَاسِبُ الَّذِي رَتَّبَ الشَّارِعُ حُكْمًا عَلَى وَفْقِهِ وَثَبَتَ بِالنَّصِّ أَوِ الْإِجْمَاعِ اعْتِبَارُهُ بِعَيْنِهِ عِلَّةً لِلْحُكْمِ الَّذِي رُتِّبَ عَلَى وَفْقِهِ","x":"Bu, kitabın tanımı."},{"k":"ar","a":"إِنِ اعْتُبِرَ بِنَصٍّ أَوْ إِجْمَاعٍ عَيْنُ الْوَصْفِ فِي عَيْنِ الْحُكْمِ","x":"Daha kısa bir tanım."},{"k":"ar","a":"وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ","x":"Örnek. Hüküm: «اعْتِزَال» · İllet: «أَذًى»"},{"k":"h","x":"2. el-Münâsibü'l-mülâim"},{"k":"ar","a":"الْوَصْفُ الْمُنَاسِبُ الَّذِي رَتَّبَ الشَّارِعُ حُكْمًا عَلَى وَفْقِهِ وَلَمْ يَثْبُتْ بِالنَّصِّ أَوِ الْإِجْمَاعِ اعْتِبَارُهُ بِعَيْنِهِ عِلَّةً لِنَفْسِ الْحُكْمِ الَّذِي رُتِّبَ عَلَى وَفْقِهِ","x":"Bu, kitabın tanımı."},{"k":"ar","a":"وَإِنْ لَمْ يُعْتَبَرْ بِهَا بَلْ بِتَرْتِيبِ الْحُكْمِ عَلَى وَفْقِهِ وَلَوْ بِاعْتِبَارِ جِنْسِهِ فِي جِنْسِهِ","x":"Daha kısa bir tanım."},{"k":"li","x":"3 kısmı vardır…"},{"k":"ornek","x":"Bir örnek: Yağmurda namazın cem'i. Hüküm: namazın cem'i. İllet: Yağmurun cem'in illeti olduğuna dair bir nass veya icmâ yok; fakat seferin cem'e illet olduğuna dair nass var. Bu da onunla kıyaslanmış."},{"k":"h","x":"3. el-Münâsibü'l-mürsel"},{"k":"li","x":"Şâriin itibar veya ilga ettiğine dair bir delil bulunmayan vasıf. Maslahat-ı mürsele de denilebilir."},{"k":"h","x":"4. el-Münâsibü'l-mülgâ"},{"k":"li","x":"Şâriin itibar etmediğine, ilga ettiğine dair bir delil bulunan vasıf."},{"k":"ornek","x":"Erkek ve kızın karabette eşit, mirasta ise farklı olmaları. Abdurrahman b. Hakem ve Yahyâ b. Yahyâ el-Leysî meselesi."},{"k":"tbl","r":[["Kısım","Şâriin vasfa bakışı","Örnek"],["**Müessir**","Nass veya icmâ ile aynı vasıf aynı hükme illet","Hayızda «أَذًى»"],["**Mülâim**","Cinsi cinsinde muteber","Yağmurda cem'"],["**Mürsel**","İtibar da ilga da yok (maslahat-ı mürsele)","—"],["**Mülgâ**","İlga edildiğine delil var","Mirasta erkek–kız"]]}]},{"h":"Mesâliku'l-illet (illeti bulma yolları)","b":[{"k":"h","x":"1. Nass"},{"k":"li","x":"**A. Sarih:** «مَا فِيهِ أَدَاةُ التَّعْلِيلِ»"},{"k":"li","x":"**A-1 → Kat'î:** Sadece talil manasında gelen, başka manaya gelmeyen. → «مِنْ أَجْلِ، لِأَجْلِ، لِأَنَّ، كَيْ، لِعِلَّةِ كَذَا، لِسَبَبِ كَذَا، لِأَجْلِ كَذَا»"},{"k":"li","x":"**A-2 → Zannî:** Talil dışında başka manaya da gelebilen. → «لِ، بِ، فَ، إِنَّ»"},{"k":"li","x":"**B. Îmâ, işaret:** «مَا لَيْسَ فِيهِ أَدَاةُ التَّعْلِيلِ»"},{"k":"ar","a":"لَا يَرِثُ الْقَاتِلُ","x":"Örnek. İlleti → «الْقَاتِل»in kendisinden türediği «الْقَتْل»dir."},{"k":"ar","a":"تَعْلِيقُ الْحُكْمِ بِالْمُشْتَقِّ يُشْعِرُ بِعِلِّيَّةِ الْمُشْتَقِّ مِنْهُ","x":"Not: Hükmün türemiş bir kelimeye bağlanması, kelimenin türediği kökün illet olduğunu gösterir."},{"k":"h","x":"2. İcmâ"},{"k":"d","t":"Kıyas maa'l-fârık","x":"İllet birliğinin sağlanamadığı kıyas."},{"k":"d","t":"Kıyas fâsidü'l-i'tibâr","x":"Fer' hakkında nass varken kıyas yapmak."},{"k":"h","x":"3. Sebr ve taksim"},{"k":"li","x":"**Sebr:** Deneme, sınama."},{"k":"li","x":"**Taksim:** Ayırmak, bölmek."},{"k":"li","x":"Bir konuda muhtemel seçenekleri belirleyip (hasr), ardından birer birer eleyerek (hazf) tek bir seçenek bırakmak."},{"k":"tbl","r":[["Vasıf","Hamr","Kokain"],["1. Akıcılık / Katılık","✗","✗"],["2. Renk","✗","✗"],["3. Koku","✗","✗"],["4. Tat","✗","✗"],["5. Sarhoş edicilik","✓","✓"]]},{"k":"h","x":"Menât"},{"k":"d","t":"Tahrîcü'l-menât","x":"İlleti bulma yollarıyla illeti tespit etmek."},{"k":"d","t":"Tenkîhu'l-menât","x":"Nassta geçen vasıflardan illet olmaya elverişli olanı tespit etmek. Sebr ve taksimden farkı; nassta geçmesi."},{"k":"d","t":"Tahkîku'l-menât","x":"Asılda geçen illetin fer'de olduğuna emin olmak."}]},{"h":"B1. İstihsan","b":[{"k":"d","t":"İstihsan","x":"Müçtehidin kıyas-ı hafîyi kıyas-ı celîye veya istisnaî hükmü küllî hükme tercihi."},{"k":"h","x":"1. Kıyas-ı hafînin kıyas-ı celîye tercihi"},{"k":"ornek","x":"Hanefîlere göre yırtıcı kuşların artıkları temizdir."},{"k":"li","x":"**Vech-i istihsan:** Yırtıcı kuşların her ne kadar eti haram olsa da tükürükleri artıklarına karışmaz. Çünkü bunlar temiz bir kemik olan gagalarıyla içerler."},{"k":"li","x":"**Açık kıyas:** Diğer yırtıcılarda olduğu gibi bunların da etleri haram olduğu gibi artıklarının da haram, necis olması."},{"k":"li","x":"**Gizli kıyas:** Bunlar, yukarıda anlatılan sebepten dolayı diğer yırtıcılar gibi değildir. Çünkü diğer yırtıcıların tükürükleri artıklarına bulaşır. Çünkü dilleri ile içerler."},{"k":"h","x":"2. Küllî hükmün bırakılıp istisnaî hükmün tercihi"},{"k":"li","x":"**Küllî hüküm →** Ma'dûmun satışı yasaktır."},{"k":"li","x":"**İstisnaî hüküm →** Selem akdi. İhtiyaçtan dolayı istihsanen caizdir."},{"k":"h","x":"Hücciyeti"},{"k":"li","x":"Hanefîlerin kabul ettiği bu delil; ya kıyastır (1. çeşidi) veya maslahat-ı mürseledir (2. çeşidi). Her ikisi de sahih bir istidlaldir."}]},{"h":"B2. Maslahat-ı mürsele","b":[{"k":"d","t":"Maslahat-ı mürsele","x":"İnsanlara bir fayda sağlayıp veya onlardan bir zararı giderip, itibar veya ilgasına dair bir delil bulunmayan delil çeşididir."},{"k":"h","x":"Şartları"},{"k":"n","n":1,"x":"Maslahat hakiki olacak, vehmî olmayacak."},{"k":"n","n":2,"x":"Umumi olacak, şahsi değil."},{"k":"n","n":3,"x":"Maslahat, nass veya icmâ ile sabit bir hükme muarız olmayacak."},{"k":"h","x":"Hücciyeti"},{"k":"n","n":1,"x":"**Kabul edenlerin delilleri:**"},{"k":"li","x":"A) İnsanların maslahatları yenilenir, bitmez."},{"k":"li","x":"B) Sahâbe, tâbiîn ve müçtehid imamlar dönemi incelendiğinde görülür ki maslahatı sağlamak için birçok hüküm koymuşlardır. (Kur'an'ın cem'i ve istinsahı gibi.)"},{"k":"n","n":2,"x":"**Kabul etmeyenlerin delilleri:**"},{"k":"li","x":"A) Zaten şâri, maslahatı nasslarda gözetmiştir."},{"k":"li","x":"B) Bu yöntem hevâ ile hükmetmeye götürür."}]},{"h":"B3. Sedd-i zerâi","b":[{"k":"d","t":"Sedd-i zerâi","x":"Mefsedete götüren vasıtaların yasaklanması."},{"k":"h","x":"Mefsedete götüren vasıtalar"},{"k":"n","n":1,"x":"**Haram:** Örnek: Nesebin karışmasına sebep olan zina → İttifakla yasaklanır."},{"k":"n","n":2,"x":"**Mübah:**"},{"k":"li","x":"**A. Nadiren mefsedete götüren →** İttifakla yasaklanmaz. Örnek: Üzüm üretimi. Nadiren de olsa içki üretimine vesile olabilir."},{"k":"li","x":"**B. Çoğu zaman mefsedete götüren →** (Not: ihtilaflı.) Örnek: Bankaya kirayla vermek."},{"k":"li","x":"**C. Konuluş amacının dışında bir sonucu elde etmeye vasıta kılınan meşru fiiller.** Örnek: Ölüm hastalığında kişinin karısını mirastan menetmek için boşaması. Normalde talak meşru."},{"k":"h","x":"Bu son iki kısım"},{"k":"li","x":"A) Mâlikî ve Hanbelîlere göre yasaklanır."},{"k":"li","x":"B) Şâfiî, Hanefî ve Zâhirîlere göre yasaklanmaz."},{"k":"not","x":"Sedd-i zerâi, maslahat-ı mürseleyi destekler ve kuvvetlendirir."},{"k":"tbl","r":[["Vasıta","Hükmü","Örnek"],["**Haram**","İttifakla yasak","Zina"],["**Mübah, nadiren mefsedete götüren**","İttifakla yasak değil","Üzüm üretimi"],["**Mübah, çoğu zaman mefsedete götüren**","Mâlikî–Hanbelî: yasak · Şâfiî–Hanefî–Zâhirî: yasak değil","Bankaya kirayla vermek"],["**Amaç dışı kullanılan meşru fiil**","Mâlikî–Hanbelî: yasak · Şâfiî–Hanefî–Zâhirî: yasak değil","Ölüm hastalığında boşama"]]}]},{"h":"B4. Örf / Âdet","b":[{"k":"d","t":"Örf","x":"İnsanların benimseyip alışkanlık hâline getirdikleri söz, fiil ve terktir."},{"k":"dikkat","x":"Halkın ittifakı örf, müçtehidlerin ittifakı icmâdır."},{"k":"h","x":"İkiye ayrılır"},{"k":"n","n":1,"x":"**Amelî:** Teâtî satışı gibi."},{"k":"n","n":2,"x":"**Kavlî:** \"Veled\" lafzının sadece erkek için kullanılması gibi."},{"k":"h","x":"Sahih ve bâtıl örf"},{"k":"li","x":"**A. Sahih örf:** Şer'î bir delile aykırı olmayan. İstisnâ (ısmarlama) akdi, mehrin muaccel ve müeccel olması gibi."},{"k":"li","x":"**B. Bâtıl örf:** Şer'î bir delile muhalif olan. İçkili düğünler gibi."},{"k":"h","x":"Hükmü"},{"k":"li","x":"Müçtehid fetvasında, kadı kazasında riayet etmesi gerekir. Çünkü âlimler «الثَّابِتُ بِالْعُرْفِ كَالثَّابِتِ بِالنَّصِّ» deyip önem göstermişlerdir."}]},{"h":"B5. İstishab","b":[{"k":"ar","a":"إِبْقَاءُ مَا كَانَ عَلَى مَا كَانَ","x":""},{"k":"d","t":"İstishab","x":"Değiştiğine dair bir delil bulunmadıkça mevcut hâlin devamına hükmedilmesidir."},{"k":"h","x":"Hücciyeti"},{"k":"li","x":"Müçtehidin başvurduğu son delildir."},{"k":"h","x":"İstishaba dayalı şer'î ilkeler"},{"k":"ar","a":"الْأَصْلُ فِي الْأَشْيَاءِ الْإِبَاحَةُ","x":"Türkçesi: Eşyada asıl olan mübahlıktır."},{"k":"ar","a":"مَا ثَبَتَ بِالْيَقِينِ لَا يَزُولُ بِالشَّكِّ","x":"Türkçesi: Kesin olarak sabit olan şüpheyle ortadan kalkmaz."},{"k":"ar","a":"الْأَصْلُ فِي الْإِنْسَانِ الْبَرَاءَةُ","x":"Türkçesi: İnsanda asıl olan beraattir."}]},{"h":"B6. Şer'u men kablenâ","b":[{"k":"li","x":"**A. Kur'an'da geçmeyen:** Şeriat değildir."},{"k":"li","x":"**B. Kur'an'da geçen:**"},{"k":"n","n":1,"x":"**Neshedilen:** Şeriat değildir. Günah karşılığı tövbesi için kendisini öldürmesi gibi."},{"k":"n","n":2,"x":"**Emredilen:** Şeriattır. Oruç gibi."},{"k":"n","n":3,"x":"**Mutlak olarak zikredilen:** Hanefî, Mâlikî ve Şâfiî: Şeriattır. Diğerleri: Şeriat değil."},{"k":"ar","a":"وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالْأَنْفَ بِالْأَنْفِ وَالْأُذُنَ بِالْأُذُنِ وَالسِّنَّ بِالسِّنِّ وَالْجُرُوحَ قِصَاصٌ","x":"Örnek (Mâide 5/45)."}]},{"h":"B7. Sahâbe kavli","b":[{"k":"li","x":"**A.** Sahâbe bir konuda ittifak etmişse hüccet sayılır. Bu konuda ihtilaf yoktur."},{"k":"li","x":"**B.** İçtihada kapalı olan konularda da hüccet sayılır. İhtilaf yoktur."},{"k":"li","x":"**C.** Sahâbenin kendi rey ve içtihadıyla olup ittifak edilmeyen konular: Hanefîlere göre hüccet, Şâfiîlere göre değil."}]}],"ht":[{"s":0,"x":"Müttefekun aleyh (4): Kitap, Sünnet, İcmâ, Kıyas. Muhtelefun fîh (7): Maslahat-ı mürsele, İstihsan, Örf, Sedd-i zerâi, Şer'u men kablenâ, Sahâbe kavli, İstishab."},{"s":1,"x":"Kitap: lafzı ve manası Allah'a ait; müteradifi ve tercümesi Kur'an değil; tevatürle nakledilmiş; Arapça. Delil bakımından 1. sırada."},{"s":2,"x":"Kur'an'daki hükümler: itikadi, ahlaki, ameli. Sübutu kat'î; delaleti tek manaya ihtimalliyse kat'î («مائة جلدة»), birden fazlaysa zannî («قروء»)."},{"s":3,"x":"Sünnet: kavlî («لا ضرر ولا ضرار»), fiilî (5 vakit namaz), takrirî (susarak, gülerek, överek, dua ederek onay). Hücciyeti: ayetler, sahâbe icmâı, mücmel farzların sünnetle anlaşılması."},{"s":4,"x":"Sünnetin Kur'an'a nispeti: te'kid · tebyin, takyid, tahsis · Kur'an'da olmayan hükmü isbat · Hanefîlere göre nesih."},{"s":5,"x":"Hanefîlere göre: mütevâtir, meşhur, âhâd. Cumhura göre: mütevâtir ve âhâd; âhâd: meşhur/müstefîz (3), azîz (2), garîb (1)."},{"s":6,"x":"Teşrî özelliği olmayanlar: insan tabiatı gereği (yeme-içme) · dünya işlerinde tecrübe (hurma aşılama) · Peygambere özel (4'ten fazla evlilik)."},{"s":7,"x":"Sahâbe: Ebû Bekir ve Ömer iki kişi işittiğinde, Ali yemin ettirerek, bazen raviye güvenerek kabul ederdi. Ortak 4 şart: Müslüman, âdil, akıl-bâliğ, zabt."},{"s":8,"x":"İcmânın şartları: birkaç müçtehid · hepsinin ittifakı · (bir görüşe göre) sarih beyan · biri bile muhalefet ederse olmaz. Hücciyeti: ulu'l-emr ayeti (ulemâ) ve \"ümmetim hata üzerinde birleşmez\"."},{"s":9,"x":"Mümkün değil: Nazzâm ve bazı Şiîler. Mümkün ve vaki: cumhur (Ebû Bekir'in hilafeti, domuz iç yağı, ninenin 1/6'sı). Hallâf: ancak devlet eliyle."},{"s":10,"x":"Sarih (hakiki) icmâ kesin bilgi ifade eder; sükûtî (itibarî) icmâ zannîdir, Şâfiî ve Mâlikîler kabul etmez."},{"s":11,"x":"Kıyas müsbit değil muzhirdir. Hücciyeti: Kitap (fa'teberû), Sünnet (Muâz hadisi), sahâbe (hilafetin imamlığa kıyası), akıl. Kabul etmeyenler: Nazzâm, Zâhirîler, bazı Şia âlimleri."},{"s":12,"x":"Kıyasın 4 rüknü: asıl (makîs aleyh), fer' (makîs), aslın hükmü, illet. Aslın hükmünün şartları: nassla sabit · aklen idrak edilebilir illet (taabbüdî değil) · asla has değil."},{"s":13,"x":"Hikmet: hükmün konuluş amacı (meşakkatin def'i). İllet: hükmün bağlandığı nitelik (sefer). Mazinne → illet, mi'inne → hikmet."},{"s":13,"x":"İllet aklen idrak edilirse hem illet hem sebep; edilemezse sadece sebep (güneşin batması). Aralarında umûm-husûs-ı mutlak."},{"s":13,"x":"İlletin şartları: zâhir, munzabıt (standart), münâsib, müteaddî (gayr-ı kâsır)."},{"s":14,"x":"Münasebet: müessir (nass/icmâ ile aynı vasıf aynı hükme: «أذى»), mülâim (cins cinse: yağmurda cem'), mürsel (itibar da ilga da yok), mülgâ (ilga edilmiş: mirasta erkek-kız)."},{"s":15,"x":"İlleti bulma yolları: nass (sarih: kat'î/zannî; îmâ-işaret), icmâ, sebr ve taksim (hasr + hazf)."},{"s":15,"x":"Tahrîc: illeti bulmak · Tenkîh: nasstaki vasıflardan ayıklamak (sebr ve taksimden farkı nassta geçmesi) · Tahkîk: illetin fer'de olduğundan emin olmak."},{"s":16,"x":"İstihsan: kıyas-ı hafîyi kıyas-ı celîye (yırtıcı kuş artığı) veya istisnaî hükmü küllî hükme (selem) tercih. 1. çeşidi kıyas, 2. çeşidi maslahat-ı mürsele."},{"s":17,"x":"Maslahat-ı mürsele şartları: hakiki (vehmî değil) · umumi (şahsi değil) · nass veya icmâya muarız değil."},{"s":18,"x":"Sedd-i zerâi: haram vasıta ittifakla yasak; nadiren götüren mübah ittifakla serbest; çoğu zaman götüren ve amaç dışı meşru fiil Mâlikî-Hanbelîye göre yasak, Şâfiî-Hanefî-Zâhirîye göre değil."},{"s":19,"x":"Örf: halkın ittifakı (icmâ müçtehidlerin). Amelî (teâtî) / kavlî (veled). Sahih (istisnâ, mehir) / bâtıl (içkili düğün). Müçtehid ve kadı riayet eder."},{"s":20,"x":"İstishab: «إبقاء ما كان على ما كان»; müçtehidin son delili. İlkeleri: eşyada asıl ibaha · yakîn şekle zail olmaz · insanda asıl beraat."},{"s":21,"x":"Şer'u men kablenâ: Kur'an'da geçmeyen ve neshedilen şeriat değil; emredilen şeriat (oruç); mutlak zikredilen Hanefî-Mâlikî-Şâfiîye göre şeriat (kısas ayeti)."},{"s":22,"x":"Sahâbe kavli: ittifak ettikleri ve içtihada kapalı konularda hüccet; kendi içtihatlarında Hanefîlere göre hüccet, Şâfiîlere göre değil."}]},{"t":"Mebâhisu'l-Ahkâm","intro":"Hâkim, hüküm, mahkûm fîh ve mahkûm aleyh; teklifî ve vaz'î hükümler ve kısımları; fiilin yükümlü kılınabilmesinin şartları; ehliyet ve ehliyet arızaları.","s":[{"h":"Mebâhisu'l-ahkâm","b":[{"k":"d","t":"Hâkim","x":"«مَنْ صَدَرَ عَنْهُ الْحُكْمُ» (Hükmün kendisinden sâdır olduğu.)"},{"k":"d","t":"Hüküm","x":"«خِطَابُ اللَّهِ الْمُتَعَلِّقُ بِأَفْعَالِ الْمُكَلَّفِينَ» (Allah'ın mükelleflerin fiillerine taalluk eden hitabı.)"},{"k":"d","t":"Mahkûm fîh","x":"«فِعْلُ الْمُكَلَّفِ» (Mükellefin fiili.)"},{"k":"d","t":"Mahkûm aleyh","x":"«الْمُكَلَّفُ» (Mükellef.)"},{"k":"h","x":"Hüsün-kubuh akılla bilinir mi?"},{"k":"li","x":"**Mâtürîdî:** Hüsün-kubuh akılla bilinebilir."},{"k":"li","x":"**Mu'tezile:** Hüsün-kubuh akılla bilinebilir."},{"k":"li","x":"**Eş'arî:** Hüsün-kubuh akılla bilinemez, şer'îdir."}]},{"h":"Hüküm","b":[{"k":"h","x":"1. Teklifî"},{"k":"d","t":"Teklifî hüküm","x":"Şâriin mükelleften yapmasını, terkini veya yapıp terk etme arasında muhayyer bıraktığı hükümdür."},{"k":"li","x":"**A. Talebî**"},{"k":"li","x":"A1. Talebü'l-fiil: «أَقِيمُوا الصَّلَاةَ»"},{"k":"li","x":"A2. Talebü't-terk: «وَلَا تَقْرَبُوا الزِّنَا»"},{"k":"li","x":"**B. Tahyîr:** İbaha ifade eder. «وَإِذَا حَلَلْتُمْ فَاصْطَادُوا»"},{"k":"h","x":"2. Vaz'î"},{"k":"d","t":"Vaz'î hüküm","x":"Bir şeyin bir şeye sebep, şart veya engel konulmasını gerektiren hükümdür."},{"k":"li","x":"**A. Sebep →** «وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا»"},{"k":"li","x":"**B. Şart →** «لَا نِكَاحَ إِلَّا بِشَاهِدَيْنِ»"},{"k":"li","x":"**C. Mâni →** «لَا يَرِثُ الْقَاتِلُ»"},{"k":"h","x":"Dolayısıyla teklifî ve vaz'î arasındaki farklar"},{"k":"n","n":1,"x":"Teklifîde talep (men ve tahyîr) var. Vaz'îde yok."},{"k":"n","n":2,"x":"Teklifî hüküm mükellefin kudreti dahilindedir. Vaz'î bazen kudreti dahilindedir, bazen de değildir. («الْقَرَابَةُ سَبَبٌ لِلْإِرْثِ» gibi.)"},{"k":"tbl","r":[["","Teklifî","Vaz'î"],["**Talep**","Var (men ve tahyîr)","Yok"],["**Kudret**","Mükellefin kudreti dahilinde","Bazen dahilinde, bazen değil"]]}]},{"h":"Teklifî hükümlerin kısımları (5) · 1. Vâcib","b":[{"k":"d","t":"Vâcib","x":"Şâriin kesin olarak yapılmasını istediği şeydir."},{"k":"li","x":"Bu kesinlik: Bazen talep sîgasından, bazen yapılmaması hâlinde ceza bildirilmesinden, bazen de başka bir şer'î karine ile bilinir."},{"k":"h","x":"Taksimi"},{"k":"n","n":1,"x":"**Zaman bakımından 2'ye ayrılır:**"},{"k":"li","x":"1A. **Mutlak:** Belli bir vakit tayin edilmeyen. Keffaretler gibi."},{"k":"li","x":"1B. **Muvakkat:** Belli bir vakit tayin edilen. Bu da 3'e ayrılır:"},{"k":"li","x":"1BA. **Muvassa':** Vakit içinde kendi cinsinden başka bir ibadet yapılabilen. Öğlen namazı gibi."},{"k":"li","x":"1BB. **Mudayyak:** Vakit içinde kendi cinsinden başka bir ibadet yapılamayan. Ramazan orucu gibi."},{"k":"li","x":"1BC. **Zü'ş-şebeheyn…** Vakti bir yönüyle muvassa', bir yönüyle mudayyak olan vâcib; hac gibi."},{"k":"n","n":2,"x":"**Yapılması istenmesi bakımından 2'ye ayrılır:**"},{"k":"li","x":"2A. **Kifâî:** Topluca. Cenaze namazı gibi."},{"k":"li","x":"2B. **Aynî:** Teker teker, her biri. 5 vakit namaz gibi."},{"k":"n","n":3,"x":"**Miktar bakımından 2'ye ayrılır:**"},{"k":"li","x":"3A. **Muhadded:** Zekât gibi."},{"k":"li","x":"3B. **Gayr-ı muhadded:** İnfak gibi."},{"k":"n","n":4,"x":"**Seçenek bakımından 2'ye ayrılır:**"},{"k":"li","x":"4A. **Muayyen:** «مَا طَلَبَهُ الشَّارِعُ بِعَيْنِهِ» Kurban gibi. Kurban yerine infak olmaz."},{"k":"li","x":"4B. **Muhayyer:** «مَا طَلَبَهُ الشَّارِعُ وَاحِدًا مِنْ أُمُورٍ مُعَيَّنَةٍ» Yemin keffareti gibi."},{"k":"tbl","r":[["Bakımından","Kısımlar","Örnek"],["**Zaman**","Mutlak · Muvakkat (muvassa', mudayyak, zü'ş-şebeheyn)","Keffaret · öğle namazı, Ramazan orucu"],["**Yapılması istenmesi**","Kifâî · Aynî","Cenaze namazı · 5 vakit namaz"],["**Miktar**","Muhadded · Gayr-ı muhadded","Zekât · infak"],["**Seçenek**","Muayyen · Muhayyer","Kurban · yemin keffareti"]]}]},{"h":"2. Mendub","b":[{"k":"d","t":"Mendub","x":"Şâriin kesin olmayarak yapılmasını istediği şeydir."},{"k":"li","x":"Bu kesin olmayan talep: Bazen sîgayla («فَكَاتِبُوهُمْ» gibi), bazen de karine ile bilinir (Müdâyene ayeti gibi)."},{"k":"h","x":"Taksimi"},{"k":"n","n":1,"x":"**Kuvvetli bir şekilde yapılması istenen.** Buna sünnet-i müekkede veya hüdâ denir."},{"k":"li","x":"Terki ikab değil, itab gerektirir. Cemaatle namaz gibi. Faili sevap alır."},{"k":"n","n":2,"x":"**Yapılması meşru olan.** Buna sünnet-i gayr-ı müekkede, sünnet-i zâide ve nâfile denir."},{"k":"li","x":"Faili sevap alır, terki ikab ve itab gerektirmez. Perşembe orucu gibi."},{"k":"n","n":3,"x":"**Zâid:** Mükellefin kemâliyyâtından sayılır."},{"k":"li","x":"Hz. Peygamber'in insan olarak yaptığı işleri ona uyma maksadıyla yapmaktır. Sevap alınır."},{"k":"li","x":"Uyma maksadı yoksa: Yapılıp yapılmamasında menfi veya müsbet bir karşılığı yoktur. Yemek, içmek, uyumak gibi."},{"k":"tbl","r":[["Kısım","Terki","Örnek"],["**Sünnet-i müekkede (hüdâ)**","İkab değil, itab gerektirir","Cemaatle namaz"],["**Gayr-ı müekkede / zâide / nâfile**","İkab ve itab gerektirmez","Perşembe orucu"],["**Zâid**","Uyma maksadıyla yapılırsa sevap","Yemek, içmek, uyumak"]]}]},{"h":"3. Muharram","b":[{"k":"d","t":"Muharram","x":"Şâriin kesin olarak yapılmamasını istediği şeydir."},{"k":"li","x":"Bu kesinlik: Bazen nehiy sîgasıyla, bazen kesinliğe delalet eden nehiy sîgasıyla («وَلَا تَقْرَبُوا الزِّنَا» gibi), bazen ictinab sîgasıyla, bazen de yapılması hâlinde ceza bildirilmesinden bilinir."},{"k":"h","x":"Taksimi"},{"k":"n","n":1,"x":"**Li-zâtihî:** Baştan beri hükmü haram olan. Zina gibi."},{"k":"n","n":2,"x":"**Li-gayrihî:** Sonradan meydana gelen bir sebepten dolayı haram olan."},{"k":"li","x":"İşlenmesi haram olsa da akid sahih, ibadet makbuldür. Mağsup elbiseyle namaz ve aldatma ile bey' gibi."}]},{"h":"4. Mekruh","b":[{"k":"d","t":"Mekruh","x":"Şâriin kesin olmayarak yapılmamasını istediği şeydir."},{"k":"li","x":"Bu kesin olmayan nehiy: Bazen «كُرِهَ» sîgasıyla, bazen kerahete delalet eden nehiy sîgasıyla («لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ» gibi), bazen de kerahete delalet eden bir karine ile ictinab emrolunmasıyla («وَذَرُوا الْبَيْعَ» gibi) bilinir."}]},{"h":"5. Mübah","b":[{"k":"d","t":"Mübah","x":"«مَا خَيَّرَ الشَّارِعُ الْمُكَلَّفَ بَيْنَ فِعْلِهِ وَتَرْكِهِ» (Şâriin mükellefi yapmakla terk etmek arasında muhayyer bıraktığı şey.)"},{"k":"li","x":"Bu muhayyerlik: Bazen şer'î bir nass ile («لَا جُنَاحَ عَلَيْكُمْ» gibi), bazen karineyle ibahaya delalet eden bir emir ile («وَإِذَا حَلَلْتُمْ فَاصْطَادُوا» gibi), bazen de ibâha-i asliyye ile bilinir."},{"k":"h","x":"Not"},{"k":"not","x":"Bu taksim cumhura göredir. Hanefiye göre ise 7 kısımdır: 1) Farz, 2) Vâcib, 3) Haram, 4) Mendub, 5) Tenzîhen mekruh, 6) Tahrîmen mekruh, 7) Mübah."},{"k":"h","x":"Farz ile vâcib arasındaki fark"},{"k":"li","x":"**Farzın** sübut ve delaleti kat'îdir. Terki azap gerektirir, inkârı küfürdür."},{"k":"li","x":"**Vâcibin** ise sübut ve delaletinden biri kat'î, diğeri zannîdir. Terki azap gerektirir, inkârı bid'at ve sapıklıktır."},{"k":"tbl","r":[["","Sübut ve delalet","Terki","İnkârı"],["**Farz**","İkisi de kat'î","Azap gerektirir","Küfür"],["**Vâcib**","Biri kat'î, diğeri zannî","Azap gerektirir","Bid'at ve sapıklık"]]}]},{"h":"Vaz'î hükmün kısımları","b":[{"k":"h","x":"1. Sebep"},{"k":"ar","a":"مَا جَعَلَهُ الشَّارِعُ عَلَامَةً عَلَى مُسَبَّبِهِ (أَيِ الْحُكْمِ) وَرَبَطَ وُجُودَ الْمُسَبَّبِ بِوُجُودِهِ وَعَدَمَهُ بِعَدَمِهِ","x":"Türkçesi: Şâriin müsebbebine (hükme) alamet kıldığı, müsebbebin varlığını onun varlığına, yokluğunu onun yokluğuna bağladığı şey."},{"k":"li","x":"**A. Teklifî bir hükme sebep olması.** «أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ» gibi."},{"k":"li","x":"**B. Mülkiyetin, helalliğin ispatı veya izalesine sebep olması.**"},{"k":"li","x":"1. çeşit örnek: «كَالْبَيْعِ لِإِثْبَاتِ الْمِلْكِ وَإِزَالَتِهِ»"},{"k":"li","x":"2. çeşit örnek: «كَالزَّوَاجِ وَالطَّلَاقِ»"},{"k":"li","x":"Her iki kısım da mükellefin gücü dahilinde olan-olmayan diye ikiye ayrılır:"},{"k":"tbl","r":[["","Gücü dahilinde","Gücü dahilinde olmayan"],["**Teklifî**","Zekât gibi","5 vakit namaz gibi"],["**İspat–izale**","Katl gibi","Miras gibi"]]},{"k":"h","x":"2. Şart"},{"k":"ar","a":"مَا يَتَوَقَّفُ وُجُودُ الْحُكْمِ عَلَى وُجُودِهِ وَيَلْزَمُ مِنْ عَدَمِهِ عَدَمُ الْحُكْمِ","x":"Türkçesi: Hükmün varlığının kendi varlığına bağlı olduğu, yokluğu hükmün yokluğunu gerektiren şey."},{"k":"dikkat","x":"Şartın yerine gelmesi, meşrutun olmasını gerektirmez. → Namaz – abdest."},{"k":"li","x":"**A. Şer'î şart:** Şâriin koyduğu şart."},{"k":"li","x":"**B. Ca'lî şart:** Mükellefin koştuğu şart. Akidlerde olduğu gibi."},{"k":"h","x":"3. Mâni"},{"k":"ar","a":"مَا يَلْزَمُ مِنْ وُجُودِهِ عَدَمُ الْحُكْمِ أَوْ بُطْلَانُ السَّبَبِ","x":"Türkçesi: Varlığı hükmün yokluğunu veya sebebin bâtıl olmasını gerektiren şey."},{"k":"li","x":"**A. Hükme mâni:** Namaz vakti girdi, ama kadın hayızlı. Bu, sebep olan vakte değil hüküm olan namazın vücubuna engeldir."},{"k":"li","x":"**B. Sebebi geçersiz kılan mâni:** Kişi nisab miktarı mala sahip ama borcu var. Bu, sebebe – yani zekâtın sebebi olan nisab miktarına sahip olmaya – engeldir."}]},{"h":"4. Ruhsat ve azîmet","b":[{"k":"ar","a":"مَا شَرَعَهُ اللَّهُ مِنَ الْأَحْكَامِ تَخْفِيفًا عَلَى الْمُكَلَّفِ فِي حَالَاتٍ خَاصَّةٍ تَقْتَضِي هَذَا التَّخْفِيفَ","x":"Ruhsat. Türkçesi: Allah'ın, bu hafifletmeyi gerektiren özel durumlarda mükellefe kolaylık olsun diye meşru kıldığı hükümler."},{"k":"ar","a":"مَا شَرَعَهُ اللَّهُ أَصَالَةً مِنَ الْأَحْكَامِ الْعَامَّةِ الَّتِي لَا تَخْتَصُّ بِحَالٍ دُونَ حَالٍ وَلَا بِمُكَلَّفٍ دُونَ مُكَلَّفٍ","x":"Azîmet. Türkçesi: Allah'ın asıl olarak meşru kıldığı, bir duruma ya da bir mükellefe özgü olmayan genel hükümler."},{"k":"h","x":"Ruhsatın çeşitleri"},{"k":"n","n":1,"x":"Zaruret veya ihtiyaç anında haramların mübah olması. Ölmeyecek kadar içki içmek gibi."},{"k":"n","n":2,"x":"Mazeret olduğunda vâcibin terkinin mübah olması. Seferde oruç tutulmaması gibi."},{"k":"n","n":3,"x":"İstisnaî bazı akidlerin sahih olması. Selem gibi."},{"k":"n","n":4,"x":"Bizden önceki ümmetlerin meşakkat barındıran hükümlerinin neshi. Necaset bulaşan elbisenin o bölgesinin kesilmesi."},{"k":"h","x":"Hanefîlere göre ikiye ayrılır"},{"k":"n","n":1,"x":"**Terfih ruhsatı:** Azîmet hükmü ve delilinin kalması ile beraber mükellefe rahatlık, hafiflik olsun diye terkine ruhsat verilen. İkrah altında küfür gibi. Burada azîmeti de seçip şehid olabilirsin."},{"k":"n","n":2,"x":"**Iskat ruhsatı:** Azîmet hükmünün kalmayıp ruhsatla amel etmenin vâcib olduğu kısımdır. Ölmemek için domuz eti yemek gibi. Bu hâlde yemeyip ölürsek günahkâr oluruz."},{"k":"tbl","r":[["","Azîmet","Örnek"],["**Terfih ruhsatı**","Hükmü ve delili kalır; azîmet de seçilebilir","İkrah altında küfür"],["**Iskat ruhsatı**","Hükmü kalmaz; ruhsatla amel vâcib","Ölmemek için domuz eti"]]}]},{"h":"5. Sıhhat – butlan","b":[{"k":"h","x":"A. Cumhura göre"},{"k":"li","x":"**Sıhhat →** «تَرَتُّبُ آثَارِهِ الشَّرْعِيَّةِ عَلَيْهِ»"},{"k":"li","x":"**Butlan →** «عَدَمُ تَرَتُّبِ آثَارِهِ الشَّرْعِيَّةِ عَلَيْهِ»"},{"k":"li","x":"Başka bir tanım: **Sıhhat →** «مُوَافَقَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ» · **Butlan →** «مُخَالَفَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ»"},{"k":"h","x":"B. Hanefîlere göre bu taksim şöyledir"},{"k":"li","x":"**Sahih →** «مُوَافَقَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ» (aynı)"},{"k":"li","x":"**Gayr-ı sahih →** «مُخَالَفَةُ الْفِعْلِ لِأَمْرِ الشَّارِعِ»"},{"k":"li","x":"İbadet konularında cumhurla aynı."},{"k":"li","x":"Muamelat konularında ise ikiye ayrılır:"},{"k":"n","n":1,"x":"**Fâsid:** Sıhhat şartlarında eksiklik olan."},{"k":"n","n":2,"x":"**Bâtıl:** Rükünlerinde eksiklik olan."},{"k":"ornek","x":"Bir misal: Et, bozulmuşsa bâtıl; kokuşmuşsa (ama yenilebiliyorsa) fâsid denir."}]},{"h":"Mahkûm fîh","b":[{"k":"ar","a":"فِعْلُ الْمُكَلَّفِ الَّذِي تَعَلَّقَ بِهِ حُكْمُ الشَّارِعِ","x":"Türkçesi: Mükellefin, şâriin hükmünün taalluk ettiği fiili."},{"k":"ar","a":"يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ","x":"Örnek. Hâkim → Allah c.c. · Hüküm → Vücub · Mahkûm fîh → Sözleşmeleri yerine getirme."},{"k":"ar","a":"لَا تَكْلِيفَ إِلَّا بِالْفِعْلِ","x":""},{"k":"li","x":"Emir, nedb ve ibaha birer fiildir."},{"k":"li","x":"Tahrîm ve kerahet ise nefsi alıkoymak bakımından birer fiil sayılır. (Yani normalde bir şeyi yapmamak fiil sayılmaz. Ancak bu bakımdan fiil sayılır.)"}]},{"h":"Bir fiilin şer'an yükümlü kılınabilmesinin şartları","b":[{"k":"h","x":"1. Fiil, mükellef tarafından tam olarak bilinmeli"},{"k":"li","x":"Kur'an'da «أَقِيمُوا الصَّلَاةَ» deniyor, fakat nasıl kılınacağı bildirilmiyor. Bunu Hz. Peygamber'in göstermesiyle tam olarak malum oluyor. Dolayısıyla teklif olması sahih oluyor."},{"k":"li","x":"Bu mücmel ayetler için geçerli. Açık olanlarda ise zaten bir problem yok."},{"k":"h","x":"2. Teklifin, teklif yetkisi bulunandan geldiğini bilmesi"},{"k":"li","x":"Buradaki bilmeden maksat; bilme imkânının olmasıdır."},{"k":"li","x":"Dolayısıyla kişinin dârülharpte bilmesi, dârülislâmda yaşaması ile sabit olur. Çünkü dârülislâmda yaşayıp da bilmeme gibi bir mazeret olamaz. Ama dârülharpte olabilir."},{"k":"h","x":"3. Fiilin, yapılması mümkün veya mükellefin kudreti dahilinde olması"},{"k":"li","x":"İkiye ayrılır:"},{"k":"li","x":"**A. Müstahil →** Bu da ikiye ayrılır:"},{"k":"li","x":"AA. **Li-zâtihî:** Aklen ve âdeten imkânsız. İki zıddın cem'i gibi."},{"k":"li","x":"AB. **Li-gayrihî:** Aklen mümkün, âdeten imkânsız. İnsanın bir vasıta olmadan uçması gibi."},{"k":"li","x":"**B.** Başkasının yapıp yapmadığı fiillerden sorumlu tutulmaması gerekir."},{"k":"li","x":"Aynı şekilde insanın fıtratında olan şeyler de emredilemez."},{"k":"li","x":"Hz. Peygamber'in «لَا تَغْضَبْ» hadisindeki \"öfkelenme\"den maksat \"Öfkene hâkim ol.\"dur."},{"k":"h","x":"İslam'da meşakkat ikiye ayrılır"},{"k":"n","n":1,"x":"Meşakkate rağmen insanların yapabildiği. Rızık için çalışmak gibi. İslam insanları bu tür meşakkatlerle sorumlu tutmuştur."},{"k":"n","n":2,"x":"İnsanların yapamadığı, yapmaya çalıştığında büyük eziyet ve zarara uğrayacağı meşakkatler. Savm-ı visal gibi. İslam insanları bu tür meşakkatlerle sorumlu tutmamıştır."}]},{"h":"Mahkûm aleyh","b":[{"k":"ar","a":"الْمُكَلَّفُ الَّذِي تَعَلَّقَ حُكْمُ الشَّارِعِ بِفِعْلِهِ","x":"Türkçesi: Şâriin hükmünün fiiline taalluk ettiği mükellef."},{"k":"h","x":"Mükellefin yükümlü olabilmesinin şartları"},{"k":"n","n":1,"x":"**Teklifin delillerini anlamaya muktedir olmalı (akıl, bâliğ).**"},{"k":"li","x":"Yani ne ile mükellef olduğunu bilmeli ve anlamalı. Bu da ancak akılla olur."},{"k":"li","x":"Yani akıl sahibi olması gerekir."},{"k":"li","x":"Dolayısıyla mecnunda bu akıl olmadığı için mükellef olmaz."},{"k":"li","x":"Akıl gizli bir şey olduğu için bir kimsenin akıllı olup olmadığını suretten anlayamayız. Bunun için alamet gerekir ve bu alamet de bulûğdur."},{"k":"li","x":"Yani bulûğa ermiş olması."},{"k":"n","n":2,"x":"**Mükellef olduğu şeye ehil olmalı.**"}]},{"h":"Ehliyet","b":[{"k":"li","x":"**Ehliyet:** Sözlükte salahiyettir. Istılahta iki kısma ayrılır:"},{"k":"h","x":"A. Vücûb ehliyeti"},{"k":"d","t":"Vücûb ehliyeti","x":"Bir insanın hakları elde etmeye ve sorumlulukları üstlenmeye elverişli olması. Bu hassaya (özelliğe) zimmet denir."},{"k":"li","x":"Vücûb ehliyeti mutlak insan (kadın, erkek, çocuk, cenin, deli, bâliğ, akıllı) olmakla ilişkilidir."},{"k":"li","x":"Vücûb ehliyeti ikiye ayrılır:"},{"k":"n","n":1,"x":"**Nâkıs:** Hakları elde etmeye elverişli, sorumlulukları üstlenmeye elverişsiz. Anne karnındaki cenin gibi. Veya tam tersi. Borçlu meyyit gibi."},{"k":"n","n":2,"x":"**Tam:** Her ikisine de elverişli. Bu da sağ olarak doğumuyla başlar."},{"k":"h","x":"B. Edâ ehliyeti"},{"k":"d","t":"Edâ ehliyeti","x":"Mükellefin söz ve fiillerinin şer'an muteber sayılmasına elverişli olması."},{"k":"li","x":"Edâ ehliyeti akıl ile ilişkilidir."},{"k":"li","x":"Edâ ehliyeti 3'e ayrılır:"},{"k":"n","n":1,"x":"**Edâ ehliyetinin olmaması:** Bu, gayr-ı mümeyyiz çocuk (7 yaş altı) ve delide olur."},{"k":"n","n":2,"x":"**Nâkıs edâ ehliyetinin olması:** Bu, mümeyyiz (7 yaş) ve ma'tûhta olur."},{"k":"li","x":"A. Mahza yarar sağlayacak tasarruflar geçerli. Hibe ve sadaka almak gibi."},{"k":"li","x":"B. Mahza zarar sağlayacak tasarruflar geçersiz. Teberruât ve ıskatat."},{"k":"li","x":"C. İki ihtimalli de olan; velinin iznine bağlı."},{"k":"n","n":3,"x":"**Tam edâ ehliyetinin olması:** Bu, bulûğa ermekle olur. (Akıllı olmak şartıyla.)"},{"k":"tbl","r":[["Edâ ehliyeti","Kimde","Tasarrufları"],["**Yok**","Gayr-ı mümeyyiz çocuk (7 yaş altı), deli","—"],["**Nâkıs**","Mümeyyiz (7 yaş), ma'tûh","Mahza yarar geçerli · mahza zarar geçersiz · iki ihtimalli veli iznine bağlı"],["**Tam**","Bulûğa ermiş akıllı","Hepsi geçerli"]]},{"k":"h","x":"Rüşd, sefeh, ateh"},{"k":"d","t":"Rüşd","x":"Malını korumak için gerekli tedbirleri alma ve saçıp savurmaktan sakınma vasfı. Bu vasfa sahip olana reşîd denir."},{"k":"li","x":"**Hanefîlere göre:** Üst sınırı dedelik yaşı denilen 25 yaştır. Bu yaşa
